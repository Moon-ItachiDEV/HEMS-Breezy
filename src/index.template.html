<!doctype html>
<!--
  Breezy · page d'accueil du HEMS (gestion de l'énergie de la maison)
  ---------------------------------------------------------------------------
  Ce fichier est un GABARIT : l'illustration assets/maison.svg y est insérée
  telle quelle (en ligne, pour pouvoir animer ses éléments) à la place du
  marqueur MAISON_SVG placé dans .hero-art.
  Construire la page, depuis la racine du dépôt :
      node tools/inline-svg.js src/index.template.html index.html
  Aperçus de développement : index.html?apercu=midi | soir | nuit (données dans ETAT.apercus)
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#a3aebd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2c3243" media="(prefers-color-scheme: dark)">
<meta name="description" content="Breezy, le tableau de bord solaire de la maison : production, batterie, autonomie et économies du jour.">
<title>Breezy · Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..700,0..100,0..1;1,9..144,300..700,0..100,0..1&display=swap">
<style>
/* ==========================================================================
   Breezy · direction « éditoriale chaleureuse »
   L'illustration est la couverture, une phrase sur la maison fait le titre,
   et un seul chiffre vivant ouvre la page : la production solaire.
   Papier crème + encre brune en clair ; papier « expresso » en sombre, où la
   maison passe à l'heure bleue (voile + fenêtres allumées) pour ne pas éblouir.
   Une seule police web (Fraunces, repli Charter / Georgia) ; texte en police système.
   ========================================================================== */
:root {
  --paper: #f5efe5;
  --paper-2: #ede4d5;
  --ink: #1d1813;
  --ink-2: #463c32;
  --muted: #65584a;
  --rule: rgba(29, 24, 19, .13);
  --rule-2: rgba(29, 24, 19, .26);
  --accent: #9a4f00;              /* ambre « texte » : accents typographiques */

  /* Couleurs d'identité des séries (validées : bande de luminance, daltonisme, contraste) */
  --c-sun: #b8690a;
  --c-home: #3563a8;
  --c-batt: #2f8a3a;
  --c-grid: #8a5cc0;

  /* Impulsions lumineuses dans les gaines (sur l'illustration) */
  --fx-sun: #ffae2b;
  --fx-home: #5f93ff;
  --fx-batt: #4fd24a;
  --fx-grid: #a77bff;
  --fx-core: #fffbf2;

  --night-band: rgba(53, 70, 105, .05);
  --chip-bg: rgba(252, 249, 243, .93);
  --chip-ink: #1d1813;
  --chip-muted: #5a4e41;
  --mast-ink: #1b1f27;
  --tab-bg: #f5efe5;
  --card-demain: radial-gradient(120% 90% at 100% 0%, rgba(255, 214, 140, .95) 0%, rgba(255, 196, 120, .55) 26%, rgba(255, 190, 120, 0) 58%), linear-gradient(158deg, #f6dcb6 0%, #f3cfa9 50%, #edbfa6 100%);
  --card-demain-ink: #2a1a10;
  --creneau: rgba(228, 138, 23, .62);
  --shadow-chip: 0 1px 0 rgba(255,255,255,.65) inset, 0 10px 24px -14px rgba(36, 28, 18, .6);
  --stem: rgba(29, 24, 19, .62);

  --font-display: "Fraunces", "Iowan Old Style", "Charter", "Bitstream Charter", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --font-text: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --gutter: max(20px, env(safe-area-inset-left), env(safe-area-inset-right));
  --col: 42.5rem;                 /* 680 px à 100 % : la colonne suit la taille de texte choisie */
  --fade: 116px;                  /* fondu de l'illustration vers le papier */
  --overlap: 50px;                /* le texte remonte sur le bas du fondu */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15120f;
    --paper-2: #1e1915;
    --ink: #f4ece0;
    --ink-2: #d9ccba;
    --muted: #b0a28f;
    --rule: rgba(244, 236, 224, .12);
    --rule-2: rgba(244, 236, 224, .24);
    --accent: #f0b25f;

    --c-sun: #c08125;
    --c-home: #5a88cc;
    --c-batt: #4a9a45;
    --c-grid: #9677cf;

    --fx-sun: #ffb43c;
    --fx-home: #7aa6ff;
    --fx-batt: #62e05a;
    --fx-grid: #b892ff;

    --night-band: rgba(140, 160, 210, .05);
    --chip-bg: rgba(23, 21, 22, .9);
    --chip-ink: #f4ece0;
    --chip-muted: #c3b5a2;
    --mast-ink: #f7f1e8;
    --tab-bg: #15120f;
    --card-demain: radial-gradient(120% 90% at 100% 0%, rgba(255, 170, 80, .34) 0%, rgba(240, 140, 70, .14) 30%, rgba(240, 140, 70, 0) 60%), linear-gradient(158deg, #3a2716 0%, #33201a 52%, #2a1a1f 100%);
    --card-demain-ink: #f8ecdc;
    --creneau: rgba(228, 138, 23, .45);
    --shadow-chip: 0 10px 28px -14px rgba(0, 0, 0, .85);
    --stem: rgba(244, 236, 224, .6);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--paper); scroll-padding-bottom: 96px; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 1rem/1.5 var(--font-text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  overflow-x: clip;
  container: page / inline-size;  /* largeur de page en em : sert au repli de la pilule (zoom du texte seul) */
}
h1, h2, h3, p, ul, ol, dl, dd, figure, blockquote { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
/* Sur l'illustration, le ciel change de teinte (jour, crépuscule, nuit) : anneau bicolore lisible partout */
.hero :focus-visible { outline: 2px solid #fff; outline-offset: 2px; box-shadow: 0 0 0 2px #1b1f27; }
.hero .icon-btn:focus-visible { box-shadow: 0 0 0 2px #1b1f27, var(--shadow-chip); }
.nw { white-space: nowrap; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 12px; top: -80px; z-index: 50; background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; }
.skip:focus { top: calc(env(safe-area-inset-top) + 12px); }
.num { font-variant-numeric: lining-nums tabular-nums; }
.u { font-size: .62em; letter-spacing: .01em; }
.label {                          /* petites capitales de l'éditorial : jamais sous 12 px */
  font: 650 .75rem/1.3 var(--font-text);
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted);
}

/* ---------------------------------------------------------------- HÉROS -- */
.hero {
  position: relative;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 75vh;
  height: 75svh;
  overflow: hidden;
  isolation: isolate;
  background: linear-gradient(#a0acbc 0 30%, #abb1bb 70% 100%);
}
.hero-art { position: absolute; inset: 0; }
.hero-art > svg, .hero-flux { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-flux { z-index: 1; pointer-events: none; will-change: transform; }  /* calque à part : seules les impulsions se redessinent */
.hero::after {                    /* fondu froid → chaud, de l'illustration vers le papier */
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0;
  height: var(--fade);
  pointer-events: none;
  z-index: 2;
  background: linear-gradient(to bottom,
    color-mix(in srgb, var(--paper) 0%, transparent) 0%,
    color-mix(in srgb, var(--paper) 14%, transparent) 14%,
    color-mix(in srgb, var(--paper) 38%, transparent) 27%,
    color-mix(in srgb, var(--paper) 74%, transparent) 42%,
    color-mix(in srgb, var(--paper) 93%, transparent) 56%,
    var(--paper) 72%);
}

/* Voile « heure bleue » du thème sombre : piloté en CSS, donc suit un changement de thème à la volée */
#voile-sombre { display: none; }
@media (prefers-color-scheme: dark) {
  .hero:not([data-scene="nuit"]):not([data-scene="crepuscule"]) #voile-sombre { display: inline; }
}

.masthead {
  position: absolute; top: 0; left: 0; right: 0; z-index: 6;
  display: flex; align-items: center; justify-content: space-between; gap: 8px 12px;
  flex-wrap: wrap;                /* zoom ou texte très agrandi : les boutons passent sous la marque */
  padding: calc(env(safe-area-inset-top) + 12px) var(--gutter) 12px;
  color: var(--mast-ink);
}
.hero[data-scene="nuit"], .hero[data-scene="crepuscule"] { --mast-ink: #f7f1e8; }
.masthead::before {               /* voile sous l'en-tête au crépuscule et la nuit : texte clair toujours lisible */
  content: ""; position: absolute; left: 0; right: 0; top: 0; z-index: -1;
  height: calc(100% + 36px);
  pointer-events: none; opacity: 0;
  background: linear-gradient(rgba(16, 18, 30, .5), rgba(16, 18, 30, .34) 58%, rgba(16, 18, 30, 0));
}
.hero[data-scene="nuit"] .masthead::before, .hero[data-scene="crepuscule"] .masthead::before { opacity: 1; }
.mast-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.brand { display: inline-flex; flex-direction: column; justify-content: center; min-height: 44px; text-decoration: none; padding-right: 8px; }
.brand-name {
  font-family: var(--font-display);
  font-style: italic; font-weight: 560;
  font-size: 1.75rem; line-height: 1; letter-spacing: -.01em;
  font-variation-settings: "SOFT" 100, "opsz" 72;
}
.brand-sub { font: 650 .75rem/1.2 var(--font-text); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }
.icon-btn {
  position: relative;
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--chip-bg);
  color: var(--chip-ink);
  box-shadow: var(--shadow-chip);
  border: 0; padding: 0; margin: 0; font: inherit; cursor: pointer;
}
.btn-pause .i-lecture, .btn-pause[aria-pressed="true"] .i-pause { display: none; }
.btn-pause[aria-pressed="true"] .i-lecture { display: block; }
.icon-btn .pastille { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: #d9731a; box-shadow: 0 0 0 2px var(--chip-bg); }

/* Annotations façon infographie : ancrées sur les vraies pièces du dessin */
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; overflow: visible; }
.leaders line { stroke: var(--stem); stroke-width: 1; }
.notes { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.ancre {
  position: absolute; left: 0; top: 0;
  width: 12px; height: 12px; margin: -6px 0 0 -6px;
  border-radius: 50%;
  background: var(--chip-bg);
  box-shadow: 0 0 0 1.25px var(--stem), 0 2px 6px rgba(0,0,0,.25);
}
.ancre::before { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--c); }
.ancre::after {
  content: ""; position: absolute; inset: -1px; border-radius: 50%;
  border: 1.5px solid #fff;
  animation: onde 2.8s ease-out infinite; animation-delay: var(--d, 0s);
}
@keyframes onde { from { transform: scale(.7); opacity: .9; } to { transform: scale(2.8); opacity: 0; } }
.note {
  position: absolute; left: 0; top: 0;
  padding: 6px 10px 7px;
  border-radius: 7px;
  background: var(--chip-bg);
  color: var(--chip-ink);
  box-shadow: var(--shadow-chip);
  white-space: nowrap;
  opacity: 0;
  transition: opacity .5s ease .25s;
}
.note.pret { opacity: 1; }
.note-k { display: flex; align-items: center; gap: 6px; font: 650 .75rem/1.2 var(--font-text); letter-spacing: .08em; text-transform: uppercase; color: var(--chip-muted); }
.note-k i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.note-v { display: block; margin-top: 2px; font: 650 .9375rem/1.2 var(--font-text); font-variant-numeric: tabular-nums; }
.note-s { display: block; margin-top: 1px; font: 550 .75rem/1.25 var(--font-text); color: var(--chip-muted); }
.hero.serre .note-s { display: none; }
/* Héros très bas (téléphone à l'horizontale) : étiquettes sur une ligne */
.hero.court .note { display: flex; align-items: baseline; gap: 8px; padding: 4px 9px 5px; }
.hero.court .note-v { margin-top: 0; }

/* ---------------------------------------------------------------- PAGE --- */
.page {
  position: relative; z-index: 5;
  margin-top: calc(-1 * var(--overlap));
  padding: 0 var(--gutter) calc(112px + env(safe-area-inset-bottom));
}
.col { max-width: var(--col); margin: 0 auto; container: col / inline-size; }

.kicker { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.kicker .heure { text-transform: none; }          /* « 17 h 12 » : le symbole h reste en minuscule */
.kicker .sep { width: 18px; height: 1px; background: var(--rule-2); }
.d-courte { display: none; }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); }
.live::before {
  content: ""; width: 8px; height: 8px; border-radius: 50%;
  background: #e07a12;
  animation: pouls 2.4s ease-out infinite;
}
@keyframes pouls { 0% { box-shadow: 0 0 0 0 rgba(224,122,18,.55); } 70%,100% { box-shadow: 0 0 0 9px rgba(224,122,18,0); } }

/* --- LE chiffre : la production solaire maintenant (la consommation la nuit) --- */
.maintenant {
  margin-top: 16px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas: "l a" "n a" "s s";
  align-items: end; column-gap: 14px;
}
.m-label { grid-area: l; display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.m-num { grid-area: n; }
.m-label i { width: 8px; height: 8px; border-radius: 50%; background: var(--c-sun); flex: none; }
.m-num {
  margin-top: 4px;
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(3.5rem, 19vw, 6.25rem);
  line-height: .92;
  letter-spacing: -.045em;
  font-variation-settings: "SOFT" 40, "opsz" 144;
  font-variant-numeric: lining-nums proportional-nums;
  white-space: nowrap;
}
.m-num.compte { font-variant-numeric: lining-nums tabular-nums; }
.m-num .u { font-size: .36em; font-weight: 400; letter-spacing: 0; vertical-align: .95em; margin-left: .1em; color: var(--ink-2); font-variation-settings: "SOFT" 50, "opsz" 36; }
.m-sub { grid-area: s; margin-top: 8px; font-size: .9375rem; line-height: 1.4; color: var(--muted); }
.arc { grid-area: a; width: max(124px, 7.75rem); margin-bottom: 4px; }   /* grandit avec le texte : « Coucher 19 h 13 » tient toujours */
.arc svg { display: block; width: 100%; height: auto; overflow: visible; }
.arc .horizon { stroke: var(--rule-2); stroke-width: 1; }
.arc .piste { fill: none; stroke: var(--rule-2); stroke-width: 1.4; stroke-dasharray: 1.5 4; stroke-linecap: round; }
.arc .fait { fill: none; stroke: var(--c-sun); stroke-width: 2; stroke-linecap: round; }
.arc .astre { fill: #f2a531; stroke: var(--paper); stroke-width: 2; }
.arc figcaption { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; font: 500 .75rem/1.25 var(--font-text); color: var(--muted); font-variant-numeric: tabular-nums; }
.arc figcaption span:last-child { text-align: right; }
.arc figcaption b { display: block; font-weight: 650; color: var(--ink-2); }

.headline {
  margin-top: 28px;
  font-family: var(--font-display);
  font-weight: 420;
  font-size: clamp(2rem, 8.8vw, 3.25rem);
  line-height: 1.03;
  letter-spacing: -.022em;
  font-variation-settings: "SOFT" 30, "opsz" 120;
  text-wrap: balance;
}
.headline em {
  font-style: italic; font-weight: 380;
  color: var(--accent);
  font-variation-settings: "SOFT" 100, "opsz" 120, "WONK" 1;
}
.dek {
  margin-top: 14px;
  font-size: 1.0625rem; line-height: 1.55;
  color: var(--ink-2);
  max-width: 34em;
  text-wrap: pretty;
}
.dek strong { font-weight: 600; color: var(--ink); }

.figures {
  margin-top: 30px;
  display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto;
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--rule);
}
.figure { padding: 16px 0 18px; min-width: 0; display: grid; grid-row: span 3; grid-template-rows: subgrid; align-content: start; }
.figure + .figure { padding-left: 18px; border-left: 1px solid var(--rule); }
.figure .label { text-wrap: balance; }
.fig-num {
  margin-top: 8px;
  font-family: var(--font-display);
  font-weight: 340;
  font-size: clamp(2.75rem, 13.5vw, 4.25rem);
  line-height: .92;
  letter-spacing: -.035em;
  font-variation-settings: "SOFT" 50, "opsz" 144;
  font-variant-numeric: lining-nums tabular-nums;
  white-space: nowrap;
}
.fig-num .u { font-size: .46em; letter-spacing: 0; vertical-align: .72em; margin-left: .04em; font-weight: 420; }
.fig-sub { margin-top: 10px; font-size: .875rem; line-height: 1.4; color: var(--muted); }
.fig-sub sup { font-size: .7em; line-height: 0; }

/* --- Sections --- */
.section { margin-top: 56px; }
/* Conteneurs des requêtes « sec » : sur le contenu, pas sur la section (qui reste libre pour la sous-grille du bureau) */
.ledger, .sec-corps { container: sec / inline-size; }
.sec-head { display: grid; gap: 8px; margin-bottom: 16px; }
.sec-title {
  font-family: var(--font-display);
  font-weight: 440;
  font-size: clamp(1.5rem, 6.4vw, 2rem);
  line-height: 1.1; letter-spacing: -.015em;
  font-variation-settings: "SOFT" 40, "opsz" 72;
  text-wrap: balance;
}
.sec-title em { font-style: italic; color: var(--accent); font-variation-settings: "SOFT" 100, "opsz" 72; }

/* --- Registre « en ce moment » --- */
.ledger { border-top: 1px solid var(--ink); }
.row {
  --c: var(--ink);
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  align-items: start;
  column-gap: 12px;
  padding: 16px 0 15px;
  border-bottom: 1px solid var(--rule);
}
.row-ico { color: var(--c); padding-top: 1px; }
.row-ico svg { display: block; }
.row-name { font-weight: 650; font-size: 1.0625rem; line-height: 1.3; }
.row-sub { font-size: .875rem; line-height: 1.4; color: var(--muted); margin-top: 2px; text-wrap: pretty; }
.row-val {
  text-align: right;
  font-family: var(--font-display);
  font-weight: 420;
  font-size: 1.625rem; line-height: 1.05;
  letter-spacing: -.02em;
  font-variation-settings: "SOFT" 50, "opsz" 48;
  font-variant-numeric: lining-nums tabular-nums;
  white-space: nowrap;
}
.row-val .u { font-size: .56em; margin-left: .06em; letter-spacing: 0; color: var(--muted); }
.row-val small { display: block; margin-top: 6px; font: 650 .75rem/1 var(--font-text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.soc { position: relative; margin-top: 10px; max-width: 240px; }
.soc-barre { position: relative; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--c-batt) 18%, transparent); overflow: hidden; }
.soc-plein { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c-batt); overflow: hidden; }
.soc-plein::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0));
  transform: translateX(-110%);
  opacity: 0;
}
.soc.charge .soc-plein::after { opacity: 1; animation: lustre 2.8s cubic-bezier(.4,0,.2,1) infinite; }
@keyframes lustre { to { transform: translateX(250%); } }
.soc-reserve { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--paper); }
.soc-legende { display: flex; justify-content: space-between; margin-top: 5px; font: 500 .75rem/1.2 var(--font-text); color: var(--muted); }

/* --- Courbe du jour --- */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .875rem; color: var(--ink-2); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--c); border-radius: 2px; }
.legend i.aire { height: 10px; border: 0; border-radius: 3px; background: linear-gradient(to bottom, color-mix(in srgb, var(--c-sun) 55%, transparent), color-mix(in srgb, var(--c-sun) 15%, transparent)); border-top: 2px solid var(--c-sun); }
.legend i.tirets { border-top-style: dashed; }
.chart { position: relative; margin: 0; touch-action: pan-y; }
.chart:focus-visible { outline-offset: 6px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grille { stroke: var(--rule); stroke-width: 1; }
.chart .base { stroke: var(--rule-2); stroke-width: 1; }
.chart .axe { fill: var(--muted); font: 500 12px var(--font-text); font-variant-numeric: tabular-nums; }
.chart .nuit { fill: var(--night-band); }
.chart .prod-aire { fill: url(#gAireProd); }
.chart .prod { fill: none; stroke: var(--c-sun); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .prev { fill: none; stroke: var(--c-sun); stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; opacity: .85; }
.chart .conso { fill: none; stroke: var(--c-home); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .maint { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; opacity: .55; }
.chart .maint-t { fill: var(--ink); font: 650 12px var(--font-text); letter-spacing: .06em; }
.chart .point { stroke: var(--paper); stroke-width: 2; }
.chart .etiq { fill: var(--ink-2); font: 600 12px var(--font-text); }
.chart .curseur { stroke: var(--ink); stroke-width: 1; opacity: .5; }
.bulle {
  position: absolute; top: 26px; left: 0;
  min-width: 148px;
  padding: 8px 11px 9px;
  border-radius: 8px;
  background: var(--ink); color: var(--paper);
  font-size: .8125rem; line-height: 1.4;
  pointer-events: none;
  opacity: 0; transform: translateY(4px);
  transition: opacity .15s, transform .15s;
  box-shadow: 0 12px 30px -14px rgba(0,0,0,.6);
  z-index: 2;
}
.bulle.on { opacity: 1; transform: none; }
.bulle b { font-weight: 650; display: block; margin-bottom: 3px; letter-spacing: .02em; }
.bulle span { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.bulle span strong { font-weight: 650; }
.bulle span i { width: 12px; height: 0; border-top: 2px solid var(--c); border-radius: 2px; flex: none; }

.totals {
  margin-top: 18px;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--ink);
  border-bottom: 1px solid var(--rule);       /* fermé en bas, comme .figures */
}
.total { padding: 12px 10px 6px 0; min-width: 0; }
.total + .total { padding-left: 12px; border-left: 1px solid var(--rule); }
.total dt { display: flex; align-items: center; gap: 6px; }
.total dt .m { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.total dt svg { flex: none; color: var(--c); }
.total dd { margin-top: 6px; font: 420 1.375rem/1.05 var(--font-display); letter-spacing: -.015em; font-variation-settings: "SOFT" 50, "opsz" 36; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.total dd .u { font-size: .6em; color: var(--muted); letter-spacing: 0; }
.total dd small { display: block; margin-top: 5px; font: 500 .8125rem/1.3 var(--font-text); color: var(--muted); letter-spacing: 0; white-space: normal; }

/* --- Demain --- */
.demain {
  position: relative; overflow: hidden;
  margin-top: 60px;
  border-radius: 22px;
  padding: 24px 22px 22px;
  background: var(--card-demain);
  color: var(--card-demain-ink);
}
.demain .label { color: inherit; opacity: .82; }
.demain-titre {
  position: relative;
  margin-top: 12px; max-width: 15em;
  font: 430 clamp(1.625rem, 7.4vw, 2.25rem)/1.08 var(--font-display);
  letter-spacing: -.018em;
  font-variation-settings: "SOFT" 60, "opsz" 96;
  text-wrap: balance;
}
.demain-titre em { font-style: italic; font-variation-settings: "SOFT" 100, "opsz" 96; }
.conseil { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
.conseil figcaption { display: flex; align-items: center; gap: 8px; }
.conseil figcaption::before { content: ""; width: 18px; height: 1px; background: currentColor; opacity: .6; }
.conseil blockquote { margin: 10px 0 0; }
.conseil blockquote p { max-width: 34em; font: italic 400 1.1875rem/1.4 var(--font-display); font-variation-settings: "SOFT" 100, "opsz" 24, "WONK" 0; letter-spacing: -.005em; text-wrap: pretty; }
.creneau { margin-top: 18px; }
.creneau-barre { position: relative; height: 32px; border-radius: 8px; background: color-mix(in srgb, currentColor 9%, transparent); overflow: hidden; }
.creneau-barre span { position: absolute; top: 0; bottom: 0; border-radius: 8px; background: var(--creneau); display: grid; place-items: center; font: 650 .75rem/1 var(--font-text); color: inherit; white-space: nowrap; }
.creneau-heures { display: flex; justify-content: space-between; margin-top: 7px; font: 500 .75rem/1.2 var(--font-text); opacity: .85; font-variant-numeric: tabular-nums; }

.colophon { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: .875rem; line-height: 1.5; color: var(--muted); display: grid; gap: 4px; }
.colophon strong { color: var(--ink-2); font-weight: 650; }

/* ------------------------------------------------------------ TAB BAR --- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 4px max(8px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  background: var(--tab-bg);                 /* opaque : aucun texte ne transparaît sous les onglets */
  border-top: 1px solid var(--rule);
}
.tabbar::before {                 /* le texte se fond avant la barre au lieu d'être tranché */
  content: ""; position: absolute; left: 0; right: 0; bottom: 100%; height: 44px; pointer-events: none;
  background: linear-gradient(to top, var(--paper) 8%, color-mix(in srgb, var(--paper) 82%, transparent) 40%, color-mix(in srgb, var(--paper) 0%, transparent));
}
.tab {
  position: relative;
  min-height: 52px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  text-decoration: none;
  font: 600 .75rem/1 var(--font-text); letter-spacing: .01em;
  color: var(--muted);
  border-radius: 12px;
  container-type: inline-size;   /* texte agrandi ou zoom : l'onglet passe en icône seule (voir plus bas) */
}
.tab svg { width: 24px; height: 24px; flex: none; }
@container (max-width: 5.6em) {
  .tab-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -5px; width: 22px; height: 2px; border-radius: 2px; background: var(--accent); }

/* ------------------------------------------------------- ENTRÉE (motion) --- */
.reveal { animation: monte .8s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }
@keyframes monte { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .reveal, .live::before, .ancre::after, .soc.charge .soc-plein::after { animation: none !important; }
  .ancre::after { display: none; }
  .soc.charge .soc-plein::after { opacity: 0; }
  .note, .bulle { transition: none; }
  .btn-pause { display: none; }   /* déjà immobile : le bouton ne servirait à rien */
}
/* Bouton « pause » de l'en-tête : mêmes règles que le mouvement réduit (les flux passent en JS) */
.calme .live::before, .calme .ancre::after, .calme .soc.charge .soc-plein::after { animation: none !important; }
.calme .ancre::after { display: none; }
.calme .soc.charge .soc-plein::after { opacity: 0; }

/* ------------------------------------------------------------ ÉCRANS --- */
@container sec (max-width: 559px) {
  .totals { grid-template-columns: 1fr 1fr; }
  .total { padding-bottom: 12px; }
  .total:nth-child(3) { padding-left: 0; border-left: 0; }
  .total:nth-child(n+3) { border-top: 1px solid var(--rule); }
}
/* Texte agrandi (réglage du navigateur ou du système) ou zoom de page : la colonne ne fait plus
   que quelques em de large. Les unités em d'une requête de conteneur suivent la taille de texte
   réelle, donc ces règles se déclenchent aussi quand seul le texte grossit. À 100 %, la colonne
   la plus étroite (320 px) mesure 18 em : rien ne change. */
@container col (max-width: 16em) {
  .maintenant { grid-template-columns: minmax(0, 1fr); grid-template-areas: "l" "n" "a" "s"; }
  .m-num { white-space: normal; font-size: clamp(2.5rem, 24cqi, 3.5rem); }
  .arc { width: min(100%, 11em); margin-top: 14px; }
  .figures { grid-template-columns: minmax(0, 1fr); }
  .figures .figure + .figure { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); }
  .fig-num { white-space: normal; }
}
@container sec (max-width: 16em) {
  .row { grid-template-columns: 26px minmax(0, 1fr); }
  .row-val { grid-column: 2; text-align: left; margin-top: 8px; white-space: normal; }
  .totals { grid-template-columns: minmax(0, 1fr); }
  .total, .total + .total, .total:nth-child(3) { padding-left: 0; border-left: 0; }
  .total + .total { border-top: 1px solid var(--rule); }
}
/* Les deux étiquettes du bilan passent ensemble sur deux lignes (jamais un « JOUR » isolé) */
@media (max-width: 383px) {
  .figure .label .l2 { display: block; }
}
@media (max-width: 379px) {
  .kicker { gap: 4px 8px; }
  .kicker .sep { width: 12px; }
  .d-longue { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .d-courte { display: inline; }
}
@media (max-width: 359px) {
  :root { --gutter: max(16px, env(safe-area-inset-left), env(safe-area-inset-right)); }
  .kicker { letter-spacing: .08em; }
  .m-label { letter-spacing: .07em; }
  .m-label i { display: none; }
  .figure + .figure { padding-left: 14px; }
  .arc { width: max(104px, 6.5rem); }
  .row-val { font-size: 1.4375rem; }
  .brand-sub { letter-spacing: .08em; }
}
/* Écrans courts (iPhone SE…) : barre d'onglets plus compacte, le chiffre reste visible */
@media (max-height: 620px) {
  :root { --overlap: 60px; }
  .tab { min-height: 44px; gap: 3px; }
  .tab svg { width: 21px; height: 21px; }
  .maintenant { margin-top: 10px; }
  .m-num { font-size: clamp(3.25rem, 17vw, 5rem); }
}
@media (min-width: 43.75em) {
  .section { margin-top: 68px; }
  .demain { padding: 32px 32px 28px; }
}
/* Fenêtre très basse (zoom 200–400 % sur ordinateur, petit téléphone à l'horizontale) :
   la barre d'onglets ne flotte plus, elle se range en fin de page au lieu de masquer le contenu */
@media (max-height: 26.25em) and (max-width: 43.6875em) {
  body { display: flex; flex-direction: column; }
  .tabbar { position: relative; order: 1; }
  .tabbar::before { display: none; }
  .page { padding-bottom: 32px; }
  html { scroll-padding-bottom: 0; }
}

/* Navigation en pilule de verre en haut du héros : bureau, et téléphone à l'horizontale.
   Seuils en em (16 px = 1 em à 100 %) : ils suivent la taille de texte réglée dans le navigateur,
   donc un texte agrandi rebascule vers la mise en page mobile au lieu de faire chevaucher la pilule. */
@media (min-width: 60em), (max-height: 32.5em) and (min-width: 43.75em) {
  .tabbar {
    position: absolute; z-index: 21;
    top: calc(env(safe-area-inset-top) + 12px); bottom: auto; left: 50%; right: auto;
    transform: translateX(-50%);
    display: flex; gap: 2px;
    padding: 4px;
    border: 1px solid var(--rule); border-radius: 999px;
    background: var(--chip-bg);
    box-shadow: var(--shadow-chip);
  }
  .tabbar::before { display: none; }
  .tab { flex-direction: row; min-height: 44px; padding: 0 16px; gap: 8px; border-radius: 999px; font-size: .8125rem; color: var(--chip-muted); container-type: normal; }
  .tab svg { width: 19px; height: 19px; }
  .tab[aria-current="page"] { background: var(--chip-ink); color: var(--chip-bg); }
  .tab[aria-current="page"]::before { display: none; }
  .page { padding-bottom: calc(56px + env(safe-area-inset-bottom)); }
  html { scroll-padding-bottom: 0; }
}
@media (max-height: 32.5em) and (min-width: 43.75em) and (max-width: 59.9375em) {
  .tab { padding: 0 11px; gap: 6px; font-size: .75rem; }
  .brand-sub { display: none; }
}
@media (min-width: 60em) {
  :root { --col: 56.25rem; --fade: 132px; --overlap: 56px; }
  .masthead { padding-left: max(var(--gutter), calc((100% - var(--col)) / 2)); padding-right: max(var(--gutter), calc((100% - var(--col)) / 2)); }
  /* Deux colonnes posées sur le même filet : « Production solaire » et « Économies du jour » sur une même ligne */
  .lede-grid { margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "m f" "h h" "d d"; column-gap: 64px; align-items: start; }
  .lede-main { display: contents; }
  .maintenant { grid-area: m; margin-top: 0; padding-top: 16px; border-top: 1px solid var(--ink); }
  .figures { grid-area: f; margin-top: 0; }
  .headline { grid-area: h; margin-top: 48px; font-size: 3.5rem; max-width: 18em; }
  .dek { grid-area: d; font-size: 1.1875rem; }
  .m-num { font-size: 6.25rem; }
  /* Les deux sections partagent leurs rangées : le registre et la légende démarrent à la même hauteur */
  .split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-rows: auto auto; gap: 0 56px; align-items: start; }
  .split > .section { margin-top: 72px; display: grid; grid-row: span 2; grid-template-rows: subgrid; align-content: start; }
  .split > .section > * { align-self: start; }
  /* Demain : le titre à gauche, le conseil à droite (lignes courtes, carte équilibrée) */
  .demain { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: auto 1fr; column-gap: 48px; padding: 36px 40px 32px; }
  .demain > .label { grid-column: 1; grid-row: 1; }
  .demain-titre { grid-column: 1; grid-row: 2; align-self: start; }
  .conseil { grid-column: 2; grid-row: 1 / span 2; margin: 0; padding: 0 0 0 40px; border-top: 0; border-left: 1px solid color-mix(in srgb, currentColor 22%, transparent); }
}
/* Zoom du texte seul (ne déplace pas les seuils des requêtes média) : quand la colonne de bureau ne fait
   plus ~50 em, les deux colonnes du chapeau se serrent jusqu'à se chevaucher. Elles s'empilent alors. */
@media (min-width: 60em) {
  /* Même cas pour la pilule : si la page ne fait plus 48 em, elle passe en icônes seules (nom accessible conservé)
     au lieu de recouvrir la marque. */
  @container page (max-width: 48em) {
    .tab { padding: 0 13px; }
    .tab-t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  }
  @container col (max-width: 50em) {
    .lede-grid { display: block; }
    .figures { margin-top: 30px; }
  }
}
</style>

<!-- ============================ HÉROS : l'illustration, collée en haut ============================ -->
<header class="hero" id="hero" data-hero>

      <!-- Bande LED : vert opaque sur toute la hauteur (le dégradé du dessin s'éteint en haut et masquait le niveau) -->

        <stop offset="0" stop-color="#3fae35"/><stop offset=".55" stop-color="#62c84a"/><stop offset="1" stop-color="#9be37a"/>
      </linearGradient>

    <path id="led-piste" d="M500.6,656 L515.2,660.5 L515.2,715.8 Q515.2,718.4 512.8,717.8 L502.8,713.4 Q500.8,712.4 500.8,709.5 Z" fill="#142211"/>

<main class="page" id="contenu">
  <div class="col">
    <!-- L'essentiel : un chiffre vivant, une phrase, deux chiffres du jour -->
    <section class="lede" aria-labelledby="titre">
      <p class="kicker label reveal" style="--i:0"><span class="live">En direct</span><span class="sep" aria-hidden="true"></span><span id="k-date" class="d-longue"></span><span id="k-date-c" class="d-courte" aria-hidden="true"></span></p>
      <div class="lede-grid">
        <div class="lede-main">
          <div class="maintenant reveal" style="--i:1">
            <p class="m-label label"><i aria-hidden="true" id="m-pastille"></i><span id="m-label"></span></p>
            <p class="m-num" id="m-num-box"><span id="m-num" aria-hidden="true"></span><span class="sr-only" id="m-num-sr"></span></p>
            <figure class="arc" id="arc" role="img">
              <svg viewBox="0 0 124 50" aria-hidden="true" focusable="false">
                <defs>
                  <radialGradient id="gArcHalo"><stop offset="0" stop-color="#ffc85a" stop-opacity=".75"/><stop offset="1" stop-color="#ffb547" stop-opacity="0"/></radialGradient>
                </defs>
                <line class="horizon" x1="0" x2="124" y1="45" y2="45"/>
                <path class="piste" d="M9 45 A53 38 0 0 1 115 45"/>
                <path class="fait" id="arc-fait" d="M9 45 A53 38 0 0 1 115 45" pathLength="1" stroke-dasharray="0 1"/>
                <circle id="arc-halo" r="13" fill="url(#gArcHalo)" cx="62" cy="10"/>
                <circle class="astre" id="arc-astre" r="5" cx="62" cy="10"/>
              </svg>
              <figcaption aria-hidden="true"><span id="arc-g"></span><span id="arc-d"></span></figcaption>
            </figure>
            <p class="m-sub" id="m-sub"></p>
          </div>
          <h1 class="headline reveal" id="titre" style="--i:2"></h1>
          <p class="dek reveal" id="dek" style="--i:3" aria-live="polite"></p>
        </div>
        <div class="figures reveal" style="--i:4" role="group" aria-labelledby="t-bilan">
          <h2 class="sr-only" id="t-bilan">Bilan du jour</h2>
          <div class="figure">
            <p class="label">Économies <span class="l2">du jour</span></p>
            <p class="fig-num"><span aria-hidden="true" id="f-eco"></span><span class="sr-only" id="f-eco-sr"></span></p>
            <p class="fig-sub" id="f-eco-sub"></p>
          </div>
          <div class="figure">
            <p class="label">Autonomie <span class="l2">du jour</span></p>
            <p class="fig-num"><span aria-hidden="true" id="f-auto"></span><span class="sr-only" id="f-auto-sr"></span></p>
            <p class="fig-sub" id="f-auto-sub"></p>
          </div>

<script>

const ETAT = {

    midi: {

      jour: { production: 20.3, maison: 15.3, autoconso_directe: 9.8, charge_batterie: 7.3, decharge_batterie: 3.8, export: 3.2, import: 1.7 },

/* ------------------------------------------------------------ Formats FR -- */
const NBSP = '\u00a0', NNBSP = '\u202f';      // espace insécable, espace fine insécable
const nf = {};
const nombre = (v, d = 1) => (nf[d] ||= new Intl.NumberFormat('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d })).format(v);
const kW = v => { const a = Math.abs(v); return a < 0.005 ? '0' : nombre(a, 2); };
const kWh = v => nombre(v, 1);
const euros = v => nombre(v, 2);
const pct = v => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 }).format(v);
const kWc = v => nombre(v, Number.isInteger(v) ? 0 : 1);                       // « 6 kWc », « 6,5 kWc »
const kWlong = v => `${kW(v)} kilowatt${Math.abs(v) >= 2 ? 's' : ''}`;          // lecteurs d'écran : pluriel dès 2
const eurosSigne = (v, signe) => Math.round(Math.abs(v) * 100) === 0 ? `${euros(0)}${NBSP}€` : `${signe}${euros(Math.abs(v))}${NBSP}€`;
/* Pourcentages entiers d'un partage qui totalisent exactement 100 (méthode des plus forts restes) */
function repartir(vals) {
  const v = vals.map(x => Math.max(0, x)), tot = v.reduce((a, x) => a + x, 0);
  if (tot <= 0) return v.map(() => 0);
  const brut = v.map(x => 100 * x / tot), ent = brut.map(Math.floor);
  let reste = 100 - ent.reduce((a, x) => a + x, 0);
  brut.map((x, k) => [x - ent[k], k]).sort((a, b) => b[0] - a[0]).forEach(([, k]) => { if (reste > 0) { ent[k]++; reste--; } });
  return ent;
}
const unite = (n, u) => `<span class="num">${n}</span>${NBSP}<span class="u">${u}</span>`;
const heureTxt = h => {
  h = ((h % 24) + 24) % 24;
  let H = Math.floor(h), M = Math.round((h - H) * 60);
  if (M === 60) { H = (H + 1) % 24; M = 0; }
  return M ? `${H}${NBSP}h${NBSP}${String(M).padStart(2, '0')}` : `${H}${NBSP}h`;
};
const duree = h => { const m = Math.round(h * 60 / 5) * 5, H = Math.floor(m / 60), M = m % 60; return H ? (M ? `${H}${NBSP}h${NBSP}${String(M).padStart(2, '0')}` : `${H}${NBSP}h`) : `${M}${NBSP}min`; };
const hDe = s => { const [H, M] = s.split(':').map(Number); return H + M / 60; };
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
const reduit = window.matchMedia('(prefers-reduced-motion: reduce)');
let PAUSE = false;                                // bouton « pause » de l'en-tête
const immobile = () => reduit.matches || PAUSE;   // plus d'animation continue (flux, LED)

/* Heure locale de la maison, quel que soit le fuseau du navigateur ou de l'horodatage (HA = UTC) */
function heureLocale(iso, fuseau) {
  const date = new Date(iso);
  const parts = new Intl.DateTimeFormat('fr-FR', { timeZone: fuseau, hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(date);
  const v = t => Number(parts.find(p => p.type === t).value);
  return { date, h: v('hour') + v('minute') / 60 };
}
const dateLongue = (date, fuseau) => {
  const t = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', timeZone: fuseau }).format(date);
  return t.charAt(0).toUpperCase() + t.slice(1);
};

/* ------------------------------------------------------- Dérivés de l'état -- */
/* Fonction pure : tout ce qui se calcule à partir de l'état brut. */
function deriver(e) {
  const { date, h } = heureLocale(e.horodatage, e.fuseau);
  const lever = hDe(e.soleil.lever), coucher = hDe(e.soleil.coucher);
  let scene = 'nuit';
  if (h >= lever - 0.5 && h < lever + 1.5) scene = 'aube';
  else if (h >= lever + 1.5 && h < coucher - 2.25) scene = 'jour';
  else if (h >= coucher - 2.25 && h < coucher) scene = 'doree';
  else if (h >= coucher && h < coucher + 0.75) scene = 'crepuscule';
  const i = e.instantane, j = e.jour, inst = e.installation;
  const evite = j.autoconso_directe + j.decharge_batterie;           // kWh non achetés grâce au soleil
  const economies = evite * inst.tarifAchat_eur_kWh;
  const autonomie = j.maison > 0 ? 100 * (1 - j.import / j.maison) : 0;
  const autoconso = j.production > 0 ? 100 * (1 - j.export / j.production) : 0;
  const p = i.production, m = i.maison, b = i.batterie, r = i.reseau, soc = i.batterie_pct;
  const soleil = p > 0.05;                                          // les panneaux produisent
  const surplus = soleil && p >= m - 0.02;
  // moment de la journée, pour les textes : avant l'aube, le jour, le soir (le soleil couché)
  const moment = h < lever ? (h < 5 ? 'nuit' : 'matin') : h < coucher ? 'jour' : 'soir';
  let pleine = null, socFin = null, tenue = null;
  if (b > 0.02 && soc < 100) ({ pleine, socFin } = finDeCharge(e, h, soleil));
  if (b < -0.02) tenue = Math.max(0, (soc - inst.reserve_pct) / 100 * inst.batterie_kWh) / -b;
  // partages en % (somme exacte de 100) : où va la production, d'où vient l'énergie de la maison
  const bSol = Math.max(0, Math.min(b, p - m));                     // part de la charge venue du toit
  const partsProd = repartir([m, bSol, -r]);                        // maison, batterie, réseau
  const partsBesoins = repartir([p, -b, r]);                        // soleil, batterie, réseau
  return { date, h, lever, coucher, scene, moment, soleil, surplus, economies, autonomie, autoconso, pleine, socFin, tenue, bSol, partsProd, partsBesoins };
}

/* Fin de charge de la batterie. Le jour, on suit la prévision solaire : la batterie ne reçoit que
   l'excédent sur la consommation actuelle (plafonné au rythme de charge actuel, plus l'appoint du
   réseau s'il y en a un). Sans soleil (charge sur le réseau) ou sans prévision : rythme constant.
   Renvoie { pleine: heure } si elle se remplit, sinon { socFin: % atteint quand la prévision s'arrête }. */
function finDeCharge(e, h, soleil) {
  const i = e.instantane, inst = e.installation, b = i.batterie;
  const besoin = (100 - i.batterie_pct) / 100 * inst.batterie_kWh;
  const c = e.courbe || {}, pas_h = c.pas_h || 0.5;
  const prev = (c.prevision || []).map((v, k) => v == null ? null : [k * pas_h, v]).filter(x => x && x[0] > h);
  if (!soleil || !prev.length) return { pleine: h + besoin / b, socFin: null };
  const pts = [[h, i.production], ...prev], appoint = Math.max(0, i.reseau), dt = 1 / 12;
  let kwh = 0;
  for (let k = 0; k < pts.length - 1; k++) {
    const [t0, p0] = pts[k], [t1, p1] = pts[k + 1];
    for (let t = t0; t < t1 - 1e-9; t += dt) {
      const d = Math.min(dt, t1 - t), pr = p0 + (p1 - p0) * (t + d / 2 - t0) / (t1 - t0);
      const charge = Math.min(b, Math.max(0, pr - i.maison) + appoint);
      if (charge > 0 && kwh + charge * d >= besoin) return { pleine: t + (besoin - kwh) / charge, socFin: null };
      kwh += charge * d;
    }
  }
  return { pleine: null, socFin: Math.min(100, i.batterie_pct + 100 * kwh / inst.batterie_kWh) };
}
/* Texte de fin de charge, partagé par le chapô et le registre */
function texteCharge(d, soc) {
  if (d.pleine != null && d.pleine < 24) return `pleine vers ${heureTxt(arrondi5(d.pleine))}`;
  if (d.socFin != null && Math.round(d.socFin) > Math.round(soc)) return `≈${NBSP}${pct(d.socFin)}${NNBSP}% au coucher du soleil`;
  return '';
}
const arrondi5 = h => Math.round(h * 12) / 12;

/* ================================================================ RENDU === */
function rendre(e) {
  const d = deriver(e);
  rendreUne(e, d);
  rendreRegistre(e, d);
  rendreCourbe(e, d);
  rendreTotaux(e, d);
  rendreDemain(e, d);
  rendreMaison(e, d);
}

/* --- L'essentiel : le chiffre, l'arc du soleil, la phrase, les deux chiffres du jour --- */
function rendreUne(e, d) {
  const i = e.instantane, inst = e.installation, p = i.production, m = i.maison, b = i.batterie, r = i.reseau;
  const heure = `<span class="heure">${heureTxt(d.h)}</span>`;
  $('k-date').innerHTML = `${dateLongue(d.date, e.fuseau)} · ${heure}`;
  $('k-date-c').innerHTML = `${new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', timeZone: e.fuseau }).format(d.date)} · ${heure}`;

  // LE chiffre : la production le jour, la consommation de la maison quand les panneaux dorment
  const val = d.soleil ? p : m;
  $('m-label').textContent = d.soleil ? 'Production solaire' : 'La maison consomme';
  $('m-pastille').style.background = d.soleil ? 'var(--c-sun)' : 'var(--c-home)';
  $('m-num-sr').textContent = `${kW(val)}${NBSP}kW`;
  compter($('m-num'), val, v => `${kW(v)}<span class="u">${NBSP}kW</span>`, $('m-num-box'));
  $('m-sub').innerHTML = d.soleil
    ? `${pct(100 * p / inst.puissanceCrete_kWc)}${NNBSP}% de la puissance crête (${kWc(inst.puissanceCrete_kWc)}${NBSP}kWc)`
    : b < -0.02
      ? `Fournie par la batterie${r > 0.05 ? ` et le réseau` : ''}, chargée à ${pct(i.batterie_pct)}${NNBSP}%`
      : `Fournie par le réseau`;

  // Arc du soleil, du lever au coucher
  const jour = d.h >= d.lever && d.h <= d.coucher;
  const t = Math.min(1, Math.max(0, (d.h - d.lever) / (d.coucher - d.lever)));
  const th = Math.PI * (1 - t), sx = 62 + 53 * Math.cos(th), sy = 45 - 38 * Math.sin(th);
  $('arc-fait').setAttribute('stroke-dasharray', jour ? `${t} 1` : `0 1`);
  for (const id of ['arc-astre', 'arc-halo']) { const c = $(id); c.setAttribute('cx', sx.toFixed(1)); c.setAttribute('cy', sy.toFixed(1)); c.style.display = jour ? '' : 'none'; }
  const leverAff = !jour && d.h > d.coucher ? hDe(e.soleil.lever_demain) : d.lever;
  $('arc-g').innerHTML = `<b>Lever</b>${heureTxt(leverAff)}`;
  $('arc-d').innerHTML = `<b>Coucher</b>${heureTxt(d.coucher)}`;
  const reste = d.coucher - d.h;
  $('arc').setAttribute('aria-label', jour
    ? `Course du soleil${NBSP}: levé à ${heureTxt(d.lever)}, coucher à ${heureTxt(d.coucher)}, encore ${duree(reste)} de jour`
    : `Le soleil est couché${NNBSP}; prochain lever à ${heureTxt(leverAff)}`);

  // Le titre et le chapô, écrits à partir de l'état ET de l'heure (soir, nuit, avant l'aube, jour couvert)
  let titre, chapo;
  const fin = texteCharge(d, i.batterie_pct);
  const quand = { soir: 'Ce soir', nuit: 'Cette nuit', matin: 'Ce matin' }[d.moment];
  if (!d.soleil) {
    if (b < -0.05) {
      titre = d.moment === 'soir' ? `Ce soir, vous vivez sur <em>le soleil de l’après-midi</em>.`
        : d.moment === 'jour' ? `Ciel couvert, <em>la batterie prend le relais</em>.`
        : `${quand}, vous vivez encore sur <em>le soleil d’hier</em>.`;
      const source = d.moment === 'soir' ? 'La batterie, remplie en journée, alimente la maison.'
        : d.moment === 'jour' ? `Les panneaux ne produisent pas pour l’instant${NBSP}: la batterie alimente la maison.`
        : 'La batterie, remplie hier, alimente la maison.';
      const avantLever = d.h < d.lever ? d.h + d.tenue >= d.lever : d.moment === 'soir' && d.h + d.tenue >= 24 + d.lever - 1;
      chapo = `${source} Il lui reste ${pct(i.batterie_pct)}${NNBSP}%${NBSP}: ${avantLever ? 'de quoi tenir jusqu’au lever du soleil' : `environ ${duree(d.tenue)} à ce rythme`}.` + (r > 0.05 ? ` Le réseau complète.` : ` Le réseau se repose.`);
    } else {
      titre = d.moment === 'jour' ? `Ciel couvert, <em>le réseau prend le relais</em>.` : `${quand}, <em>le réseau prend le relais</em>.`;
      const panneaux = d.moment === 'jour' ? 'Le ciel est trop couvert pour les panneaux' : 'Les panneaux dorment';
      const batt = i.batterie_pct <= e.installation.reserve_pct + 1 ? 'la batterie est à sa réserve'
        : b > 0.02 ? `la batterie se recharge sur le réseau (${pct(i.batterie_pct)}${NNBSP}%)`
        : `la batterie se repose à ${pct(i.batterie_pct)}${NNBSP}%`;
      chapo = `${panneaux} et ${batt}${NBSP}: la maison achète ce qu’il lui faut au réseau.`;
    }
  } else if (d.surplus) {
    const encore = d.scene === 'doree' ? 'encore ' : '';
    titre = `Votre maison tourne ${encore}<em>au soleil</em>.`;
    const morceaux = [];
    if (b > 0.05) morceaux.push(`remplit la batterie${fin ? ` (${fin})` : ''}`);
    if (r < -0.05) morceaux.push(`vend le surplus au réseau`);
    chapo = `Le toit couvre toute la maison` + (morceaux.length === 2 ? `, ${morceaux[0]} et ${morceaux[1]}.` : morceaux.length ? ` et ${morceaux[0]}.` : '.');
    if (r >= 0.05) chapo += ` Le réseau complète la charge de la batterie.`;
    else if (r > -0.05) chapo += ` Le réseau se repose.`;
    if (b <= 0.05 && i.batterie_pct >= 99) chapo += ` La batterie est pleine.`;
  } else {
    titre = d.scene === 'aube' ? `Le jour se lève <em>sur vos panneaux</em>.` : b < -0.05 ? `Le soleil fait sa part, <em>la batterie complète</em>.` : `Le soleil fait sa part, <em>le réseau complète</em>.`;
    const apport = b < -0.05 && r > 0.05 ? 'la batterie et le réseau apportent le reste' : b < -0.05 ? 'la batterie apporte le reste' : r > 0.05 ? 'le réseau apporte le reste' : '';
    chapo = `Le toit fournit ${d.partsBesoins[0]}${NNBSP}% de ce que consomme la maison` + (apport ? `${NBSP}; ${apport}.` : `.`);
  }
  // n'écrire que ce qui change : #dek est une région « aria-live », chaque réécriture serait relue
  const titreEl = $('titre'), dek = $('dek');
  if (titreEl._v !== titre) { titreEl.innerHTML = titre; titreEl._v = titre; }
  if (dek._v !== chapo) { dek.innerHTML = chapo; dek._v = chapo; }

  // Les deux chiffres du jour
  const eco = euros(d.economies), auto = pct(d.autonomie);
  $('f-eco-sr').textContent = `${eco}${NBSP}€ économisés aujourd’hui`;
  $('f-auto-sr').textContent = `${auto}${NNBSP}% d’autonomie aujourd’hui`;
  compter($('f-eco'), d.economies, v => `${euros(v)}<span class="u">${NBSP}€</span>`);
  compter($('f-auto'), d.autonomie, v => `${pct(v)}<span class="u">${NNBSP}%</span>`);
  const depuis = new Date(e.mois.depuis + 'T12:00:00');
  $('f-eco-sub').innerHTML = `${euros(e.mois.economies_eur)}${NBSP}€ depuis le ${depuis.getDate() === 1 ? '1<sup>er</sup>' : depuis.getDate()}${NBSP}${new Intl.DateTimeFormat('fr-FR', { month: 'long' }).format(depuis)}`;
  $('f-auto-sub').textContent = e.jour.import < 0.05 ? 'Rien acheté au réseau'
    : `${kWh(e.jour.import)}${NBSP}kWh ${d.autonomie >= 60 ? 'seulement ' : ''}achetés au réseau`;
}

/* Décompte animé : une seule fois, au premier affichage. Les mises à jour suivantes (Home Assistant)
   affichent directement la nouvelle valeur, sans repartir de zéro. */
function compter(el, cible, gabarit, boite) {
  el._cible = cible; el._gabarit = gabarit;
  if (reduit.matches || el.dataset.vu) { el.innerHTML = gabarit(cible); return; }
  el.dataset.vu = '1';
  if (boite) boite.classList.add('compte');
  const t0 = performance.now(), duree = 1100;
  const pas = t => {
    const k = Math.min(1, (t - t0) / duree), ease = 1 - Math.pow(1 - k, 3);
    el.innerHTML = el._gabarit(el._cible * ease);
    if (k < 1) requestAnimationFrame(pas);
    else { el.innerHTML = el._gabarit(el._cible); if (boite) boite.classList.remove('compte'); }
  };
  requestAnimationFrame(pas);
}

/* --- En ce moment : où part l'énergie du toit (le jour), d'où vient celle de la maison (sinon) --- */

  const i = e.instantane, inst = e.installation;

  let titre;

    L.push({ ...res, sub: r < -0.02 ? `${partP(2)}<br>revendue ${nombre(inst.tarifRevente_eur_kWh, 2)}${NBSP}€/kWh`

    const leverProchain = heureTxt(d.h > d.coucher ? hDe(e.soleil.lever_demain) : d.lever);
    L.push({ c: '--c-sun', ico: 'soleil', nom: 'Soleil', v: p,

               aria-label="Charge de la batterie" aria-valuetext="${pct(l.soc)} %, ${nombre(l.soc / 100 * inst.batterie_kWh, 1)} kWh stockés sur ${nombre(inst.batterie_kWh, 0)} kWh, réserve de secours ${res15} %">
            <span class="soc-plein" style="width:${l.soc}%"></span><span class="soc-reserve" style="left:${res15}%"></span>

/* ------------------------------------------------------- Courbe du jour --- */
function lisse(pts) {           // interpolation monotone (Fritsch–Carlson) → chemin SVG sans dépassement
  const n = pts.length;
  if (n < 2) return '';
  if (n === 2) return `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}L${pts[1][0].toFixed(1)},${pts[1][1].toFixed(1)}`;
  const dx = [], dy = [], m = [];
  for (let k = 0; k < n - 1; k++) { dx[k] = pts[k + 1][0] - pts[k][0]; dy[k] = (pts[k + 1][1] - pts[k][1]) / (dx[k] || 1); }
  m[0] = dy[0]; m[n - 1] = dy[n - 2];
  for (let k = 1; k < n - 1; k++) m[k] = dy[k - 1] * dy[k] <= 0 ? 0 : 3 * (dx[k - 1] + dx[k]) / ((2 * dx[k] + dx[k - 1]) / dy[k - 1] + (dx[k] + 2 * dx[k - 1]) / dy[k]);
  let s = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let k = 0; k < n - 1; k++) {
    const [x0, y0] = pts[k], [x1, y1] = pts[k + 1], h = dx[k] / 3;
    s += `C${(x0 + h).toFixed(1)},${(y0 + m[k] * h).toFixed(1)} ${(x1 - h).toFixed(1)},${(y1 - m[k + 1] * h).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
  }
  return s;
}

let COURBE = null;   // géométrie courante, pour le curseur
function rendreCourbe(e, d) {
  const box = $('chart-svg');
  const W = Math.max(260, Math.round(box.clientWidth || 340)), H = W < 420 ? 196 : 228;
  const pad = { l: 0, r: 2, t: 24, b: 26 };
  const c = e.courbe, now = d.h;
  const serie = arr => arr.map((v, k) => v == null ? null : [k * c.pas_h, v]).filter(Boolean);
  const mesProd = serie(c.production).filter(([t]) => t <= now);
  const mesMaison = serie(c.maison).filter(([t]) => t <= now);
  const prevision = serie(c.prevision || []).filter(([t]) => t > now);
  const toutes = [...mesProd, ...mesMaison, ...prevision].map(p => p[1]);
  const ymax = Math.max(4, Math.ceil(Math.max(...toutes) + .3));
  const X = t => pad.l + (t / 24) * (W - pad.l - pad.r);
  const Y = v => pad.t + (1 - v / ymax) * (H - pad.t - pad.b);

  const pNow = [now, e.instantane.production], mNow = [now, e.instantane.maison];
  if (!mesProd.length || now > mesProd[mesProd.length - 1][0]) mesProd.push(pNow);
  if (!mesMaison.length || now > mesMaison[mesMaison.length - 1][0]) mesMaison.push(mNow);
  // prévision : du point actuel jusqu'au premier zéro après le coucher
  const prev = [pNow];
  for (const p of prevision) { prev.push(p); if (p[1] === 0 && p[0] > d.coucher) break; }

  const px = a => a.map(([t, v]) => [X(t), Y(v)]);
  const prodPath = lisse(px(mesProd));
  const aire = prodPath + `L${X(now).toFixed(1)},${Y(0)}L${X(0)},${Y(0)}Z`;
  const prevPath = prev.length > 1 && d.soleil ? lisse(px(prev)) : '';
  const consoPath = lisse(px(mesMaison));

  // étiquettes directes : pic de production, pointe du matin pour la maison
  const pic = mesProd.reduce((a, b) => b[1] > a[1] ? b : a, [0, 0]);
  const matin = mesMaison.filter(p => p[0] >= 5 && p[0] <= 10).reduce((a, b) => b[1] > a[1] ? b : a, [7, 0]);
  const lignes = [];
  for (let v = 1; v <= ymax; v++) lignes.push(`<line class="grille" x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}"/>${v % 2 === 0 ? `<text class="axe" x="0" y="${Y(v) - 5}">${v}${NBSP}kW</text>` : ''}`);
  const heures = [0, 6, 12, 18, 24].map(t => `<text class="axe" x="${X(t)}" y="${H - 6}" text-anchor="${t === 0 ? 'start' : t === 24 ? 'end' : 'middle'}">${t}${NBSP}h</text>`).join('');
  const nowX = X(now);
  const nowAnchor = nowX > W - 50 ? 'end' : nowX < 50 ? 'start' : 'middle';

  box.innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="gAireProd" x1="0" y1="${Y(ymax * .9)}" x2="0" y2="${Y(0)}" gradientUnits="userSpaceOnUse">
        <stop offset="0" style="stop-color:var(--c-sun);stop-opacity:.42"/>
        <stop offset="1" style="stop-color:var(--c-sun);stop-opacity:.04"/>
      </linearGradient>
    </defs>
    <rect class="nuit" x="${X(0)}" y="${pad.t}" width="${X(d.lever) - X(0)}" height="${Y(0) - pad.t}"/>
    <rect class="nuit" x="${X(d.coucher)}" y="${pad.t}" width="${X(24) - X(d.coucher)}" height="${Y(0) - pad.t}"/>
    ${lignes.join('')}
    <line class="base" x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}"/>
    ${heures}
    <path class="prod-aire" d="${aire}"/>
    <path class="prod" d="${prodPath}"/>
    ${prevPath ? `<path class="prev" d="${prevPath}"/>` : ''}
    <path class="conso" d="${consoPath}"/>
    ${pic[1] > 0.3 ? `<text class="etiq" x="${X(pic[0])}" y="${Y(pic[1]) - 9}" text-anchor="middle">Production</text>` : ''}
    ${matin[1] > 0.4 ? `<text class="etiq" x="${X(matin[0])}" y="${Y(matin[1]) - 9}" text-anchor="middle">Maison</text>` : ''}
    <line class="maint" x1="${nowX}" x2="${nowX}" y1="${pad.t - 10}" y2="${Y(0)}"/>
    <text class="maint-t" x="${nowX}" y="${pad.t - 14}" text-anchor="${nowAnchor}">${heureTxt(now)}</text>
    <circle class="point" cx="${nowX}" cy="${Y(pNow[1])}" r="4.5" style="fill:var(--c-sun)"/>
    <circle class="point" cx="${nowX}" cy="${Y(mNow[1])}" r="4.5" style="fill:var(--c-home)"/>
    <g id="curseur" style="display:none">
      <line class="curseur" y1="${pad.t}" y2="${Y(0)}"/>
      <circle class="point" r="4.5" style="fill:var(--c-sun)" data-s="p"/>
      <circle class="point" r="4.5" style="fill:var(--c-home)" data-s="m"/>
    </g>
  </svg>`;

  // points interrogeables (mesures uniquement)
  const pts = mesProd.map(([t, v]) => { const q = mesMaison.find(mm => Math.abs(mm[0] - t) < 1e-6); return { t, p: v, m: q ? q[1] : null }; });
  COURBE = { W, H, X, Y, pts };
  if (curseurIdx >= pts.length) curseurIdx = -1;

  $('chart-desc').textContent = `Courbe de la journée : production solaire et consommation de la maison, de minuit à ${heureTxt(now)}. ` +
    (pic[1] > 0.3 ? `Pic de production à ${heureTxt(pic[0])} avec ${kW(pic[1])}${NBSP}kW. ` : '') +
    `Flèches gauche et droite, Début et Fin pour parcourir les mesures.`;
  $('chart-table').innerHTML = `<caption>Mesures au pas de 30 minutes</caption><thead><tr><th scope="col">Heure</th><th scope="col">Production (kW)</th><th scope="col">Maison (kW)</th></tr></thead><tbody>` +
    pts.map(q => `<tr><th scope="row">${heureTxt(q.t)}</th><td>${kW(q.p)}</td><td>${q.m == null ? '—' : kW(q.m)}</td></tr>`).join('') + '</tbody>';
}

let curseurIdx = -1;
function montrerCurseur(idx) {
  if (!COURBE) return;
  const g = document.getElementById('curseur'), bulle = $('bulle');
  if (idx < 0) { g.style.display = 'none'; bulle.classList.remove('on'); curseurIdx = -1; return; }
  idx = Math.max(0, Math.min(COURBE.pts.length - 1, idx));
  curseurIdx = idx;
  const q = COURBE.pts[idx], x = COURBE.X(q.t);
  g.style.display = '';
  const ln = g.querySelector('line'); ln.setAttribute('x1', x); ln.setAttribute('x2', x);
  const cp = g.querySelector('[data-s="p"]'), cm = g.querySelector('[data-s="m"]');
  cp.setAttribute('cx', x); cp.setAttribute('cy', COURBE.Y(q.p));
  cm.setAttribute('cx', x); cm.setAttribute('cy', COURBE.Y(q.m ?? 0)); cm.style.display = q.m == null ? 'none' : '';
  // valeur d'abord, nom de la série ensuite ; clés en trait, comme les courbes
  bulle.innerHTML = `<b>${heureTxt(q.t)}</b><span style="--c:var(--c-sun)"><i></i><strong>${kW(q.p)}${NBSP}kW</strong> production</span>` +
    (q.m == null ? '' : `<span style="--c:var(--c-home)"><i></i><strong>${kW(q.m)}${NBSP}kW</strong> maison</span>`);
  // la bulle se pose à côté du curseur, dans le graphique (elle ne couvre ni le titre ni la légende) ;
  // si aucun côté n'a la place (écran étroit, milieu de journée), elle chevauche le curseur mais se
  // glisse au-dessus, entre ou au-dessous des points lus, jamais sur eux
  const bw = bulle.offsetWidth || 150, bh = bulle.offsetHeight || 64;
  const scale = $('chart').getBoundingClientRect().width / COURBE.W, Wp = COURBE.W * scale, Hp = COURBE.H * scale;
  const xp = x * scale;
  let left, top = 26;
  if (xp > bw + 16) left = xp - bw - 12;
  else if (xp + 12 + bw <= Wp) left = xp + 12;
  else {
    left = xp > Wp / 2 ? Math.max(0, xp - bw - 12) : Math.min(Wp - bw, xp + 12);
    const ys = [COURBE.Y(q.p), q.m == null ? null : COURBE.Y(q.m)].filter(v => v != null).map(v => v * scale);
    const libre = t => ys.every(y => y < t - 9 || y > t + bh + 9);
    const essais = [26, ...ys.map(y => y + 12), ...ys.map(y => y - 12 - bh), Hp - bh - 22, -bh - 6];
    top = essais.filter(t => t >= -bh - 6 && t <= Hp - bh && libre(t)).sort((a, b) => Math.abs(a - 26) - Math.abs(b - 26))[0] ?? 26;
  }
  bulle.style.left = left + 'px';
  bulle.style.top = top + 'px';
  bulle.classList.add('on');
}
function brancherCourbe() {
  const fig = $('chart');
  const idxDe = ev => {
    const r = fig.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width * COURBE.W;
    let best = 0, bd = Infinity;
    COURBE.pts.forEach((q, k) => { const dd = Math.abs(COURBE.X(q.t) - x); if (dd < bd) { bd = dd; best = k; } });
    return best;
  };
  fig.addEventListener('pointermove', ev => montrerCurseur(idxDe(ev)));
  fig.addEventListener('pointerdown', ev => montrerCurseur(idxDe(ev)));
  fig.addEventListener('pointerleave', () => montrerCurseur(-1));
  fig.addEventListener('blur', () => montrerCurseur(-1));
  fig.addEventListener('keydown', ev => {
    const n = COURBE.pts.length;
    const cible = { ArrowLeft: curseurIdx < 0 ? n - 1 : curseurIdx - 1, ArrowRight: curseurIdx < 0 ? n - 1 : curseurIdx + 1, Home: 0, End: n - 1 }[ev.key];
    if (cible == null) { if (ev.key === 'Escape') montrerCurseur(-1); return; }
    ev.preventDefault();
    montrerCurseur(cible);
  });
}

function rendreTotaux(e, d) {
  const j = e.jour, inst = e.installation;
  // avant l'aube : la journée commence à peine ; après le coucher : le bilan ; le jour : « déjà »
  const produit = j.production > 0.1;
  if (d.h < d.lever) {
    $('k-jour').textContent = 'Depuis minuit';
    $('t-jour').innerHTML = produit ? `Le soleil a déjà fourni <em>${kWh(j.production)}${NBSP}kWh</em>` : `Le soleil n’est <em>pas encore levé</em>`;
  } else if (d.h >= d.coucher) {
    $('k-jour').textContent = 'Le bilan de la journée';
    $('t-jour').innerHTML = produit ? `Le soleil a fourni <em>${kWh(j.production)}${NBSP}kWh</em>` : `Une journée sans soleil`;
  } else {
    $('k-jour').textContent = 'Aujourd’hui, depuis minuit';
    $('t-jour').innerHTML = produit ? `Le soleil a déjà fourni <em>${kWh(j.production)}${NBSP}kWh</em>` : `Pas encore de soleil <em>aujourd’hui</em>`;
  }
  const items = [
    { c: '--c-sun', k: 'Produit', v: j.production, s: `${pct(d.autoconso)}${NNBSP}% gardés à la maison` },
    { c: '--c-home', k: 'Consommé', v: j.maison, s: `${pct(d.autonomie)}${NNBSP}% sans le réseau` },
    { c: '--c-grid', k: 'Vendu', g: 'vente', v: j.export, s: eurosSigne(j.export * inst.tarifRevente_eur_kWh, '+') },
    { c: '--c-grid', k: 'Acheté', g: 'achat', v: j.import, s: eurosSigne(j.import * inst.tarifAchat_eur_kWh, '−') }
  ];
  $('totals').innerHTML = items.map(t => `<div class="total" style="--c:var(${t.c})"><dt class="label">${t.g ? FLECHE[t.g] : '<i class="m" aria-hidden="true"></i>'}${t.k}</dt><dd>${unite(kWh(t.v), 'kWh')}<small>${t.s}</small></dd></div>`).join('');
}

function rendreDemain(e, d) {
  const dm = e.meteo.demain, dd = new Date(dm.date + 'T12:00:00');
  $('k-demain').textContent = `Demain · ${new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).format(dd)}`;
  $('t-demain').innerHTML = `${dm.ciel}, <em>≈${NBSP}${kWh(dm.production_kWh)}${NBSP}kWh</em> attendus sur le toit.`;
  const [a, b] = dm.creneau.map(hDe);
  $('conseil').innerHTML = `«${NNBSP}Lancez le <span class="nw">lave-linge</span> et le <span class="nw">lave-vaisselle</span> entre ${heureTxt(a)} et ${heureTxt(b)}${NBSP}: ils tourneront au soleil, sans rien coûter.${NNBSP}»`;
  const L = hDe(e.soleil.lever_demain), C = hDe(e.soleil.coucher_demain || e.soleil.coucher);
  const g = v => 100 * (v - L) / (C - L);
  $('creneau').innerHTML = `<div class="creneau-barre" aria-hidden="true"><span style="left:${g(a).toFixed(1)}%;width:${(g(b) - g(a)).toFixed(1)}%">${heureTxt(a)} – ${heureTxt(b)}</span></div>
    <p class="creneau-heures"><span>Lever ${heureTxt(L)}</span><span class="sr-only">Meilleur créneau de ${heureTxt(a)} à ${heureTxt(b)}.</span><span>Coucher ${heureTxt(C)}</span></p>`;
  $('colophon-install').textContent = `${e.lieu} · ${kWc(e.installation.puissanceCrete_kWc)}${NBSP}kWc · batterie ${nombre(e.installation.batterie_kWh, 0)}${NBSP}kWh · achat ${nombre(e.installation.tarifAchat_eur_kWh, 4)}${NBSP}€/kWh`;
}
