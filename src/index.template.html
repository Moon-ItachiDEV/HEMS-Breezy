<!doctype html>
<!--
  Breezy · Accueil — « la maison au grand air »
  ---------------------------------------------------------------------------
  GABARIT : tools/build.js produit index.html (une page autonome) depuis ce fichier :
   - les marqueurs INCLURE insèrent le code commun à toutes les pages (src/partage/ : jetons, scène, pont vers
     Home Assistant, formats, icônes, ciel, comètes, interrupteur des animations) ;
   - l'illustration assets/maison.svg est insérée telle quelle, en ligne, à la place du marqueur MAISON_SVG de #scene
     (ses éléments sont animés à l'exécution, le fichier n'est jamais modifié).
      node tools/build.js                                      (toutes les pages)
      node tools/build.js src/index.template.html index.html   (ou : node tools/inline-svg.js src/index.template.html index.html)

  DONNÉES : les entités de Home Assistant (bloc CONFIG.entites du script, « ← AJUSTE ICI »), reçues de
  la coque de S&A-HOME par postMessage (request_states → states, history_request → history_result).
  Hors de Home Assistant (page ouverte seule) : des valeurs d'exemple, au même format que les états de
  Home Assistant, lues par le même code. Aperçus : index.html?apercu=midi | soir | nuit | borne
  (ou Breezy.apercu('nuit') dans la console).

  Deux axes indépendants :
   - la SCÈNE (ciel, lumière sur la maison, soleil, lune, étoiles, nuages) suit l'heure de la maison,
     la hauteur du soleil (sun.sun) et la météo (weather.*) ;
   - le THÈME (fond de page, cartes, texte) suit le mode sombre de Home Assistant dans la coque,
     sinon prefers-color-scheme.
  Couleurs d'énergie, partout les mêmes : soleil ambre, maison bleu, batterie vert, réseau violet, borne prune.
  Une seule famille : Geist (400/500/600).
  Flux d'énergie : le relais en comètes de S&A-HOME (cycle 5,6 s, moyeu sur le coffret principal).
-->
<html lang="fr">

<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">

<style>
/* ================================================================ ACCUEIL === */
.bilan-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); }   /* « Autoconsommés », le plus long libellé, tient sur une ligne */
.bm { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 0 14px; }
.bm + .bm:not(.premiere) { border-left: 1px solid var(--filet); }
.bm[hidden], .journee[hidden] { display: none; }
.bm-b { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.bm-l { max-width: 100%; font: 500 12.5px/16px var(--police); color: var(--encre-2); }
.bm-v { max-width: 100%; white-space: nowrap; font-weight: 400; font-size: clamp(19px, 6.2vw, 24px); line-height: 28px; letter-spacing: -.04em; color: var(--encre); }
.bm-v .u { font-size: 13px; letter-spacing: 0; color: var(--encre-2); margin-left: 3px; }
.bm-p { position: relative; display: block; height: 3px; margin: 9px 5px 0 0; border-radius: 999px; background: var(--piste); }
.bm-p i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--v, 0) * 1%); border-radius: inherit; background: linear-gradient(90deg, color-mix(in oklch, var(--c) 55%, transparent), var(--c)); transition: width 1.2s cubic-bezier(.2, .7, .2, 1); }
.bm-p i::after { content: ""; position: absolute; right: -5px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px var(--c), 0 1px 3px oklch(.25 .02 260 / .3); }
/* texte agrandi : les libellés ne tiennent plus sur trois colonnes → une rangée par mesure, jamais de mot coupé */
.bilan-cols.rangees { grid-template-columns: minmax(0, 1fr); row-gap: 12px; }
.bilan-cols.rangees .bm + .bm:not(.premiere) { border-left: 0; border-top: 1px solid var(--filet); padding-top: 12px; }
.bilan-cols.rangees .bm-v { white-space: normal; }
@media (max-width: 429px) { .bm { padding: 0 11px; } }
@media (max-width: 374px) { .bm { padding: 0 7px; } .bm-l { font-size: 12px; } }

/* --- Production solaire : réel et prévision Solcast, de 6 h à 21 h (S&A-HOME, écran Énergie) --- */
.journee .carte-tete { flex-wrap: wrap; row-gap: 4px; }               /* téléphone étroit : la légende passe sous le titre */
.journee h2 { white-space: nowrap; }
.legende { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 14px; font: 500 12.5px/16px var(--police); color: var(--encre-2); }
.legende span[hidden] { display: none; }
.legende span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legende i { display: block; width: 14px; flex: none; }
.legende .k-reel { height: 3px; border-radius: 2px; background: var(--soleil-t); }
.legende .k-prev { height: 0; border-top: 1.5px dashed var(--encre-3); }
.courbe { position: relative; margin-top: 12px; touch-action: pan-y; cursor: crosshair; border-radius: 8px; }
.courbe svg { display: block; width: 100%; overflow: visible; }
.courbe .c-bande { fill: color-mix(in oklch, var(--soleil) 26%, transparent); }
.courbe .c-base { stroke: var(--piste); stroke-width: 1.5; }
.courbe .c-aire { fill: var(--soleil-graphe); opacity: .38; }
.courbe .c-prev { fill: none; stroke: var(--encre-3); stroke-width: 1.5; stroke-dasharray: 4 4; }
.courbe .c-reel { fill: none; stroke: var(--soleil-t); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.courbe .c-now { stroke: var(--encre-2); stroke-width: 1.5; stroke-dasharray: 3 3; }
.courbe .c-pin { fill: var(--surface); stroke-width: 2; }
.courbe .c-pin.r { stroke: var(--soleil-t); }
.courbe .c-pin.p { stroke: var(--encre-3); }
.bulle { position: absolute; top: 0; left: 0; z-index: 2; padding: 5px 10px; border-radius: 999px; background: var(--encre); color: var(--fond); font: 600 12.5px/16px var(--police); white-space: nowrap; pointer-events: none; }
.bulle[hidden] { display: none; }
.axe-h { display: flex; justify-content: space-between; margin-top: 8px; font: 500 12px/16px var(--police); color: var(--encre-3); }

/* moyeu des flux (dans le SVG de la maison) */
.hub-halo { fill: var(--maison); opacity: .55; }
.hub-disque { transform-box: fill-box; transform-origin: center; }
.hub-rond { fill: var(--surface-scene); stroke: var(--maison); stroke-width: 1.8; }
.hub-ic { fill: var(--maison); }
#fl-hub.eteint .hub-halo { display: none; }
#fl-hub.eteint .hub-rond { stroke: var(--encre-3); }
#fl-hub.eteint .hub-ic { fill: var(--encre-3); }
@media (forced-colors: active) {
  .bm-p, .bm-p i { forced-color-adjust: none; }
}
</style>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   Breezy · réglages et pont vers Home Assistant (comme S&A-HOME)
   ← AJUSTE ICI : toutes les entités sont regroupées dans CONFIG.entites.
   Une entité vide ('') = l'élément n'est pas relié : il est masqué. Une entité absente, « unavailable » ou « unknown »
   dans Home Assistant : sa valeur s'affiche « — », son flux et sa pastille sont masqués (rien n'est jamais inventé).
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  fuseau: 'Europe/Paris',                                                 // ← l'heure de la maison (heures, minuit, « demain »)
  entites: {
    // la maison en direct (les mêmes entités que S&A-HOME et Voltia)
    solaire: 'sensor.production_pv_maison_totale_w',                      // W, somme des trois onduleurs (Izy 2K + Deye 2K + Deye 1K = 5 kW)
    batterie: 'sensor.solarflow_2400_ac_bat_in_out',                      // W signés, négatif = charge (Zendure SolarFlow 2400 AC)
    socBatterie: 'sensor.solarflow_2400_ac_electric_level',               // %
    batterieDispo: 'sensor.solarflow_2400_ac_available_kwh',              // kWh stockés (3 packs AB3000 de 2,88 kWh)
    batterieMin: 'number.solarflow_2400_ac_min_soc',                      // % : la réserve basse, jamais entamée
    batterieMax: 'number.solarflow_2400_ac_soc_set',                      // % : la limite haute de charge (« pleine vers » compte jusqu'à 100 %, comme S&A-HOME)
    reseau: 'sensor.te31njn2n154747_l3_p',                                // W signés, + = import / − = export (Smart3CT L3)
    voiture: 'sensor.te31njn2n154747_l2_p',                               // W à la borne de la Kia (Smart3CT L2)
    soleil: 'sun.sun',
    meteo: ['weather.homelyvibes_sa', 'weather.forecast_maison', 'weather.forecast_home'],   // la première qui existe
    // le bilan et la courbe du jour
    productionJour: 'sensor.production_pv_jour',                          // kWh depuis minuit
    previsionJour: 'sensor.solcast_pv_forecast_previsions_pour_aujourd_hui',   // kWh ; attribut detailedForecast : kW par demi-heure
    eco: {
      autoconsoJour: 'sensor.hv_autoconso_reel_jour',                     // kWh
      jour: 'sensor.hv_eco_reel_jour',                                    // €
      mois: 'sensor.hv_eco_reel_month',                                   // €
      cumul: 'sensor.hv_economies_reel_cumul'                             // € depuis le début (pour la future page Économies)
    }
  }
};
const ENT = CONFIG.entites;

<!--INCLURE partage/ha.js-->
<!--INCLURE partage/formats.js-->
<!--INCLURE partage/icones.js-->
<!--INCLURE partage/ciel.js-->
<!--INCLURE partage/flux.js-->
<!--INCLURE partage/animations.js-->

/* ---------- Statistiques de Home Assistant : la production heure par heure ---------- */
const HISTO = { heures: null, quand: 0 };
/* la production heure par heure depuis minuit (moyennes, en W) : comme chargerHisto de S&A-HOME, rechargée toutes les 15 min */
function chargerHisto() {
  if (!HA.enCoque || !ENT.solaire) return;
  const now = Date.now(), minuit = minuitDe(now);
  HISTO.quand = now;
  HA.historique({ start: new Date(minuit).toISOString(), end: new Date(now).toISOString(), entities: [ENT.solaire], period: 'hour', types: ['mean'] })
    .then(r => { HISTO.heures = r || {}; planifierRendu(); })
    .catch(() => { /* sans historique : la courbe garde la prévision et la valeur actuelle */ });
}

/* ---------- Valeurs d'exemple (page ouverte hors de Home Assistant) ----------
   Des états au format de Home Assistant ({ entity_id, state, attributes, last_changed }) et un historique au
   format des statistiques ({ start, mean }), lus par le MÊME code que les vrais.
   Journée du samedi 10 octobre 2026 : lever 8 h 05, coucher 19 h 13 ; batterie 3 × 2,88 kWh, réserve 10 % ;
   un passage nuageux vers 11 h ; économies au prix moyen évité de 0,222 €/kWh. */
const EXEMPLE = {
  jour: '2026-10-10', lever: '08:05', coucher: '19:13', capacite: 8.64, reserve: 10, prix: 0.222, moisAvant: 28.44, cumulAvant: 912.4,
  apercus: {
    //        heure                          météo HA          W : soleil, batterie (− = charge), réseau (+ = import), borne ; % batterie ; part autoconsommée
    defaut: { t: '2026-10-10T17:12:00+02:00', meteo: 'sunny',        pv: 1460, bat: -520,  reseau: -360, borne: 0,    soc: 91, auto: .82 },
    midi:   { t: '2026-10-10T13:24:00+02:00', meteo: 'sunny',        pv: 3360, bat: -2400, reseau: -300, borne: 0,    soc: 50, auto: .94 },
    soir:   { t: '2026-10-10T19:34:00+02:00', meteo: 'clear-night',  pv: 0,    bat: 1620,  reseau: 3,    borne: 0,    soc: 76, auto: .84 },
    nuit:   { t: '2026-10-10T22:36:00+02:00', meteo: 'clear-night',  pv: 0,    bat: 660,   reseau: 2,    borne: 0,    soc: 45, auto: .89 },
    borne:  { t: '2026-10-10T14:10:00+02:00', meteo: 'partlycloudy', pv: 3380, bat: 0,     reseau: 4340, borne: 7200, soc: 98, auto: .86 }
  }
};
/* prévision (kW) à l'heure h, et moyenne réelle de l'heure h → h + 1 */
const prevuKW = h => (h <= 8.25 || h >= 19 ? 0 : 3.45 * Math.pow(Math.sin(Math.PI * (h - 8.25) / 10.75), 1.4));
const reelKW = h => prevuKW(h + 0.5) * (h === 11 ? 0.72 : h === 12 ? 0.86 : 0.96);
function etatsExemple(nom) {
  const A = EXEMPLE.apercus[nom] || EXEMPLE.apercus.defaut;
  const t = Date.parse(A.t), date = new Date(t), h = heureLocale(date).h, minuit = minuitDe(t), quand = date.toISOString();
  const etats = {};
  const pose = (id, state, attributes = {}) => { if (id) etats[id] = { entity_id: id, state: String(state), attributes, last_changed: quand }; };
  // historique : les moyennes horaires des heures déjà finies
  const H = Math.floor(h), serie = [];
  for (let k = 0; k < H; k++) serie.push({ start: minuit + k * 3600000, end: minuit + (k + 1) * 3600000, mean: Math.round(reelKW(k) * 1000) });
  const prod = serie.reduce((a, p) => a + p.mean / 1000, 0) + (h - H) * A.pv / 1000;
  // Solcast : 48 demi-heures (kW), fourchette 10-90 %
  const det = Array.from({ length: 48 }, (_, k) => {
    const kw = prevuKW(k / 2 + 0.25);
    return { period_start: new Date(minuit + k * 1800000).toISOString(), pv_estimate: +kw.toFixed(4), pv_estimate10: +(kw * 0.72).toFixed(4), pv_estimate90: +Math.min(5, kw * 1.1).toFixed(4) };
  });
  const prev = det.reduce((a, p) => a + p.pv_estimate / 2, 0);
  // le soleil de ce jour-là, à Paris
  const lever = hDe(EXEMPLE.lever), coucher = hDe(EXEMPLE.coucher);
  const prochain = (x, hx) => new Date(minuit + (h < x ? 0 : 86400000) + hx * 3600000).toISOString();
  const elevation = positionSoleil(date, 48.85, 2.35).elevation;
  pose(ENT.soleil, elevation > 0 ? 'above_horizon' : 'below_horizon', { elevation: +elevation.toFixed(2), rising: h < (lever + coucher) / 2, next_rising: prochain(lever, lever), next_setting: prochain(coucher, coucher) });
  pose([].concat(ENT.meteo)[0], A.meteo);
  pose(ENT.solaire, A.pv, { unit_of_measurement: 'W' });
  pose(ENT.batterie, A.bat, { unit_of_measurement: 'W' });
  pose(ENT.socBatterie, A.soc, { unit_of_measurement: '%' });
  pose(ENT.batterieDispo, (A.soc / 100 * EXEMPLE.capacite).toFixed(2), { unit_of_measurement: 'kWh' });
  pose(ENT.batterieMin, EXEMPLE.reserve, { unit_of_measurement: '%' });
  pose(ENT.batterieMax, 100, { unit_of_measurement: '%' });
  pose(ENT.reseau, A.reseau, { unit_of_measurement: 'W' });
  pose(ENT.voiture, A.borne, { unit_of_measurement: 'W' });
  pose(ENT.productionJour, prod.toFixed(2), { unit_of_measurement: 'kWh' });
  pose(ENT.previsionJour, prev.toFixed(2), { unit_of_measurement: 'kWh', detailedForecast: det });
  const auto = prod * A.auto, eco = auto * EXEMPLE.prix;
  pose(ENT.eco.autoconsoJour, auto.toFixed(2), { unit_of_measurement: 'kWh' });
  pose(ENT.eco.jour, eco.toFixed(2), { unit_of_measurement: '€' });
  pose(ENT.eco.mois, (EXEMPLE.moisAvant + eco).toFixed(2), { unit_of_measurement: '€' });
  pose(ENT.eco.cumul, (EXEMPLE.cumulAvant + eco).toFixed(2), { unit_of_measurement: '€' });
  return { t, etats, histo: { [ENT.solaire]: serie } };
}

/* ------------------------------------------------------- Lecture des entités (S&A-HOME : fluxMaison, batterieMaison) --
   Puissances en W. batNet = −batterie : + = la batterie se charge, − = elle alimente la maison.
   maison = soleil + réseau − batNet − borne ; elle n'est connue que si le soleil, le réseau et la batterie (si reliée) le sont.
   La borne (Smart3CT L2) indisponible compte pour 0, comme dans S&A-HOME : seule sa pastille et son flux disparaissent. */
function fluxMaison() {
  const pv = HA.nb(ENT.solaire), z = HA.nb(ENT.batterie), grid = HA.nb(ENT.reseau), ve = HA.nb(ENT.voiture);
  if (pv == null && z == null && grid == null) return null;
  const batNet = z != null ? -z : null;
  const complet = pv != null && grid != null && (z != null || !ENT.batterie);
  return {
    pv: pv != null ? Math.max(0, pv) : null, batNet, grid, ve: ve != null ? Math.max(0, ve) : null,
    maison: complet ? Math.max(0, pv + grid - (batNet || 0) - (ve || 0)) : null
  };
}
/* capacité = disponible / charge (comme S&A-HOME) ; « pleine » : jusqu'à 100 %, au rythme de maintenant (plafonné à 24 h) ;
   « jusqu'à » : au rythme de maintenant, jusqu'à la réserve basse (pas jusqu'à 0 %). Durées en heures.
   Réserve reliée mais illisible (charge ou réserve indisponible) : pas d'heure, plutôt qu'une heure comptée jusqu'à 0 %. */
function batterieMaison(f) {
  const soc = HA.nb(ENT.socBatterie), dispo = HA.nb(ENT.batterieDispo), reserve = HA.nb(ENT.batterieMin);
  const cap = soc != null && soc > 5 && dispo != null ? dispo / (soc / 100) : null;
  const reserveOk = !ENT.batterieMin || (cap != null && reserve != null);
  const utile = dispo != null && reserveOk ? Math.max(0, dispo - (ENT.batterieMin ? cap * reserve / 100 : 0)) : null;
  const batNet = f?.batNet ?? null;
  const autonomie = batNet != null && utile != null && batNet < -30 ? utile * 1000 / -batNet : null;
  const pleine = batNet != null && cap && dispo != null && batNet > 50 && soc < 100 ? Math.min(24, Math.max(0, cap - dispo) * 1000 / batNet) : null;
  return { soc, dispo, cap, pleine, autonomie };
}
/* LA ligne du héros : « Batterie pleine vers 18 h 20 », « Batterie jusqu’à 23 h 15 » ou rien */
function ligneBatterie(d) {
  const b = d.b;
  if (b.pleine != null) return `Batterie pleine vers ${heureTxt(arrondi5(d.h + b.pleine))}`;
  if (b.autonomie != null) {
    if (b.autonomie >= 24) return `Batterie pour plus de 24${NBSP}h`;
    const fin = tronque5(d.h + b.autonomie);
    return `Batterie jusqu’à ${fin >= 24 ? 'demain ' : ''}${heureTxt(fin)}`;
  }
  return '';
}

/* ------------------------------------------------------- Dérivés -- */
let MEMO = { jour: null, annonce: null };
/* Flux allumés aux seuils de S&A-HOME : soleil ≥ 30 W, |batterie| > 30 W, |réseau| > 5 W, borne > 50 W ; la maison dès qu'elle est connue.
   u = √(kW / 3) : la vitesse des comètes croît avec la puissance. */
function calculerFlux(f, aBatterie) {
  const out = {};
  const flux = (nom, actif, w, phase) => { const kW = Math.abs(w || 0) / 1000; out[nom] = { actif: !!actif, phase, kW, u: Math.sqrt(borne(kW / 3, 0, 1)) }; };
  flux('soleil', f?.pv != null && f.pv >= 30, f?.pv, 'ent');
  flux('maison', f?.maison != null, f?.maison, 'sor');
  flux('batterie', aBatterie && f?.batNet != null && Math.abs(f.batNet) > 30, f?.batNet, f?.batNet > 0 ? 'sor' : 'ent inv');
  flux('reseau', f?.grid != null && Math.abs(f.grid) > 5, f?.grid, f?.grid < 0 ? 'sor' : 'ent inv');
  flux('voiture', f?.ve != null && f.ve > 50, f?.ve, 'cab');
  return out;
}

function deriver() {
  const t = HA.maintenant(), { date, h } = heureLocale(new Date(t));
  // le soleil : sun.sun (élévation, prochains lever et coucher) ; à défaut, sa position calculée à Paris
  const el = HA.attr(ENT.soleil, 'elevation');
  const E = el != null && Number.isFinite(Number(el)) ? Number(el) : positionSoleil(date, 48.85, 2.35).elevation;
  const nr = Date.parse(HA.attr(ENT.soleil, 'next_rising')), ns = Date.parse(HA.attr(ENT.soleil, 'next_setting'));
  const lever = Number.isFinite(nr) ? heureLocale(new Date(nr)).h : 7.5, coucher = Number.isFinite(ns) ? heureLocale(new Date(ns)).h : 19;
  const montant = HA.attr(ENT.soleil, 'rising');
  const matin = typeof montant === 'boolean' ? montant : h < (lever + coucher) / 2;
  const cle = E >= 10 ? 'jour' : E >= -1 ? (matin ? 'aube' : 'doree') : E >= -8 ? 'crepuscule' : 'nuit';
  const progres = borne((h - lever) / (coucher - lever), 0, 1);
  const ciel = METEO[HA.etat(HA.premiere(ENT.meteo))] || 'clair';
  const f = fluxMaison(), b = batterieMaison(f);
  const aBatterie = !!(ENT.batterie || ENT.socBatterie);
  // le chiffre : la production le jour, la maison le soir (hystérésis 80 W / 30 W) ; sans mesure du soleil, sa hauteur décide
  const pv = f?.pv ?? null;
  let jour = MEMO.jour;
  if (pv == null) jour = E > 0; else if (pv >= 80) jour = true; else if (pv < 30) jour = false; else if (jour == null) jour = E > 0;
  MEMO.jour = jour;
  // bilan du jour (S&A-HOME : production, prévision Solcast, part autoconsommée, économies)
  const prod = HA.nb(ENT.productionJour), prev = HA.nb(ENT.previsionJour), auto = HA.nb(ENT.eco.autoconsoJour);
  const bilan = { prod, prev, autoPct: prod && auto != null ? borne(Math.round(auto / prod * 100), 0, 100) : null, ecoJour: HA.nb(ENT.eco.jour), ecoMois: HA.nb(ENT.eco.mois) };
  return { t, date, h, lever, coucher, E, matin, cle, progres, ciel, f, b, soc: b.soc, aBatterie, mode_une: jour ? 'soleil' : 'maison', bilan, flux: calculerFlux(f, aBatterie) };
}

/* ================================================================ HÉROS === */
const A = { PANNEAUX: [470, 190], PANNEAUX_G: [330, 175], LUCARNE: [773, 285], BATTERIE: [508, 668], RESEAU: [900, 743], GARAGE: [1065, 362], HUB: [759, 538] };
let PHRASE = '', PASTILLES = [], UNE_VAL = null;

function rendreHero(d) {
  const f = d.f, jour = d.mode_une === 'soleil';
  const M = jour ? { k: 'Production solaire', c: 'var(--soleil)', v: f?.pv ?? null, ancre: A.PANNEAUX }
                 : { k: 'La maison consomme', c: 'var(--maison)', v: f?.maison ?? null, ancre: A.LUCARNE };
  $('une').style.setProperty('--c', M.c);
  $('une-k').querySelector('span').textContent = M.k;
  const pw = puissance(M.v), html = pw.u ? unite(pw.n, pw.u) : pw.n;
  // décompte : seulement si la valeur bouge d'au moins 2 %
  const el = $('une-v');
  cancelAnimationFrame(el._raf);
  if (pw.u && UNE_VAL && UNE_VAL.u === pw.u && !immobile() && Math.abs(pw.w - UNE_VAL.w) / Math.max(UNE_VAL.w, 1) >= .02) {
    const de = UNE_VAL.w, a = pw.w, unit = pw.u, t0 = performance.now();
    const pas = t => {
      const k = Math.min(1, (t - t0) / 600), x = de + (a - de) * (1 - Math.pow(1 - k, 3));
      el.innerHTML = k < 1 ? unite(unit === 'kW' ? kWtxt(x) : nombre(Math.round(x / 10) * 10, 0), unit) : html;
      if (k < 1) el._raf = requestAnimationFrame(pas);
    };
    el._raf = requestAnimationFrame(pas);
  } else el.innerHTML = html;
  UNE_VAL = pw.u ? pw : null;
  $('une-sr').textContent = `${M.k}${NBSP}: ${pLong(M.v)}`;
  PHRASE = ligneBatterie(d);
  const ph = $('une-phrase');
  if (ph.textContent !== PHRASE) ph.textContent = PHRASE;
  if (!PHRASE) ph.hidden = true;
  MEMO.ancreUne = M.v != null ? M.ancre : null;
  MEMO.couleurUne = M.c;
  rendrePastilles(d);
}

/* Pastilles : où elles vont (ciel ou sol), leur ancre, leur texte long et court.
   Un flux à zéro n'a pas de pastille (comme S&A-HOME) ; la source du chiffre n'en a pas non plus. */
function rendrePastilles(d) {
  const f = d.f || {}, F = d.flux, L = [];
  const sep = '<span class="sep">·</span>';
  if (d.mode_une === 'maison' && F.soleil.actif) L.push({ id: 'soleil', place: 'ciel', ancre: A.PANNEAUX_G, c: 'var(--soleil)', ct: 'var(--soleil-t)', g: 'soleil', long: [pTxt(f.pv), ''], court: [pTxt(f.pv), ''], label: `Le soleil produit ${pLong(f.pv)}` });
  if (d.mode_une === 'soleil' && f.maison != null) L.push({ id: 'maison', place: 'ciel', ancre: A.LUCARNE, c: 'var(--maison)', ct: 'var(--maison-t)', g: 'maison', long: [pTxt(f.maison), ''], court: [pTxt(f.maison), ''], label: `La maison consomme ${pLong(f.maison)}` });
  // la borne de la Kia : seulement quand elle recharge (le dessin n'a pas de voiture : la pastille montre le garage)
  if (F.voiture.actif) L.push({ id: 'borne', place: 'ciel', ancre: A.GARAGE, c: 'var(--borne)', ct: 'var(--borne-t)', g: 'borne', nom: 'Borne', long: [pTxt(f.ve), ''], court: [pTxt(f.ve), ''], label: `La borne recharge la voiture à ${pLong(f.ve)}` });
  // la batterie : sa charge, et sa puissance quand elle se charge (↑) ou se vide (↓)
  if (d.aBatterie && (d.soc != null || F.batterie.actif)) {
    const socTxt = d.soc != null ? `${pct(d.soc)}${NNBSP}%` : '—';
    const sens = F.batterie.actif ? (f.batNet > 0 ? 'haut' : 'bas') : null, pB = sens ? `${fleche(sens)}${pTxt(f.batNet)}` : '';
    L.push({ id: 'batterie', place: 'sol', ancre: A.BATTERIE, c: 'var(--batterie)', ct: 'var(--batterie-t)', g: 'batterie', long: [socTxt, pB && `${sep}${pB}`], court: [socTxt, pB],
      label: `Batterie à ${d.soc != null ? `${pct(d.soc)} %` : 'une charge non mesurée'}${sens ? `, ${sens === 'haut' ? 'en charge' : 'en décharge'} à ${pLong(f.batNet)}` : ''}` });
  }
  // le réseau : ↙ import, ↗ export
  if (F.reseau.actif) {
    const imp = f.grid > 0, v = `${fleche(imp ? 'import' : 'export')}${pTxt(f.grid)}`;
    L.push({ id: 'reseau', place: 'sol', ancre: A.RESEAU, c: 'var(--reseau)', ct: 'var(--reseau-t)', g: 'reseau', long: [v, ''], court: [v, ''], label: `Réseau${NBSP}: ${imp ? 'import' : 'export'} de ${pLong(f.grid)}` });
  }
  PASTILLES = L;
  const ul = $('pastilles');
  const seg = ([v, s]) => `${v ? `<span class="v">${v}</span>` : ''}${s ? `<span class="s">${s}</span>` : ''}`;
  for (const id of ['soleil', 'maison', 'borne', 'batterie', 'reseau']) {
    let pill = ul.querySelector(`.pill[data-noeud="${id}"]`);
    if (!pill) {
      const li = document.createElement('li');
      li.innerHTML = `<span class="pill cache" data-noeud="${id}" aria-hidden="true"></span><span class="sr-only"></span>`;
      ul.appendChild(li);
      pill = li.firstChild;
      pill.addEventListener('pointerenter', () => pulserAncre(id));
    }
    const li = pill.parentElement, P = L.find(x => x.id === id);
    // pastille absente : son <li> sort de la liste (lecteur d'écran), la pastille s'efface en fondu
    if (!P) { pill.classList.add('cache'); li.setAttribute('aria-hidden', 'true'); li.lastChild.textContent = ''; continue; }
    li.removeAttribute('aria-hidden');
    pill.className = 'pill';
    pill.style.setProperty('--c', P.c); pill.style.setProperty('--ct', P.ct);
    const html = `<span class="g">${icone(P.g)}</span><span class="long">${P.nom ? `<span class="n">${P.nom}</span>` : ''}${seg(P.long)}</span><span class="court">${seg(P.court)}</span>`;
    if (pill.innerHTML !== html) pill.innerHTML = html;
    if (li.lastChild.textContent !== P.label) li.lastChild.textContent = P.label;
  }
}
function pulserAncre(id) {
  if (immobile()) return;
  const a = $('fils').querySelector(`.ancre[data-noeud="${id}"]`);
  if (!a) return;
  a.classList.remove('pouls'); void a.getBoundingClientRect(); a.classList.add('pouls');
}

/* --- Capsule d'état : en direct (coque de Home Assistant), connexion, ou valeurs d'exemple (page ouverte seule) --- */
let SANS_REPONSE = false;                            // dans la coque, aucun état reçu après 6 s
function rendreCapsule() {
  const [c, long, court] = !HA.enCoque ? ['var(--soleil)', `Hors de Home Assistant${NBSP}: valeurs d’exemple`, 'Valeurs d’exemple']
    : HA.connecte ? ['var(--batterie)', 'En direct', 'En direct']
    : SANS_REPONSE ? ['var(--alerte)', 'Home Assistant ne répond pas', 'Sans réponse']
    : ['var(--ciel-encre-2)', 'Connexion à Home Assistant…', 'Connexion…'];
  const cap = $('capsule');
  cap.style.setProperty('--c', c);
  const html = `<span class="pt" aria-hidden="true"></span><span class="cl" aria-hidden="true">${long}</span><span class="cc" aria-hidden="true">${court}</span><span class="sr-only">${long}</span>`;
  if (cap.innerHTML !== html) cap.innerHTML = html;
}

/* ================================================================ SCÈNE === */
const svg = document.querySelector('#scene svg');
let CADRE = null, SCENE = null;

function rendreScene(d) {
  SCENE = d;
  // --- le ciel (partage/ciel.js) : dégradé, encre, astre, nuages, pluie
  const ciel = peindreCiel(d, CADRE);
  const sombre = themeSombre();

  // --- la maison : voile (multiplication), teinte, halo, lumières, ombres au sol
  const vo = interCles(VOILE[sombre ? 'sombre' : 'clair'], d.E, 1);
  const voileEl = svg.querySelector('#voile'), blanc = luminanceLab(vo) > .985;
  voileEl.setAttribute('display', blanc ? 'none' : 'inline');
  voileEl.setAttribute('fill', cssLab(vo));
  const teinte = svg.querySelector('#teinte');
  if (d.cle === 'jour') { teinte.setAttribute('display', 'inline'); teinte.setAttribute('fill', 'url(#gTeinteJour)'); teinte.setAttribute('opacity', sombre ? '.25' : '.35'); }
  else if (d.cle === 'doree' || d.cle === 'aube') { teinte.setAttribute('display', 'inline'); teinte.setAttribute('fill', 'url(#gTeinteDoree)'); teinte.setAttribute('opacity', '.55'); }
  else teinte.setAttribute('display', 'none');
  const contreJour = HALO[d.cle];
  const halo = svg.querySelector('#halo');
  halo.setAttribute('display', contreJour ? 'inline' : 'none');
  if (contreJour) { svg.querySelector('#halo-couleur').setAttribute('flood-color', contreJour[0]); halo.setAttribute('opacity', contreJour[1]); }
  const soirOuNuit = d.cle === 'crepuscule' || d.cle === 'nuit';
  // lumières d'ambiance selon l'heure ; la tranchée s'éclaire quand le réseau travaille
  const Lum = {
    pignon: d.cle !== 'jour',
    baies: soirOuNuit,
    lucarne: d.cle !== 'jour',
    applique: soirOuNuit,
    tranchee: d.flux.reseau.actif
  };
  const allumees = [];
  for (const [k, on] of Object.entries(Lum)) {
    const g = svg.querySelector('#lueur-' + k);
    if (!g) continue;
    g.style.transition = immobile() ? 'none' : 'opacity 1.2s ease';
    g.style.opacity = on ? '1' : '0';
    const fen = svg.querySelector('#fen-' + k);
    if (fen) fen.setAttribute('fill-opacity', on ? '1' : '0');
    if (on && k !== 'tranchee') allumees.push({ pignon: 'le séjour', baies: 'la terrasse', lucarne: 'la chambre sous la lucarne', applique: 'le garage' }[k]);
  }
  svg.querySelector('#flaques').setAttribute('opacity', soirOuNuit && (Lum.baies || Lum.applique) ? '1' : '0');
  // ombres du dessin : grises de jour sur ciel clair, noires sur ciel sombre
  const sombreCiel = ciel === 'sombre';
  svg.querySelectorAll('#sol > g').forEach(g => {
    g.setAttribute('opacity', sombreCiel ? '.6' : g.dataset.o);
    g.querySelectorAll('polygon').forEach(pg => pg.setAttribute('fill', sombreCiel ? '#000' : pg.dataset.f));
  });
  // reflet fixe sur les panneaux, le jour
  const uSol = d.flux.soleil.u;
  svg.querySelector('#reflet-pv').setAttribute('opacity', d.flux.soleil.actif ? (.2 + .1 * uSol).toFixed(2) : '0');
  // LED de la batterie : niveau (bas 718 → haut 617) ; charge non mesurée : ni niveau ni halo (jamais un 0 % inventé)
  const socConnu = d.soc != null, soc = socConnu ? borne(d.soc, 0, 100) / 100 : 0;
  const r = $('soc-rect'), yHaut = 718 - 101 * soc;
  r.style.transition = immobile() ? 'none' : 'y .6s ease, height .6s ease';
  r.setAttribute('y', yHaut.toFixed(1)); r.setAttribute('height', socConnu ? (732 - yHaut).toFixed(1) : '0');
  const ledHalo = svg.querySelector('#lueur-led');
  if (ledHalo) ledHalo.style.opacity = d.aBatterie && socConnu ? (0.3 + .7 * soc).toFixed(2) : '0';
  // sans batterie : on retire batterie, gaines et LED
  for (const id of ['led-batterie', 'gaine-coffrets', 'gaine-batterie', 'calque-led']) { const el = svg.querySelector('#' + id); if (el) el.style.display = d.aBatterie ? '' : 'none'; }
  // sans borne reliée : pas de gaine vers le garage
  svg.querySelector('#gaine-borne').style.display = ENT.voiture ? '' : 'none';

  // la description : l'état des flux (mêmes seuils que les pastilles et les comètes)
  const f = d.f || {}, F = d.flux;
  // trois états : actif, au repos (mesuré sous le seuil), non mesuré (entité absente ou indisponible)
  const etat = (v, actif, txt, nm = 'non mesuré') => v == null ? nm : actif ? txt : 'au repos';
  const etatBatt = f.batNet == null ? 'puissance non mesurée' : F.batterie.actif ? (f.batNet > 0 ? `en charge à ${pLong(f.batNet)}` : `en décharge à ${pLong(f.batNet)}`) : 'au repos';
  svg.setAttribute('aria-label',
    `La maison entière. Panneaux solaires ${etat(f.pv, F.soleil.actif, `produisant ${pLong(f.pv)}`, 'non mesurés')}, ` +
    (f.maison != null ? `maison consommant ${pLong(f.maison)}` : 'consommation de la maison non mesurée') +
    (d.aBatterie ? `, batterie à ${d.soc != null ? `${pct(d.soc)} %` : 'une charge non mesurée'}, ${etatBatt}` : '') +
    `, réseau ${etat(f.grid, F.reseau.actif, f.grid > 0 ? `en import, ${pLong(f.grid)}` : `en export, ${pLong(f.grid)}`)}` +
    (F.voiture.actif ? `, borne de la voiture en charge, ${pLong(f.ve)}` : ENT.voiture && f.ve == null && d.f ? ', borne non mesurée (comptée à zéro)' : '') +
    (allumees.length ? `. Lumière allumée dans ${allumees.join(', ')}.` : '.'));
}

/* ======================================================= FLUX de la maison (moteur : partage/flux.js) === */
const COULEUR_FLUX = { soleil: null, maison: 'var(--maison)', batterie: 'var(--batterie)', reseau: 'var(--reseau)', voiture: 'var(--borne)' };
let FILE = null, MINUTERIE = 0;
const FLUX = {};

function preparerFlux() {
  const lire = id => points(svg.querySelector('#' + id)?.getAttribute('d') || '');
  // trajets d'exécution, centrés sur le moyeu (coffret principal)
  const T = {
    soleil:   [lire('gaine-pv-flux')],                                         // toit → moyeu
    maison:   [lire('gaine-lucarne-flux').reverse()],                          // moyeu → chambre sous la lucarne
    batterie: [lire('gaine-coffrets-flux').reverse(), lire('gaine-batterie-flux')],   // moyeu → coffret secondaire → batterie
    reseau:   [lire('gaine-sol-flux')],                                        // moyeu → tranchée
    voiture:  [lire('gaine-borne-flux')]                                       // moyeu → garage (le câble de la borne)
  };
  const defs = svg.querySelector('defs');
  for (const [nom, troncons] of Object.entries(T)) {
    const pieces = troncons.map(pts => ({ pts, d: cheminDe(pts), len: longueur(pts) }));
    const L = pieces.reduce((a, p) => a + p.len, 0);
    const debut = pieces[0].pts[0], finP = pieces[pieces.length - 1].pts.at(-1);
    // plus long tronçon droit : la flèche du mode immobile s'y pose
    let best = { l: 0 };
    pieces.forEach(p => { for (let q = 1; q < p.pts.length; q++) { const l = Math.hypot(p.pts[q][0] - p.pts[q - 1][0], p.pts[q][1] - p.pts[q - 1][1]); if (l > best.l) best = { l, a: p.pts[q - 1], b: p.pts[q] }; } });
    const stops = nom === 'soleil'
      ? '<stop offset="0" stop-color="oklch(0.92 0.13 98)"/><stop offset=".5" stop-color="oklch(0.86 0.16 90)"/><stop offset="1" stop-color="oklch(0.78 0.16 72)"/>'
      : `<stop offset="0" style="stop-color:${COULEUR_FLUX[nom]}"/><stop offset="1" style="stop-color:${COULEUR_FLUX[nom]}"/>`;
    defs.insertAdjacentHTML('beforeend',
      `<linearGradient id="fl-g-${nom}" gradientUnits="userSpaceOnUse">${stops}</linearGradient>` +
      `<linearGradient id="fl-gs-${nom}" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:${COULEUR_FLUX[nom] || 'oklch(0.86 0.16 90)'}" stop-opacity=".15"/><stop offset="1" style="stop-color:${COULEUR_FLUX[nom] || 'oklch(0.78 0.16 72)'}" stop-opacity="1"/></linearGradient>`);
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'fl-flux'); g.dataset.flux = nom; g.style.opacity = '0';
    svg.querySelector('#flux').appendChild(g);
    const gf = document.createElementNS(SVGNS, 'g');
    gf.setAttribute('class', 'fl-fixe'); gf.dataset.flux = nom; gf.style.display = 'none';
    svg.querySelector('#fl-fixe').appendChild(gf);
    FLUX[nom] = { nom, pieces, L, debut, fin: finP, best, g, gf, grad: defs.querySelector(`#fl-g-${nom}`), gradS: defs.querySelector(`#fl-gs-${nom}`),
      paths: [], anims: [], etat: { actif: false, phase: '', u: 0, kW: 0 }, PL: 0, cle: '' };
  }
  // le moyeu (S&A-HOME h3-hub) : halo flou, disque, petite maison — tailles en pixels, mises à l'échelle par cadrer()
  svg.querySelector('#fl-hub').innerHTML =
    `<g id="hub-echelle"><circle class="hub-halo" r="10" filter="url(#fl-flou-hub)"/><g class="hub-disque"><circle class="hub-rond" r="6.6"/><path class="hub-ic" d="M-3.4,2.6 V-0.8 L0,-3.6 L3.4,-0.8 V2.6 Z"/></g></g>`;
}

/* tailles en pixels d'écran → unités du dessin, à chaque cadrage */
function echelleFlux() {
  if (!CADRE) return;
  const s = CADRE.s, largeurMaison = 1179 * s;
  const coeur = borne(3.75 * Math.sqrt(largeurMaison / 390), 3.0, 4.5);
  svg.querySelector('#fl-flou-dev').setAttribute('stdDeviation', (0.64 * coeur / s).toFixed(2));
  svg.querySelector('#hub-echelle').setAttribute('transform', `translate(${A.HUB[0]} ${A.HUB[1]}) scale(${(1 / s).toFixed(4)})`);
  for (const f of Object.values(FLUX)) {
    const PL = Math.round(100 * Math.max(1, f.L * s / 120) * 10) / 10;
    f.coeur = coeur;
    if (PL !== f.PL) { f.PL = PL; construireFlux(f); f.cle = ''; }
    regleEpaisseurs(f);
  }
  // le cadrage a changé : animations recréées tout de suite (état déjà appliqué, même origine T0)
  if (s !== MEMO.sFlux) { MEMO.sFlux = s; appliquerFlux(true, null, true); }
}
function construireFlux(f) {
  annuler(f.anims);
  f.g.textContent = '';
  f.paths = construireComete(f.g, f.pieces, f.PL, `fl-g-${f.nom}`);
  // tracé fixe + flèche (mouvement réduit)
  f.gf.innerHTML = f.pieces.map(pc => `<path d="${pc.d}" stroke="url(#fl-gs-${f.nom})"/>`).join('') + '<path class="fl-fleche"/>';
}
function regleEpaisseurs(f) {
  const s = CADRE.s, u = f.etat.u ?? 0;
  const w = f.coeur * (0.85 + 0.30 * u) / s * (f.nom === 'voiture' ? 0.7 : 1);       // le câble : plus fin (S&A-HOME, 2,6 au lieu de 3,75)
  for (const p of f.paths) {
    p.setAttribute('stroke-width', (p._lueur ? w * 1.6 : w).toFixed(2));
    if (p._lueur) p.style.opacity = (.16 + .12 * u).toFixed(3);
  }
  f.gf.querySelectorAll('path:not(.fl-fleche)').forEach(p => p.setAttribute('stroke-width', (f.coeur / s).toFixed(2)));
}
/* sens du dégradé : de l'origine de l'énergie vers sa destination */
function orienter(f) {
  const versHub = f.etat.phase === 'ent' ? false : f.etat.phase === 'ent inv';
  // trajets dessinés moyeu → extrémité, sauf le soleil (dessiné source → moyeu)
  let [o, dst] = [f.debut, f.fin];
  if (versHub) [o, dst] = [f.fin, f.debut];
  for (const gr of [f.grad, f.gradS]) {
    gr.setAttribute('x1', o[0]); gr.setAttribute('y1', o[1]);
    gr.setAttribute('x2', dst[0]); gr.setAttribute('y2', dst[1] + 0.01);
  }
  // flèche du mode immobile : 62 % le long du plus long tronçon droit, dans le sens de l'énergie
  const { a, b } = f.best, s = CADRE?.s || 1;
  let [p0, p1] = versHub ? [b, a] : [a, b];
  const x = p0[0] + (p1[0] - p0[0]) * .62, y = p0[1] + (p1[1] - p0[1]) * .62;
  const ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
  const fl = f.gf.querySelector('.fl-fleche');
  fl.setAttribute('d', 'M4,0 L-4,-3.5 L-2.4,0 L-4,3.5 Z');
  fl.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${(1 / s).toFixed(4)})`);
  fl.style.fill = COULEUR_FLUX[f.nom] || 'var(--soleil)';
}

/* Applique l'état demandé (FILE) : tout de suite (premier rendu, cadrage, flux caché) ou au prochain début de cycle */
function demanderFlux(fluxEtat, toutDeSuite) {
  FILE = fluxEtat;
  clearTimeout(MINUTERIE);
  // sans mouvement (flèches fixes), aucune comète n'est en vol : le nouveau sens s'affiche tout de suite
  if (toutDeSuite || T0 == null || immobile()) { appliquerFlux(false); return; }
  // les flux cachés changent tout de suite ; les autres attendent la fin du cycle (pas de comète coupée en vol)
  const immediat = Object.entries(fluxEtat).filter(([n]) => !FLUX[n].etat.actif);
  if (immediat.length) appliquerFlux(false, immediat.map(([n]) => n));
  const now = document.timeline.currentTime ?? performance.now();
  const attente = T_CYCLE - (((now - T0) % T_CYCLE) + T_CYCLE) % T_CYCLE;
  MINUTERIE = setTimeout(() => appliquerFlux(false), attente);
}
function appliquerFlux(recreer, seulement = null, garder = false) {
  if (T0 == null) T0 = document.timeline.currentTime ?? performance.now();
  const calme = immobile();
  for (const f of Object.values(FLUX)) {
    if (seulement && !seulement.includes(f.nom)) continue;
    const voulu = garder ? f.etat : (FILE?.[f.nom] || f.etat);
    const cle = `${voulu.actif}|${voulu.phase}|${(voulu.u ?? 0).toFixed(3)}|${calme}|${f.PL}`;
    f.etat = { ...voulu };
    // attributs de test, sur le chemin d'origine
    const src = svg.querySelector('#' + { soleil: 'gaine-pv-flux', maison: 'gaine-lucarne-flux', batterie: 'gaine-batterie-flux', reseau: 'gaine-sol-flux', voiture: 'gaine-borne-flux' }[f.nom]);
    if (src) { src.dataset.flux = f.nom; src.dataset.phase = voulu.actif ? voulu.phase : 'off'; src.dataset.kw = (voulu.kW ?? 0).toFixed(2); }
    if (f.nom === 'batterie') { const c2 = svg.querySelector('#gaine-coffrets-flux'); if (c2) Object.assign(c2.dataset, src.dataset); }
    if (!CADRE) continue;
    f.g.style.opacity = voulu.actif && !calme ? '1' : '0';
    f.gf.style.display = voulu.actif && calme ? '' : 'none';
    if (cle === f.cle && !recreer) continue;
    f.cle = cle;
    regleEpaisseurs(f);
    orienter(f);
    annuler(f.anims);
    if (!voulu.actif || calme) continue;
    const win = fenetre(voulu.phase, voulu.u);
    f.win = win;
    for (const p of f.paths) {
      const a = p.animate(images(p._N, f.PL, voulu.phase, win, p._decal), { duration: T_CYCLE, iterations: Infinity });
      f.anims.push(enregistrer(a));
    }
  }
  animerMoyeu();
  animerLed();
  synchroPause();                                                // hors écran ou onglet caché : les nouvelles animations naissent en pause
}
/* Moyeu : il « reçoit » quand les comètes entrantes arrivent (28,2 %) */
let HUB_ANIMS = [];
function animerMoyeu() {
  const halo = svg.querySelector('.hub-halo'), disque = svg.querySelector('.hub-disque');
  const hub = svg.querySelector('#fl-hub');
  const sansMesure = !SCENE?.f;                                   // aucune mesure : moyeu éteint
  hub.classList.toggle('eteint', sansMesure);
  const cle = `${immobile()}|${sansMesure}|${T0}`;
  if (cle === MEMO.cleHub) return;
  MEMO.cleHub = cle;
  annuler(HUB_ANIMS);
  if (immobile() || sansMesure) return;
  const o = [{ offset: 0, opacity: .55 }, { offset: .22, opacity: .55 }, { offset: .282, opacity: .9 }, { offset: .40, opacity: .55 }, { offset: 1, opacity: .55 }];
  const sc = [{ offset: 0, transform: 'scale(1)' }, { offset: .22, transform: 'scale(1)' }, { offset: .282, transform: 'scale(1.08)' }, { offset: .40, transform: 'scale(1)' }, { offset: 1, transform: 'scale(1)' }];
  HUB_ANIMS.push(enregistrer(halo.animate(o, { duration: T_CYCLE, iterations: Infinity, easing: 'ease-in-out' })));
  HUB_ANIMS.push(enregistrer(disque.animate(sc, { duration: T_CYCLE, iterations: Infinity, easing: 'ease-in-out' })));
}
/* LED : une bande de lumière monte juste après l'arrivée de la comète (charge), descend quand elle part (décharge) */
let LED_ANIMS = [];
function animerLed() {
  const onde = svg.querySelector('#led-onde');
  const fb = FLUX.batterie?.etat || {};
  const soc = (SCENE?.soc ?? 0) / 100, haut = 718 - 101 * soc;
  const mode = immobile() || !fb.actif || !SCENE?.aBatterie ? 'fixe' : fb.phase === 'sor' ? 'charge' : 'decharge';
  const cle = `${mode}|${haut.toFixed(1)}|${T0}|${FLUX.batterie?.win}`;
  if (cle === MEMO.cleLed) return;
  MEMO.cleLed = cle;
  annuler(LED_ANIMS);
  onde.setAttribute('opacity', mode === 'fixe' ? '0' : '1');
  if (mode === 'fixe') return;
  const bas = 'translateY(26px)', sommet = `translateY(${(haut - 700 - 26).toFixed(1)}px)`;
  // charge : l'onde monte juste après l'arrivée de la comète ; décharge : elle descend pendant que la comète part (0 → 18 %)
  const wb = FLUX.batterie?.win?.[1] ?? 0.554;
  const k = mode === 'charge'
    ? [{ offset: 0, transform: bas, opacity: 0 }, { offset: wb, transform: bas, opacity: 0 }, { offset: wb + .026, transform: bas, opacity: 1, easing: 'ease-in-out' }, { offset: wb + .166, transform: sommet, opacity: 1 }, { offset: wb + .196, transform: sommet, opacity: 0 }, { offset: 1, transform: sommet, opacity: 0 }]
    : [{ offset: 0, transform: sommet, opacity: 0 }, { offset: .02, transform: sommet, opacity: 1, easing: 'ease-in-out' }, { offset: .18, transform: bas, opacity: 1 }, { offset: .21, transform: bas, opacity: 0 }, { offset: 1, transform: bas, opacity: 0 }];
  LED_ANIMS.push(enregistrer(onde.animate(k, { duration: T_CYCLE, iterations: Infinity })));
}

/* ================================================================ CADRAGE ===
   La maison entière (x 0 → 1179, y 20 → 760) tient toujours dans le héros et rien d'opaque ne la couvre :
   - portrait : pleine largeur (échelle s = W/1179) ; échelle de compaction L0 → L4 ;
   - court (téléphone à l'horizontale) : à droite, toute la hauteur ; texte et pastilles dans la colonne de gauche ;
   - large (tablette à l'horizontale, ordinateur) : à droite, alignée sur la grille du contenu. */
const NIVEAUX = [
  { gBK: 14, taille: W => borne(.16 * W, 52, 72), phrase: 16, lh: 22, sg: 6, gSky: 12, gSH: 14, gG: 12, pad: 12, ov: true },
  { gBK: 10, taille: W => borne(.14 * W, 46, 56), phrase: 15, lh: 20, sg: 4, gSky: 10, gSH: 12, gG: 10, pad: 10 },
  { gBK: 8, taille: W => borne(.14 * W, 46, 56), phrase: 0, gSky: 8, gSH: 10, gG: 8, pad: 8 },
  { gBK: 8, taille: W => borne(.14 * W, 44, 52), phrase: 0, gG: 8, pad: 8, ligne: true }

/* profil haut de la maison (y du premier pixel opaque, par x) : les filets et le soleil restent au-dessus */
const PROFIL = [[0, 540], [50, 540], [54, 212], [155, 104], [905, 20], [1036, 200], [1040, 300], [1179, 352]];
function toitY(xd) {
  if (xd <= PROFIL[0][0]) return PROFIL[0][1];
  for (let k = 1; k < PROFIL.length; k++) { const [x1, y1] = PROFIL[k], [x0, y0] = PROFIL[k - 1]; if (xd <= x1) return y0 + (y1 - y0) * (xd - x0) / (x1 - x0); }
  return PROFIL[PROFIL.length - 1][1];
}
const silhouette = (x, C) => { const xd = (x - C.hx) / C.s; return xd < -2 || xd > 1181 ? Infinity : C.hy + (toitY(xd) - 20) * C.s; };

/* chevauchements : centres souhaités → centres résolus (écart ≥ gap, bornés à [g, d]) */
function resoudre(items, g, d, gap = 8) {
  const ordre = items.map((it, k) => ({ ...it, k })).sort((a, b) => a.x - b.x);
  const Lg = ordre.map(it => it.x - it.w / 2);
  for (let k = 0; k < ordre.length; k++) Lg[k] = Math.max(Lg[k], k ? Lg[k - 1] + ordre[k - 1].w + gap : g);
  const n = ordre.length - 1;
  if (n >= 0) Lg[n] = Math.min(Lg[n], d - ordre[n].w);
  for (let k = n - 1; k >= 0; k--) Lg[k] = Math.min(Lg[k], Lg[k + 1] - gap - ordre[k].w);
  if (n >= 0) Lg[0] = Math.max(Lg[0], g);
  const out = [];
  ordre.forEach((it, k) => { out[it.k] = Lg[k] + it.w / 2; });
  return out;
}

function cadrer() {
  const hero = $('hero');
  const W = hero.clientWidth, H = hero.clientHeight;
  if (!W || !H || !SCENE) return;
  const html = document.documentElement;
  const mode = W / H < 1.15 ? 'portrait' : H < 430 ? 'court' : 'large';
  hero.dataset.mode = mode; html.dataset.mode = mode;
  const gx = parseFloat(getComputedStyle(html).getPropertyValue('--gx')) || 20;
  const edge = Math.max(32, (W - 1320) / 2 + 32);
  hero.style.setProperty('--edge', edge + 'px'); html.style.setProperty('--edge', edge + 'px');
  const barre = $('barre'), une = $('une'), ph = $('une-phrase'), bilan = $('bilan');
  const pills = PASTILLES.map(P => ({ P, el: $('pastilles').querySelector(`.pill[data-noeud="${P.id}"]`) }));
  const ciel = pills.filter(x => x.P.place === 'ciel'), solP = pills.filter(x => x.P.place === 'sol');
  let s, hx, hy, ov = 0, phraseVue = false, skyTop = null, groundTop, ligne = false, colW = W, bilanZone = null, gauche = gx, droite = W - gx, dehors = false;
  pastillesDehors(false);
  hero.classList.remove('pills-courtes', 'borne-courte');
  barre.style.width = '';
  ajusterBilan();
  // la ligne batterie : affichée si elle tient (en lignes, et en largeur si demandé)
  const choisirPhrase = (maxLignes, lh, largeurMax) => {
    ph.hidden = !PHRASE;
    if (!PHRASE) return false;
    if (ph.offsetHeight <= maxLignes * lh + 1 && (!largeurMax || ph.scrollWidth <= largeurMax)) return true;
    ph.hidden = true;
    return false;
  };
  const bas = () => barre.offsetTop + barre.offsetHeight;
  const largeur = x => x.el.offsetWidth || 90;
  // une rangée de pastilles trop large pour sa place : libellés courts (« 91 % ↑ 520 W » sans le point, « Borne » sans le mot)
  const rangee = (L, place) => L.reduce((a, x) => a + largeur(x), 0) + 8 * Math.max(0, L.length - 1) > place;

  if (mode === 'portrait') {
    s = W / 1179; hx = 0;
    const hh = 740 * s;
    let choisi = null;
    for (let L = 0; L < NIVEAUX.length && !choisi; L++) {
      const v = NIVEAUX[L];
      hero.dataset.niveau = L;
      const N = v.taille(W);
      une.style.setProperty('--une-t', N.toFixed(1) + 'px');
      let pv = false, pH = 0;
      if (v.phrase && PHRASE) { pv = choisirPhrase(2, v.lh); if (!pv) continue; pH = ph.offsetHeight; }
      else ph.hidden = true;
      const bB = bas(), uH = une.offsetHeight;                 // hauteur mesurée : suit le texte agrandi ou espacé
      const hb = bB + v.gBK + uH + (pv ? v.sg + pH : 0);
      let y = H - v.pad - 30 - v.gG - hh;
      if (v.ligne) {
        // L3 : la pastille du ciel monte dans la rangée du chiffre, si elle y tient
        const numR = gx + une.offsetWidth;
        const total = ciel.reduce((a, x) => a + largeur(x) + 8, 0);
        if (y - (hb + 16) >= 0 && W - gx - total >= numR + 16) choisi = { L, N, bB, uH, hb, y, pv, ligne: true };
        continue;
      }
      let st = y - v.gSH - 30;
      const slack = st - (hb + v.gSky);
      if (slack < 0) continue;
      let o = 0;
      if (v.ov) { o = borne(slack - 24, 0, 40); y -= o; st -= o; }
      choisi = { L, N, bB, uH, hb, y, st, pv, ov: o };
    }
    if (!choisi) {
      // L4 : la maison rétrécit (centrée) jusqu'à ce que le niveau 2 tienne
      const v = NIVEAUX[2];
      hero.dataset.niveau = 4;
      const N = v.taille(W);
      une.style.setProperty('--une-t', N.toFixed(1) + 'px');
      ph.hidden = true;
      const bB = bas(), uH = une.offsetHeight, hb = bB + v.gBK + uH;
      const place = H - v.pad - 30 - v.gG - (hb + v.gSky + 30 + v.gSH);
      s = Math.max(.08, Math.min(W / 1179, place / 740));
      hx = (W - 1179 * s) / 2;
      const y = H - v.pad - 30 - v.gG - 740 * s;
      choisi = { L: 4, N, bB, uH, hb, y, st: y - v.gSH - 30, pv: false, ov: 0 };
    }
    hy = choisi.y; ov = choisi.ov || 0; phraseVue = choisi.pv; ligne = !!choisi.ligne;
    const v = NIVEAUX[Math.min(choisi.L, 3)];
    une.style.top = (choisi.bB + v.gBK) + 'px';
    if (phraseVue) ph.style.top = (choisi.bB + v.gBK + choisi.uH + v.sg) + 'px';
    skyTop = ligne ? null : choisi.st;
    groundTop = hy + 740 * s + v.gG;
    if (ligne) {
      const yc = choisi.bB + v.gBK + (choisi.uH - choisi.N) + choisi.N / 2 - 15;
      ciel.forEach(x => { x.top = yc; });
    }
    if (ov > 0) bilanZone = [H - ov, H];
    CADRE = { mode, W, H, s, hx, hy, gx, bB: choisi.bB, hb: choisi.hb };
  } else if (mode === 'court') {
    // téléphone à l'horizontale : la maison à droite ; texte et pastilles en colonne à gauche.
    // Si les pastilles ne tiennent pas : sans la phrase, puis libellés courts, puis une maison plus petite.
    hero.dataset.niveau = 0;
    const safeR = parseFloat(getComputedStyle($('ciel')).paddingRight) || 0;   // env(safe-area-inset-right)
    une.style.setProperty('--une-t', (H < 260 ? 34 : 44) + 'px');
    const essai = (frac, courtes, avecPhrase, sansPills) => {
      s = Math.min(frac * W / 1179, (H - 12) / 740);
      hx = W - 1179 * s - Math.max(8, safeR); hy = H - 6 - 740 * s;
      colW = hx - 16;
      hero.style.setProperty('--colw', colW + 'px');
      // la barre s'étend vers la droite tant que le toit reste sous elle (la capsule ne couvre jamais la maison)
      const yB = barre.offsetTop + barre.offsetHeight + 8;
      let xr = W - gx;
      for (let x = gx; x <= W - gx; x += 4) if (silhouette(x, { s, hx, hy }) < yB) { xr = x - 8; break; }
      barre.style.width = Math.max(colW - gx, xr - gx) + 'px';
      const uneB = bas() + 8 + une.offsetHeight;
      une.style.top = (bas() + 8) + 'px';
      hero.classList.toggle('pills-courtes', courtes);
      phraseVue = avecPhrase && choisirPhrase(1, 20, colW - gx);
      if (!avecPhrase) ph.hidden = true;
      let y = uneB + 12;
      if (phraseVue) { ph.style.top = (uneB + 6) + 'px'; y = uneB + 6 + ph.offsetHeight + 12; }
      if (sansPills) return true;
      // pastilles en rangées de 44 px (30 + 14 : les zones tactiles ne se recouvrent pas)
      let x = gx, top = y, ok = true;
      pills.forEach(p => {
        const w = largeur(p);
        if (x > gx && x + w > colW) { x = gx; top += 44; }
        p.left = x; p.top = top; x += w + 8;
        if (x - 8 > colW) ok = false;
      });
      return ok && top + 30 <= H - 6;
    };
    let fait = false;
    essais: for (const frac of [.56, .48, .40]) for (const [courtes, avecPhrase] of [[false, true], [false, false], [true, true], [true, false]]) if (essai(frac, courtes, avecPhrase, false)) { fait = true; break essais; }
    // héros minuscule (zoom 400 %, 320 × 256) : les pastilles quittent le héros et passent en rangée sous lui, plutôt qu'être coupées
    if (!fait) essai(.56, false, true, true);
    dehors = !fait;
    CADRE = { mode, W, H, s, hx, hy, gx, bB: bas(), hb: une.offsetTop + une.offsetHeight };
  } else {
    hero.dataset.niveau = 0;
    colW = borne(.32 * W, 340, 460);
    hero.style.setProperty('--colw', colW + 'px'); html.style.setProperty('--colw', colW + 'px');
    const wb = W - 2 * edge - colW - 40, hbud = H - 72 - 56 - 52 - 24;
    s = Math.min(wb / 1179, hbud / 740);
    hx = W - edge - 1179 * s; hy = 72 + 56 + (hbud - 740 * s);
    const bB = bas();
    const N = borne(H * .15, 56, 88);
    une.style.setProperty('--une-t', N + 'px');
    phraseVue = choisirPhrase(2, 26);
    // le bilan descend dans le bas du héros (bas à H − 24) ; s'il n'y a pas la place (texte très agrandi), il reste sous le héros
    const bH = bilan.offsetHeight;
    let bilanTop = H - 24 - bH;
    let kTop = Math.max(bB + 24, hy);
    const uH = une.offsetHeight;
    let uneH = uH + (phraseVue ? 8 + ph.offsetHeight : 0);
    if (kTop + uneH + 20 > bilanTop) kTop = Math.max(bB + 24, bilanTop - 20 - uneH);
    if (kTop + uneH + 20 > bilanTop && phraseVue) { ph.hidden = true; phraseVue = false; uneH = uH; }
    const leve = kTop + uneH + 20 <= bilanTop;
    if (!leve) { bilanTop = H; kTop = Math.max(bB + 24, Math.min(hy, H - 12 - uneH)); }
    html.style.setProperty('--lift', leve ? (bH + 24) + 'px' : '0px');
    une.style.top = kTop + 'px';
    if (phraseVue) ph.style.top = (kTop + uH + 8) + 'px';
    skyTop = hy - 14 - 30;
    groundTop = hy + 740 * s + 12;
    if (leve) bilanZone = [bilanTop, H - 24];
    gauche = Math.max(edge + colW + 16, hx - 24); droite = W - edge;
    CADRE = { mode, W, H, s, hx, hy, gx, edge, colW, bB, hb: kTop + uH };
  }
  hero.style.setProperty('--colw', colW + 'px');
  html.style.setProperty('--ov', ov + 'px');
  pastillesDehors(dehors);
  const P = ([ax, ay]) => [hx + ax * s, hy + (ay - 20) * s];
  const ancreUne = MEMO.ancreUne;
  // la rangée du ciel, sur téléphone : le filet du chiffre la coupe en deux ; chaque pastille reste du côté de son ancre, à 12 px du filet
  const lxUne = mode === 'portrait' && !ligne && ancreUne ? P(ancreUne)[0] : null;
  let etage = null;   // la pastille de la borne, montée d'un étage au-dessus de la rangée du ciel (téléphone)
  const rangCiel = () => ciel.filter(x => x !== etage);
  const cotes = avecFil => avecFil && lxUne != null
    ? [[rangCiel().filter(x => P(x.P.ancre)[0] < lxUne), gauche, lxUne - 12], [rangCiel().filter(x => P(x.P.ancre)[0] >= lxUne), lxUne + 12, droite]]
    : [[rangCiel(), gauche, droite]];
  const tient = avecFil => !rangee(solP, droite - gauche) && (ligne || cotes(avecFil).every(([L, g, d]) => !L.length || !rangee(L, d - g)));
  // téléphone : plutôt que de perdre son mot, « Borne 7,2 kW » monte d'un étage, de son côté du filet du chiffre, si
  // l'étage tient sous le texte, si son filet descend droit vers le garage et ne passe sous aucune pastille de la rangée
  const etageBorne = () => {
    const pb = ciel.find(x => x.P.id === 'borne');
    if (mode !== 'portrait' || ligne || skyTop == null || lxUne == null || !pb) return null;
    const top = skyTop - 44, ax = P(pb.P.ancre)[0], w = largeur(pb);
    const [g, d] = ax >= lxUne ? [lxUne + 12, droite] : [gauche, lxUne - 12];
    if (top < CADRE.hb + 16 || w > d - g) return null;
    const cx = borne(ax, g + w / 2, d - w / 2);
    if (ax < cx - w / 2 + 15 || ax > cx + w / 2 - 15) return null;
    etage = pb;
    const L = cotes(true).find(([, g2]) => g2 === g)[0];
    const cxL = resoudre(L.map(x => ({ x: P(x.P.ancre)[0], w: largeur(x) })), g, d);
    if (!tient(true) || L.some((x, k) => Math.abs(ax - cxL[k]) < largeur(x) / 2 + 8)) { etage = null; return null; }
    pb.cx = cx; pb.top = top;
    return pb;
  };
  let avecFil = true;
  if (mode !== 'court') {
    // la borne d'un étage plus haut ou sans son mot, puis tous les libellés courts ; sinon la rangée du ciel ignore le filet ;
    // sinon (texte très agrandi) les pastilles passent sous le héros
    for (const cls of ['borne-courte', 'pills-courtes']) {
      if (tient(true)) break;
      if (cls === 'borne-courte' && etageBorne()) break;
      hero.classList.add(cls);
    }
    if (!tient(true)) { avecFil = false; if (!tient(false)) { dehors = true; pastillesDehors(true); } }
  }

  // --- la maison : viewBox à partir du cadrage
  const C = CADRE;
  C.bilanZone = bilanZone;
  // pour le ciel partagé (partage/ciel.js) : horizon, profil du toit, lune du grand écran, carte en verre
  C.yh = hy + 535 * s;
  C.silhouette = x => silhouette(x, C);
  C.lune = [hx + 1179 * s * .78, C.bB + 34];
  C.verre = $('bilan');
  const x0 = -hx / s, y0 = 20 - hy / s;
  svg.setAttribute('viewBox', `${x0.toFixed(2)} ${y0.toFixed(2)} ${(W / s).toFixed(2)} ${(H / s).toFixed(2)}`);
  $('ciel').style.setProperty('--yh', (hy + 535 * s).toFixed(1) + 'px');
  // bords coupés du dessin : fondus quand ils ne touchent pas le bord de l'écran
  const fonduG = hx > .5, fonduD = hx + 1179 * s < W - .5;
  svg.querySelector('#bord-g').setAttribute('display', fonduG ? 'inline' : 'none');
  svg.querySelector('#bord-d').setAttribute('display', fonduD ? 'inline' : 'none');
  if (fonduG || fonduD) svg.querySelector('#habillage').setAttribute('mask', 'url(#mBords)'); else svg.querySelector('#habillage').removeAttribute('mask');

  // --- pastilles : ciel au-dessus du toit, sol sous la maison
  const hr = hero.getBoundingClientRect();
  const boite = el => { const r = el.getBoundingClientRect(); return { l: r.left - hr.left, r: r.right - hr.left, t: r.top - hr.top, b: r.bottom - hr.top }; };
  if (dehors) {
    pills.forEach(x => { x.el.style.left = ''; x.el.style.top = ''; });
  } else if (mode !== 'court') {
    // ligne de la pastille du ciel
    if (ciel.length) {
      if (ligne) {
        let r = W - gx;
        [...ciel].reverse().forEach(x => { const w = largeur(x); x.cx = r - w / 2; r -= w + 8; });
      } else {
        for (const [L, g, d] of cotes(avecFil)) {
          if (!L.length) continue;
          const cx = resoudre(L.map(x => ({ x: P(x.P.ancre)[0], w: largeur(x) })), g, d);
          L.forEach((x, k) => { x.cx = cx[k]; x.top = skyTop; });
        }
      }
    }
    const cxs = resoudre(solP.map(x => ({ x: P(x.P.ancre)[0], w: largeur(x) })), gauche, droite);
    solP.forEach((x, k) => { x.cx = cxs[k]; x.top = groundTop; });
    pills.forEach(x => { x.el.style.left = x.cx.toFixed(1) + 'px'; x.el.style.top = x.top.toFixed(1) + 'px'; });
  } else {
    pills.forEach(x => { x.el.style.left = x.left.toFixed(1) + 'px'; x.el.style.top = x.top.toFixed(1) + 'px'; });
  }

  // --- filets (S&A-HOME .h4-fil) et ancres
  const fils = $('fils');
  fils.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const f1 = v => v.toFixed(1);
  let out = '';
  const point = (id, [x, y], c) => `<circle class="ancre" data-noeud="${id}" cx="${f1(x)}" cy="${f1(y)}" r="2.5" style="--c:${c}"/>`;
  const obstaclesFil = [];
  if (mode === 'court' || dehors) {
    pills.forEach(x => { out += point(x.P.id, P(x.P.ancre), x.P.c); });
  } else {
    pills.forEach(x => {
      const [ax, ay] = P(x.P.ancre), w = largeur(x), l = x.cx - w / 2, r = x.cx + w / 2;
      if (x.P.place === 'ciel') {
        const yb = x.top + 30;
        if (ax >= l + 15 && ax <= r - 15) out += `<path class="fil" d="M${f1(ax)},${f1(yb)}V${f1(ay - 3)}"/>`;
        else {
          const yk = ligne ? Math.max(yb + 8, hy - 10) : yb + 8;
          out += `<path class="fil" d="M${f1(x.cx)},${f1(yb)}V${f1(yk)}H${f1(ax)}V${f1(ay - 3)}"/>`;
        }
      } else {
        if (ax >= l + 15 && ax <= r - 15) out += `<path class="fil" d="M${f1(ax)},${f1(ay + 3)}V${f1(x.top)}"/>`;
        else { const xc = borne(ax, l + 15, r - 15); out += `<path class="fil" d="M${f1(ax)},${f1(ay + 3)}V${f1(x.top - 8)}H${f1(xc)}V${f1(x.top)}"/>`; }
      }
      out += point(x.P.id, [ax, ay], x.P.c);
    });
    // filet du chiffre (sur téléphone, omis si les pastilles du ciel n'ont pas pu se ranger à côté de lui)
    if (ancreUne && (mode !== 'portrait' || avecFil)) {
      const [ax, ay] = P(ancreUne);
      if (mode === 'portrait') {
        const y1 = C.hb + 10;
        // sous la phrase quand elle est là ; sinon sous le chiffre lui-même (le surtitre, plus large, n'est pas au-dessus du filet)
        // droit si l'ancre est sous le texte ; sinon un coude qui part de sous le texte
        let hiDroit, hiCoude;
        if (phraseVue) hiDroit = hiCoude = boite(ph).r + 16;
        else { const rg = document.createRange(); rg.selectNodeContents($('une-v')); hiDroit = rg.getBoundingClientRect().right - hr.left; hiCoude = hiDroit - 8; }
        const lo = gx + 24;
        if (ax >= lo && ax <= Math.max(lo, hiDroit)) out += `<path class="fil" d="M${f1(ax)},${f1(y1)}V${f1(ay - 3)}"/>`;
        else { const xs = borne(ax, lo, Math.max(lo, hiCoude)); out += `<path class="fil" d="M${f1(xs)},${f1(y1)}V${f1(y1 + 10)}H${f1(ax)}V${f1(ay - 3)}"/>`; }
        out += point('une', [ax, ay], MEMO.couleurUne);
      } else {
        const k = boite($('une-k')), ly = (k.t + k.b) / 2, lx = k.r + 16;
        let ok = ax - lx > 60 && ly < ay - 16;
        for (let x = lx; x <= ax && ok; x += 6) if (ly > silhouette(x, C) - 6) ok = false;
        // jamais à travers une pastille du ciel
        ciel.forEach(x => { if (ok && ly > x.top - 4 && ly < x.top + 34 && x.cx - largeur(x) / 2 < ax + 4) ok = false; });
        if (ok) { out += `<path class="fil" d="M${f1(lx)},${f1(ly)}H${f1(ax)}V${f1(ay - 3)}"/>` + point('une', [ax, ay], MEMO.couleurUne); obstaclesFil.push({ l: lx, r: ax, t: ly - 1, b: ly + 1 }); }
      }
    }
  }
  fils.innerHTML = out;

  // --- barre : la forme longue de la capsule, le menu puis le nom de la marque s'effacent tour à tour plutôt que de se chevaucher
  hero.classList.remove('sans-nom', 'sans-nav');
  const cap = $('capsule'), nav = barre.querySelector('.nav-large'), marque = barre.querySelector('.marque');
  cap.classList.remove('court');
  const vu = el => el && el.offsetWidth > 0;
  const gene = () => { const c = boite(cap), g = vu(nav) ? boite(nav).r + 16 : boite(marque).r + 6; return g > c.l || cap.scrollWidth > cap.clientWidth + 1; };
  if (gene()) cap.classList.add('court');
  if (gene() && vu(nav)) hero.classList.add('sans-nav');
  if (gene()) hero.classList.add('sans-nom');
  const texte = [marque, vu(nav) ? nav : null, une, phraseVue ? ph : null].filter(Boolean).map(boite);
  C.texte = [Math.max(0, Math.min(...texte.map(b => b.t))), Math.max(...texte.map(b => b.b))];
  C.obstacles = [marque, vu(nav) ? nav : null, cap, une, phraseVue ? ph : null, ...(dehors ? [] : pills.map(x => x.el))].filter(Boolean).map(boite).concat(obstaclesFil);
  if (bilanZone && mode === 'large') C.obstacles.push(boite(bilan));
  encrerCiel(C);
  placerCiel(C, SCENE);
  echelleFlux();
}

/* Pastilles hors du héros (héros trop bas pour elles) : la liste passe en tête du contenu, en rangée qui se replie */
function pastillesDehors(oui) {
  const ul = $('pastilles');
  if (oui === ul.classList.contains('dehors')) return;
  ul.classList.toggle('dehors', oui);
  if (oui) $('contenu').prepend(ul); else $('direct').insertBefore(ul, $('scene'));
}

/* ================================================================ SOUS LE HÉROS === */
/* Décompte : une seule fois, au premier affichage ; les mises à jour suivantes sont directes. */
function compter(el, cible, gabarit) {
  el._cible = cible; el._gabarit = gabarit;
  if (!fini(cible) || immobile() || el.dataset.vu) { el.innerHTML = gabarit(cible); return; }
  el.dataset.vu = '1';
  const t0 = performance.now();
  const pas = t => {
    const k = Math.min(1, (t - t0) / 900), ease = 1 - Math.pow(1 - k, 3);
    el.innerHTML = el._gabarit(fini(el._cible) ? el._cible * ease : el._cible);
    if (k < 1) requestAnimationFrame(pas); else el.innerHTML = el._gabarit(el._cible);
  };
  requestAnimationFrame(pas);
}
/* texte agrandi : un libellé ou une valeur ne tient plus dans sa colonne → une rangée par mesure (jamais de mot coupé) */
function ajusterBilan() {
  const cols = document.querySelector('.bilan-cols');
  // valeurs finales pendant la mesure (le décompte reprend à l'image suivante, avant d'être peint)
  cols.querySelectorAll('.bm-v').forEach(el => { if (el._gabarit) el.innerHTML = el._gabarit(el._cible); });
  cols.classList.remove('rangees');
  if ([...cols.querySelectorAll('.bm-l, .bm-v')].some(el => el.scrollWidth > el.clientWidth + .5)) cols.classList.add('rangees');
}
/* Bilan du jour (S&A-HOME) : produits (le filet : sur la prévision Solcast), part autoconsommée (le filet : ce %), économies (piste seule) */
function rendreBilan(d) {
  const B = d.bilan;
  $('bilan-date').textContent = dateCourte(d.date);
  // une mesure dont l'entité n'est pas reliée ('' dans CONFIG) est masquée ; les autres se partagent la largeur
  const relie = { 'bm-prod': ENT.productionJour, 'bm-auto': ENT.productionJour && ENT.eco.autoconsoJour, 'bm-eco': ENT.eco.jour };
  const cols = [...document.querySelectorAll('.bm')];
  cols.forEach(bm => { bm.hidden = !relie[bm.querySelector('.bm-v').id]; bm.classList.remove('premiere'); });
  const vues = cols.filter(bm => !bm.hidden);
  vues[0]?.classList.add('premiere');
  $('bilan').hidden = !vues.length;
  document.querySelector('.bilan-cols').style.gridTemplateColumns = vues.length === 3 ? '' : `repeat(${vues.length}, minmax(0, 1fr))`;
  const filet = (id, v) => { const i = $(id); i.style.visibility = fini(v) ? '' : 'hidden'; i.style.setProperty('--v', fini(v) ? borne(v, 0, 100).toFixed(1) : '0'); };
  compter($('bm-prod'), B.prod, v => fini(v) ? `${kWh(v)}<span class="u">${NBSP}kWh</span>` : '—');
  filet('bm-prod-p', B.prod != null && B.prev > 0 ? 100 * B.prod / B.prev : null);
  compter($('bm-auto'), B.autoPct, v => fini(v) ? `${pct(v)}<span class="u">${NNBSP}%</span>` : '—');
  filet('bm-auto-p', B.autoPct);
  compter($('bm-eco'), B.ecoJour, v => fini(v) ? `${euros(v)}<span class="u">${NBSP}€</span>` : '—');
  filet('bm-eco-p', null);   // pas de référence définie pour les économies du jour : la piste seule, sans remplissage
  ajusterBilan();
}

/* ------------------------------------------------ Production solaire du jour (S&A-HOME, écran Énergie) ---
   Réel : les moyennes horaires des statistiques (heures finies), puis la valeur de maintenant ; prévision Solcast
   (detailedForecast, kW par demi-heure) et sa fourchette 10-90 % ; de 6 h à 21 h, avec le repère de maintenant. */
let COURBE = null, curseur = -1;
const interp = (pts, h) => {
  if (!pts.length || h < pts[0].h || h > pts.at(-1).h) return null;
  for (let k = 1; k < pts.length; k++) if (h <= pts[k].h) { const a = pts[k - 1], b = pts[k], t = b.h > a.h ? (h - a.h) / (b.h - a.h) : 0; return a.kw + (b.kw - a.kw) * t; }
  return pts.at(-1).kw;
};
function donneesCourbe(d) {
  const jour = heureLocale(d.date).jour, minuit = minuitDe(d.t);
  const det = (HA.attr(ENT.previsionJour, 'detailedForecast') || []).map(p => {
    const ts = Date.parse(p.period_start), l = Number.isFinite(ts) ? heureLocale(new Date(ts)) : null;
    return { h: l && l.jour === jour ? l.h : NaN, kw: Number(p.pv_estimate), lo: Number(p.pv_estimate10), hi: Number(p.pv_estimate90) };
  }).filter(p => fini(p.h) && fini(p.kw) && p.h >= 6 && p.h <= 21).sort((a, b) => a.h - b.h);
  const moyH = parCle(HISTO.heures, ENT.solaire, ts => (ts >= minuit && ts < minuit + 86400000 ? Math.floor(heureLocale(new Date(ts)).h + 1e-6) : null), 'mean');
  const hNow = d.h, H = Math.floor(hNow), pv = d.f?.pv ?? null;
  const reel = Object.keys(moyH).map(Number).filter(h => h >= 6 && h < H && h <= 20).sort((a, b) => a - b).map(h => ({ h: h + 0.5, kw: moyH[h] / 1000 }));
  if (pv != null && hNow >= 6 && hNow <= 21) reel.push({ h: hNow, kw: pv / 1000 });
  const prevH = h => { const p = det.filter(x => Math.floor(x.h) === h); return p.length ? p.reduce((a, x) => a + x.kw, 0) / p.length : null; };
  const heures = [];
  for (let h = 6; h <= 21; h++) heures.push({ h, reel: h < H ? (moyH[h] != null ? moyH[h] / 1000 : null) : h === H ? (pv != null ? pv / 1000 : null) : null, prev: prevH(h) });
  const maxKW = Math.max(1, ...det.map(p => (fini(p.hi) ? p.hi : p.kw)), ...reel.map(p => p.kw)) * 1.12;
  return { det, reel, heures, maxKW, hNow, pv };
}
function rendreCourbe(d) {
  const box = $('courbe-svg');
  $('journee').hidden = !ENT.solaire && !ENT.previsionJour;
  const W = Math.max(240, Math.round(box.clientWidth || 320)), H = 140;
  const C = donneesCourbe(d);
  const X = h => (h - 6) / 15 * W, Y = kw => H - Math.max(0, kw) * (H - 12) / C.maxKW, f1 = v => v.toFixed(1);
  const chemin = pts => pts.map((p, k) => `${k ? 'L' : 'M'}${f1(X(p.h))} ${f1(Y(p.kw))}`).join(' ');
  let s = '';
  const r = C.reel, aire = r.length > 1 ? `${chemin(r)} L${f1(X(r.at(-1).h))} ${H} L${f1(X(r[0].h))} ${H} Z` : '';
  // la fourchette 10-90 % n'est peinte qu'hors de l'aire du réel : deux couches lisibles, pas de troisième teinte
  if (C.det.length && aire) s += `<defs><mask id="c-hors-reel" maskUnits="userSpaceOnUse" x="-8" y="-8" width="${W + 16}" height="${H + 16}"><rect x="-8" y="-8" width="${W + 16}" height="${H + 16}" fill="#fff"/><path d="${aire}" fill="#000"/></mask></defs>`;
  if (C.det.length) s += `<path class="c-bande"${aire ? ' mask="url(#c-hors-reel)"' : ''} d="${chemin(C.det.map(p => ({ h: p.h, kw: fini(p.hi) ? p.hi : p.kw })))} ${C.det.slice().reverse().map(p => `L${f1(X(p.h))} ${f1(Y(fini(p.lo) ? p.lo : p.kw))}`).join(' ')} Z"/>`;
  s += `<path class="c-base" d="M0 ${H} H${W}"/>`;
  if (aire) s += `<path class="c-aire" d="${aire}"/>`;
  if (C.det.length) s += `<path class="c-prev" d="${chemin(C.det)}"/>`;
  if (r.length > 1) s += `<path class="c-reel" d="${chemin(r)}"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" focusable="false">${s}<g class="c-repere"></g></svg>`;
  $('leg-reel').hidden = !r.length; $('leg-prev').hidden = !C.det.length;
  COURBE = { ...C, W, H, X, Y };
  repere();
}
/* le repère : maintenant au repos ; l'heure choisie au doigt, à la souris ou au clavier (avec sa bulle) */
function repere() {
  const C = COURBE;
  if (!C) return;
  const g = $('courbe-svg').querySelector('.c-repere'), fig = $('courbe'), bulle = $('bulle');
  const H0 = borne(Math.floor(C.hNow), 6, 21), h = curseur < 0 ? H0 : curseur, q = C.heures[h - 6];
  const enCours = h === Math.floor(C.hNow);
  // abscisse : le milieu de l'heure (où sont posées les moyennes), maintenant pour l'heure en cours
  const xh = enCours ? borne(C.hNow, 6, 21) : Math.min(21, h + 0.5), x = C.X(xh);
  const kwP = interp(C.det, xh), kwR = enCours ? (C.reel.length && C.reel.at(-1).h === C.hNow ? C.reel.at(-1).kw : null) : q.reel != null && h < Math.floor(C.hNow) ? interp(C.reel, xh) : null;
  let s = `<line class="c-now" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="0" y2="${C.H}"/>`;
  if (kwP != null) s += `<circle class="c-pin p" cx="${x.toFixed(1)}" cy="${C.Y(kwP).toFixed(1)}" r="4"/>`;
  if (kwR != null) s += `<circle class="c-pin r" cx="${x.toFixed(1)}" cy="${C.Y(kwR).toFixed(1)}" r="4.5"/>`;
  g.innerHTML = s;
  const w = v => (v != null ? pTxt(v * 1000) : null), quand = enCours ? 'Maintenant' : `${h}${NBSP}h`;
  const court = [quand, w(q.reel), q.prev != null ? `prévu ${w(q.prev)}` : null].filter(Boolean).join(' · ');
  // au repos : maintenant (la valeur en direct, la prévision du moment) ; sinon l'heure choisie (moyennes de l'heure)
  const long = curseur < 0
    ? `Maintenant, ${heureTxt(C.hNow)}${NBSP}: ${C.pv != null ? `${pLong(C.pv)} produits` : 'production non mesurée'}${kwP != null ? `, ${pLong(kwP * 1000)} prévus par Solcast` : ''}`
    : `${enCours ? `Maintenant, ${heureTxt(C.hNow)}` : `De ${h} h à ${h + 1} h`}${NBSP}: ${q.reel != null ? `${pLong(q.reel * 1000)} produits` : 'pas de mesure'}${q.prev != null ? `, ${pLong(q.prev * 1000)} prévus par Solcast` : ''}`;
  fig.setAttribute('aria-valuenow', String(h));
  fig.setAttribute('aria-valuetext', long);
  bulle.hidden = curseur < 0;
  if (curseur >= 0) {
    bulle.textContent = court;
    const bw = bulle.offsetWidth;
    bulle.style.left = borne(x - bw / 2, 0, Math.max(0, C.W - bw)).toFixed(1) + 'px';
  }
}
function brancherCourbe() {
  const fig = $('courbe');
  const aller = h => { curseur = h < 0 ? -1 : borne(h, 6, 21); repere(); };
  const sousLeDoigt = ev => { const r = fig.getBoundingClientRect(); return 6 + Math.floor(borne((ev.clientX - r.left) / r.width, 0, .9999) * 16); };
  fig.addEventListener('pointermove', ev => aller(sousLeDoigt(ev)));
  fig.addEventListener('pointerdown', ev => aller(sousLeDoigt(ev)));
  fig.addEventListener('pointerleave', () => aller(-1));
  fig.addEventListener('blur', () => aller(-1));
  fig.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { if (curseur >= 0) { ev.stopPropagation(); aller(-1); } return; }
    const base = curseur < 0 ? borne(Math.floor(COURBE?.hNow ?? 6), 6, 21) : curseur;
    const cible = { ArrowLeft: base - 1, ArrowDown: base - 1, ArrowRight: base + 1, ArrowUp: base + 1, Home: 6, End: 21 }[ev.key];
    if (cible == null) return;
    ev.preventDefault();
    aller(cible);
  });
}

/* ------------------------------------------------ Lignes (liste à la Tesla) : les autres pages de Breezy */
/* remplace un contenu seulement s'il change, et rend le focus clavier au lien de même rang */
const MODELE = document.createElement('template');
function majHTML(el, html) {
  MODELE.innerHTML = html;
  if (el.innerHTML === MODELE.innerHTML) return;
  const act = document.activeElement, rang = act && el.contains(act) ? [...el.querySelectorAll('a')].indexOf(act) : -1;
  el.innerHTML = html;
  if (rang >= 0) el.querySelectorAll('a')[rang]?.focus({ preventScroll: true });
}
function rendreLignes(d) {
  // la valeur d'une ligne : « — » si l'entité ne répond pas, rien si elle n'est pas reliée
  const L = [
    d.aBatterie ? ['batterie', 'Batterie', !ENT.socBatterie ? '' : d.soc != null ? `${pct(d.soc)}${NNBSP}%` : '—'] : null,
    ['graphique', 'Énergie', ''],
    ['feuille', 'Économies', !ENT.eco.mois ? '' : d.bilan.ecoMois != null ? `${euros(d.bilan.ecoMois)}${NBSP}€ ce mois` : '—']
  ].filter(Boolean);
  majHTML($('lignes'), L.map(([ic, t, v]) => `<li><a href="#">${icone(ic)}<span class="l1">${t}</span><span class="lv">${v}</span>${icone('chevron', 'ic chev')}</a></li>`).join(''));
}

/* ================================================================ RENDU === */
function annoncer(d) {
  const fb = d.flux.batterie, cle = d.f?.batNet == null ? 'inconnu' : fb.actif ? (fb.phase === 'sor' ? 'charge' : 'decharge') : 'repos';
  if (cle === 'inconnu') return;                                       // batterie non mesurée : rien n'est annoncé, le dernier état connu est gardé
  const avant = MEMO.annonce;
  MEMO.annonce = cle;
  if (avant == null || avant === cle) return;
  $('annonce').textContent = cle === 'charge' ? 'La batterie commence à se charger.' : cle === 'decharge' ? 'La batterie commence à se décharger.' : 'La batterie est au repos.';
}
function rendre(opts = {}) {
  const d = deriver();
  SCENE = d;
  rendreScene(d);
  rendreHero(d);
  rendreCapsule();
  rendreBilan(d);
  rendreCourbe(d);
  rendreLignes(d);
  annoncer(d);
  cadrer();
  demanderFlux(d.flux, opts.immediat);
}
/* les états arrivent par rafales : un seul rendu par image */
let RENDU = 0;
function planifierRendu() { cancelAnimationFrame(RENDU); RENDU = requestAnimationFrame(() => rendre()); }

/* le thème de Home Assistant (coque) ; hors de la coque, celui de l'appareil */
function appliquerTheme() {
  const r = document.documentElement;
  if (HA.sombre == null) delete r.dataset.theme; else r.dataset.theme = HA.sombre ? 'dark' : 'light';
}
/* valeurs d'exemple : les états et l'historique d'un aperçu, au format de Home Assistant */
function chargerExemple(nom) {
  const x = etatsExemple(nom);
  HA.etats = x.etats; HA.t = x.t;
  HISTO.heures = x.histo;
}

/* ================================================================ DÉMARRAGE === */
function demarrer() {
  lireAnimations();
  majInterrupteur();
  preparerSvg();
  brancherCourbe();
  $('btn-anim').addEventListener('click', () => basculerAnimations(() => { rendre({ immediat: true }); appliquerFlux(true); }));
  const histoPerime = () => Date.now() - HISTO.quand > 15 * 60000 || HISTO.quand < minuitDe(Date.now());
  if (HA.enCoque) {
    // dans la coque de S&A-HOME : les états de Home Assistant, puis la production heure par heure (toutes les 15 min)
    HA.ecouter(premier => {
      appliquerTheme();
      if (histoPerime()) chargerHisto();
      if (premier) rendre({ immediat: true }); else planifierRendu();
    });
    setTimeout(() => { if (!HA.connecte) { SANS_REPONSE = true; rendreCapsule(); cadrer(); } }, 6000);
    // l'heure avance même sans nouvel état : repère de la courbe, « pleine vers », « jusqu'à »
    setInterval(() => { if (!HA.connecte) return; if (histoPerime()) chargerHisto(); planifierRendu(); }, 60000);
  } else chargerExemple(new URLSearchParams(location.search).get('apercu'));
  rendre({ immediat: true });
  requestAnimationFrame(() => cadrer());
  document.fonts?.ready?.then(() => cadrer());
  let rz = 0;
  const obs = new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(cadrer); });
  [$('hero'), $('barre'), $('une'), $('bilan')].forEach(el => obs.observe(el));
  let largeurCourbe = $('courbe-svg').clientWidth;
  new ResizeObserver(() => { const w = $('courbe-svg').clientWidth; if (SCENE && Math.abs(w - largeurCourbe) > 2) { largeurCourbe = w; rendreCourbe(SCENE); } }).observe($('courbe-svg'));
  // pause hors écran et onglet caché
  new IntersectionObserver(es => { ECRAN = es[0].isIntersecting; synchroPause(); }, { threshold: 0 }).observe($('hero'));
  document.addEventListener('visibilitychange', () => { VISIBLE = !document.hidden; synchroPause(); });
  reduitMQ.addEventListener?.('change', () => { majInterrupteur(); rendre({ immediat: true }); appliquerFlux(true); });
  sombreMQ.addEventListener?.('change', () => rendre());
}

/* Outil de développement, hors de Home Assistant : Breezy.apercu('nuit') */
window.Breezy = {
  apercu(nom) { if (HA.enCoque) return; MEMO = { jour: null, annonce: null }; chargerExemple(nom); rendre({ immediat: true }); }
};
demarrer();
</script>
