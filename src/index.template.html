/* Cadrage : la scène utile tient entre l'en-tête et le fondu bas.
   Portrait : batterie, coffrets, gaines, lucarne et panneaux (x ≈ 448–968), ciel prolongé pour l'en-tête.
   Paysage / bureau : toute la maison, bords fondus dans le décor comme un objet photographié. */
function cadrer() {
  const hero = $('hero');
  const W = hero.clientWidth, H = hero.clientHeight;
  if (!W || !H) return;
  const mast = $('masthead');
  const haut = mast.offsetTop + mast.offsetHeight - 6;
  const ov = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--overlap')) || 50;
  const bas = ov + 18;                                    // le texte remonte de --overlap px sur le fondu
  const A = W / H;
  let F;
  if (A < 0.9)       F = { x0: 448, x1: 968, y0: 8, y1: 742 };
  else if (A < 1.45) F = { x0: 330, x1: 1040, y0: 0, y1: 748 };
  else               F = { x0: 0, x1: 1179, y0: 0, y1: 756 };
  const dispo = H - haut - bas;
  const s = Math.min(W / (F.x1 - F.x0), dispo / (F.y1 - F.y0));
  const vw = W / s, vh = H / s;
  const cx = (F.x0 + F.x1) / 2;
  let x0 = cx - vw / 2;
  if (vw <= 1179) x0 = Math.max(0, Math.min(1179 - vw, x0));
  const y0 = F.y1 - (H - bas) / s;                        // le bas de la scène se pose sur le fondu, le surplus va au ciel
  const vb = `${x0.toFixed(2)} ${y0.toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}`;
  svg.setAttribute('viewBox', vb);
  fx.setAttribute('viewBox', vb);
  const large = x0 < -1 || x0 + vw > 1180;
  svg.querySelector('#bords').style.display = large ? '' : 'none';
  const lum = svg.querySelector('#lumieres');
  if (large) lum.setAttribute('mask', 'url(#mBordsInv)'); else lum.removeAttribute('mask');
  hero.classList.toggle('serre', H < 500);              // héros court : étiquettes réduites à l'essentiel
  hero.classList.toggle('court', H < 340);              // très court (téléphone à l'horizontale) : étiquettes sur une ligne
  CADRE = { x0, y0, s, W, H, haut, bas, ov };
  placerCielNuit();
  placerNotes();
}

/* ------------------------------------------------ Flux dans les gaines ---
   Les chemins #gaine-*-flux du dessin (sans trait) servent de gabarit : chaque flux est
   dessiné une fois pour toutes dans le calque #hero-flux (trace + halo + cœur lumineux),
   puis seulement réglé (visible, sens, vitesse) à chaque mise à jour — sans recréer de nœuds
   ni faire sauter la phase des impulsions. Pas de filtre de flou : le halo est un trait large. */
const FLUX = {
  pv:       { id: 'gaine-pv-flux',       c: 'var(--fx-sun)' },
  lucarne:  { id: 'gaine-lucarne-flux',  c: 'var(--fx-home)' },
  coffrets: { id: 'gaine-coffrets-flux', c: 'var(--fx-batt)' },
  batterie: { id: 'gaine-batterie-flux', c: 'var(--fx-batt)' },
  sol:      { id: 'gaine-sol-flux',      c: 'var(--fx-grid)' }
};
const PERIODE = 46, TRAIT = 11;
function preparerFlux() {
  const calque = $('calque-flux');
  for (const [nom, f] of Object.entries(FLUX)) {
    const src = svg.querySelector('#' + f.id);
    f.src = src; f.len = src.getTotalLength();
    f.echant = [];                                      // points du tracé tous les 8 unités : obstacles pour les étiquettes
    for (let l = 0; l <= f.len; l += 8) { const q = src.getPointAtLength(l); f.echant.push([q.x, q.y]); }
    const d = src.getAttribute('d');
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'flux flux-' + nom);
    g.setAttribute('display', 'none');
    g.innerHTML =
      `<path d="${d}" fill="none" stroke="${f.c}" stroke-width="2.2" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round" data-r="trace"/>` +
      `<path d="${d}" fill="none" stroke="${f.c}" stroke-width="10" stroke-opacity=".3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${TRAIT + 6} ${PERIODE - TRAIT - 6}" data-r="halo"/>` +
      `<path d="${d}" fill="none" stroke="${f.c}" stroke-width="5" stroke-opacity=".55" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${TRAIT + 2} ${PERIODE - TRAIT - 2}" data-r="halo2"/>` +
      `<path d="${d}" fill="none" stroke="var(--fx-core)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${TRAIT} ${PERIODE - TRAIT}" data-r="coeur"/>` +
      `<g data-r="chevrons"></g>`;
    calque.appendChild(g);
    f.g = g;
    f.dash = ['halo', 'halo2', 'coeur'].map(r => g.querySelector(`[data-r="${r}"]`));
    f.trace = g.querySelector('[data-r="trace"]');
    f.chev = g.querySelector('[data-r="chevrons"]');
    f.anims = []; f.sens = 0; f.duree = 0; f.mode = '';
  }
}

function reglerFlux(f, actif, sens, kw) {
  if (!actif) {                                         // flux nul : on éteint vraiment (attribut SVG, pas .hidden)
    f.g.setAttribute('display', 'none');
    f.anims.forEach(a => a.cancel()); f.anims = []; f.mode = '';
    return;
  }
  f.g.removeAttribute('display');
  if (immobile()) {
    // Mouvement réduit (ou pause) : pointillés fixes + chevrons le long de la gaine, flèche à l'arrivée
    f.anims.forEach(a => a.cancel()); f.anims = [];
    f.dash.forEach(p => p.style.display = 'none');
    f.trace.setAttribute('stroke-dasharray', '0.1 7'); f.trace.setAttribute('stroke-width', '3.4'); f.trace.setAttribute('stroke-opacity', '.95');
    if (f.mode !== 'reduit' || f.sens !== sens) f.chev.innerHTML = chevrons(f, sens);
    f.chev.style.display = '';
    f.mode = 'reduit'; f.sens = sens;
    return;
  }
  f.dash.forEach(p => p.style.display = '');
  f.trace.removeAttribute('stroke-dasharray'); f.trace.setAttribute('stroke-width', '2.2'); f.trace.setAttribute('stroke-opacity', '.55');
  f.chev.style.display = 'none';
  const vitesse = 38 + 34 * Math.min(kw, 5);            // unités SVG / s : plus de puissance, plus vif
  const duree = PERIODE / vitesse * 1000;
  if (f.mode === 'anime' && f.sens === sens && Math.abs(f.duree - duree) < 1) return;
  // garder la phase en cours : pas de saut visible lors d'une mise à jour
  let phase = 0;
  if (f.anims.length && f.duree) phase = ((f.anims[0].currentTime || 0) % f.duree) / f.duree;
  f.anims.forEach(a => a.cancel());
  f.anims = f.dash.map((p, k) => {
    const decal = k < 2 ? (k === 0 ? 3 : 1) : 0;         // halos centrés sur le cœur
    const a = p.animate([{ strokeDashoffset: decal }, { strokeDashoffset: decal - sens * PERIODE }], { duration: duree, iterations: Infinity, easing: 'linear' });
    a.currentTime = phase * duree;
    return a;
  });
  f.mode = 'anime'; f.sens = sens; f.duree = duree;
}

function chevrons(f, sens) {
  const pas = 58, out = [];
  const pt = l => f.src.getPointAtLength(Math.max(0, Math.min(f.len, l)));
  const fleche = (l, grand) => {
    const p = pt(l), a = pt(l - 1.5), b = pt(l + 1.5);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + (sens < 0 ? 180 : 0);
    const k = grand ? 1.35 : 1;
    const dch = `M${(-4.5 * k).toFixed(1)},${(-5.5 * k).toFixed(1)} L${(2 * k).toFixed(1)},0 L${(-4.5 * k).toFixed(1)},${(5.5 * k).toFixed(1)}`;
    return `<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${ang.toFixed(1)})"><path d="${dch}" fill="none" stroke="rgba(20,22,30,.55)" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/><path d="${dch}" fill="none" stroke="${f.c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  };
  const n = Math.max(1, Math.floor((f.len - 24) / pas));
  for (let k = 1; k <= n; k++) {
    const l = sens > 0 ? (f.len - 6) * k / (n + 1) : f.len - (f.len - 6) * k / (n + 1);
    out.push(fleche(l, false));
  }
  out.push(fleche(sens > 0 ? f.len - 5 : 5, true));       // flèche d'arrivée, plus grande
  return out.join('');
}

let LED_ANIM = null, LED_MODE = '';
function rendreMaison(e, d) {
  const i = e.instantane;
  // --- lumières : selon l'heure, ou selon les entités light.* si fournies
  const soir = d.scene === 'nuit' || d.scene === 'crepuscule';
  const auto = {
    pignon: soir || d.scene === 'doree' || d.scene === 'aube',
    baies: soir || (d.scene === 'aube' && d.h < d.lever + 0.5),
    lucarne: soir || d.scene === 'doree',
    applique: soir,
    tranchee: soir || Math.abs(i.reseau) > 0.02               // la tranchée s'éclaire quand le réseau travaille
  };
  const L = e.lumieres === 'auto' ? auto : { ...auto, ...e.lumieres };
  const allumees = [];
  for (const [k, on] of Object.entries(L)) {
    const g = svg.querySelector('#lueur-' + k);
    if (!g) continue;
    g.style.transition = immobile() ? 'none' : 'opacity 1.2s ease';
    g.style.opacity = on ? '1' : '0';
    if (on && k !== 'tranchee') allumees.push({ pignon: 'le séjour', baies: 'la terrasse', lucarne: 'la chambre sous la lucarne', applique: 'le garage' }[k]);
    const fen = svg.querySelector('#fen-' + k);          // découpe des voiles : la pièce allumée brille
    if (fen) fen.setAttribute('fill-opacity', on ? '1' : '0');
  }

  // --- ambiance : ciel et teinte selon le moment de la journée
  const ciel = svg.querySelector('#ciel-scene'), teinte = svg.querySelector('#teinte-scene'), extCiel = svg.querySelector('#ext-ciel');
  ciel.innerHTML = ''; teinte.innerHTML = ''; extCiel.innerHTML = '';
  const R = (fill, mode, op, mask) => `<rect x="-6000" y="-3000" width="13179" height="7000" fill="${fill}" style="mix-blend-mode:${mode}" opacity="${op}"${mask ? ' mask="url(#mFenetres)"' : ''}/>`;
  if (d.scene === 'doree') {
    // une lueur sur le dessin, une sur le décor prolongé (jamais les deux au même endroit)
    ciel.innerHTML = `<rect x="0" y="0" width="1179" height="779" fill="url(#gSoleilCiel)" style="mix-blend-mode:screen"/>`;
    extCiel.innerHTML = `<rect x="-6000" y="-3000" width="13179" height="7000" fill="url(#gSoleilCiel)" style="mix-blend-mode:screen"/>`;
    teinte.innerHTML = R('url(#gTeinteDoree)', 'soft-light', .42);
  } else if (d.scene === 'aube') {
    teinte.innerHTML = R('url(#gTeinteAube)', 'soft-light', .55);
  } else if (d.scene === 'crepuscule') {
    teinte.innerHTML = R('#7d76a8', 'multiply', .5, true) + R('#ff9e6b', 'soft-light', .3);
  } else if (d.scene === 'nuit') {
    teinte.innerHTML = R('#1d2a4a', 'multiply', .8, true) + R('#2a3a66', 'soft-light', .4, true) + `<g id="ciel-nuit"></g>`;
  }
  $('hero').dataset.scene = d.scene;
  placerCielNuit();
  // barre d'adresse assortie au ciel la nuit
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    m.dataset.jour ||= m.content;
    m.content = soir ? '#232a3c' : m.dataset.jour;
  });

  // --- batterie : la bande LED suit l'état de charge et respire en charge
  const soc = Math.max(0, Math.min(100, i.batterie_pct)) / 100;
  const r = $('soc-rect');
  const yHaut = 718 - 62 * soc;
  r.setAttribute('y', (yHaut - 2).toFixed(1)); r.setAttribute('height', (732 - yHaut).toFixed(1));
  const halo = svg.querySelector('#lueur-led');
  if (halo) halo.style.opacity = (0.25 + .75 * soc).toFixed(2);
  const led = $('led-batterie');
  const ledMode = immobile() ? 'fixe' : i.batterie > 0.02 ? 'charge' : i.batterie < -0.02 ? 'decharge' : 'fixe';
  if (ledMode !== LED_MODE) {
    LED_ANIM?.cancel(); LED_ANIM = null; LED_MODE = ledMode;
    if (ledMode !== 'fixe') LED_ANIM = led.animate([{ opacity: 1 }, { opacity: ledMode === 'charge' ? .5 : .75 }, { opacity: 1 }], { duration: ledMode === 'charge' ? 2600 : 3800, iterations: Infinity, easing: 'ease-in-out' });
  }

  // --- flux d'énergie dans les gaines : le sens suit les signes, la vitesse suit les kW
  const b = i.batterie, rs = i.reseau;
  reglerFlux(FLUX.pv, i.production > 0.02, 1, i.production);
  reglerFlux(FLUX.lucarne, i.maison > 0.02, -1, i.maison);
  reglerFlux(FLUX.coffrets, Math.abs(b) > 0.02, b > 0 ? -1 : 1, Math.abs(b));
  reglerFlux(FLUX.batterie, Math.abs(b) > 0.02, b > 0 ? 1 : -1, Math.abs(b));
  reglerFlux(FLUX.sol, Math.abs(rs) > 0.02, rs < 0 ? 1 : -1, Math.abs(rs));

  // --- description de l'illustration pour les lecteurs d'écran
  const etatBatt = b > 0.02 ? 'en charge' : b < -0.02 ? 'en décharge' : 'au repos';
  svg.setAttribute('aria-label',
    `Illustration de la maison. Panneaux solaires ${i.production > 0.05 ? `produisant ${kWlong(i.production)}` : 'au repos'}, ` +
    `maison consommant ${kWlong(i.maison)}, batterie à ${pct(i.batterie_pct)} % ${etatBatt}, ` +
    `réseau ${rs > 0.02 ? `en achat, ${kWlong(rs)}` : rs < -0.02 ? `en vente, ${kWlong(rs)}` : 'au repos'}` +
    (allumees.length ? `. Lumière allumée dans ${allumees.join(', ')}.` : '.'));

  // --- annotations : ancres en coordonnées du dessin, positions candidates par ordre de préférence
  const battVal = b > 0.02 ? `charge ${kW(b)}${NBSP}kW` : b < -0.02 ? `décharge ${kW(-b)}${NBSP}kW` : 'au repos';
  const soleilVal = d.soleil ? `${kW(i.production)}${NBSP}kW`
    : d.moment === 'jour' ? 'au repos' : `lever ${heureTxt(d.h > d.coucher ? hDe(e.soleil.lever_demain) : d.lever)}`;
  NOTES = [
    { k: 'Soleil', c: 'var(--c-sun)', v: soleilVal, ax: 612, ay: 176, pos: ['n', 'w', 's'] },
    { k: 'Maison', c: 'var(--c-home)', v: `${kW(i.maison)}${NBSP}kW`, ax: 760, ay: 352, pos: ['w', 'n', 'e'] },
    { k: 'Batterie', c: 'var(--c-batt)', v: `${pct(i.batterie_pct)}${NNBSP}%`, s: battVal, ax: 556, ay: 612, pos: ['n', 'w', 'e'] },
    // ancre plus loin sur la tranchée : l'étiquette (étroite : « Réseau » / « vente 0,36 kW ») laisse voir la gaine
    { k: 'Réseau', c: 'var(--c-grid)', v: rs < -0.02 ? `vente ${kW(rs)}${NBSP}kW` : rs > 0.02 ? `achat ${kW(rs)}${NBSP}kW` : 'au repos', ax: 880, ay: 733, pos: ['n', 'e', 'w', 'nn', 's'] }
  ];
  placerNotes();
}

/* Lune et étoiles : posées dans le ciel réellement visible (au-dessus du faîtage, y < 0 du dessin),
   à taille constante à l'écran — la lune se glisse dans l'en-tête, entre la marque et la cloche. */
const ETOILES = [[.06,.3,1.4],[.13,.75,1],[.21,.2,1.2],[.29,.55,1.6],[.37,.85,1],[.44,.25,1.3],[.52,.6,1.1],[.6,.15,1.5],[.71,.8,1],[.78,.35,1.2],[.86,.65,1.4],[.93,.2,1.1],[.97,.9,1]];
function placerCielNuit() {
  const g = svg.querySelector('#ciel-nuit');
  if (!g || !CADRE) return;
  const { x0, y0, s, W, haut } = CADRE;
  const haut1 = y0 + 6 / s, bas1 = Math.min(-6, y0 + (haut + 30) / s);
  const hr = $('hero').getBoundingClientRect();
  const evite = [...document.querySelectorAll('.brand, .icon-btn, .tabbar')].map(el => el.getBoundingClientRect())
    .filter(r => r.width && r.top - hr.top < haut + 40).map(r => ({ l: r.left - hr.left - 8, r: r.right - hr.left + 8, t: r.top - hr.top - 8, b: r.bottom - hr.top + 8 }));
  let out = '';
  if (bas1 > haut1) ETOILES.forEach(([fx, fy, r]) => {
    const px = fx * W, py = (haut1 + fy * (bas1 - haut1) - y0) * s;
    if (evite.some(z => px > z.l && px < z.r && py > z.t && py < z.b)) return;   // pas d'étoile sur la marque ni les boutons
    out += `<circle cx="${(x0 + fx * W / s).toFixed(1)}" cy="${(haut1 + fy * (bas1 - haut1)).toFixed(1)}" r="${(r / s).toFixed(2)}" fill="#fff" opacity="${(.5 + fx * .4).toFixed(2)}"/>`;
  });
  // la lune se pose au milieu de l'espace libre à gauche des boutons (après la marque, ou après la
  // pilule de navigation sur ordinateur) ; s'il n'y a pas la place, pas de lune
  const ac = document.querySelector('.mast-actions').getBoundingClientRect();
  const gauche = Math.max(...[...document.querySelectorAll('.brand, .tabbar')].map(el => el.getBoundingClientRect())
    .filter(r => r.width && r.top < ac.bottom && r.bottom > ac.top && r.right <= ac.left + 1).map(r => r.right), hr.left);
  if (ac.left - gauche >= 40) {
    const lxPx = (gauche + ac.left) / 2 - hr.left;
    const lx = x0 + lxPx / s, ly = Math.min(-14 / s, y0 + (haut * .5) / s), rl = 10 / s;
    out += `<mask id="mLune" maskUnits="userSpaceOnUse" x="${lx - 2 * rl}" y="${ly - 2 * rl}" width="${4 * rl}" height="${4 * rl}"><rect x="${lx - 2 * rl}" y="${ly - 2 * rl}" width="${4 * rl}" height="${4 * rl}" fill="#fff"/><circle cx="${lx + .45 * rl}" cy="${ly - .35 * rl}" r="${.85 * rl}" fill="#000"/></mask>` +
      `<radialGradient id="gLune" cx="${lx}" cy="${ly}" r="${7 * rl}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#eef2ff" stop-opacity=".38"/><stop offset="1" stop-color="#eef2ff" stop-opacity="0"/></radialGradient>` +
      `<circle cx="${lx}" cy="${ly}" r="${7 * rl}" fill="url(#gLune)"/><circle cx="${lx}" cy="${ly}" r="${rl}" fill="#f4f1e6" mask="url(#mLune)"/>`;
  }
  g.innerHTML = out;
}

/* Annotations : ancrées en coordonnées SVG, repositionnées à chaque cadrage.
   Chaque étiquette essaie plusieurs positions autour de son ancre, garde celles qui restent dans la
   zone libre (sous l'en-tête, au-dessus du fondu) sans chevaucher une autre étiquette ni une ancre,
   et choisit celle qui masque le moins les pièces utiles du dessin (coffrets, batterie, gaines). */
let NOTES = [];
const A_EVITER = [   // [x0, y0, x1, y1, poids] en coordonnées du dessin
  [728, 490, 790, 586, 1], [643, 535, 676, 570, 1], [494, 598, 614, 722, 1],     // coffrets, batterie
  [712, 183, 834, 404, .45],                                                     // fenêtre de la lucarne
  [884, 200, 904, 520, .7], [785, 508, 900, 540, .7], [810, 98, 892, 212, .4],   // gaine des panneaux
  [733, 384, 766, 500, .7], [652, 538, 735, 557, .7],                            // lucarne, coffrets
  [654, 560, 668, 692, .7], [606, 676, 668, 696, .7],                            // batterie
  [748, 578, 763, 672, .7], [760, 664, 925, 758, .35]                            // réseau, tranchée
];
function placerNotes() {
  if (!CADRE || !NOTES.length) return;
  const { x0, y0, s, W, H, haut, bas, ov } = CADRE;
  const court = H < 340;
  const notes = $('notes'), lead = $('leaders');
  lead.setAttribute('viewBox', `0 0 ${W} ${H}`);
  if (notes.querySelectorAll('.note').length !== NOTES.length) {
    notes.innerHTML = NOTES.map(() => '<span class="ancre"></span><div class="note"><span class="note-k"><i></i><span></span></span><span class="note-v"></span></div>').join('');
  }
  const els = notes.querySelectorAll('.note'), ancres = notes.querySelectorAll('.ancre');
  const k0 = Math.max(.75, Math.min(1.2, s / .66));
  const L = 26 * k0;                                         // longueur du filet
  const pts = NOTES.map(n => ({ x: (n.ax - x0) * s, y: (n.ay - y0) * s }));
  // héros très court : les étiquettes peuvent descendre dans le haut du fondu (jamais sous le texte)
  const zone = { l: 10, r: W - 10, t: haut + 4, b: court ? H - ov - 10 : H - bas - 4 };
  // flux actifs = obstacles : une étiquette ne doit pas cacher le trajet d'une impulsion
  const fluxPts = Object.values(FLUX).filter(f => f.g && !f.g.hasAttribute('display') && f.echant)
    .map(f => f.echant.map(([x, y]) => [(x - x0) * s, (y - y0) * s]));
  const boites = [];
  let svgOut = '';
  NOTES.forEach((n, k) => {
    const el = els[k], an = ancres[k];
    el.style.setProperty('--c', n.c); an.style.setProperty('--c', n.c); an.style.setProperty('--d', `${k * .7}s`);
    el.querySelector('.note-k span').textContent = n.k;
    el.querySelector('.note-v').innerHTML = `<span>${n.v}</span>` + (n.s ? `<span class="note-s">${n.s}</span>` : '');
    const w = el.offsetWidth, h = el.offsetHeight, a = pts[k];
    const ancreVisible = a.x > 8 && a.x < W - 8 && a.y > zone.t && a.y < H - 24;
    // positions candidates : au-dessus / en dessous (glissées latéralement), à gauche / à droite
    const cands = [];
    const glisse = (l0, l1, t, rang) => { for (let k = 0; k <= 6; k++) cands.push({ l: l0 + (l1 - l0) * k / 6, t, rang, ecart: Math.abs(k - 3) / 3 }); };
    const vertical = (t0, t1, l, rang) => { for (let k = 0; k <= 4; k++) cands.push({ l, t: t0 + (t1 - t0) * k / 4, rang, ecart: Math.abs(k - 2) / 2 }); };
    const positions = court ? [...new Set([...n.pos, 'e', 'w', 's', 'n'])] : n.pos;
    positions.forEach((p, rang) => {
      if (p === 'n') glisse(a.x - w + 16, a.x - 16, a.y - L - h, rang);
      if (p === 'nn') glisse(a.x - w + 16, a.x - 16, a.y - 2.2 * L - h, rang);   // filet plus long : passe au-dessus d'une gaine
      if (p === 's') glisse(a.x - w + 16, a.x - 16, a.y + L, rang);
      if (p === 'w') vertical(a.y - h + 10, a.y - 10, a.x - L - w, rang);
      if (p === 'e') vertical(a.y - h + 10, a.y - 10, a.x + L, rang);
    });
    let choix = null, meilleur = Infinity;
    if (ancreVisible) for (const c of cands) {
      const l = Math.max(zone.l, Math.min(zone.r - w, c.l)), t = c.t;
      if (t < zone.t || t + h > zone.b) continue;
      const box = { l, r: l + w, t, b: t + h };
      if (boites.some(o => box.l < o.r + 8 && box.r > o.l - 8 && box.t < o.b + 8 && box.b > o.t - 8)) continue;
      if (pts.some(q => q.x > box.l - 8 && q.x < box.r + 8 && q.y > box.t - 8 && q.y < box.b + 8)) continue;
      let gene = 0;
      for (const [zx0, zy0, zx1, zy1, poids] of A_EVITER) {
        const ox = Math.min(box.r, (zx1 - x0) * s) - Math.max(box.l, (zx0 - x0) * s);
        const oy = Math.min(box.b, (zy1 - y0) * s) - Math.max(box.t, (zy0 - y0) * s);
        if (ox > 0 && oy > 0) gene += poids * ox * oy / (w * h);
      }
      // chaque point de gaine caché pèse lourd ; au-delà de 10 % d'un flux, la place n'est retenue qu'en dernier recours
      for (const pts of fluxPts) {
        let nb = 0;
        for (const [px, py] of pts) if (px > box.l - 3 && px < box.r + 3 && py > box.t - 3 && py < box.b + 3) nb++;
        if (nb) gene += nb * .12 + (nb > pts.length * .1 ? 5 : 0);
      }
      const score = gene + c.rang * .06 + c.ecart * .02 + Math.abs(l - c.l) / w * .1;
      if (score < meilleur) { meilleur = score; choix = box; }
    }
    if (!choix) { el.style.display = 'none'; an.style.display = 'none'; return; }
    boites.push(choix);
    el.style.display = ''; an.style.display = '';
    el.style.transform = `translate(${choix.l.toFixed(1)}px, ${choix.t.toFixed(1)}px)`;
    an.style.transform = `translate(${a.x.toFixed(1)}px, ${a.y.toFixed(1)}px)`;
    requestAnimationFrame(() => el.classList.add('pret'));
    // filet : de l'ancre au point le plus proche du bord de l'étiquette
    const lx = Math.max(choix.l + 8, Math.min(choix.r - 8, a.x)), ly = Math.max(choix.t, Math.min(choix.b, a.y));
    svgOut += `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${lx.toFixed(1)}" y2="${ly.toFixed(1)}"/>`;
  });
  lead.innerHTML = svgOut;
}

/* ================================================================ DÉMARRAGE === */
function etatCourant() {
  const q = new URLSearchParams(location.search).get('apercu');
  const A = ETAT.apercus, a = q && A && q !== 'maison_soiree' && A[q];
  if (!a) return ETAT;
  // journée complète reconstituée à partir de l'état : mesures + prévision, puis soirée de la maison
  const c = ETAT.courbe, pas = c.pas_h;
  const debutSoiree = Math.round(17.5 / pas);
  const production = c.production.map((v, k) => v ?? c.prevision[k] ?? 0);
  const maison = c.maison.map((v, k) => v ?? A.maison_soiree[k - debutSoiree] ?? null);
  const { h } = heureLocale(a.horodatage, ETAT.fuseau);
  const coupe = (arr, f) => arr.map((v, k) => f(k * pas) ? v : null);
  return {
    ...ETAT, ...a,
    instantane: { ...ETAT.instantane, ...a.instantane },
    courbe: { pas_h: pas, production: coupe(production, t => t <= h), prevision: coupe(production, t => t > h), maison: coupe(maison, t => t <= h) }
  };
}

/* Pause des animations continues (impulsions, LED, ondes) : mémorisée dans ce navigateur seulement */
const btnPause = $('btn-pause');
function appliquerPause(on) {
  PAUSE = on;
  document.documentElement.classList.toggle('calme', on);
  btnPause.setAttribute('aria-pressed', String(on));
}
try { appliquerPause(localStorage.getItem('breezy-pause') === '1'); } catch (_) { /* stockage indisponible */ }
btnPause.addEventListener('click', () => {
  appliquerPause(!PAUSE);
  try { localStorage.setItem('breezy-pause', PAUSE ? '1' : '0'); } catch (_) { /* stockage indisponible */ }
  rendreMaison(etat, deriver(etat));
});

let etat = etatCourant();
preparerSvg();
rendre(etat);
cadrer();
brancherCourbe();

/* Point d'entrée pour Home Assistant : Breezy.actualiser(nouvelEtat) */
window.Breezy = {
  get etat() { return etat; },
  actualiser(nouvel) { etat = nouvel; rendre(etat); }
};

let rz = 0;
new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(cadrer); }).observe($('hero'));
let largeurCourbe = $('chart-svg').clientWidth;
new ResizeObserver(() => { const w = $('chart-svg').clientWidth; if (Math.abs(w - largeurCourbe) > 2) { largeurCourbe = w; rendreCourbe(etat, deriver(etat)); } }).observe($('chart-svg'));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { cadrer(); });
reduit.addEventListener?.('change', () => rendreMaison(etat, deriver(etat)));
</script>
