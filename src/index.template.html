<!doctype html>
<!--
  Breezy · Accueil — « la maison au grand air »
  ---------------------------------------------------------------------------
  GABARIT : l'illustration assets/maison.svg est insérée telle quelle, en ligne, à la place du
  marqueur MAISON_SVG de #scene (ses éléments sont animés à l'exécution, le fichier n'est jamais modifié) :
      node tools/inline-svg.js src/index.template.html index.html

  DONNÉES : les entités de Home Assistant (bloc CONFIG.entites du script, « ← AJUSTE ICI »), reçues de
  la coque de S&A-HOME par postMessage (request_states → states, history_request → history_result).
  Hors de Home Assistant (page ouverte seule) : des valeurs d'exemple, au même format que les états de
  Home Assistant, lues par le même code. Aperçus : index.html?apercu=midi | soir | nuit | borne
  (ou Breezy.apercu('nuit') dans la console).

  Deux axes indépendants :
   - la SCÈNE (ciel, lumière sur la maison, soleil, lune, étoiles, nuages) suit l'heure de la maison,
     la hauteur du soleil (sun.sun) et la météo (weather.*) ;
   - le THÈME (fond de page, cartes, texte) suit le mode sombre de Home Assistant dans la coque,
     sinon prefers-color-scheme.
  Couleurs d'énergie, partout les mêmes : soleil ambre, maison bleu, batterie vert, réseau violet, borne prune.
  Une seule famille : Geist (400/500/600).
  Flux d'énergie : le relais en comètes de S&A-HOME (cycle 5,6 s, moyeu sur le coffret principal).
-->

<title>Breezy · Accueil</title>

<style>
/* ================================================================ JETONS === */

  --surface: #FFFFFF;

  --encre-3: oklch(0.52 0.01 260);
  --filet: oklch(0.22 0.012 260 / .10);
  --piste: oklch(0.40 0.01 260 / .10);
  /* énergie : même teinte pour comète, pastille, graphique, icône */

  --soleil-t: oklch(0.52 0.12 70);
  --soleil-graphe: oklch(0.665 0.15 70);       /* barres du graphique : ≥ 3:1 sur la carte blanche (le héros garde --soleil) */
  --maison: oklch(0.66 0.14 250);
  --maison-t: oklch(0.48 0.15 256);
  --batterie: oklch(0.64 0.15 152);
  --batterie-t: oklch(0.48 0.12 152);

  --reseau-t: oklch(0.46 0.19 295);
  --borne: oklch(0.58 0.19 332);                  /* la recharge de la voiture : un violet rosé, distinct du réseau */

  --alerte: oklch(0.58 0.20 27);

}

    --fond: oklch(0.17 0.006 260);
    --surface: oklch(0.215 0.007 260);
    --surface-2: oklch(0.25 0.008 260);
    --encre: oklch(0.96 0.004 260);
    --encre-2: oklch(0.80 0.008 260);
    --encre-3: oklch(0.70 0.008 260);
    --filet: oklch(0.96 0.004 260 / .10);

    --maison: oklch(0.80 0.11 240);
    --maison-t: oklch(0.80 0.11 240);
    --batterie: oklch(0.74 0.15 152);

    --reseau: oklch(0.62 0.17 295);

  --fond: oklch(0.17 0.006 260);
  --surface: oklch(0.215 0.007 260);
  --surface-2: oklch(0.25 0.008 260);
  --encre: oklch(0.96 0.004 260);
  --encre-2: oklch(0.80 0.008 260);
  --encre-3: oklch(0.70 0.008 260);
  --filet: oklch(0.96 0.004 260 / .10);
  --piste: oklch(0.96 0.004 260 / .12);
  --soleil: oklch(0.86 0.15 85);
  --soleil-t: oklch(0.86 0.15 85); --soleil-graphe: oklch(0.86 0.15 85);
  --maison: oklch(0.80 0.11 240);
  --maison-t: oklch(0.80 0.11 240);
  --batterie: oklch(0.74 0.15 152);
  --batterie-t: oklch(0.74 0.15 152);
  --reseau: oklch(0.62 0.17 295);
  --reseau-t: oklch(0.70 0.15 295);
  --borne: oklch(0.72 0.15 332);
  --borne-t: oklch(0.76 0.13 332);

/* ================================================================ BASE === */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--fond); }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font: 400 15px/21px var(--police);
  font-feature-settings: "tnum" 1; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
p, h1, h2, h3, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { overflow: visible; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ================================================================ HÉROS === */
.hero {
  position: relative; display: block;
  width: 100%; height: 75vh; height: 75svh;
  margin: 0; padding: 0 0 0 0;
  overflow: hidden; isolation: isolate;
  border-radius: 0 0 28px 28px;
  background: var(--ciel-haut-actuel, oklch(.86 .055 240));
  color: var(--ciel-encre);
  /* encres et surface de la SCÈNE (indépendantes du thème de la page) */
  --surface-scene: #FFFFFF;
  --ciel-encre: oklch(0.22 0.012 260);
  --ciel-encre-2: oklch(0.38 0.012 260);
  --fil: oklch(0.42 0.01 260 / .5);
}
.hero[data-ciel="sombre"] {
  /* sur un ciel sombre, les énergies prennent leur clarté « sombre » (même teinte) : comètes, moyeu et pastilles restent lisibles */
  --soleil: oklch(0.86 0.15 85);
  --maison: oklch(0.80 0.11 240);
  --batterie: oklch(0.74 0.15 152);
  --reseau: oklch(0.62 0.17 295);
  --borne: oklch(0.72 0.15 332);
  --surface-scene: oklch(0.24 0.01 260);
  --ciel-encre: oklch(0.97 0.004 260);
  --ciel-encre-2: oklch(0.84 0.008 260);
  --fil: oklch(0.88 0.01 260 / .45);
}
.hero :focus-visible { outline-color: var(--ciel-encre); }
.saut {
  position: absolute; z-index: 20; left: var(--gx); top: -80px;
  padding: 10px 14px; border-radius: 12px;
  background: var(--encre); color: var(--fond); font-weight: 600; text-decoration: none;
}
.saut:focus { top: max(8px, env(safe-area-inset-top)); }
#annonce { top: 0; left: 0; }
.direct:focus { outline: none; }

/* --- Ciel (derrière la maison : il ne la couvre jamais) --- */
.ciel { position: absolute; inset: 0; z-index: 0; pointer-events: none; --yh: 60%; padding-right: env(safe-area-inset-right, 0px); }
.ciel-fond {
  position: absolute; inset: 0;
  /* voile de lecture (encrerCiel) : seulement autour du crépuscule et de l'aube, quand ni l'encre claire ni la sombre n'atteint 4,5:1 sur le ciel */
  background:
    linear-gradient(180deg, var(--voile-c, transparent) 0, var(--voile-c, transparent) var(--voile-y, 0px), transparent calc(var(--voile-y, 0px) + 80px)),
    linear-gradient(180deg, var(--c-haut) 0, var(--c-milieu) calc(var(--yh) * .45), var(--c-horizon) var(--yh), var(--c-sol0) calc(var(--yh) + 24px), var(--c-sol1) 100%);
}
.ciel-fond-b { opacity: 0; }
.astre { position: absolute; left: 0; top: 0; width: 0; height: 0; transition: opacity .6s ease; }
.astre .halo { position: absolute; left: calc(var(--r) * -3.5); top: calc(var(--r) * -3.5); width: calc(var(--r) * 7); height: calc(var(--r) * 7); border-radius: 50%; background: radial-gradient(closest-side, color-mix(in oklch, var(--astre) 42%, transparent), color-mix(in oklch, var(--astre) 14%, transparent) 55%, transparent); }
.astre .disque { position: absolute; left: calc(var(--r) * -1); top: calc(var(--r) * -1); width: calc(var(--r) * 2); height: calc(var(--r) * 2); border-radius: 50%; background: var(--astre); box-shadow: 0 0 0 .5px color-mix(in oklch, var(--astre) 60%, transparent); }
.astre.lune .disque { background: transparent; box-shadow: calc(var(--r) * .42) calc(var(--r) * -.18) 0 0 oklch(.95 .02 90); transform: rotate(-12deg); }
.astre.lune .halo { background: radial-gradient(closest-side, oklch(.95 .02 90 / .10), transparent); }
.etoiles { position: absolute; inset: 0; width: 100%; height: 100%; }
.etoiles circle { fill: oklch(.95 .01 260); }
.etoiles .tw { animation: scintille var(--d) ease-in-out var(--r) infinite; }
@keyframes scintille { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.nuages { position: absolute; inset: 0; }
.nuages i { position: absolute; display: block; border-radius: 999px; background: radial-gradient(closest-side, var(--nuage), transparent); }
.nuages.derive { animation: derive 40s ease-in-out infinite alternate; }
@keyframes derive { to { transform: translateX(24px); } }
.pluie { position: absolute; inset: 0; opacity: .18; background: repeating-linear-gradient(102deg, transparent 0 9px, oklch(1 0 0 / .9) 9px 10px, transparent 10px 23px); background-size: 100% 46px; }
.pluie.anim { animation: pluie 1.1s linear infinite; }
@keyframes pluie { to { background-position: -10px 46px; } }

/* --- Maison (SVG en ligne) et calque des filets --- */
.scene { position: absolute; inset: 0; z-index: 1; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: hidden; }
.fils { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fil { fill: none; stroke: var(--fil); stroke-width: 1; stroke-dasharray: 1.4 3; stroke-linecap: round; transition: opacity .3s ease; }
.ancre { fill: var(--c); stroke: var(--surface-scene); stroke-width: 1; transform-box: fill-box; transform-origin: center; }
.ancre.pouls { animation: ancre 600ms ease-in-out; }
@keyframes ancre { 50% { transform: scale(1.8); } }

/* --- Barre du haut --- */
.barre {
  position: absolute; z-index: 5; top: 8px; left: var(--gx); right: var(--gx); height: 44px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
  transition: top .2s;
}
.hero[data-niveau="2"] .barre, .hero[data-niveau="3"] .barre, .hero[data-niveau="4"] .barre { top: 4px; }
.barre-g { display: flex; align-items: center; gap: 28px; min-width: 0; justify-self: start; }
.marque { display: inline-flex; align-items: center; gap: 9px; height: 44px; min-width: 44px; padding-right: 4px; border-radius: 12px; color: var(--ciel-encre); text-decoration: none; }
.marque svg { width: 28px; height: 28px; flex: none; }
.marque-nom { font: 600 17px/1 var(--police); letter-spacing: -.02em; }
.nav-large { display: none; gap: 22px; }
.nav-large a { position: relative; padding: 0; border: 0; background: none; font: 500 15px/44px var(--police); color: var(--ciel-encre-2); text-decoration: none; border-radius: 6px; }
.nav-large a[aria-current="page"] { color: var(--ciel-encre); }
.hero.sans-nav .nav-large { display: none !important; }
.nav-large a[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 2px; border-radius: 2px; background: currentColor; }

/* surfaces givrées de la scène (pastilles, capsule « en direct ») — S&A-HOME .hc-chip */
.givre, .pill {
  background: linear-gradient(180deg, color-mix(in oklch, var(--surface-scene) 64%, transparent), color-mix(in oklch, var(--surface-scene) 82%, transparent));
  -webkit-backdrop-filter: blur(16px) saturate(1.8); backdrop-filter: blur(16px) saturate(1.8);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .8), inset 0 0 0 .5px oklch(1 0 0 / .5), 0 0 0 .5px oklch(.35 .01 260 / .12), 0 6px 16px -10px oklch(.25 .03 260 / .45);
}
.hero[data-ciel="sombre"] :is(.givre, .pill) {
  background: oklch(.22 .01 260 / .72);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .10), 0 0 0 .5px oklch(1 0 0 / .08), 0 8px 18px -10px oklch(0 0 0 / .6);
}

/* --- Capsule d'état (centre de la barre) : « En direct », ou « Hors de Home Assistant : valeurs d’exemple » (S&A-HOME) --- */
.capsule {
  position: relative; justify-self: center; min-width: 0; max-width: 100%;
  display: inline-flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 12px 0 10px; border: 0; border-radius: 999px;
  font: 500 13px/1 var(--police); color: var(--ciel-encre); white-space: nowrap;
}
.capsule .pt { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--batterie)); box-shadow: 0 0 0 2.5px color-mix(in oklch, var(--c, var(--batterie)) 24%, transparent); flex: none; }
.capsule .cc, .capsule.court .cl { display: none; }
.capsule.court .cc { display: inline; }
.hero.sans-nom .marque-nom { display: none; }
@media (max-width: 359px) { .barre { gap: 6px; } }

/* --- LE chiffre et sa phrase --- */
.une {
  position: absolute; z-index: 4; left: var(--gx); top: 66px;
  display: flex; flex-direction: column; align-items: flex-start;
  margin: 0; padding: 0; border: 0; background: none; border-radius: 12px;
  color: var(--ciel-encre); text-align: left;
}
.une-k { display: flex; align-items: center; gap: 8px; height: 20px; font: 500 14px/20px var(--police); color: var(--ciel-encre-2); white-space: nowrap; }
.une-k i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--soleil)); flex: none; }
.une-v { display: block; font-weight: 400; font-size: var(--une-t, 62px); line-height: 1; letter-spacing: -.045em; white-space: nowrap; font-variant-numeric: tabular-nums; transition: opacity .4s; }
.une-v .u { font-size: .34em; font-weight: 500; letter-spacing: 0; color: var(--ciel-encre-2); margin-left: .12em; }
.hero[data-niveau="2"] .une-k, .hero[data-niveau="3"] .une-k, .hero[data-niveau="4"] .une-k, .hero[data-mode="court"] .une-k { height: 18px; font-size: 13px; line-height: 18px; }
.une-phrase {
  position: absolute; z-index: 4; left: var(--gx); top: 160px;
  width: max-content; max-width: min(32ch, calc(100% - 2 * var(--gx)));
  font: 400 16px/22px var(--police); letter-spacing: -.005em; color: var(--ciel-encre);
  text-wrap: pretty;
}
.hero[data-niveau="1"] .une-phrase { font-size: 15px; line-height: 20px; }
.hero[data-mode="court"] .une-phrase { font-size: 15px; line-height: 20px; white-space: nowrap; max-width: none; }
.une-phrase[hidden] { display: none; }

/* --- Pastilles (S&A-HOME) : une valeur par flux allumé --- */
.pastilles { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.pill {
  position: absolute; left: 0; top: 0; pointer-events: auto;
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 6px;
  border: 0; border-radius: 999px; transform: translate(-50%, 0);
  font: 600 14px/20px var(--police); letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums;
  color: oklch(.22 .012 260);
  transition: opacity 300ms ease, visibility 0s linear 0s;
}
.pill .g { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 999px; flex: none; background: color-mix(in oklch, var(--c) 22%, transparent); color: var(--ct); }
.pill .g .ic { width: 12px; height: 12px; stroke-width: 2; }
.pill .v { display: inline-flex; align-items: center; gap: 3px; }
.pill .v .ic, .pill .s .ic { width: 11px; height: 11px; stroke-width: 2; }
.pill .s { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; font-size: 12.5px; color: oklch(.41 .01 260); }
.pill .n { margin-right: 4px; font-weight: 500; font-size: 13px; color: oklch(.41 .01 260); }
.hero[data-ciel="sombre"] .pill { color: oklch(.97 .004 260); }
.hero[data-ciel="sombre"] .pill :is(.s, .n) { color: oklch(.80 .008 260); }
.hero[data-ciel="sombre"] .pill .g { color: var(--c); }
.pill.cache { opacity: 0; visibility: hidden; transition: opacity 300ms ease, visibility 0s linear 300ms; }
.hero[data-mode="court"] .pill { transform: none; }

/* pastilles sorties du héros (héros minuscule : zoom 400 %) : une rangée qui se replie, sur la page */
.pastilles.dehors { position: static; display: flex; flex-wrap: wrap; gap: 14px 8px; padding: 14px var(--gx) 2px; pointer-events: auto; }
.pastilles.dehors .pill { position: relative; transform: none; color: var(--encre); background: var(--surface-2); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.pastilles.dehors .pill :is(.s, .n) { color: var(--encre-2); }

/* ================================================================ GRANDS ÉCRANS (héros) === */
.hero[data-mode="large"] .barre { top: 16px; height: 48px; left: var(--edge); right: var(--edge); }
.hero[data-mode="large"] .une, .hero[data-mode="large"] .une-phrase { left: var(--edge); }
.hero[data-mode="large"] .une-phrase { max-width: var(--colw); font-size: 18px; line-height: 26px; }
.hero[data-mode="large"] .une-v { letter-spacing: -.05em; }
@media (min-width: 1100px) { .hero[data-mode="large"] .nav-large { display: flex; } }
.hero[data-mode="court"] .barre { top: 6px; right: auto; width: calc(var(--colw) - var(--gx)); }
.hero[data-mode="court"] .une-v { letter-spacing: -.05em; }
</style>
<style>
/* ================================================================ CONTENU === */
main { display: block; padding: 0 0 8px; }
@media (prefers-reduced-motion: reduce) { main { padding-bottom: 32px; } }   /* le pied (interrupteur) est masqué : la page garde sa marge basse */
.page { display: flex; flex-direction: column; gap: 16px; padding: 16px var(--gx) 0; max-width: 1320px; margin: 0 auto; }

}

.carte-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }

  -webkit-backdrop-filter: blur(24px) saturate(1.9); backdrop-filter: blur(24px) saturate(1.9);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .9), inset 0 -1px 0 oklch(0.4 0.01 260 / .06), inset 0 0 0 .5px oklch(1 0 0 / .55), 0 0 0 .5px oklch(0.35 0.01 260 / .1), 0 1px 2px oklch(0.25 0.02 260 / .06), 0 18px 40px -22px oklch(0.25 0.03 260 / .5);
}
:root[data-theme="dark"] .bilan { background: color-mix(in oklch, var(--surface) 82%, transparent); box-shadow: inset 0 1px 0 oklch(1 0 0 / .08), 0 0 0 .5px oklch(1 0 0 / .08), 0 18px 40px -22px oklch(0 0 0 / .7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bilan { background: color-mix(in oklch, var(--surface) 82%, transparent); box-shadow: inset 0 1px 0 oklch(1 0 0 / .08), 0 0 0 .5px oklch(1 0 0 / .08), 0 18px 40px -22px oklch(0 0 0 / .7); } }
/* Sur une scène sombre ou intermédiaire (soir, nuit…), le verre dépoli clair deviendrait gris boueux :
   - page claire, carte surtout hors du héros (téléphone) : surface claire pleine, sans flou (pas de bande grise ni de couture) ;
   - carte posée dans le héros (grand écran) : verre sombre de la scène, encres claires (comme les pastilles du ciel sombre). */
.bilan[data-fond="plein"] { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
.bilan[data-fond="sombre"] {
  --surface: oklch(0.24 0.01 260);
  --encre: oklch(0.97 0.004 260); --encre-2: oklch(0.84 0.008 260); --encre-3: oklch(0.76 0.008 260);
  --filet: oklch(0.96 0.004 260 / .12); --piste: oklch(0.96 0.004 260 / .16);

}
.bilan-tete { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 14px; margin-bottom: 12px; }

.bilan-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); }   /* « Autoconsommés », le plus long libellé, tient sur une ligne */
.bm { position: relative; display: flex; flex-direction: column; min-width: 0; padding: 0 14px; }

.bm-b { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.bm-l { max-width: 100%; font: 500 12.5px/16px var(--police); color: var(--encre-2); }

@media (max-width: 429px) { .bm { padding: 0 11px; } .bilan-tete { padding: 0 11px; } }

@media (min-width: 768px) { .bilan { margin-left: var(--gx); margin-right: var(--gx); } }

/* --- Production solaire : réel et prévision Solcast, de 6 h à 21 h (S&A-HOME, écran Énergie) --- */
.journee .carte-tete { flex-wrap: wrap; row-gap: 4px; }               /* téléphone étroit : la légende passe sous le titre */
.journee h2 { white-space: nowrap; }

.legende .k-reel { height: 3px; border-radius: 2px; background: var(--soleil-t); }

.bulle { position: absolute; top: 0; left: 0; z-index: 2; padding: 5px 10px; border-radius: 999px; background: var(--encre); color: var(--fond); font: 600 12.5px/16px var(--police); white-space: nowrap; pointer-events: none; }
.bulle[hidden] { display: none; }
.axe-h { display: flex; justify-content: space-between; margin-top: 8px; font: 500 12px/16px var(--police); color: var(--encre-3); }

}

.lignes a:hover { background: color-mix(in oklch, var(--surface-2) 70%, transparent); }
.lignes .ic { width: 22px; height: 22px; stroke-width: 1.6; color: var(--encre); }
.lignes .chev { width: 16px; height: 16px; color: var(--encre-3); }
.lignes .l1 { min-width: 0; font: 500 16px/22px var(--police); }
.lignes .lv { font: 500 15px/20px var(--police); color: var(--encre-2); white-space: nowrap; }

/* --- Pied : l'interrupteur des animations (WCAG 2.2.2) --- */
.pied[hidden] { display: none; }
.pied { max-width: 1320px; margin: 0 auto; padding: 16px var(--gx) 28px; text-align: center; font: 500 12.5px/18px var(--police); color: var(--encre-3); }

.interrupteur { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 44px; min-height: 44px; padding: 0 4px; border: 0; background: none; font: 500 13px/1 var(--police); color: var(--encre-2); border-radius: 12px; }

.interrupteur .tr { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--piste); box-shadow: inset 0 0 0 1px var(--encre-3); transition: background .2s; flex: none; }
.interrupteur .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--encre-3), 0 1px 3px oklch(.2 .01 260 / .3); transition: transform .2s; }

.interrupteur[aria-checked="true"] .tr::after { box-shadow: 0 1px 3px oklch(.2 .01 260 / .3); transform: translateX(14px); }

html[data-mode="court"] .bilan { margin: 12px var(--gx) 0; }

  .colonne-g { grid-column: 1 / span 7; display: flex; flex-direction: column; gap: 24px; }
  .colonne-d { grid-column: 8 / span 5; display: flex; flex-direction: column; gap: 24px; }
  .lignes { margin: 0; padding: 6px 0; border-radius: 24px; background: var(--surface); box-shadow: var(--ombre-carte); overflow: hidden; }
  .lignes a { padding: 12px 20px; }

}
@media (max-width: 899px) { .colonne-g, .colonne-d { display: contents; } }

/* ================================================================ COMÈTES ET MOYEU (dans le SVG) === */
.fl-flux { transition: opacity 300ms ease; }
.fl-flux path, .fl-fixe path { fill: none; stroke-linecap: round; stroke-linejoin: round; }

.pill .long, .pill .court { align-items: center; gap: 4px; }

.hero.borne-courte .pill .n { display: none; }

  .interrupteur[aria-checked="true"] .tr::after { background: HighlightText; }
  .une-k { position: relative; z-index: 1; }           /* le fond imposé de la ligne du chiffre ne masque plus son intitulé */
  .bm-p, .bm-p i { forced-color-adjust: none; }

}

<body>
<!-- Le héros : la barre (bandeau du site) puis la section « en direct » (titre h1, chiffre, ligne batterie, pastilles, maison) -->
<div class="hero" id="hero" data-hero data-mode="portrait" data-niveau="0" data-ciel="clair">
  <a class="saut" href="#direct">Aller au contenu</a>
  <!-- Ciel : dégradé CSS (deux calques pour les fondus), astre, nuages, étoiles. Peint DERRIÈRE la maison. -->
  <div class="ciel" id="ciel" aria-hidden="true" data-transparent>
    <div class="ciel-fond" id="ciel-a"></div><div class="ciel-fond ciel-fond-b" id="ciel-b"></div>
    <svg class="etoiles" id="etoiles" focusable="false"></svg>
    <div class="astre" id="astre"><i class="halo"></i><i class="disque"></i></div>

  <header class="barre" id="barre">

          <rect width="28" height="28" rx="9" fill="var(--surface-scene)" opacity=".9"/>
          <circle cx="14" cy="11.6" r="4.2" fill="var(--soleil)"/>
          <path d="M7.5 18.4h13" stroke="var(--maison)" stroke-width="2" stroke-linecap="round"/>
          <path d="M10 21.8h8" stroke="var(--batterie)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="marque-nom">Breezy</span>
      </a>
      <nav class="nav-large" aria-label="Navigation principale">
        <a href="#" aria-current="page">Accueil</a><a href="#">Batterie</a><a href="#">Énergie</a><a href="#">Économies</a>
      </nav>
    </div>
    <!-- État des données : en direct (coque Home Assistant) ou valeurs d'exemple (page ouverte seule) -->
    <p class="capsule givre" id="capsule" role="status"></p>
  </header>

  <!-- En direct : cible du lien d'évitement ; ses éléments restent positionnés dans le héros (la section n'a pas de boîte propre) -->
  <section class="direct" id="direct" tabindex="-1" aria-labelledby="direct-t">
    <h1 class="sr-only" id="direct-t">Énergie de la maison, en direct</h1>
    <!-- LE chiffre : la production solaire le jour, la consommation de la maison le soir et la nuit -->
    <p class="une" id="une">
      <span class="une-k" id="une-k" aria-hidden="true"><i></i><span></span></span>
      <span class="une-v" id="une-v" aria-hidden="true"></span>
      <span class="sr-only" id="une-sr"></span>

    <p class="une-phrase" id="une-phrase" hidden></p>

    <div class="scene" id="scene"><!--MAISON_SVG--></div>

</div>

<main id="contenu" tabindex="-1">
  <!-- Bilan du jour : chevauche le bas du héros sur téléphone ; posé dans la colonne gauche du héros sur grand écran -->
  <section class="bilan" id="bilan" aria-labelledby="bilan-t">

<footer class="pied" id="pied">

  </div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   Breezy · réglages et pont vers Home Assistant (comme S&A-HOME)
   ← AJUSTE ICI : toutes les entités sont regroupées dans CONFIG.entites.
   Une entité vide ('') = l'élément n'est pas relié : il est masqué. Une entité absente, « unavailable » ou « unknown »
   dans Home Assistant : sa valeur s'affiche « — », son flux et sa pastille sont masqués (rien n'est jamais inventé).
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  fuseau: 'Europe/Paris',                                                 // ← l'heure de la maison (heures, minuit, « demain »)
  entites: {
    // la maison en direct (les mêmes entités que S&A-HOME et Voltia)
    solaire: 'sensor.production_pv_maison_totale_w',                      // W, somme des trois onduleurs (Izy 2K + Deye 2K + Deye 1K = 5 kW)
    batterie: 'sensor.solarflow_2400_ac_bat_in_out',                      // W signés, négatif = charge (Zendure SolarFlow 2400 AC)
    socBatterie: 'sensor.solarflow_2400_ac_electric_level',               // %
    batterieDispo: 'sensor.solarflow_2400_ac_available_kwh',              // kWh stockés (3 packs AB3000 de 2,88 kWh)
    batterieMin: 'number.solarflow_2400_ac_min_soc',                      // % : la réserve basse, jamais entamée
    batterieMax: 'number.solarflow_2400_ac_soc_set',                      // % : la limite haute de charge (« pleine vers » compte jusqu'à 100 %, comme S&A-HOME)
    reseau: 'sensor.te31njn2n154747_l3_p',                                // W signés, + = import / − = export (Smart3CT L3)
    voiture: 'sensor.te31njn2n154747_l2_p',                               // W à la borne de la Kia (Smart3CT L2)
    soleil: 'sun.sun',
    meteo: ['weather.homelyvibes_sa', 'weather.forecast_maison', 'weather.forecast_home'],   // la première qui existe
    // le bilan et la courbe du jour
    productionJour: 'sensor.production_pv_jour',                          // kWh depuis minuit
    previsionJour: 'sensor.solcast_pv_forecast_previsions_pour_aujourd_hui',   // kWh ; attribut detailedForecast : kW par demi-heure
    eco: {
      autoconsoJour: 'sensor.hv_autoconso_reel_jour',                     // kWh
      jour: 'sensor.hv_eco_reel_jour',                                    // €
      mois: 'sensor.hv_eco_reel_month',                                   // €
      cumul: 'sensor.hv_economies_reel_cumul'                             // € depuis le début (pour la future page Économies)
    }
  }
};
const ENT = CONFIG.entites;

/* ---------- Home Assistant, par la coque de S&A-HOME (postMessage) ----------
   page → coque : { type: 'request_states' } · { type: 'history_request', id, start, end, entities, period, types }
   coque → page : { type: 'states', states, user, dark } · { type: 'history_result', id, success, data }
   Une entité absente, « unavailable » ou « unknown » vaut null : rien n'est jamais inventé. */
const HA = {
  enCoque: window.parent !== window,
  connecte: false,
  sombre: null,
  etats: {},
  t: null,                                                    // valeurs d'exemple : l'heure figée de l'aperçu
  id: 1, attentes: {},
  e(id) { return id ? this.etats[id] || null : null; },
  etat(id) { const s = this.e(id); return s && s.state !== 'unavailable' && s.state !== 'unknown' ? s.state : null; },
  nb(id) { const v = parseFloat(this.etat(id)); return Number.isFinite(v) ? v : null; },
  attr(id, a) { const s = this.e(id); return s && s.attributes && s.attributes[a] != null ? s.attributes[a] : null; },
  premiere(liste) { return [].concat(liste).find(id => id && this.etats[id]) || null; },
  maintenant() { return this.t ?? Date.now(); },
  ecouter(recu) {
    window.addEventListener('message', ev => {
      const m = ev.data;
      if (!m || !m.type || ev.source !== window.parent) return;
      if (m.type === 'states') {
        this.etats = m.states || {};

/* ------------------------------------------------ Position du soleil ---
   Formules astronomiques simplifiées (≈ 0,5°), suffisantes pour peindre le ciel.
   Avec Home Assistant, l’attribut elevation de sun.sun est utilisé tel quel ; ceci ne sert qu’à défaut (et aux valeurs d’exemple). */
function positionSoleil(date, lat, lon) {
  const d = date.getTime() / 86400000 - 10957.5;
  const g = (357.529 + 0.98560028 * d) * RAD;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * RAD;
  const eps = (23.439 - 0.00000036 * d) * RAD;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(eps) * Math.sin(L));
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const H = (gmst * 15 + lon) * RAD - ra, phi = lat * RAD;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  return { elevation: alt / RAD };
}

    return `Batterie jusqu’à ${fin >= 24 ? 'demain ' : ''}${heureTxt(fin)}`;

let MEMO = { jour: null, annonce: null };
/* météo de Home Assistant → ciel de la scène */
const METEO = { sunny: 'clair', 'clear-night': 'clair', partlycloudy: 'nuageux', windy: 'nuageux', 'windy-variant': 'nuageux', cloudy: 'couvert', exceptional: 'couvert', fog: 'voile',
  rainy: 'pluie', pouring: 'pluie', snowy: 'pluie', 'snowy-rainy': 'pluie', hail: 'pluie', lightning: 'orage', 'lightning-rainy': 'orage' };
/* Flux allumés aux seuils de S&A-HOME : soleil ≥ 30 W, |batterie| > 30 W, |réseau| > 5 W, borne > 50 W ; la maison dès qu'elle est connue.
   u = √(kW / 3) : la vitesse des comètes croît avec la puissance. */
function calculerFlux(f, aBatterie) {
  const out = {};
  const flux = (nom, actif, w, phase) => { const kW = Math.abs(w || 0) / 1000; out[nom] = { actif: !!actif, phase, kW, u: Math.sqrt(borne(kW / 3, 0, 1)) }; };
  flux('soleil', f?.pv != null && f.pv >= 30, f?.pv, 'ent');
  flux('maison', f?.maison != null, f?.maison, 'sor');
  flux('batterie', aBatterie && f?.batNet != null && Math.abs(f.batNet) > 30, f?.batNet, f?.batNet > 0 ? 'sor' : 'ent inv');
  flux('reseau', f?.grid != null && Math.abs(f.grid) > 5, f?.grid, f?.grid < 0 ? 'sor' : 'ent inv');
  flux('voiture', f?.ve != null && f.ve > 50, f?.ve, 'cab');
  return out;
}

function deriver() {
  const t = HA.maintenant(), { date, h } = heureLocale(new Date(t));
  // le soleil : sun.sun (élévation, prochains lever et coucher) ; à défaut, sa position calculée à Paris
  const el = HA.attr(ENT.soleil, 'elevation');
  const E = el != null && Number.isFinite(Number(el)) ? Number(el) : positionSoleil(date, 48.85, 2.35).elevation;
  const nr = Date.parse(HA.attr(ENT.soleil, 'next_rising')), ns = Date.parse(HA.attr(ENT.soleil, 'next_setting'));
  const lever = Number.isFinite(nr) ? heureLocale(new Date(nr)).h : 7.5, coucher = Number.isFinite(ns) ? heureLocale(new Date(ns)).h : 19;
  const montant = HA.attr(ENT.soleil, 'rising');
  const matin = typeof montant === 'boolean' ? montant : h < (lever + coucher) / 2;
  const cle = E >= 10 ? 'jour' : E >= -1 ? (matin ? 'aube' : 'doree') : E >= -8 ? 'crepuscule' : 'nuit';
  const progres = borne((h - lever) / (coucher - lever), 0, 1);
  const ciel = METEO[HA.etat(HA.premiere(ENT.meteo))] || 'clair';
  const f = fluxMaison(), b = batterieMaison(f);
  const aBatterie = !!(ENT.batterie || ENT.socBatterie);
  // le chiffre : la production le jour, la maison le soir (hystérésis 80 W / 30 W) ; sans mesure du soleil, sa hauteur décide
  const pv = f?.pv ?? null;
  let jour = MEMO.jour;
  if (pv == null) jour = E > 0; else if (pv >= 80) jour = true; else if (pv < 30) jour = false; else if (jour == null) jour = E > 0;
  MEMO.jour = jour;
  // bilan du jour (S&A-HOME : production, prévision Solcast, part autoconsommée, économies)
  const prod = HA.nb(ENT.productionJour), prev = HA.nb(ENT.previsionJour), auto = HA.nb(ENT.eco.autoconsoJour);
  const bilan = { prod, prev, autoPct: prod && auto != null ? borne(Math.round(auto / prod * 100), 0, 100) : null, ecoJour: HA.nb(ENT.eco.jour), ecoMois: HA.nb(ENT.eco.mois) };
  return { t, date, h, lever, coucher, E, matin, cle, progres, ciel, f, b, soc: b.soc, aBatterie, mode_une: jour ? 'soleil' : 'maison', bilan, flux: calculerFlux(f, aBatterie) };
}

/* Pastilles : où elles vont (ciel ou sol), leur ancre, leur texte long et court.
   Un flux à zéro n'a pas de pastille (comme S&A-HOME) ; la source du chiffre n'en a pas non plus. */
function rendrePastilles(d) {
  const f = d.f || {}, F = d.flux, L = [];
  const sep = '<span class="sep">·</span>';
  if (d.mode_une === 'maison' && F.soleil.actif) L.push({ id: 'soleil', place: 'ciel', ancre: A.PANNEAUX_G, c: 'var(--soleil)', ct: 'var(--soleil-t)', g: 'soleil', long: [pTxt(f.pv), ''], court: [pTxt(f.pv), ''], label: `Le soleil produit ${pLong(f.pv)}` });
  if (d.mode_une === 'soleil' && f.maison != null) L.push({ id: 'maison', place: 'ciel', ancre: A.LUCARNE, c: 'var(--maison)', ct: 'var(--maison-t)', g: 'maison', long: [pTxt(f.maison), ''], court: [pTxt(f.maison), ''], label: `La maison consomme ${pLong(f.maison)}` });
  // la borne de la Kia : seulement quand elle recharge (le dessin n'a pas de voiture : la pastille montre le garage)
  if (F.voiture.actif) L.push({ id: 'borne', place: 'ciel', ancre: A.GARAGE, c: 'var(--borne)', ct: 'var(--borne-t)', g: 'borne', nom: 'Borne', long: [pTxt(f.ve), ''], court: [pTxt(f.ve), ''], label: `La borne recharge la voiture à ${pLong(f.ve)}` });
  // la batterie : sa charge, et sa puissance quand elle se charge (↑) ou se vide (↓)
  if (d.aBatterie && (d.soc != null || F.batterie.actif)) {
    const socTxt = d.soc != null ? `${pct(d.soc)}${NNBSP}%` : '—';
    const sens = F.batterie.actif ? (f.batNet > 0 ? 'haut' : 'bas') : null, pB = sens ? `${fleche(sens)}${pTxt(f.batNet)}` : '';
    L.push({ id: 'batterie', place: 'sol', ancre: A.BATTERIE, c: 'var(--batterie)', ct: 'var(--batterie-t)', g: 'batterie', long: [socTxt, pB && `${sep}${pB}`], court: [socTxt, pB],
      label: `Batterie à ${d.soc != null ? `${pct(d.soc)} %` : 'une charge non mesurée'}${sens ? `, ${sens === 'haut' ? 'en charge' : 'en décharge'} à ${pLong(f.batNet)}` : ''}` });
  }
  // le réseau : ↙ import, ↗ export
  if (F.reseau.actif) {
    const imp = f.grid > 0, v = `${fleche(imp ? 'import' : 'export')}${pTxt(f.grid)}`;
    L.push({ id: 'reseau', place: 'sol', ancre: A.RESEAU, c: 'var(--reseau)', ct: 'var(--reseau-t)', g: 'reseau', long: [v, ''], court: [v, ''], label: `Réseau${NBSP}: ${imp ? 'import' : 'export'} de ${pLong(f.grid)}` });
  }
  PASTILLES = L;
  const ul = $('pastilles');
  const seg = ([v, s]) => `${v ? `<span class="v">${v}</span>` : ''}${s ? `<span class="s">${s}</span>` : ''}`;
  for (const id of ['soleil', 'maison', 'borne', 'batterie', 'reseau']) {
    let pill = ul.querySelector(`.pill[data-noeud="${id}"]`);
    if (!pill) {
      const li = document.createElement('li');
      li.innerHTML = `<span class="pill cache" data-noeud="${id}" aria-hidden="true"></span><span class="sr-only"></span>`;
      ul.appendChild(li);
      pill = li.firstChild;
      pill.addEventListener('pointerenter', () => pulserAncre(id));
    }
    const li = pill.parentElement, P = L.find(x => x.id === id);
    // pastille absente : son <li> sort de la liste (lecteur d'écran), la pastille s'efface en fondu
    if (!P) { pill.classList.add('cache'); li.setAttribute('aria-hidden', 'true'); li.lastChild.textContent = ''; continue; }
    li.removeAttribute('aria-hidden');
    pill.className = 'pill';
    pill.style.setProperty('--c', P.c); pill.style.setProperty('--ct', P.ct);
    const html = `<span class="g">${icone(P.g)}</span><span class="long">${P.nom ? `<span class="n">${P.nom}</span>` : ''}${seg(P.long)}</span><span class="court">${seg(P.court)}</span>`;
    if (pill.innerHTML !== html) pill.innerHTML = html;
    if (li.lastChild.textContent !== P.label) li.lastChild.textContent = P.label;

}
function pulserAncre(id) {

  const yH = luminanceLab(haut), yM = luminanceLab(milieu), yN = luminanceLab(ENCRE.sombre), yB = luminanceLab(ENCRE.claire);
  const ciel = Math.min(contraste(yN, yH), contraste(yN, yM)) >= Math.min(contraste(yB, yH), contraste(yB, yM)) ? 'clair' : 'sombre';

  const etatBatt = f.batNet == null ? 'puissance non mesurée' : F.batterie.actif ? (f.batNet > 0 ? `en charge à ${pLong(f.batNet)}` : `en décharge à ${pLong(f.batNet)}`) : 'au repos';
  svg.setAttribute('aria-label',
    `La maison entière. Panneaux solaires ${etat(f.pv, F.soleil.actif, `produisant ${pLong(f.pv)}`, 'non mesurés')}, ` +

    (allumees.length ? `. Lumière allumée dans ${allumees.join(', ')}.` : '.'));

/* ------------------------------------------------ Encre du héros et voile de lecture ---
   Le texte du héros (marque, menu, chiffre, phrase) est posé sur le ciel. On échantillonne le dégradé réellement
   derrière lui (de la barre au bas de la phrase), on choisit l'encre, sombre ou claire, qui demande le moins d'aide,
   puis, si elle reste sous 4,5:1 (autour de l'aube et du crépuscule, ciel mauve), on pose en haut du ciel un voile
   de sa propre teinte, plus clair ou plus sombre, juste assez opaque pour l'atteindre. L'encre secondaire
   (intitulé, unité, menu) se rapproche de l'encre principale tant qu'elle n'atteint pas 4,5:1.
   Le bilan, quand il chevauche une scène sombre ou intermédiaire en thème clair, passe en surface pleine ou en verre sombre. */
const ENCRE = { sombre: lireOklch('.22 .012 260'), claire: lireOklch('.97 .004 260') };
const CIBLE = 4.6;
const versSrgb = lab => versRgbLin(lab).map(v => { v = borne(v, 0, 1); return v <= .0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - .055; });
const lumSrgb = c => .2126 * lin(c[0]) + .7152 * lin(c[1]) + .0722 * lin(c[2]);
function encrerCiel() {
  const T = MEMO.teintes;
  if (!T) return;
  const hero = $('hero'), C = CADRE, sombreTheme = themeSombre();
  const [haut, milieu, horizon, sol] = T;
  const H = C?.H || hero.clientHeight || 600, yh = C ? C.hy + 535 * C.s : H * .6;
  const [y0, y1] = C?.texte || [0, yh * .45];
  // le dégradé CSS du ciel (interpolé en sRGB, comme le navigateur)
  const arrets = [[0, haut], [yh * .45, milieu], [yh, horizon], [yh + 24, sol], [H, chroma(sol, 1, -.015)]].map(([y, c]) => [y, versSrgb(c)]);
  const ciel = y => {
    if (y <= arrets[0][0]) return arrets[0][1];
    for (let k = 1; k < arrets.length; k++) if (y <= arrets[k][0]) { const [ya, a] = arrets[k - 1], [yb, b] = arrets[k], t = yb > ya ? (y - ya) / (yb - ya) : 1; return a.map((x, n) => x + (b[n] - x) * t); }
    return arrets[arrets.length - 1][1];
  };
  const ech = Array.from({ length: 13 }, (_, k) => ciel(y0 + (y1 - y0) * k / 12));
  const voiles = { clair: versSrgb([.97, haut[1] * .3, haut[2] * .3]), sombre: versSrgb([.24, haut[1] * .7, haut[2] * .7]) };
  const pire = (yEncre, voile, a) => Math.min(...ech.map(c => contraste(yEncre, lumSrgb(a ? c.map((x, n) => x + (voile[n] - x) * a) : c))));
  const alpha = (yEncre, voile) => {
    if (pire(yEncre, voile, 0) >= CIBLE) return 0;
    let lo = 0, hi = .8;
    if (pire(yEncre, voile, hi) < CIBLE) return hi;
    for (let k = 0; k < 14; k++) { const m = (lo + hi) / 2; if (pire(yEncre, voile, m) >= CIBLE) hi = m; else lo = m; }

  const a = Math.min(aS, aC), voile = encre === 'clair' ? voiles.clair : voiles.sombre;

  let fond = '';

}

/* ======================================================= FLUX : le relais de S&A-HOME ===
   Une comète = 6 tirets empilés (46/38/30/22/14/7, opacité .10 → 1) + une lueur floutée, têtes alignées.
   Cycle fixe de 5,6 s : les comètes entrantes arrivent au moyeu à 28,2 %, les sortantes partent à 25,7 %.
   Vitesse croissante avec la puissance : les fenêtres de la référence sont le cas le plus lent (u → 0) ;
   u = √(|kW| / 3) les raccourcit, sans jamais passer sous 0,9 s de trajet. */
const T_CYCLE = 5600, EASE = 'cubic-bezier(.45,0,.55,1)';
const COUCHES = [[46, .10], [38, .16], [30, .26], [22, .40], [14, .62], [7, 1]];
const COULEUR_FLUX = { soleil: null, maison: 'var(--maison)', batterie: 'var(--batterie)', reseau: 'var(--reseau)', voiture: 'var(--borne)' };
let T0 = null, FILE = null, MINUTERIE = 0;
const ANIMS = new Set();
const FLUX = {};
function enregistrer(a) { ANIMS.add(a); a.startTime = T0; return a; }
function annuler(liste) { liste.forEach(a => { a.cancel(); ANIMS.delete(a); }); liste.length = 0; }

const points = d => (d.match(/-?[\d.]+,-?[\d.]+/g) || []).map(q => q.split(',').map(Number));
const cheminDe = pts => 'M' + pts.map(p => p.join(',')).join(' L');
const longueur = pts => pts.slice(1).reduce((a, p, k) => a + Math.hypot(p[0] - pts[k][0], p[1] - pts[k][1]), 0);
/* fenêtre [début, fin] (fraction du cycle) : arrivée au moyeu à 28,2 % (entrantes, 1,58 s → 0,90 s),
   départ à 25,7 % (sortantes, 1,66 s → 0,90 s), puis le câble de la borne de 53,6 à 64,3 % (phase « cab ») ;
   le reste du cycle est le repos de la référence */
function fenetre(phase, u) {
  u = borne(u || 0, 0, 1);
  return phase === 'cab' ? [0.536, 0.643] : phase === 'sor' ? [0.257, 0.554 - 0.137 * u] : [0.122 * u, 0.282];
}
/* images clés du tiret N ; « decal » décale le motif pour un tronçon qui commence plus loin sur le trajet */
function images(N, PL, phase, [a, b], decal = 0) {
  const inv = phase === 'ent inv';
  const o0 = (inv ? -PL - 1 : N + 1) + decal;                    // ±1 : le tiret attend entièrement hors du tracé
  const o1 = (inv ? 47 : N - (PL + 47)) + decal;
  const k = [{ offset: 0, strokeDashoffset: o0 }];
  if (a > 0) k.push({ offset: a, strokeDashoffset: o0 });
  k[k.length - 1].easing = EASE;
  k.push({ offset: b, strokeDashoffset: o1 }, { offset: 1, strokeDashoffset: o1 });
  return k;
}

function preparerFlux() {
  const lire = id => points(svg.querySelector('#' + id)?.getAttribute('d') || '');
  // trajets d'exécution, centrés sur le moyeu (coffret principal)
  const T = {
    soleil:   [lire('gaine-pv-flux')],                                         // toit → moyeu
    maison:   [lire('gaine-lucarne-flux').reverse()],                          // moyeu → chambre sous la lucarne
    batterie: [lire('gaine-coffrets-flux').reverse(), lire('gaine-batterie-flux')],   // moyeu → coffret secondaire → batterie
    reseau:   [lire('gaine-sol-flux')],                                        // moyeu → tranchée
    voiture:  [lire('gaine-borne-flux')]                                       // moyeu → garage (le câble de la borne)
  };
  const defs = svg.querySelector('defs');
  for (const [nom, troncons] of Object.entries(T)) {
    const pieces = troncons.map(pts => ({ pts, d: cheminDe(pts), len: longueur(pts) }));
    const L = pieces.reduce((a, p) => a + p.len, 0);
    const debut = pieces[0].pts[0], finP = pieces[pieces.length - 1].pts.at(-1);
    // plus long tronçon droit : la flèche du mode immobile s'y pose
    let best = { l: 0 };
    pieces.forEach(p => { for (let q = 1; q < p.pts.length; q++) { const l = Math.hypot(p.pts[q][0] - p.pts[q - 1][0], p.pts[q][1] - p.pts[q - 1][1]); if (l > best.l) best = { l, a: p.pts[q - 1], b: p.pts[q] }; } });
    const stops = nom === 'soleil'
      ? '<stop offset="0" stop-color="oklch(0.92 0.13 98)"/><stop offset=".5" stop-color="oklch(0.86 0.16 90)"/><stop offset="1" stop-color="oklch(0.78 0.16 72)"/>'
      : `<stop offset="0" style="stop-color:${COULEUR_FLUX[nom]}"/><stop offset="1" style="stop-color:${COULEUR_FLUX[nom]}"/>`;
    defs.insertAdjacentHTML('beforeend',
      `<linearGradient id="fl-g-${nom}" gradientUnits="userSpaceOnUse">${stops}</linearGradient>` +
      `<linearGradient id="fl-gs-${nom}" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:${COULEUR_FLUX[nom] || 'oklch(0.86 0.16 90)'}" stop-opacity=".15"/><stop offset="1" style="stop-color:${COULEUR_FLUX[nom] || 'oklch(0.78 0.16 72)'}" stop-opacity="1"/></linearGradient>`);
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'fl-flux'); g.dataset.flux = nom; g.style.opacity = '0';

    svg.querySelector('#fl-fixe').appendChild(gf);
    FLUX[nom] = { nom, pieces, L, debut, fin: finP, best, g, gf, grad: defs.querySelector(`#fl-g-${nom}`), gradS: defs.querySelector(`#fl-gs-${nom}`),
      paths: [], anims: [], etat: { actif: false, phase: '', u: 0, kW: 0 }, PL: 0, cle: '' };
  }
  // le moyeu (S&A-HOME h3-hub) : halo flou, disque, petite maison — tailles en pixels, mises à l'échelle par cadrer()
  svg.querySelector('#fl-hub').innerHTML =
    `<g id="hub-echelle"><circle class="hub-halo" r="10" filter="url(#fl-flou-hub)"/><g class="hub-disque"><circle class="hub-rond" r="6.6"/><path class="hub-ic" d="M-3.4,2.6 V-0.8 L0,-3.6 L3.4,-0.8 V2.6 Z"/></g></g>`;
}

/* tailles en pixels d'écran → unités du dessin, à chaque cadrage */
function echelleFlux() {
  if (!CADRE) return;
  const s = CADRE.s, largeurMaison = 1179 * s;
  const coeur = borne(3.75 * Math.sqrt(largeurMaison / 390), 3.0, 4.5);
  svg.querySelector('#fl-flou-dev').setAttribute('stdDeviation', (0.64 * coeur / s).toFixed(2));
  svg.querySelector('#hub-echelle').setAttribute('transform', `translate(${A.HUB[0]} ${A.HUB[1]}) scale(${(1 / s).toFixed(4)})`);
  for (const f of Object.values(FLUX)) {
    const PL = Math.round(100 * Math.max(1, f.L * s / 120) * 10) / 10;
    f.coeur = coeur;
    if (PL !== f.PL) { f.PL = PL; construireFlux(f); f.cle = ''; }
    regleEpaisseurs(f);
  }
  // le cadrage a changé : animations recréées tout de suite (état déjà appliqué, même origine T0)
  if (s !== MEMO.sFlux) { MEMO.sFlux = s; appliquerFlux(true, null, true); }
}
function construireFlux(f) {
  annuler(f.anims);
  f.g.textContent = '';
  f.paths = [];
  let decal = 0;
  const PL = f.PL;
  for (const piece of f.pieces) {
    const plp = PL * piece.len / f.L;
    const couches = [['fl-lueur', 14, null], ...COUCHES.map(([N, o]) => ['fl-trait l' + N, N, o])];
    for (const [cls, N, op] of couches) {
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', piece.d);

  const tient = avecFil => !rangee(solP, droite - gauche) && (ligne || cotes(avecFil).every(([L, g, d]) => !L.length || !rangee(L, d - g)));
  // téléphone : plutôt que de perdre son mot, « Borne 7,2 kW » monte d'un étage, de son côté du filet du chiffre, si
  // l'étage tient sous le texte, si son filet descend droit vers le garage et ne passe sous aucune pastille de la rangée
  const etageBorne = () => {
    const pb = ciel.find(x => x.P.id === 'borne');
    if (mode !== 'portrait' || ligne || skyTop == null || lxUne == null || !pb) return null;
    const top = skyTop - 44, ax = P(pb.P.ancre)[0], w = largeur(pb);
    const [g, d] = ax >= lxUne ? [lxUne + 12, droite] : [gauche, lxUne - 12];
    if (top < CADRE.hb + 16 || w > d - g) return null;
    const cx = borne(ax, g + w / 2, d - w / 2);
    if (ax < cx - w / 2 + 15 || ax > cx + w / 2 - 15) return null;
    etage = pb;
    const L = cotes(true).find(([, g2]) => g2 === g)[0];
    const cxL = resoudre(L.map(x => ({ x: P(x.P.ancre)[0], w: largeur(x) })), g, d);
    if (!tient(true) || L.some((x, k) => Math.abs(ax - cxL[k]) < largeur(x) / 2 + 8)) { etage = null; return null; }
    pb.cx = cx; pb.top = top;
    return pb;
  };
  let avecFil = true;
  if (mode !== 'court') {
    // la borne d'un étage plus haut ou sans son mot, puis tous les libellés courts ; sinon la rangée du ciel ignore le filet ;
    // sinon (texte très agrandi) les pastilles passent sous le héros
    for (const cls of ['borne-courte', 'pills-courtes']) {
      if (tient(true)) break;
      if (cls === 'borne-courte' && etageBorne()) break;
      hero.classList.add(cls);
    }
    if (!tient(true)) { avecFil = false; if (!tient(false)) { dehors = true; pastillesDehors(true); } }
  }

  // --- la maison : viewBox à partir du cadrage
  const C = CADRE;
  C.bilanZone = bilanZone;
  const x0 = -hx / s, y0 = 20 - hy / s;
  svg.setAttribute('viewBox', `${x0.toFixed(2)} ${y0.toFixed(2)} ${(W / s).toFixed(2)} ${(H / s).toFixed(2)}`);
  $('ciel').style.setProperty('--yh', (hy + 535 * s).toFixed(1) + 'px');
  // bords coupés du dessin : fondus quand ils ne touchent pas le bord de l'écran
  const fonduG = hx > .5, fonduD = hx + 1179 * s < W - .5;
  svg.querySelector('#bord-g').setAttribute('display', fonduG ? 'inline' : 'none');
  svg.querySelector('#bord-d').setAttribute('display', fonduD ? 'inline' : 'none');
  if (fonduG || fonduD) svg.querySelector('#habillage').setAttribute('mask', 'url(#mBords)'); else svg.querySelector('#habillage').removeAttribute('mask');

  // --- pastilles : ciel au-dessus du toit, sol sous la maison
  const hr = hero.getBoundingClientRect();
  const boite = el => { const r = el.getBoundingClientRect(); return { l: r.left - hr.left, r: r.right - hr.left, t: r.top - hr.top, b: r.bottom - hr.top }; };
  if (dehors) {
    pills.forEach(x => { x.el.style.left = ''; x.el.style.top = ''; });
  } else if (mode !== 'court') {
    // ligne de la pastille du ciel
    if (ciel.length) {
      if (ligne) {
        let r = W - gx;
        [...ciel].reverse().forEach(x => { const w = largeur(x); x.cx = r - w / 2; r -= w + 8; });
      } else {
        for (const [L, g, d] of cotes(avecFil)) {
          if (!L.length) continue;
          const cx = resoudre(L.map(x => ({ x: P(x.P.ancre)[0], w: largeur(x) })), g, d);
          L.forEach((x, k) => { x.cx = cx[k]; x.top = skyTop; });
        }
      }
    }
    const cxs = resoudre(solP.map(x => ({ x: P(x.P.ancre)[0], w: largeur(x) })), gauche, droite);
    solP.forEach((x, k) => { x.cx = cxs[k]; x.top = groundTop; });
    pills.forEach(x => { x.el.style.left = x.cx.toFixed(1) + 'px'; x.el.style.top = x.top.toFixed(1) + 'px'; });
  } else {
    pills.forEach(x => { x.el.style.left = x.left.toFixed(1) + 'px'; x.el.style.top = x.top.toFixed(1) + 'px'; });
  }

  // --- filets (S&A-HOME .h4-fil) et ancres
  const fils = $('fils');
  fils.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const f1 = v => v.toFixed(1);
  let out = '';
  const point = (id, [x, y], c) => `<circle class="ancre" data-noeud="${id}" cx="${f1(x)}" cy="${f1(y)}" r="2.5" style="--c:${c}"/>`;
  const obstaclesFil = [];
  if (mode === 'court' || dehors) {
    pills.forEach(x => { out += point(x.P.id, P(x.P.ancre), x.P.c); });
  } else {
    pills.forEach(x => {
      const [ax, ay] = P(x.P.ancre), w = largeur(x), l = x.cx - w / 2, r = x.cx + w / 2;
      if (x.P.place === 'ciel') {
        const yb = x.top + 30;
        if (ax >= l + 15 && ax <= r - 15) out += `<path class="fil" d="M${f1(ax)},${f1(yb)}V${f1(ay - 3)}"/>`;
        else {
          const yk = ligne ? Math.max(yb + 8, hy - 10) : yb + 8;
          out += `<path class="fil" d="M${f1(x.cx)},${f1(yb)}V${f1(yk)}H${f1(ax)}V${f1(ay - 3)}"/>`;
        }
      } else {
        if (ax >= l + 15 && ax <= r - 15) out += `<path class="fil" d="M${f1(ax)},${f1(ay + 3)}V${f1(x.top)}"/>`;
        else { const xc = borne(ax, l + 15, r - 15); out += `<path class="fil" d="M${f1(ax)},${f1(ay + 3)}V${f1(x.top - 8)}H${f1(xc)}V${f1(x.top)}"/>`; }
      }
      out += point(x.P.id, [ax, ay], x.P.c);
    });
    // filet du chiffre (sur téléphone, omis si les pastilles du ciel n'ont pas pu se ranger à côté de lui)
    if (ancreUne && (mode !== 'portrait' || avecFil)) {
      const [ax, ay] = P(ancreUne);
      if (mode === 'portrait') {
        const y1 = C.hb + 10;
        // sous la phrase quand elle est là ; sinon sous le chiffre lui-même (le surtitre, plus large, n'est pas au-dessus du filet)
        // droit si l'ancre est sous le texte ; sinon un coude qui part de sous le texte
        let hiDroit, hiCoude;
        if (phraseVue) hiDroit = hiCoude = boite(ph).r + 16;
        else { const rg = document.createRange(); rg.selectNodeContents($('une-v')); hiDroit = rg.getBoundingClientRect().right - hr.left; hiCoude = hiDroit - 8; }
        const lo = gx + 24;
        if (ax >= lo && ax <= Math.max(lo, hiDroit)) out += `<path class="fil" d="M${f1(ax)},${f1(y1)}V${f1(ay - 3)}"/>`;
        else { const xs = borne(ax, lo, Math.max(lo, hiCoude)); out += `<path class="fil" d="M${f1(xs)},${f1(y1)}V${f1(y1 + 10)}H${f1(ax)}V${f1(ay - 3)}"/>`; }
        out += point('une', [ax, ay], MEMO.couleurUne);
      } else {
        const k = boite($('une-k')), ly = (k.t + k.b) / 2, lx = k.r + 16;
        let ok = ax - lx > 60 && ly < ay - 16;
        for (let x = lx; x <= ax && ok; x += 6) if (ly > silhouette(x, C) - 6) ok = false;
        // jamais à travers une pastille du ciel
        ciel.forEach(x => { if (ok && ly > x.top - 4 && ly < x.top + 34 && x.cx - largeur(x) / 2 < ax + 4) ok = false; });
        if (ok) { out += `<path class="fil" d="M${f1(lx)},${f1(ly)}H${f1(ax)}V${f1(ay - 3)}"/>` + point('une', [ax, ay], MEMO.couleurUne); obstaclesFil.push({ l: lx, r: ax, t: ly - 1, b: ly + 1 }); }
      }
    }
  }
  fils.innerHTML = out;

  // --- barre : la forme longue de la capsule, le menu puis le nom de la marque s'effacent tour à tour plutôt que de se chevaucher
  hero.classList.remove('sans-nom', 'sans-nav');
  const cap = $('capsule'), nav = barre.querySelector('.nav-large'), marque = barre.querySelector('.marque');
  cap.classList.remove('court');
  const vu = el => el && el.offsetWidth > 0;
  const gene = () => { const c = boite(cap), g = vu(nav) ? boite(nav).r + 16 : boite(marque).r + 6; return g > c.l || cap.scrollWidth > cap.clientWidth + 1; };
  if (gene()) cap.classList.add('court');
  if (gene() && vu(nav)) hero.classList.add('sans-nav');
  if (gene()) hero.classList.add('sans-nom');
  const texte = [marque, vu(nav) ? nav : null, une, phraseVue ? ph : null].filter(Boolean).map(boite);
  C.texte = [Math.max(0, Math.min(...texte.map(b => b.t))), Math.max(...texte.map(b => b.b))];
  C.obstacles = [marque, vu(nav) ? nav : null, cap, une, phraseVue ? ph : null, ...(dehors ? [] : pills.map(x => x.el))].filter(Boolean).map(boite).concat(obstaclesFil);
  if (bilanZone && mode === 'large') C.obstacles.push(boite(bilan));
  encrerCiel();
  placerCiel();
  echelleFlux();
}

/* Pastilles hors du héros (héros trop bas pour elles) : la liste passe en tête du contenu, en rangée qui se replie */
function pastillesDehors(oui) {
  const ul = $('pastilles');
  if (oui === ul.classList.contains('dehors')) return;
  ul.classList.toggle('dehors', oui);
  if (oui) $('contenu').prepend(ul); else $('direct').insertBefore(ul, $('scene'));
}

/* ------------------------------------------------ Ciel : soleil ou lune, étoiles, nuages (jamais sous le texte) */
function placerCiel() {
  const C = CADRE, d = SCENE;
  if (!C || !d) return;
  const { W, s, hx, hy, gx, mode } = C;
  const astre = $('astre');
  const yh = hy + 535 * s;
  const touche = (x, y, m) => C.obstacles.some(o => x > o.l - m && x < o.r + m && y > o.t - m && y < o.b + m);
  const p = d.progres;
  const lune = d.E < -4;
  const r = lune ? 13 : mode === 'large' ? 28 : 20;
  let ax, ay;
  if (mode === 'portrait') {
    if (lune) { ax = W - gx - 40; ay = C.bB + 40; }
    else { ax = W - gx - 36 - (1 - p) * .18 * W; ay = C.bB + 26 + (1 - Math.sin(Math.PI * p)) * .10 * C.H; }
  } else if (mode === 'court') {
    ax = hx + 80 * s; ay = 24;
  } else {
    // grand écran : le ciel libre à droite de la colonne de texte ; matin à gauche, soir à droite, plus haut vers midi
    const xa = C.edge + C.colW + 16 + r, xb = W - C.edge - r;
    if (lune) { ax = hx + 1179 * s * .78; ay = C.bB + 34; }
    else { ax = xa + p * (xb - xa); ay = C.bB + r + 24 + (1 - Math.sin(Math.PI * p)) * Math.max(0, yh - r - 40 - (C.bB + r + 24)) * .7; }
  }
  // place libre la plus proche : le disque plus une marge (la partie vive du halo) ne touche ni texte, ni pastille, ni filet, ni toit
  const libre = (x, y, m) => {
    if (x - r < 4 || x + r > W - 4 || y - r < (mode === 'large' ? C.bB - 8 : 4) || y + r > yh - 8) return false;   // grand écran : pas dans la rangée du menu
    const R = r + m;
    if (C.obstacles.some(o => x + R > o.l && x - R < o.r && y + R > o.t && y - R < o.b)) return false;
    const Rt = R + (mode === 'large' ? 8 : 0);                      // le profil du toit est approché : un peu plus d'air au-dessus
    for (let a = 0; a <= 180; a += 30) { const t = a * RAD, px = x + Rt * Math.cos(t), py = y + Rt * Math.sin(t); if (py >= silhouette(px, C)) return false; }
    return true;
  };
  const marges = mode === 'large' ? [24, 16, 8] : [12, 8];
  let place = null;
  for (const m of marges) {
    if (libre(ax, ay, m)) { place = [ax, ay]; break; }
    let best = null, d2 = Infinity;
    for (let y = r + 4; y <= yh - r - 8; y += 6) for (let x = r + 4; x <= W - r - 4; x += 8) {
      const q = (x - ax) ** 2 + (y - ay) ** 2;
      if (q < d2 && libre(x, y, m)) { d2 = q; best = [x, y]; }
    }
    if (best) { place = best; break; }
  }
  if (place) [ax, ay] = place;
  astre.style.transform = `translate(${ax.toFixed(1)}px, ${ay.toFixed(1)}px)`;
  astre.style.setProperty('--r', r + 'px');
  // étoiles : 24 points déterministes (suite du nombre d'or), dans les 70 % hauts du ciel, hors du texte
  let et = '';
  if (d.E < -6) {
    const phi = 0.6180339887, phi2 = 0.7548776662;
    let tw = 0;
    for (let k = 1; k <= 24; k++) {
      const x = ((k * phi) % 1) * W, y = ((k * phi2 + .13) % 1) * .7 * yh;
      if (touche(x, y, 10) || y > silhouette(x, C) - 8 || Math.hypot(x - ax, y - ay) < r + 16) continue;
      const rr = .6 + .6 * ((k * 0.38196) % 1), op = .25 + .25 * ((k * 0.7071) % 1);
      const twc = tw < 5 && k % 4 === 1;
      if (twc) tw++;
      et += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(2)}" opacity="${op.toFixed(2)}"${twc ? ` class="tw" style="--d:${(3.5 + (k % 5) * .55).toFixed(2)}s;--r:${(-(k % 7) * .7).toFixed(1)}s"` : ''}/>`;
    }
  }
  $('etoiles').innerHTML = et;
  // nuages : des formes douces dans la bande de ciel au-dessus du toit
  const n = +($('nuages').dataset.n || 0);
  const pos = [[.12, .30, .34], [.62, .18, .30], [.36, .48, .26], [.86, .42, .24], [.02, .58, .22]];
  const cirrus = $('nuages').dataset.meteo === 'voile';
  $('nuages').innerHTML = pos.slice(0, n).map(([fx, fy, fw]) => {
    const w = fw * W * (cirrus ? 1.6 : 1), h = cirrus ? 10 : w * .34;
    return `<i style="left:${(fx * W).toFixed(0)}px;top:${(C.bB + fy * (yh * .55)).toFixed(0)}px;width:${w.toFixed(0)}px;height:${h.toFixed(0)}px"></i>`;
  }).join('');
}

/* ================================================================ SOUS LE HÉROS === */
/* Décompte : une seule fois, au premier affichage ; les mises à jour suivantes sont directes. */
function compter(el, cible, gabarit) {
  el._cible = cible; el._gabarit = gabarit;
  if (!fini(cible) || immobile() || el.dataset.vu) { el.innerHTML = gabarit(cible); return; }
  el.dataset.vu = '1';
  const t0 = performance.now();
  const pas = t => {
    const k = Math.min(1, (t - t0) / 900), ease = 1 - Math.pow(1 - k, 3);
    el.innerHTML = el._gabarit(fini(el._cible) ? el._cible * ease : el._cible);
    if (k < 1) requestAnimationFrame(pas); else el.innerHTML = el._gabarit(el._cible);
  };
  requestAnimationFrame(pas);
}
/* texte agrandi : un libellé ou une valeur ne tient plus dans sa colonne → une rangée par mesure (jamais de mot coupé) */
function ajusterBilan() {
  const cols = document.querySelector('.bilan-cols');
  // valeurs finales pendant la mesure (le décompte reprend à l'image suivante, avant d'être peint)
  cols.querySelectorAll('.bm-v').forEach(el => { if (el._gabarit) el.innerHTML = el._gabarit(el._cible); });
  cols.classList.remove('rangees');
  if ([...cols.querySelectorAll('.bm-l, .bm-v')].some(el => el.scrollWidth > el.clientWidth + .5)) cols.classList.add('rangees');
}
/* Bilan du jour (S&A-HOME) : produits (le filet : sur la prévision Solcast), part autoconsommée (le filet : ce %), économies (piste seule) */
function rendreBilan(d) {
  const B = d.bilan;
  $('bilan-date').textContent = dateCourte(d.date);
  // une mesure dont l'entité n'est pas reliée ('' dans CONFIG) est masquée ; les autres se partagent la largeur
  const relie = { 'bm-prod': ENT.productionJour, 'bm-auto': ENT.productionJour && ENT.eco.autoconsoJour, 'bm-eco': ENT.eco.jour };
  const cols = [...document.querySelectorAll('.bm')];
  cols.forEach(bm => { bm.hidden = !relie[bm.querySelector('.bm-v').id]; bm.classList.remove('premiere'); });
  const vues = cols.filter(bm => !bm.hidden);
  vues[0]?.classList.add('premiere');
  $('bilan').hidden = !vues.length;
  document.querySelector('.bilan-cols').style.gridTemplateColumns = vues.length === 3 ? '' : `repeat(${vues.length}, minmax(0, 1fr))`;
  const filet = (id, v) => { const i = $(id); i.style.visibility = fini(v) ? '' : 'hidden'; i.style.setProperty('--v', fini(v) ? borne(v, 0, 100).toFixed(1) : '0'); };
  compter($('bm-prod'), B.prod, v => fini(v) ? `${kWh(v)}<span class="u">${NBSP}kWh</span>` : '—');
  filet('bm-prod-p', B.prod != null && B.prev > 0 ? 100 * B.prod / B.prev : null);
  compter($('bm-auto'), B.autoPct, v => fini(v) ? `${pct(v)}<span class="u">${NNBSP}%</span>` : '—');
  filet('bm-auto-p', B.autoPct);
  compter($('bm-eco'), B.ecoJour, v => fini(v) ? `${euros(v)}<span class="u">${NBSP}€</span>` : '—');
  filet('bm-eco-p', null);   // pas de référence définie pour les économies du jour : la piste seule, sans remplissage
  ajusterBilan();
}

/* ------------------------------------------------ Production solaire du jour (S&A-HOME, écran Énergie) ---
   Réel : les moyennes horaires des statistiques (heures finies), puis la valeur de maintenant ; prévision Solcast
   (detailedForecast, kW par demi-heure) et sa fourchette 10-90 % ; de 6 h à 21 h, avec le repère de maintenant. */
let COURBE = null, curseur = -1;
const interp = (pts, h) => {
  if (!pts.length || h < pts[0].h || h > pts.at(-1).h) return null;
  for (let k = 1; k < pts.length; k++) if (h <= pts[k].h) { const a = pts[k - 1], b = pts[k], t = b.h > a.h ? (h - a.h) / (b.h - a.h) : 0; return a.kw + (b.kw - a.kw) * t; }
  return pts.at(-1).kw;
};
function donneesCourbe(d) {
  const jour = heureLocale(d.date).jour, minuit = minuitDe(d.t);
  const det = (HA.attr(ENT.previsionJour, 'detailedForecast') || []).map(p => {
    const ts = Date.parse(p.period_start), l = Number.isFinite(ts) ? heureLocale(new Date(ts)) : null;
    return { h: l && l.jour === jour ? l.h : NaN, kw: Number(p.pv_estimate), lo: Number(p.pv_estimate10), hi: Number(p.pv_estimate90) };
  }).filter(p => fini(p.h) && fini(p.kw) && p.h >= 6 && p.h <= 21).sort((a, b) => a.h - b.h);
  const moyH = parCle(HISTO.heures, ENT.solaire, ts => (ts >= minuit && ts < minuit + 86400000 ? Math.floor(heureLocale(new Date(ts)).h + 1e-6) : null), 'mean');
  const hNow = d.h, H = Math.floor(hNow), pv = d.f?.pv ?? null;
  const reel = Object.keys(moyH).map(Number).filter(h => h >= 6 && h < H && h <= 20).sort((a, b) => a - b).map(h => ({ h: h + 0.5, kw: moyH[h] / 1000 }));
  if (pv != null && hNow >= 6 && hNow <= 21) reel.push({ h: hNow, kw: pv / 1000 });
  const prevH = h => { const p = det.filter(x => Math.floor(x.h) === h); return p.length ? p.reduce((a, x) => a + x.kw, 0) / p.length : null; };
  const heures = [];
  for (let h = 6; h <= 21; h++) heures.push({ h, reel: h < H ? (moyH[h] != null ? moyH[h] / 1000 : null) : h === H ? (pv != null ? pv / 1000 : null) : null, prev: prevH(h) });
  const maxKW = Math.max(1, ...det.map(p => (fini(p.hi) ? p.hi : p.kw)), ...reel.map(p => p.kw)) * 1.12;
  return { det, reel, heures, maxKW, hNow, pv };
}
function rendreCourbe(d) {
  const box = $('courbe-svg');
  $('journee').hidden = !ENT.solaire && !ENT.previsionJour;
  const W = Math.max(240, Math.round(box.clientWidth || 320)), H = 140;
  const C = donneesCourbe(d);
  const X = h => (h - 6) / 15 * W, Y = kw => H - Math.max(0, kw) * (H - 12) / C.maxKW, f1 = v => v.toFixed(1);
  const chemin = pts => pts.map((p, k) => `${k ? 'L' : 'M'}${f1(X(p.h))} ${f1(Y(p.kw))}`).join(' ');
  let s = '';
  const r = C.reel, aire = r.length > 1 ? `${chemin(r)} L${f1(X(r.at(-1).h))} ${H} L${f1(X(r[0].h))} ${H} Z` : '';
  // la fourchette 10-90 % n'est peinte qu'hors de l'aire du réel : deux couches lisibles, pas de troisième teinte
  if (C.det.length && aire) s += `<defs><mask id="c-hors-reel" maskUnits="userSpaceOnUse" x="-8" y="-8" width="${W + 16}" height="${H + 16}"><rect x="-8" y="-8" width="${W + 16}" height="${H + 16}" fill="#fff"/><path d="${aire}" fill="#000"/></mask></defs>`;
  if (C.det.length) s += `<path class="c-bande"${aire ? ' mask="url(#c-hors-reel)"' : ''} d="${chemin(C.det.map(p => ({ h: p.h, kw: fini(p.hi) ? p.hi : p.kw })))} ${C.det.slice().reverse().map(p => `L${f1(X(p.h))} ${f1(Y(fini(p.lo) ? p.lo : p.kw))}`).join(' ')} Z"/>`;
  s += `<path class="c-base" d="M0 ${H} H${W}"/>`;
  if (aire) s += `<path class="c-aire" d="${aire}"/>`;
  if (C.det.length) s += `<path class="c-prev" d="${chemin(C.det)}"/>`;
  if (r.length > 1) s += `<path class="c-reel" d="${chemin(r)}"/>`;
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" focusable="false">${s}<g class="c-repere"></g></svg>`;
  $('leg-reel').hidden = !r.length; $('leg-prev').hidden = !C.det.length;
  COURBE = { ...C, W, H, X, Y };
  repere();
}
/* le repère : maintenant au repos ; l'heure choisie au doigt, à la souris ou au clavier (avec sa bulle) */
function repere() {
  const C = COURBE;
  if (!C) return;
  const g = $('courbe-svg').querySelector('.c-repere'), fig = $('courbe'), bulle = $('bulle');
  const H0 = borne(Math.floor(C.hNow), 6, 21), h = curseur < 0 ? H0 : curseur, q = C.heures[h - 6];
  const enCours = h === Math.floor(C.hNow);
  // abscisse : le milieu de l'heure (où sont posées les moyennes), maintenant pour l'heure en cours
  const xh = enCours ? borne(C.hNow, 6, 21) : Math.min(21, h + 0.5), x = C.X(xh);
  const kwP = interp(C.det, xh), kwR = enCours ? (C.reel.length && C.reel.at(-1).h === C.hNow ? C.reel.at(-1).kw : null) : q.reel != null && h < Math.floor(C.hNow) ? interp(C.reel, xh) : null;
  let s = `<line class="c-now" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="0" y2="${C.H}"/>`;
  if (kwP != null) s += `<circle class="c-pin p" cx="${x.toFixed(1)}" cy="${C.Y(kwP).toFixed(1)}" r="4"/>`;
  if (kwR != null) s += `<circle class="c-pin r" cx="${x.toFixed(1)}" cy="${C.Y(kwR).toFixed(1)}" r="4.5"/>`;
  g.innerHTML = s;
  const w = v => (v != null ? pTxt(v * 1000) : null), quand = enCours ? 'Maintenant' : `${h}${NBSP}h`;
  const court = [quand, w(q.reel), q.prev != null ? `prévu ${w(q.prev)}` : null].filter(Boolean).join(' · ');
  // au repos : maintenant (la valeur en direct, la prévision du moment) ; sinon l'heure choisie (moyennes de l'heure)
  const long = curseur < 0
    ? `Maintenant, ${heureTxt(C.hNow)}${NBSP}: ${C.pv != null ? `${pLong(C.pv)} produits` : 'production non mesurée'}${kwP != null ? `, ${pLong(kwP * 1000)} prévus par Solcast` : ''}`
    : `${enCours ? `Maintenant, ${heureTxt(C.hNow)}` : `De ${h} h à ${h + 1} h`}${NBSP}: ${q.reel != null ? `${pLong(q.reel * 1000)} produits` : 'pas de mesure'}${q.prev != null ? `, ${pLong(q.prev * 1000)} prévus par Solcast` : ''}`;
  fig.setAttribute('aria-valuenow', String(h));
  fig.setAttribute('aria-valuetext', long);
  bulle.hidden = curseur < 0;
  if (curseur >= 0) {
    bulle.textContent = court;
    const bw = bulle.offsetWidth;
    bulle.style.left = borne(x - bw / 2, 0, Math.max(0, C.W - bw)).toFixed(1) + 'px';
  }
}
function brancherCourbe() {
  const fig = $('courbe');
  const aller = h => { curseur = h < 0 ? -1 : borne(h, 6, 21); repere(); };
  const sousLeDoigt = ev => { const r = fig.getBoundingClientRect(); return 6 + Math.floor(borne((ev.clientX - r.left) / r.width, 0, .9999) * 16); };
  fig.addEventListener('pointermove', ev => aller(sousLeDoigt(ev)));
  fig.addEventListener('pointerdown', ev => aller(sousLeDoigt(ev)));
  fig.addEventListener('pointerleave', () => aller(-1));
  fig.addEventListener('blur', () => aller(-1));
  fig.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { if (curseur >= 0) { ev.stopPropagation(); aller(-1); } return; }
    const base = curseur < 0 ? borne(Math.floor(COURBE?.hNow ?? 6), 6, 21) : curseur;
    const cible = { ArrowLeft: base - 1, ArrowDown: base - 1, ArrowRight: base + 1, ArrowUp: base + 1, Home: 6, End: 21 }[ev.key];
    if (cible == null) return;
    ev.preventDefault();
    aller(cible);
  });
}

/* ------------------------------------------------ Lignes (liste à la Tesla) : les autres pages de Breezy */
/* remplace un contenu seulement s'il change, et rend le focus clavier au lien de même rang */
const MODELE = document.createElement('template');
function majHTML(el, html) {
  MODELE.innerHTML = html;
  if (el.innerHTML === MODELE.innerHTML) return;
  const act = document.activeElement, rang = act && el.contains(act) ? [...el.querySelectorAll('a')].indexOf(act) : -1;
  el.innerHTML = html;
  if (rang >= 0) el.querySelectorAll('a')[rang]?.focus({ preventScroll: true });
}
function rendreLignes(d) {
  // la valeur d'une ligne : « — » si l'entité ne répond pas, rien si elle n'est pas reliée
  const L = [
    d.aBatterie ? ['batterie', 'Batterie', !ENT.socBatterie ? '' : d.soc != null ? `${pct(d.soc)}${NNBSP}%` : '—'] : null,
    ['graphique', 'Énergie', ''],
    ['feuille', 'Économies', !ENT.eco.mois ? '' : d.bilan.ecoMois != null ? `${euros(d.bilan.ecoMois)}${NBSP}€ ce mois` : '—']
  ].filter(Boolean);
  majHTML($('lignes'), L.map(([ic, t, v]) => `<li><a href="#">${icone(ic)}<span class="l1">${t}</span><span class="lv">${v}</span>${icone('chevron', 'ic chev')}</a></li>`).join(''));
}

/* ================================================================ RENDU === */
function annoncer(d) {
  const fb = d.flux.batterie, cle = d.f?.batNet == null ? 'inconnu' : fb.actif ? (fb.phase === 'sor' ? 'charge' : 'decharge') : 'repos';
  if (cle === 'inconnu') return;                                       // batterie non mesurée : rien n'est annoncé, le dernier état connu est gardé
  const avant = MEMO.annonce;
  MEMO.annonce = cle;
  if (avant == null || avant === cle) return;
  $('annonce').textContent = cle === 'charge' ? 'La batterie commence à se charger.' : cle === 'decharge' ? 'La batterie commence à se décharger.' : 'La batterie est au repos.';
}
function rendre(opts = {}) {
  const d = deriver();
  SCENE = d;
  rendreScene(d);
  rendreHero(d);
  rendreCapsule();
  rendreBilan(d);
  rendreCourbe(d);
  rendreLignes(d);
  annoncer(d);
  cadrer();
  demanderFlux(d.flux, opts.immediat);
}
/* les états arrivent par rafales : un seul rendu par image */
let RENDU = 0;
function planifierRendu() { cancelAnimationFrame(RENDU); RENDU = requestAnimationFrame(() => rendre()); }

/* le thème de Home Assistant (coque) ; hors de la coque, celui de l'appareil */
function appliquerTheme() {
  const r = document.documentElement;
  if (HA.sombre == null) delete r.dataset.theme; else r.dataset.theme = HA.sombre ? 'dark' : 'light';
}
/* valeurs d'exemple : les états et l'historique d'un aperçu, au format de Home Assistant */
function chargerExemple(nom) {
  const x = etatsExemple(nom);
  HA.etats = x.etats; HA.t = x.t;
  HISTO.heures = x.histo;
}

/* Interrupteur « Animations des flux » (WCAG 2.2.2) : coupe comètes, moyeu, LED et nuages ; mémorisé dans ce navigateur seulement.
   Mouvement réduit demandé par l'appareil : tout est déjà immobile, l'interrupteur n'a plus d'utilité et le pied est masqué. */
function majInterrupteur() {
  $('btn-anim').setAttribute('aria-checked', String(!immobile()));
  $('pied').hidden = reduitMQ.matches;
  document.documentElement.classList.toggle('calme', immobile());
}
function basculerAnimations() {
  if (reduitMQ.matches) return;
  PAUSE = !PAUSE;
  try { localStorage.setItem('breezy-animations', PAUSE ? '0' : '1'); } catch (_) { /* stockage indisponible */ }
  majInterrupteur();
  rendre({ immediat: true });
  appliquerFlux(true);
}

/* ================================================================ DÉMARRAGE === */
function demarrer() {
  try { PAUSE = localStorage.getItem('breezy-animations') === '0'; } catch (_) { PAUSE = false; }
  majInterrupteur();
  preparerSvg();
  brancherCourbe();
  $('btn-anim').addEventListener('click', basculerAnimations);
  const histoPerime = () => Date.now() - HISTO.quand > 15 * 60000 || HISTO.quand < minuitDe(Date.now());
  if (HA.enCoque) {
    // dans la coque de S&A-HOME : les états de Home Assistant, puis la production heure par heure (toutes les 15 min)
    HA.ecouter(premier => {
      appliquerTheme();
      if (histoPerime()) chargerHisto();
      if (premier) rendre({ immediat: true }); else planifierRendu();
    });
    setTimeout(() => { if (!HA.connecte) { SANS_REPONSE = true; rendreCapsule(); cadrer(); } }, 6000);
    // l'heure avance même sans nouvel état : repère de la courbe, « pleine vers », « jusqu'à »
    setInterval(() => { if (!HA.connecte) return; if (histoPerime()) chargerHisto(); planifierRendu(); }, 60000);
  } else chargerExemple(new URLSearchParams(location.search).get('apercu'));
  rendre({ immediat: true });
  requestAnimationFrame(() => cadrer());
  document.fonts?.ready?.then(() => cadrer());
  let rz = 0;
  const obs = new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(cadrer); });
  [$('hero'), $('barre'), $('une'), $('bilan')].forEach(el => obs.observe(el));
  let largeurCourbe = $('courbe-svg').clientWidth;
  new ResizeObserver(() => { const w = $('courbe-svg').clientWidth; if (SCENE && Math.abs(w - largeurCourbe) > 2) { largeurCourbe = w; rendreCourbe(SCENE); } }).observe($('courbe-svg'));
  // pause hors écran et onglet caché
  new IntersectionObserver(es => { ECRAN = es[0].isIntersecting; synchroPause(); }, { threshold: 0 }).observe($('hero'));
  document.addEventListener('visibilitychange', () => { VISIBLE = !document.hidden; synchroPause(); });
  reduitMQ.addEventListener?.('change', () => { majInterrupteur(); rendre({ immediat: true }); appliquerFlux(true); });
  sombreMQ.addEventListener?.('change', () => rendre());
}

/* Outil de développement, hors de Home Assistant : Breezy.apercu('nuit') */
window.Breezy = {
  apercu(nom) { if (HA.enCoque) return; MEMO = { jour: null, annonce: null }; chargerExemple(nom); rendre({ immediat: true }); }
};
demarrer();
</script>
