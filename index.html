/* ======================================================= FLUX : le relais de S&A-HOME ===
   Une comète = 6 tirets empilés (46/38/30/22/14/7, opacité .10 → 1) + une lueur floutée, têtes alignées.
   Cycle fixe de 5,6 s : les comètes entrantes arrivent au moyeu à 28,2 %, les sortantes partent à 25,7 %.
   Vitesse : la même pour une même puissance, quel que soit le conduit, et croissante avec elle
   (v = V0·(0,5 + kW/kWmax), en unités du dessin par seconde) ; la fenêtre de trajet = longueur ÷ vitesse. */
const T_CYCLE = 5600, EASE = 'cubic-bezier(.45,0,.55,1)';
const COUCHES = [[46, .10], [38, .16], [30, .26], [22, .40], [14, .62], [7, 1]];
const COULEUR_FLUX = { soleil: null, maison: 'var(--maison)', batterie: 'var(--batterie)', reseau: 'var(--reseau)' };
let T0 = null, FILE = null, MINUTERIE = 0;
const ANIMS = new Set();
const FLUX = {};
function enregistrer(a) { ANIMS.add(a); a.startTime = T0; return a; }
function annuler(liste) { liste.forEach(a => { a.cancel(); ANIMS.delete(a); }); liste.length = 0; }

const points = d => (d.match(/-?[\d.]+,-?[\d.]+/g) || []).map(q => q.split(',').map(Number));
const cheminDe = pts => 'M' + pts.map(p => p.join(',')).join(' L');
const longueur = pts => pts.slice(1).reduce((a, p, k) => a + Math.hypot(p[0] - pts[k][0], p[1] - pts[k][1]), 0);
const V0 = 800;                                                   // unités du dessin par seconde à kWmax/2 (≈ 265 px/s sur une maison de 390 px)
function vitesse(kW, kWmax) { return V0 * borne(0.5 + kW / Math.max(kWmax, 1), 0.5, 1.5); }
/* fenêtre [début, fin] (fraction du cycle) : arrivée au moyeu à 28,2 % (entrantes), départ à 25,7 % (sortantes) */
function fenetre(phase, kW, kWmax, distance) {
  const duree = borne(distance / vitesse(kW, kWmax) * 1000 / T_CYCLE, 0.045, 0.28);
  return phase === 'sor' ? [0.257, 0.257 + duree] : [0.282 - duree, 0.282];
}
/* images clés du tiret N ; « decal » décale le motif pour un tronçon qui commence plus loin sur le trajet */
function images(N, PL, phase, [a, b], decal = 0) {
  const inv = phase === 'ent inv';
  const o0 = (inv ? -PL - 1 : N + 1) + decal;                    // ±1 : le tiret attend entièrement hors du tracé
  const o1 = (inv ? 47 : N - (PL + 47)) + decal;
  const k = [{ offset: 0, strokeDashoffset: o0 }];
  if (a > 0) k.push({ offset: a, strokeDashoffset: o0 });
  k[k.length - 1].easing = EASE;
  k.push({ offset: b, strokeDashoffset: o1 }, { offset: 1, strokeDashoffset: o1 });
  return k;
}

function preparerFlux() {
  const lire = id => points(svg.querySelector('#' + id)?.getAttribute('d') || '');
  // trajets d'exécution, centrés sur le moyeu (coffret principal)
  const T = {
    soleil:   [lire('gaine-pv-flux')],                                         // toit → moyeu
    maison:   [lire('gaine-lucarne-flux').reverse()],                          // moyeu → chambre sous la lucarne
    batterie: [lire('gaine-coffrets-flux').reverse(), lire('gaine-batterie-flux')],   // moyeu → coffret secondaire → batterie
    reseau:   [lire('gaine-sol-flux')]                                         // moyeu → tranchée
  };
  const defs = svg.querySelector('defs');
  for (const [nom, troncons] of Object.entries(T)) {
    const pieces = troncons.map(pts => ({ pts, d: cheminDe(pts), len: longueur(pts) }));
    const L = pieces.reduce((a, p) => a + p.len, 0);
    const debut = pieces[0].pts[0], finP = pieces[pieces.length - 1].pts.at(-1);
    // plus long tronçon droit : la flèche du mode immobile s'y pose
    let best = { l: 0 };
    pieces.forEach(p => { for (let q = 1; q < p.pts.length; q++) { const l = Math.hypot(p.pts[q][0] - p.pts[q - 1][0], p.pts[q][1] - p.pts[q - 1][1]); if (l > best.l) best = { l, a: p.pts[q - 1], b: p.pts[q] }; } });
    const stops = nom === 'soleil'
      ? '<stop offset="0" stop-color="oklch(0.92 0.13 98)"/><stop offset=".5" stop-color="oklch(0.86 0.16 90)"/><stop offset="1" stop-color="oklch(0.78 0.16 72)"/>'
      : `<stop offset="0" style="stop-color:${COULEUR_FLUX[nom]}"/><stop offset="1" style="stop-color:${COULEUR_FLUX[nom]}"/>`;
    defs.insertAdjacentHTML('beforeend',
      `<linearGradient id="fl-g-${nom}" gradientUnits="userSpaceOnUse">${stops}</linearGradient>` +
      `<linearGradient id="fl-gs-${nom}" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:${COULEUR_FLUX[nom] || 'oklch(0.86 0.16 90)'}" stop-opacity=".15"/><stop offset="1" style="stop-color:${COULEUR_FLUX[nom] || 'oklch(0.78 0.16 72)'}" stop-opacity="1"/></linearGradient>`);
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'fl-flux'); g.dataset.flux = nom; g.style.opacity = '0';
    svg.querySelector('#flux').appendChild(g);
    const gf = document.createElementNS(SVGNS, 'g');
    gf.setAttribute('class', 'fl-fixe'); gf.dataset.flux = nom; gf.style.display = 'none';
    svg.querySelector('#fl-fixe').appendChild(gf);
    FLUX[nom] = { nom, pieces, L, debut, fin: finP, best, g, gf, grad: defs.querySelector(`#fl-g-${nom}`), gradS: defs.querySelector(`#fl-gs-${nom}`),
      paths: [], anims: [], etat: { actif: false, phase: '', u: 0, kW: 0 }, PL: 0, cle: '' };
  }
  // le moyeu (S&A-HOME h3-hub) : halo flou, disque, petite maison — tailles en pixels, mises à l'échelle par cadrer()
  svg.querySelector('#fl-hub').innerHTML =
    `<g id="hub-echelle"><circle class="hub-halo" r="10" filter="url(#fl-flou-hub)"/><g class="hub-disque"><circle class="hub-rond" r="6.6"/><path class="hub-ic" d="M-3.4,2.6 V-0.8 L0,-3.6 L3.4,-0.8 V2.6 Z"/></g></g>`;
}

/* tailles en pixels d'écran → unités du dessin, à chaque cadrage */
function echelleFlux() {
  if (!CADRE) return;
  const s = CADRE.s, largeurMaison = 1179 * s;
  const coeur = borne(3.75 * Math.sqrt(largeurMaison / 390), 3.0, 4.5);
  svg.querySelector('#fl-flou-dev').setAttribute('stdDeviation', (0.64 * coeur / s).toFixed(2));
  svg.querySelector('#hub-echelle').setAttribute('transform', `translate(${A.HUB[0]} ${A.HUB[1]}) scale(${(1 / s).toFixed(4)})`);
  for (const f of Object.values(FLUX)) {
    const PL = Math.round(100 * Math.max(1, f.L * s / 120) * 10) / 10;
    f.coeur = coeur;
    if (PL !== f.PL) { f.PL = PL; construireFlux(f); f.cle = ''; }
    regleEpaisseurs(f);
  }
  // le cadrage a changé : animations recréées tout de suite (état déjà appliqué, même origine T0)
  if (s !== MEMO.sFlux) { MEMO.sFlux = s; appliquerFlux(true, null, true); }
}
function construireFlux(f) {
  annuler(f.anims);
  f.g.textContent = '';
  f.paths = [];
  let decal = 0;
  const PL = f.PL;
  for (const piece of f.pieces) {
    const plp = PL * piece.len / f.L;
    const couches = [['fl-lueur', 14, null], ...COUCHES.map(([N, o]) => ['fl-trait l' + N, N, o])];
    for (const [cls, N, op] of couches) {
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', piece.d);
      p.setAttribute('pathLength', plp.toFixed(3));
      p.setAttribute('class', cls);
      p.setAttribute('stroke', `url(#fl-g-${f.nom})`);
      p.setAttribute('stroke-dasharray', `${N} ${PL + 300}`);
      p.setAttribute('stroke-dashoffset', String(N + 1 + decal));
      if (op != null) p.style.opacity = op;
      p._N = N; p._decal = decal; p._lueur = op == null;
      f.g.appendChild(p);
      f.paths.push(p);
    }
    decal += plp;
  }
  // tracé fixe + flèche (mouvement réduit)
  f.gf.innerHTML = f.pieces.map(pc => `<path d="${pc.d}" stroke="url(#fl-gs-${f.nom})"/>`).join('') + '<path class="fl-fleche"/>';
}
function regleEpaisseurs(f) {
  const s = CADRE.s, u = f.etat.u ?? 0;
  const w = f.coeur * (0.85 + 0.30 * u) / s;
  for (const p of f.paths) {
    p.setAttribute('stroke-width', (p._lueur ? w * 1.6 : w).toFixed(2));
    if (p._lueur) p.style.opacity = (.16 + .12 * u).toFixed(3);
  }
  f.gf.querySelectorAll('path:not(.fl-fleche)').forEach(p => p.setAttribute('stroke-width', (f.coeur / s).toFixed(2)));
}
/* sens du dégradé : de l'origine de l'énergie vers sa destination */
function orienter(f) {
  const versHub = f.etat.phase === 'ent' ? false : f.etat.phase === 'ent inv';
  // trajets dessinés moyeu → extrémité, sauf le soleil (dessiné source → moyeu)
  let [o, dst] = [f.debut, f.fin];
  if (versHub) [o, dst] = [f.fin, f.debut];
  for (const gr of [f.grad, f.gradS]) {
    gr.setAttribute('x1', o[0]); gr.setAttribute('y1', o[1]);
    gr.setAttribute('x2', dst[0]); gr.setAttribute('y2', dst[1] + 0.01);
  }
  // flèche du mode immobile : 62 % le long du plus long tronçon droit, dans le sens de l'énergie
  const { a, b } = f.best, s = CADRE?.s || 1;
  let [p0, p1] = versHub ? [b, a] : [a, b];
  const x = p0[0] + (p1[0] - p0[0]) * .62, y = p0[1] + (p1[1] - p0[1]) * .62;
  const ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
  const fl = f.gf.querySelector('.fl-fleche');
  fl.setAttribute('d', 'M4,0 L-4,-3.5 L-2.4,0 L-4,3.5 Z');
  fl.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${(1 / s).toFixed(4)})`);
  fl.style.fill = COULEUR_FLUX[f.nom] || 'var(--soleil)';
}

/* Applique l'état demandé (FILE) : tout de suite (premier rendu, cadrage, flux caché) ou au prochain début de cycle */
function demanderFlux(fluxEtat, toutDeSuite) {
  FILE = fluxEtat;
  clearTimeout(MINUTERIE);
  if (toutDeSuite || T0 == null) { appliquerFlux(false); return; }
  // les flux cachés (et ceux qui s'éteignent par donnée périmée) changent tout de suite ; les autres attendent la fin du cycle
  const immediat = Object.entries(fluxEtat).filter(([n, e]) => !FLUX[n].etat.actif);
  if (immediat.length) appliquerFlux(false, immediat.map(([n]) => n));
  const now = document.timeline.currentTime ?? performance.now();
  const attente = T_CYCLE - (((now - T0) % T_CYCLE) + T_CYCLE) % T_CYCLE;
  MINUTERIE = setTimeout(() => appliquerFlux(false), attente);
}
function appliquerFlux(recreer, seulement = null, garder = false) {
  if (T0 == null) T0 = document.timeline.currentTime ?? performance.now();
  const calme = immobile();
  for (const f of Object.values(FLUX)) {
    if (seulement && !seulement.includes(f.nom)) continue;
    const voulu = garder ? f.etat : (FILE?.[f.nom] || f.etat);
    const kWmax = SCENE?.kWmax ?? 6;
    const cle = `${voulu.actif}|${voulu.phase}|${(voulu.kW ?? 0).toFixed(2)}|${kWmax}|${calme}|${f.PL}`;
    f.etat = { ...voulu };
    // attributs de test, sur le chemin d'origine
    const src = svg.querySelector('#' + { soleil: 'gaine-pv-flux', maison: 'gaine-lucarne-flux', batterie: 'gaine-batterie-flux', reseau: 'gaine-sol-flux' }[f.nom]);
    if (src) { src.dataset.flux = f.nom; src.dataset.phase = voulu.actif ? voulu.phase : 'off'; src.dataset.kw = (voulu.kW ?? 0).toFixed(2); }
    if (f.nom === 'batterie') { const c2 = svg.querySelector('#gaine-coffrets-flux'); if (c2) Object.assign(c2.dataset, src.dataset); }
    if (!CADRE) continue;
    f.g.style.opacity = voulu.actif && !calme ? '1' : '0';
    f.gf.style.display = voulu.actif && calme ? '' : 'none';
    if (cle === f.cle && !recreer) continue;
    f.cle = cle;
    regleEpaisseurs(f);
    orienter(f);
    annuler(f.anims);
    if (!voulu.actif || calme) continue;
    // distance parcourue par la tête : le trajet entier plus la longueur d'un tiret (47 unités de pathLength)
    const win = fenetre(voulu.phase, voulu.kW ?? 0, kWmax, f.L * (f.PL + 48) / f.PL);
    f.win = win;
    for (const p of f.paths) {
      const a = p.animate(images(p._N, f.PL, voulu.phase, win, p._decal), { duration: T_CYCLE, iterations: Infinity });
      f.anims.push(enregistrer(a));
    }
  }
  animerMoyeu();
  animerLed();
  dessinerCoupure();
}
/* Coupure : le câble du réseau reste immobile, en pointillés rouges, jusqu'à l'ancre de la pastille, barrée d'une croix
   (la croix remplace le point de l'ancre : filet, ancre et croix coïncident) */
function dessinerCoupure() {
  const g = svg.querySelector('#fl-coupe'), f = FLUX.reseau;
  if (!SCENE?.coupure || !CADRE || !f) { g.innerHTML = ''; return; }
  const s = CADRE.s, w = f.coeur * .7 / s, [x, y] = A.RESEAU, k = 1 / s;
  // le tracé s'arrête à l'ancre (sur le dernier tronçon de la tranchée)
  const pts = f.pieces[0].pts, n = pts.length - 1;
  const d = cheminDe([...pts.slice(0, n), [x, y]]);
  g.innerHTML = `<path d="${d}" fill="none" stroke="var(--alerte)" stroke-width="${w.toFixed(2)}" stroke-linecap="round" stroke-dasharray="${(2 * k).toFixed(2)} ${(3 * k).toFixed(2)}"/>` +
    `<g transform="translate(${x} ${y}) scale(${k.toFixed(4)})" stroke-linecap="round"><path d="M-3,-3L3,3M3,-3L-3,3" stroke="var(--surface-scene)" stroke-width="4"/><path d="M-3,-3L3,3M3,-3L-3,3" stroke="var(--alerte)" stroke-width="1.8"/></g>`;
}

/* Moyeu : il « reçoit » quand les comètes entrantes arrivent (28,2 %) */
let HUB_ANIMS = [];
function animerMoyeu() {
  const halo = svg.querySelector('.hub-halo'), disque = svg.querySelector('.hub-disque');
  const hub = svg.querySelector('#fl-hub');
  const perime = SCENE?.horsligne;
  hub.classList.toggle('eteint', !!perime);
  const cle = `${immobile()}|${perime}|${T0}`;
  if (cle === MEMO.cleHub) return;
  MEMO.cleHub = cle;
  annuler(HUB_ANIMS);
  if (immobile() || perime) return;
  const o = [{ offset: 0, opacity: .55 }, { offset: .22, opacity: .55 }, { offset: .282, opacity: .9 }, { offset: .40, opacity: .55 }, { offset: 1, opacity: .55 }];
  const sc = [{ offset: 0, transform: 'scale(1)' }, { offset: .22, transform: 'scale(1)' }, { offset: .282, transform: 'scale(1.08)' }, { offset: .40, transform: 'scale(1)' }, { offset: 1, transform: 'scale(1)' }];
  HUB_ANIMS.push(enregistrer(halo.animate(o, { duration: T_CYCLE, iterations: Infinity, easing: 'ease-in-out' })));
  HUB_ANIMS.push(enregistrer(disque.animate(sc, { duration: T_CYCLE, iterations: Infinity, easing: 'ease-in-out' })));
}
/* LED : une bande de lumière monte juste après l'arrivée de la comète (charge), descend quand elle part (décharge) */
let LED_ANIMS = [];
function animerLed() {
  const onde = svg.querySelector('#led-onde');
  const fb = FLUX.batterie?.etat || {};
  const soc = (SCENE?.soc ?? 0) / 100, haut = 718 - 101 * soc;
  const mode = immobile() || !fb.actif || !SCENE?.aBatterie ? 'fixe' : fb.phase === 'sor' ? 'charge' : 'decharge';
  const cle = `${mode}|${haut.toFixed(1)}|${T0}|${FLUX.batterie?.win}`;
  if (cle === MEMO.cleLed) return;
  MEMO.cleLed = cle;
  annuler(LED_ANIMS);
  onde.setAttribute('opacity', mode === 'fixe' ? '0' : '1');
  if (mode === 'fixe') return;
  const bas = 'translateY(26px)', sommet = `translateY(${(haut - 700 - 26).toFixed(1)}px)`;
  // charge : l'onde monte juste après l'arrivée de la comète ; décharge : elle descend juste avant son départ
  const [wa, wb] = FLUX.batterie?.win || [0.122, 0.282];
  const t0 = Math.max(0, wa - 0.16);
  const k = mode === 'charge'
    ? [{ offset: 0, transform: bas, opacity: 0 }, { offset: wb, transform: bas, opacity: 0 }, { offset: wb + .026, transform: bas, opacity: 1, easing: 'ease-in-out' }, { offset: wb + .166, transform: sommet, opacity: 1 }, { offset: wb + .196, transform: sommet, opacity: 0 }, { offset: 1, transform: sommet, opacity: 0 }]
    : [{ offset: 0, transform: sommet, opacity: t0 > 0 ? 0 : 1 }, { offset: t0, transform: sommet, opacity: 1, easing: 'ease-in-out' }, { offset: wa, transform: bas, opacity: 1 }, { offset: wa + .03, transform: bas, opacity: 0 }, { offset: 1, transform: bas, opacity: 0 }];
  LED_ANIMS.push(enregistrer(onde.animate(k, { duration: T_CYCLE, iterations: Infinity })));
}

/* Hors écran, ou onglet caché : tout se met en pause ; au retour, même origine T0 (les flux restent en phase) */
let VISIBLE = true, ECRAN = true;
function synchroPause() {
  const actif = VISIBLE && ECRAN;
  for (const a of ANIMS) {
    if (!actif) { if (a.playState === 'running') a.pause(); }
    else if (a.playState === 'paused') a.startTime = T0;
  }
}

/* ================================================================ CADRAGE ===
   La maison entière (x 0 → 1179, y 20 → 760) tient toujours dans le héros et rien d'opaque ne la couvre :
   - portrait : pleine largeur (échelle s = W/1179) ; échelle de compaction L0 → L4 ;
   - court (téléphone à l'horizontale) : à droite, toute la hauteur ; texte et pastilles dans la colonne de gauche ;
   - large (tablette à l'horizontale, ordinateur) : à droite, alignée sur la grille du contenu. */
const NIVEAUX = [
  { gBK: 14, taille: W => borne(.16 * W, 52, 72), phrase: 16, lh: 22, sg: 6, gSky: 12, gSH: 14, gG: 12, pad: 12, ov: true },
  { gBK: 10, taille: W => borne(.14 * W, 46, 56), phrase: 15, lh: 20, sg: 4, gSky: 10, gSH: 12, gG: 10, pad: 10 },
  { gBK: 8, taille: W => borne(.14 * W, 46, 56), phrase: 0, gSky: 8, gSH: 10, gG: 8, pad: 8 },
  { gBK: 8, taille: W => borne(.14 * W, 44, 52), phrase: 0, gG: 8, pad: 8, ligne: true }
];
/* profil haut de la maison (y du premier pixel opaque, par x) : les filets et le soleil restent au-dessus */
const PROFIL = [[0, 540], [50, 540], [54, 212], [155, 104], [905, 20], [1036, 200], [1040, 300], [1179, 352]];
function toitY(xd) {
  if (xd <= PROFIL[0][0]) return PROFIL[0][1];
  for (let k = 1; k < PROFIL.length; k++) { const [x1, y1] = PROFIL[k], [x0, y0] = PROFIL[k - 1]; if (xd <= x1) return y0 + (y1 - y0) * (xd - x0) / (x1 - x0); }
  return PROFIL[PROFIL.length - 1][1];
}
const silhouette = (x, C) => { const xd = (x - C.hx) / C.s; return xd < -2 || xd > 1181 ? Infinity : C.hy + (toitY(xd) - 20) * C.s; };

/* chevauchements : centres souhaités → centres résolus (écart ≥ gap, bornés à [g, d]) */
function resoudre(items, g, d, gap = 8) {
  const ordre = items.map((it, k) => ({ ...it, k })).sort((a, b) => a.x - b.x);
  const Lg = ordre.map(it => it.x - it.w / 2);
  for (let k = 0; k < ordre.length; k++) Lg[k] = Math.max(Lg[k], k ? Lg[k - 1] + ordre[k - 1].w + gap : g);
  const n = ordre.length - 1;
  if (n >= 0) Lg[n] = Math.min(Lg[n], d - ordre[n].w);
  for (let k = n - 1; k >= 0; k--) Lg[k] = Math.min(Lg[k], Lg[k + 1] - gap - ordre[k].w);
  if (n >= 0) Lg[0] = Math.max(Lg[0], g);
  const out = [];
  ordre.forEach((it, k) => { out[it.k] = Lg[k] + it.w / 2; });
  return out;
}

function cadrer() {
  const hero = $('hero');
  const W = hero.clientWidth, H = hero.clientHeight;
  if (!W || !H || !SCENE) return;
  const html = document.documentElement;
  const mode = W / H < 1.15 ? 'portrait' : H < 430 ? 'court' : 'large';
  hero.dataset.mode = mode; html.dataset.mode = mode;
  const gx = parseFloat(getComputedStyle(html).getPropertyValue('--gx')) || 20;
  const edge = Math.max(32, (W - 1320) / 2 + 32);
  hero.style.setProperty('--edge', edge + 'px'); html.style.setProperty('--edge', edge + 'px');
  const barre = $('barre'), une = $('une'), ph = $('une-phrase'), bilan = $('bilan');
  const pills = PASTILLES.map(P => ({ P, el: $('pastilles').querySelector(`[data-noeud="${P.id}"]`) }));
  const ciel = pills.filter(x => x.P.place === 'ciel'), solP = pills.filter(x => x.P.place === 'sol');
  let s, hx, hy, ov = 0, phraseVue = false, skyTop = null, groundTop, ligne = false, colW = W, bilanZone = null, gauche = gx, droite = W - gx, dehors = false;
  pastillesDehors(false);
  hero.classList.remove('pills-courtes');
  barre.style.width = '';
  ajusterBilan();
  const choisirPhrase = (maxLignes, lh, largeurMax) => {
    for (const cle of ['longue', 'courte']) {
      ph.hidden = false; ph.dataset.choix = cle; ph.textContent = PHRASE[cle];
      if (ph.offsetHeight <= maxLignes * lh + 1 && (!largeurMax || ph.scrollWidth <= largeurMax)) return true;
    }
    ph.hidden = true; ph.dataset.choix = 'longue'; ph.textContent = PHRASE.longue;
    return false;
  };
  const bas = () => barre.offsetTop + barre.offsetHeight;
  const largeur = x => x.el.offsetWidth || 90;
  // une rangée de pastilles trop large pour sa place : libellés courts (« au repos », « 800 W »…)
  const rangee = (L, place) => L.reduce((a, x) => a + largeur(x), 0) + 8 * Math.max(0, L.length - 1) > place;

  if (mode === 'portrait') {
    s = W / 1179; hx = 0;
    const hh = 740 * s;
    let choisi = null;
    for (let L = 0; L < NIVEAUX.length && !choisi; L++) {
      const v = NIVEAUX[L];
      hero.dataset.niveau = L;
      const N = v.taille(W);
      une.style.setProperty('--une-t', N.toFixed(1) + 'px');
      let pv = false, pH = 0;
      if (v.phrase) { pv = choisirPhrase(2, v.lh); if (!pv) continue; pH = ph.offsetHeight; }
      else ph.hidden = true;
      const bB = bas(), uH = une.offsetHeight;                 // hauteur mesurée : suit le texte agrandi ou espacé
      const hb = bB + v.gBK + uH + (pv ? v.sg + pH : 0);
      let y = H - v.pad - 30 - v.gG - hh;
      if (v.ligne) {
        // L3 : la pastille du ciel monte dans la rangée du chiffre, si elle y tient
        const numR = gx + une.offsetWidth;
        const total = ciel.reduce((a, x) => a + largeur(x) + 8, 0);
        if (y - (hb + 16) >= 0 && W - gx - total >= numR + 16) choisi = { L, N, bB, uH, hb, y, pv, ligne: true };
        continue;
      }
      let st = y - v.gSH - 30;
      const slack = st - (hb + v.gSky);
      if (slack < 0) continue;
      let o = 0;
      if (v.ov) { o = borne(slack - 24, 0, 40); y -= o; st -= o; }
      choisi = { L, N, bB, uH, hb, y, st, pv, ov: o };
    }
    if (!choisi) {
      // L4 : la maison rétrécit (centrée) jusqu'à ce que le niveau 2 tienne
      const v = NIVEAUX[2];
      hero.dataset.niveau = 4;
      const N = v.taille(W);
      une.style.setProperty('--une-t', N.toFixed(1) + 'px');
      ph.hidden = true;
      const bB = bas(), uH = une.offsetHeight, hb = bB + v.gBK + uH;
      const place = H - v.pad - 30 - v.gG - (hb + v.gSky + 30 + v.gSH);
      s = Math.max(.08, Math.min(W / 1179, place / 740));
      hx = (W - 1179 * s) / 2;
      const y = H - v.pad - 30 - v.gG - 740 * s;
      choisi = { L: 4, N, bB, uH, hb, y, st: y - v.gSH - 30, pv: false, ov: 0 };
    }
    hy = choisi.y; ov = choisi.ov || 0; phraseVue = choisi.pv; ligne = !!choisi.ligne;
    const v = NIVEAUX[Math.min(choisi.L, 3)];
    une.style.top = (choisi.bB + v.gBK) + 'px';
    if (phraseVue) ph.style.top = (choisi.bB + v.gBK + choisi.uH + v.sg) + 'px';
    skyTop = ligne ? null : choisi.st;
    groundTop = hy + 740 * s + v.gG;
    if (ligne) {
      const yc = choisi.bB + v.gBK + (choisi.uH - choisi.N) + choisi.N / 2 - 15;
      ciel.forEach(x => { x.top = yc; });
    }
    if (ov > 0) bilanZone = [H - ov, H];
    CADRE = { mode, W, H, s, hx, hy, gx, bB: choisi.bB, hb: choisi.hb };
  } else if (mode === 'court') {
    // téléphone à l'horizontale : la maison à droite ; texte et pastilles en colonne à gauche.
    // Si les pastilles ne tiennent pas : sans la phrase, puis libellés courts, puis une maison plus petite.
    hero.dataset.niveau = 0;
    const safeR = parseFloat(getComputedStyle($('ciel')).paddingRight) || 0;   // env(safe-area-inset-right)
    une.style.setProperty('--une-t', (H < 260 ? 34 : 44) + 'px');
    const essai = (frac, courtes, avecPhrase, sansPills) => {
      s = Math.min(frac * W / 1179, (H - 12) / 740);
      hx = W - 1179 * s - Math.max(8, safeR); hy = H - 6 - 740 * s;
      colW = hx - 16;
      hero.style.setProperty('--colw', colW + 'px');
      // la barre s'étend vers la droite tant que le toit reste sous elle (la capsule et la cloche ne couvrent jamais la maison)
      const yB = barre.offsetTop + barre.offsetHeight + 8;
      let xr = W - gx;
      for (let x = gx; x <= W - gx; x += 4) if (silhouette(x, { s, hx, hy }) < yB) { xr = x - 8; break; }
      barre.style.width = Math.max(colW - gx, xr - gx) + 'px';
      const uneB = bas() + 8 + une.offsetHeight;
      une.style.top = (bas() + 8) + 'px';
      hero.classList.toggle('pills-courtes', courtes);
      phraseVue = avecPhrase && choisirPhrase(1, 20, colW - gx);
      if (!avecPhrase) ph.hidden = true;
      let y = uneB + 12;
      if (phraseVue) { ph.style.top = (uneB + 6) + 'px'; y = uneB + 6 + ph.offsetHeight + 12; }
      if (sansPills) return true;
      // pastilles en rangées de 44 px (30 + 14 : les zones tactiles ne se recouvrent pas)
      let x = gx, top = y, ok = true;
      pills.forEach(p => {
        const w = largeur(p);
        if (x > gx && x + w > colW) { x = gx; top += 44; }
        p.left = x; p.top = top; x += w + 8;
        if (x - 8 > colW) ok = false;
      });
      return ok && top + 30 <= H - 6;
    };
    let fait = false;
    essais: for (const frac of [.56, .48, .40]) for (const [courtes, avecPhrase] of [[false, true], [false, false], [true, true], [true, false]]) if (essai(frac, courtes, avecPhrase, false)) { fait = true; break essais; }
    // héros minuscule (zoom 400 %, 320 × 256) : les pastilles quittent le héros et passent en rangée sous lui, plutôt qu'être coupées
    if (!fait) essai(.56, false, true, true);
    dehors = !fait;
    CADRE = { mode, W, H, s, hx, hy, gx, bB: bas(), hb: une.offsetTop + une.offsetHeight };
  } else {
    hero.dataset.niveau = 0;
    colW = borne(.32 * W, 340, 460);
    hero.style.setProperty('--colw', colW + 'px'); html.style.setProperty('--colw', colW + 'px');
    const wb = W - 2 * edge - colW - 40, hbud = H - 72 - 56 - 52 - 24;
    s = Math.min(wb / 1179, hbud / 740);
    hx = W - edge - 1179 * s; hy = 72 + 56 + (hbud - 740 * s);
    const bB = bas();
    const N = borne(H * .15, 56, 88);
    une.style.setProperty('--une-t', N + 'px');
    phraseVue = choisirPhrase(2, 26);
    // le bilan descend dans le bas du héros (bas à H − 24) ; s'il n'y a pas la place (texte très agrandi), il reste sous le héros
    const bH = bilan.offsetHeight;
    let bilanTop = H - 24 - bH;
    let kTop = Math.max(bB + 24, hy);
    const uH = une.offsetHeight;
    let uneH = uH + (phraseVue ? 8 + ph.offsetHeight : 0);
    if (kTop + uneH + 20 > bilanTop) kTop = Math.max(bB + 24, bilanTop - 20 - uneH);
    if (kTop + uneH + 20 > bilanTop && phraseVue) { ph.hidden = true; phraseVue = false; uneH = uH; }
    const leve = kTop + uneH + 20 <= bilanTop;
    if (!leve) { bilanTop = H; kTop = Math.max(bB + 24, Math.min(hy, H - 12 - uneH)); }
    html.style.setProperty('--lift', leve ? (bH + 24) + 'px' : '0px');
    une.style.top = kTop + 'px';
    if (phraseVue) ph.style.top = (kTop + uH + 8) + 'px';
    skyTop = hy - 14 - 30;
    groundTop = hy + 740 * s + 12;
    if (leve) bilanZone = [bilanTop, H - 24];
    gauche = Math.max(edge + colW + 16, hx - 24); droite = W - edge;
    CADRE = { mode, W, H, s, hx, hy, gx, edge, colW, bB, hb: kTop + uH };
  }
  hero.style.setProperty('--colw', colW + 'px');
  html.style.setProperty('--ov', ov + 'px');
  pastillesDehors(dehors);
  MEMO.phraseDansHero = phraseVue;
  $('mt-lead').hidden = phraseVue || !PHRASE.longue;
  $('mt-lead').textContent = PHRASE.longue;
  if (mode !== 'court' && (rangee(solP, droite - gauche) || (!ligne && rangee(ciel, droite - gauche)))) {
    hero.classList.add('pills-courtes');
    // même en libellés courts, une rangée déborde (texte très agrandi) : les pastilles passent sous le héros
    if (rangee(solP, droite - gauche) || (!ligne && rangee(ciel, droite - gauche))) { dehors = true; pastillesDehors(true); }
  }

  // --- la maison : viewBox à partir du cadrage
  const C = CADRE;
  C.bilanZone = bilanZone;
  const x0 = -hx / s, y0 = 20 - hy / s;
  svg.setAttribute('viewBox', `${x0.toFixed(2)} ${y0.toFixed(2)} ${(W / s).toFixed(2)} ${(H / s).toFixed(2)}`);
  const P = ([ax, ay]) => [hx + ax * s, hy + (ay - 20) * s];
  $('ciel').style.setProperty('--yh', (hy + 535 * s).toFixed(1) + 'px');
  // bords coupés du dessin : fondus quand ils ne touchent pas le bord de l'écran
  const fonduG = hx > .5, fonduD = hx + 1179 * s < W - .5;
  svg.querySelector('#bord-g').setAttribute('display', fonduG ? 'inline' : 'none');
  svg.querySelector('#bord-d').setAttribute('display', fonduD ? 'inline' : 'none');
  if (fonduG || fonduD) svg.querySelector('#habillage').setAttribute('mask', 'url(#mBords)'); else svg.querySelector('#habillage').removeAttribute('mask');

  // --- pastilles : ciel au-dessus du toit, sol sous la maison
  const hr = hero.getBoundingClientRect();
  const boite = el => { const r = el.getBoundingClientRect(); return { l: r.left - hr.left, r: r.right - hr.left, t: r.top - hr.top, b: r.bottom - hr.top }; };
  const ancreUne = MEMO.ancreUne;
  if (dehors) {
    pills.forEach(x => { x.el.style.left = ''; x.el.style.top = ''; });
  } else if (mode !== 'court') {
    // ligne de la pastille du ciel
    if (ciel.length) {
      if (ligne) {
        let r = W - gx;
        [...ciel].reverse().forEach(x => { const w = largeur(x); x.cx = r - w / 2; r -= w + 8; });
      } else {
        const cx = resoudre(ciel.map(x => ({ x: P(x.P.ancre)[0], w: largeur(x) })), gauche, droite);
        ciel.forEach((x, k) => { x.cx = cx[k]; x.top = skyTop; });
        // ≥ 12 px entre une pastille et le filet du chiffre
        if (ancreUne && mode === 'portrait') {
          const lx = P(ancreUne)[0];
          ciel.forEach(x => {
            const w = largeur(x), l = x.cx - w / 2, r = x.cx + w / 2;
            if (lx > l - 12 && lx < r + 12) x.cx = x.cx >= lx ? Math.min(droite - w / 2, lx + 12 + w / 2) : Math.max(gauche + w / 2, lx - 12 - w / 2);
          });
        }
      }
    }
    const cxs = resoudre(solP.map(x => ({ x: P(x.P.ancre)[0], w: largeur(x) })), gauche, droite);
    solP.forEach((x, k) => { x.cx = cxs[k]; x.top = groundTop; });
    pills.forEach(x => { x.el.style.left = x.cx.toFixed(1) + 'px'; x.el.style.top = x.top.toFixed(1) + 'px'; });
  } else {
    pills.forEach(x => { x.el.style.left = x.left.toFixed(1) + 'px'; x.el.style.top = x.top.toFixed(1) + 'px'; });
  }

  // --- filets (S&A-HOME .h4-fil) et ancres ; en coupure, la croix rouge tient lieu d'ancre du réseau
  const fils = $('fils');
  fils.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const f1 = v => v.toFixed(1);
  let out = '';
  const coupe = !!SCENE.coupure;
  const point = (id, [x, y], c) => coupe && id === 'reseau' ? '' : `<circle class="ancre" data-noeud="${id}" cx="${f1(x)}" cy="${f1(y)}" r="2.5" style="--c:${c}"/>`;
  const obstaclesFil = [];
  if (mode === 'court' || dehors) {
    pills.forEach(x => { out += point(x.P.id, P(x.P.ancre), x.P.c); });
  } else {
    pills.forEach(x => {
      const [ax, ay] = P(x.P.ancre), w = largeur(x), l = x.cx - w / 2, r = x.cx + w / 2;
      if (x.P.place === 'ciel') {
        const yb = x.top + 30;
        if (ax >= l + 15 && ax <= r - 15) out += `<path class="fil" d="M${f1(ax)},${f1(yb)}V${f1(ay - 3)}"/>`;
        else {
          const yk = ligne ? Math.max(yb + 8, hy - 10) : yb + 8;
          out += `<path class="fil" d="M${f1(x.cx)},${f1(yb)}V${f1(yk)}H${f1(ax)}V${f1(ay - 3)}"/>`;
        }
      } else {
        if (ax >= l + 15 && ax <= r - 15) out += `<path class="fil" d="M${f1(ax)},${f1(ay + 3)}V${f1(x.top)}"/>`;
        else { const xc = borne(ax, l + 15, r - 15); out += `<path class="fil" d="M${f1(ax)},${f1(ay + 3)}V${f1(x.top - 8)}H${f1(xc)}V${f1(x.top)}"/>`; }
      }
      out += point(x.P.id, [ax, ay], x.P.c);
    });
    // filet du chiffre
    if (ancreUne) {
      const [ax, ay] = P(ancreUne);
      if (mode === 'portrait') {
        const y1 = C.hb + 10;
        const ref = phraseVue ? boite(ph) : boite(une);
        const lo = gx + 24, hi = Math.max(lo, ref.r + 16);
        if (ax >= lo && ax <= hi) out += `<path class="fil" d="M${f1(ax)},${f1(y1)}V${f1(ay - 3)}"/>`;
        else { const xs = borne(ax, lo, hi); out += `<path class="fil" d="M${f1(xs)},${f1(y1)}V${f1(y1 + 10)}H${f1(ax)}V${f1(ay - 3)}"/>`; }
        out += point('une', [ax, ay], MEMO.couleurUne);
      } else {
        const k = boite($('une-k')), ly = (k.t + k.b) / 2, lx = k.r + 16;
        let ok = ax - lx > 60 && ly < ay - 16;
        for (let x = lx; x <= ax && ok; x += 6) if (ly > silhouette(x, C) - 6) ok = false;
        // jamais à travers une pastille du ciel
        ciel.forEach(x => { if (ok && ly > x.top - 4 && ly < x.top + 34 && x.cx - largeur(x) / 2 < ax + 4) ok = false; });
        if (ok) { out += `<path class="fil" d="M${f1(lx)},${f1(ly)}H${f1(ax)}V${f1(ay - 3)}"/>` + point('une', [ax, ay], MEMO.couleurUne); obstaclesFil.push({ l: lx, r: ax, t: ly - 1, b: ly + 1 }); }
      }
    }
  }
  fils.innerHTML = out;

  // --- barre : le menu, la marque puis les deux lignes de la capsule s'effacent tour à tour plutôt que de se chevaucher
  hero.classList.remove('sans-nom', 'barre-serree', 'sans-nav');
  const cap = $('capsule'), nav = barre.querySelector('.nav-large');
  MEMO.capCompacte = false; cap.classList.remove('compacte');
  const vu = el => el && el.offsetWidth > 0;
  if (vu(nav) && boite(nav).r + 16 > boite(cap).l) hero.classList.add('sans-nav');
  const chevauche = () => { const m = boite(barre.querySelector('.marque')), c = boite(cap), r = boite($('btn-alertes')); return m.r + 6 > c.l || c.r + 6 > r.l; };
  if (chevauche()) { hero.classList.add('sans-nom'); if (chevauche()) hero.classList.add('barre-serree'); }
  if (cap.classList.contains('evenement') && [...cap.querySelectorAll('.ev-1, .ev-2')].some(t => t.scrollWidth > t.clientWidth + 1)) { MEMO.capCompacte = true; cap.classList.add('compacte'); }
  const texte = [barre.querySelector('.marque'), vu(nav) ? nav : null, une, phraseVue ? ph : null].filter(Boolean).map(boite);
  C.texte = [Math.max(0, Math.min(...texte.map(b => b.t))), Math.max(...texte.map(b => b.b))];
  C.obstacles = [barre.querySelector('.marque'), vu(nav) ? nav : null, cap, $('btn-alertes'), une, phraseVue ? ph : null, ...(dehors ? [] : pills.map(x => x.el))].filter(Boolean).map(boite).concat(obstaclesFil);
  if (bilanZone && mode === 'large') C.obstacles.push(boite(bilan));
  encrerCiel();
  placerCiel();
  echelleFlux();
}

/* Pastilles hors du héros (héros trop bas pour elles) : la liste passe en tête du contenu, en rangée qui se replie */
function pastillesDehors(oui) {
  const ul = $('pastilles');
  if (oui === ul.classList.contains('dehors')) return;
  ul.classList.toggle('dehors', oui);
  if (oui) $('contenu').prepend(ul); else $('direct').insertBefore(ul, $('scene'));
}

/* ------------------------------------------------ Ciel : soleil ou lune, étoiles, nuages (jamais sous le texte) */
function placerCiel() {
  const C = CADRE, d = SCENE;
  if (!C || !d) return;
  const { W, s, hx, hy, gx, mode } = C;
  const astre = $('astre');
  const yh = hy + 535 * s;
  const touche = (x, y, m) => C.obstacles.some(o => x > o.l - m && x < o.r + m && y > o.t - m && y < o.b + m);
  const p = d.progres;
  const lune = d.E < -4;
  const r = lune ? 13 : mode === 'large' ? 28 : 20;
  let ax, ay;
  if (mode === 'portrait') {
    if (lune) { ax = W - gx - 40; ay = C.bB + 40; }
    else { ax = W - gx - 36 - (1 - p) * .18 * W; ay = C.bB + 26 + (1 - Math.sin(Math.PI * p)) * .10 * C.H; }
  } else if (mode === 'court') {
    ax = hx + 80 * s; ay = 24;
  } else {
    // grand écran : le ciel libre à droite de la colonne de texte ; matin à gauche, soir à droite, plus haut vers midi
    const xa = C.edge + C.colW + 16 + r, xb = W - C.edge - r;
    if (lune) { ax = hx + 1179 * s * .78; ay = C.bB + 34; }
    else { ax = xa + p * (xb - xa); ay = C.bB + r + 24 + (1 - Math.sin(Math.PI * p)) * Math.max(0, yh - r - 40 - (C.bB + r + 24)) * .7; }
  }
  // place libre la plus proche : le disque plus une marge (la partie vive du halo) ne touche ni texte, ni pastille, ni filet, ni toit
  const libre = (x, y, m) => {
    if (x - r < 4 || x + r > W - 4 || y - r < (mode === 'large' ? C.bB - 8 : 4) || y + r > yh - 8) return false;   // grand écran : pas dans la rangée du menu
    const R = r + m;
    if (C.obstacles.some(o => x + R > o.l && x - R < o.r && y + R > o.t && y - R < o.b)) return false;
    const Rt = R + (mode === 'large' ? 8 : 0);                      // le profil du toit est approché : un peu plus d'air au-dessus
    for (let a = 0; a <= 180; a += 30) { const t = a * RAD, px = x + Rt * Math.cos(t), py = y + Rt * Math.sin(t); if (py >= silhouette(px, C)) return false; }
    return true;
  };
  const marges = mode === 'large' ? [24, 16, 8] : [12, 8];
  let place = null;
  for (const m of marges) {
    if (libre(ax, ay, m)) { place = [ax, ay]; break; }
    let best = null, d2 = Infinity;
    for (let y = r + 4; y <= yh - r - 8; y += 6) for (let x = r + 4; x <= W - r - 4; x += 8) {
      const q = (x - ax) ** 2 + (y - ay) ** 2;
      if (q < d2 && libre(x, y, m)) { d2 = q; best = [x, y]; }
    }
    if (best) { place = best; break; }
  }
  if (place) [ax, ay] = place;
  astre.style.transform = `translate(${ax.toFixed(1)}px, ${ay.toFixed(1)}px)`;
  astre.style.setProperty('--r', r + 'px');
  // étoiles : 24 points déterministes (suite du nombre d'or), dans les 70 % hauts du ciel, hors du texte
  let et = '';
  if (d.E < -6) {
    const phi = 0.6180339887, phi2 = 0.7548776662;
    let tw = 0;
    for (let k = 1; k <= 24; k++) {
      const x = ((k * phi) % 1) * W, y = ((k * phi2 + .13) % 1) * .7 * yh;
      if (touche(x, y, 10) || y > silhouette(x, C) - 8 || Math.hypot(x - ax, y - ay) < r + 16) continue;
      const rr = .6 + .6 * ((k * 0.38196) % 1), op = .25 + .25 * ((k * 0.7071) % 1);
      const twc = tw < 5 && k % 4 === 1;
      if (twc) tw++;
      et += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rr.toFixed(2)}" opacity="${op.toFixed(2)}"${twc ? ` class="tw" style="--d:${(3.5 + (k % 5) * .55).toFixed(2)}s;--r:${(-(k % 7) * .7).toFixed(1)}s"` : ''}/>`;
    }
  }
  $('etoiles').innerHTML = et;
  // nuages : des formes douces dans la bande de ciel au-dessus du toit
  const n = +($('nuages').dataset.n || 0);
  const pos = [[.12, .30, .34], [.62, .18, .30], [.36, .48, .26], [.86, .42, .24], [.02, .58, .22]];
  const cirrus = $('nuages').dataset.meteo === 'voile';
  $('nuages').innerHTML = pos.slice(0, n).map(([fx, fy, fw]) => {
    const w = fw * W * (cirrus ? 1.6 : 1), h = cirrus ? 10 : w * .34;
    return `<i style="left:${(fx * W).toFixed(0)}px;top:${(C.bB + fy * (yh * .55)).toFixed(0)}px;width:${w.toFixed(0)}px;height:${h.toFixed(0)}px"></i>`;
  }).join('');
}

/* ================================================================ SOUS LE HÉROS === */
/* Décompte : une seule fois, au premier affichage ; les mises à jour suivantes sont directes. */
function compter(el, cible, gabarit) {
  el._cible = cible; el._gabarit = gabarit;
  if (!fini(cible) || immobile() || el.dataset.vu) { el.innerHTML = gabarit(cible); return; }
  el.dataset.vu = '1';
  const t0 = performance.now();
  const pas = t => {
    const k = Math.min(1, (t - t0) / 900), ease = 1 - Math.pow(1 - k, 3);
    el.innerHTML = el._gabarit(el._cible * ease);
    if (k < 1) requestAnimationFrame(pas); else el.innerHTML = el._gabarit(el._cible);
  };
  requestAnimationFrame(pas);
}
/* Sous-lignes du bilan : version longue si elle tient sur une ligne, sinon courte, sinon retour à la ligne (texte agrandi) */
function sousLigne(id, long, court) {
  const el = $(id), html = `<span class="long">${long}</span><span class="court">${court}</span>`;
  if (el.dataset.t !== html) { el.dataset.t = html; el.innerHTML = html; }
}
function ajusterBilan() {
  document.querySelectorAll('.bm-s').forEach(el => {
    el.classList.remove('court', 'libre');
    if (el.scrollWidth > el.clientWidth + .5) el.classList.add('court');
    if (el.scrollWidth > el.clientWidth + .5) el.classList.add('libre');
  });
}
function rendreBilan(e, d) {
  const j = e.jour || {};
  $('bilan-date').textContent = dateCourte(d.date, e.fuseau);
  const total = (j.production ?? 0) + d.reste;
  // valeurs : espace simple avant l'unité (elle peut passer dessous si le texte est très agrandi, plutôt que déborder)
  compter($('bm-prod'), j.production, v => fini(v) ? `${kWh(v)}<span class="u"> kWh</span>` : '—');
  $('bm-prod-p').style.setProperty('--v', total > 0 ? (100 * (j.production ?? 0) / total).toFixed(1) : '0');
  const couche = d.h >= d.coucher;
  sousLigne('bm-prod-s', couche ? 'journée terminée' : `sur ≈${NBSP}${kWh(total)} prévus`, couche ? 'jour terminé' : `≈${NBSP}${kWh(total)}${NBSP}prévus`);
  $('bm-prod-b').setAttribute('aria-label', `Produits aujourd’hui${NBSP}: ${kWh(j.production)} kilowattheures, ${couche ? 'journée terminée' : `sur environ ${kWh(total)} prévus`}. Ouvrir le détail du soleil`);
  compter($('bm-auto'), d.autonomie, v => fini(v) ? `${pct(v)}<span class="u">${NNBSP}%</span>` : '—');
  $('bm-auto-p').style.setProperty('--v', fini(d.autonomie) ? d.autonomie.toFixed(1) : '0');
  sousLigne('bm-auto-s', `${kWh(j.import ?? 0)}${NBSP}kWh achetés`, `${kWh(j.import ?? 0)}${NBSP}kWh achat`);
  $('bm-auto-b').setAttribute('aria-label', `Autonomie${NBSP}: ${pct(d.autonomie)} % des besoins couverts sans le réseau, ${kWh(j.import ?? 0)} kilowattheures achetés. Ouvrir le détail de la maison`);
  compter($('bm-eco'), d.economies, v => fini(v) ? `${euros(v)}<span class="u"> €</span>` : '—');
  sousLigne('bm-eco-s', `${euros(e.mois?.economies_eur)}${NBSP}€ en${NBSP}${moisCourt(e.mois?.depuis)}`, `${euros(e.mois?.economies_eur)}${NBSP}€${NBSP}${moisCourt(e.mois?.depuis)}`);
  $('bm-eco-b').setAttribute('aria-label', `Économisés aujourd’hui${NBSP}: ${euros(d.economies)} euros${d.economiesEstimees ? ', estimation' : ''}, ${euros(e.mois?.economies_eur)} euros en ${moisNom(e.mois?.depuis)}. Ouvrir le détail des économies`);
  ajusterBilan();
}

/* Remplace un contenu seulement s'il change, et rend le focus clavier à l'élément équivalent (id, nom et valeur, rang) */
const MODELE = document.createElement('template');
const FOCALISABLES = 'button, a[href], input, select, [tabindex]';
function cleFocus(el) {
  if (el.id) return '#' + CSS.escape(el.id);

    : cle === 'charge' ? 'La batterie commence à se charger.' : cle === 'decharge' ? 'La batterie commence à se décharger.' : 'La batterie est au repos.';

function rendre(e, opts = {}) {
  const d = deriver(e);

function etatCourant(nom) {

  if (!a) return ETAT;
  const c = ETAT.courbe, pas = c.pas_h;
  const debutSoiree = Math.round(17.5 / pas);
  // le lendemain (achat) : la prévision annoncée la veille, heure par heure, et la nuit mesurée de l'aperçu
  const production = a.lendemain ? c.production.map((_, k) => ETAT.meteo?.demain?.prevision_h?.[Math.floor(k * pas)] ?? 0)
    : c.production.map((v, k) => v ?? c.prevision[k] ?? 0);

    : c.maison.map((v, k) => v ?? Ap.maison_soiree[k - debutSoiree] ?? null);
  const { h } = heureLocale(a.horodatage, ETAT.fuseau);
  const coupe = (arr, f) => arr.map((v, k) => f(k * pas) ? v : null);
  // pic de production : celui du jour s'il a déjà eu lieu, sinon le plus fort relevé jusqu'à maintenant
  const pic0 = ETAT.jour?.pic, i = a.instantane || {};
  let pic = !a.lendemain && pic0 && hDe(pic0.heure, 99) <= h ? pic0 : null;
  if (!pic) {
    let best = { kW: i.production ?? 0, h };
    production.forEach((v, k) => { if (k * pas + pas <= h && v > best.kW) best = { kW: v, h: k * pas + pas / 2 }; });
    const H = Math.floor(best.h), M = Math.round((best.h - H) * 60);
    pic = best.kW > 0.03 ? { kW: best.kW, heure: `${String(H).padStart(2, '0')}:${String(M).padStart(2, '0')}` } : null;
  }
  return {
    ...ETAT, ...a,
    fraicheur: a.fraicheur || { ...ETAT.fraicheur, derniere_maj: a.horodatage },
    instantane: { ...a.instantane },
    jour: { ...(a.jour || ETAT.jour), pic },
    courbe: { pas_h: pas, production: coupe(production, t => t <= h), prevision: coupe(production, t => t > h), maison: coupe(maison, t => t <= h) }
  };
}

function brancher() {
  // tous les nombres sont des boutons : ouverture des fiches par délégation
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-fiche]');
    if (t && !t.closest('.fiche')) { ev.preventDefault(); ouvrirFiche(t.dataset.fiche, t, t.dataset.section); return; }
    const av = ev.target.closest('[data-avis]');
    if (av) {
      const utile = av.dataset.avis === '1';
      document.dispatchEvent(new CustomEvent('breezy:avis', { detail: { utile, texte: MEMO.explication || '', horodatage: new Date().toISOString() } }));
      const box = $('avis');
      box.dataset.merci = '1';
      box.querySelector('span').textContent = 'Merci';
      box.querySelectorAll('[data-avis]').forEach(b => b.setAttribute('aria-pressed', String(b === av)));
      clearTimeout(box._t);
      box._t = setTimeout(() => {
        delete box.dataset.merci;
        const l = box.querySelector('span');
        if (l) l.textContent = `Utile${NBSP}?`;
        box.querySelectorAll('[data-avis]').forEach(b => b.setAttribute('aria-pressed', 'false'));
      }, 4000);
      return;
    }
    if (ev.target.closest('[data-masquer-moment]')) { etat.moments = (etat.moments || []).slice(1); rendreMoment(etat); }
    const th = ev.target.closest('[data-theme-choix]');
    if (th) { choisirTheme(th.dataset.themeChoix); return; }
    if (ev.target.closest('#in-orage')) { commande('veille_orage', !etat.veille_orage?.active); return; }
    if (ev.target.closest('#in-anim')) { basculerAnimations(); remplirFiche(); }
  });
  const dlg = $('fiche');
  $('fiche-fermer').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => { FICHE = null; if (OUVREUR && document.contains(OUVREUR)) OUVREUR.focus(); });
  dlg.addEventListener('input', ev => {
    if (ev.target.id === 'in-reserve') {
      const v = +ev.target.value, cap = etat.installation?.batterie_kWh ?? 0;
      ev.target.setAttribute('aria-valuetext', `${v} %, soit ${nombre(v / 100 * cap, 1)} kWh gardés pour une coupure`);
      $('out-reserve').textContent = `${v}${NNBSP}% · ${nombre(v / 100 * cap, 1)}${NBSP}kWh gardés pour une coupure`;
    }
  });
  // groupe radio du thème : une seule tabulation, les flèches déplacent et choisissent
  dlg.addEventListener('keydown', ev => {
    const th = ev.target.closest?.('[data-theme-choix]');
    if (!th) return;
    const pas = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[ev.key];
    if (!pas) return;
    ev.preventDefault();
    const tous = [...th.parentElement.querySelectorAll('[data-theme-choix]')];
    const v = tous[(tous.indexOf(th) + pas + tous.length) % tous.length].dataset.themeChoix;
    choisirTheme(v);
    $('fiche-corps').querySelector(`[data-theme-choix="${v}"]`)?.focus();
  });
  dlg.addEventListener('change', ev => {
    if (ev.target.id === 'in-reserve') commande('reserve', +ev.target.value);
    if (ev.target.name === 'mode') commande('mode', ev.target.value);
  });
  // onglets Aujourd'hui / Demain (flèches gauche et droite)
  const tabs = [$('tab-auj'), $('tab-dem')];
  const choisir = (k, focus) => {
    tabs.forEach((t, n) => { t.setAttribute('aria-selected', String(n === k)); t.tabIndex = n === k ? 0 : -1; $(t.getAttribute('aria-controls')).hidden = n !== k; });
    if (focus) tabs[k].focus();
    if (k === 1) rendreDemain(etat, SCENE);
  };
  tabs.forEach((t, k) => {
    t.addEventListener('click', () => choisir(k));
    t.addEventListener('keydown', ev => {
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { ev.preventDefault(); choisir(k === 0 ? 1 : 0, true); }
      if (ev.key === 'Home') { ev.preventDefault(); choisir(0, true); }
      if (ev.key === 'End') { ev.preventDefault(); choisir(1, true); }
    });
  });
  brancherCourbe();
  $('btn-anim').addEventListener('click', basculerAnimations);
}

function choisirTheme(v) {
  if (v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  try { if (v === 'auto') localStorage.removeItem('breezy-theme'); else localStorage.setItem('breezy-theme', v); } catch (_) { /* stockage indisponible */ }
  rendre(etat);
}

/* Interrupteur « Animations » (WCAG 2.2.2) : coupe comètes, moyeu, LED et nuages ; mémorisé dans ce navigateur seulement */
function majInterrupteur() {
  const b = $('btn-anim');
  b.setAttribute('aria-checked', String(!immobile()));
  b.disabled = reduitMQ.matches;
  $('anim-note').hidden = !reduitMQ.matches;
  document.documentElement.classList.toggle('calme', immobile());
}
function basculerAnimations() {
  if (reduitMQ.matches) return;
  PAUSE = !PAUSE;
  try { localStorage.setItem('breezy-animations', PAUSE ? '0' : '1'); } catch (_) { /* stockage indisponible */ }
  majInterrupteur();
  rendre(etat, { immediat: true });
  appliquerFlux(true);
}

function demarrer() {
  try { PAUSE = localStorage.getItem('breezy-animations') === '0'; } catch (_) { PAUSE = false; }
  majInterrupteur();
  etat = etatCourant(new URLSearchParams(location.search).get('apercu'));
  preparerSvg();
  brancher();
  rendre(etat, { immediat: true });
  requestAnimationFrame(() => cadrer());
  document.fonts?.ready?.then(() => cadrer());
  let rz = 0;
  const obs = new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(cadrer); });
  [$('hero'), $('barre'), $('une'), $('bilan')].forEach(el => obs.observe(el));
  let largeurCourbe = $('courbe-svg').clientWidth;
  new ResizeObserver(() => { const w = $('courbe-svg').clientWidth; if (Math.abs(w - largeurCourbe) > 2) { largeurCourbe = w; rendreJournee(etat, SCENE); } }).observe($('courbe-svg'));
  // pause hors écran et onglet caché
  new IntersectionObserver(es => { ECRAN = es[0].isIntersecting; synchroPause(); }, { threshold: 0 }).observe($('hero'));
  document.addEventListener('visibilitychange', () => { VISIBLE = !document.hidden; synchroPause(); });
  reduitMQ.addEventListener?.('change', () => { majInterrupteur(); rendre(etat, { immediat: true }); appliquerFlux(true); });
  sombreMQ.addEventListener?.('change', () => rendre(etat));
  // fraîcheur : la capsule se met à jour toutes les 15 s
  // fraîcheur : toutes les 15 s, l'âge des données ; au passage du seuil hors ligne (15 min), toute la page bascule
  // (comètes arrêtées, pastilles périmées, chiffre à 55 %) ; sinon seule la capsule change. Pas d'effet sur l'hystérésis des flux.
  setInterval(() => {
    if (!etat || !SCENE || fini(etat.fraicheur?.age_s)) return;
    const f = fraicheur(etat, SCENE.h);
    if (f.horsligne !== SCENE.horsligne) rendre(etat, { immediat: true });
    else rendreCapsule(etat, { ...SCENE, ...f });
  }, 15000);
}

/* Point d'entrée pour Home Assistant */
window.Breezy = {
  get etat() { return etat; },
  actualiser(nouvelEtat) { etat = nouvelEtat; rendre(etat); },                  // textes tout de suite ; flux au prochain début de cycle
  apercu(nom) { MEMO = { jour: null, flux: {}, annonce: null }; etat = etatCourant(nom); rendre(etat, { immediat: true }); },
  /* contrôle des bilans (outil de développement) : maison = production − batterie + réseau ; compteurs du jour */
  verifier(e = etat) {
    const i = e.instantane || {}, j = e.jour || {}, r2 = v => Math.round(v * 100) / 100;
    const inst = r2((i.production ?? 0) - (i.batterie ?? 0) + (e.reseau_etat === 'coupure' ? 0 : (i.reseau ?? 0)));
    const prod = r2((j.autoconso_directe ?? 0) + (j.charge_batterie ?? 0) + (j.export ?? 0)), mais = r2((j.autoconso_directe ?? 0) + (j.decharge_batterie ?? 0) + (j.import ?? 0));
    return { instantane: inst === r2(i.maison ?? 0), production: prod === r2(j.production ?? 0), maison: mais === r2(j.maison ?? 0) };
  }
};
demarrer();
</script>
