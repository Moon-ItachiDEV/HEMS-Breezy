<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1017">
  <title>Voltia</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div>
      <div class="brand">Volt<span>ia</span></div>
      <div class="demo">v1 · démo · <a href="v2/" style="color:var(--sun)">voir la v2 →</a></div>
    </div>
    <div class="meta" id="top-meta"></div>
  </header>

  <main>
    <section class="view" id="view-energie">
      <div class="card flow-card" id="flow"></div>
      <div id="energie-cards"></div>
    </section>
    <section class="view" id="view-voiture"><div id="voiture" style="padding-top:8px"></div></section>
    <section class="view" id="view-maison"><div id="maison"></div></section>
    <section class="view" id="view-chauffage"><div id="chauffage" style="padding-top:8px"></div></section>
  </main>

  <nav class="tabs">
    <button data-view="energie"><span>⚡</span>Énergie</button>
    <button data-view="voiture"><span>🚗</span>Voiture</button>
    <button data-view="maison"><span>🏠</span>Maison</button>
    <button data-view="chauffage"><span>🔥</span>Chauffage</button>
  </nav>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
