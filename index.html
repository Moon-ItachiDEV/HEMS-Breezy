<!doctype html>
<!--
  Breezy · Accueil — « la maison au grand air » (spécification v3)
  ---------------------------------------------------------------------------
  GABARIT : l'illustration assets/maison.svg est insérée telle quelle, en ligne, à la place du
  marqueur MAISON_SVG de #scene (ses éléments sont animés à l'exécution, le fichier n'est jamais modifié) :
      node tools/inline-svg.js src/index.template.html index.html
  Aperçus de développement : index.html?apercu=midi | soir | nuit | achat | coupure | horsligne
  (ou Breezy.apercu('nuit') dans la console).

  Deux axes indépendants :
   - la SCÈNE (ciel, lumière sur la maison, soleil, lune, étoiles, nuages) suit l'heure réelle de la
     maison (Europe/Paris), la hauteur du soleil et la météo ;
   - le THÈME (fond de page, cartes, texte) suit prefers-color-scheme, ou html[data-theme].
  Couleurs d'énergie, partout les mêmes : soleil ambre, maison bleu, batterie vert, réseau violet.
  Le rouge est réservé aux alertes et au Tempo rouge. Une seule famille : Geist (400/500/600).
  Flux d'énergie : le relais en comètes de S&A-HOME (cycle 5,6 s, moyeu sur le coffret principal).
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<meta name="description" content="Breezy, l’énergie de la maison en direct : soleil, batterie, réseau, autonomie et économies du jour.">
<title>Breezy · Accueil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<script>
  /* Thème choisi dans Réglages (confort de lecture, mémorisé dans ce navigateur seulement) : appliqué avant le premier rendu */
  try { const t = localStorage.getItem('breezy-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) { /* stockage indisponible */ }
</script>
<style>
/* ================================================================ JETONS === */
:root {
  color-scheme: light;
  --fond: oklch(0.972 0.004 260);
  --surface: #FFFFFF;
  --surface-2: oklch(0.95 0.005 260);
  --encre: oklch(0.22 0.012 260);
  --encre-2: oklch(0.44 0.01 260);
  --encre-3: oklch(0.52 0.01 260);
  --filet: oklch(0.22 0.012 260 / .10);
  --piste: oklch(0.40 0.01 260 / .10);
  /* énergie : même teinte pour comète, pastille, graphique, icône */
  --soleil: oklch(0.82 0.16 82);
  --soleil-t: oklch(0.52 0.12 70);
  --maison: oklch(0.66 0.14 250);
  --maison-t: oklch(0.48 0.15 256);
  --batterie: oklch(0.64 0.15 152);
  --batterie-t: oklch(0.48 0.12 152);
  --reseau: oklch(0.50 0.19 295);
  --reseau-t: oklch(0.46 0.19 295);
  --alerte: oklch(0.58 0.20 27);
  --alerte-t: oklch(0.50 0.19 27);                 /* texte d'alerte sur fond clair : ≥ 4,5:1 même sur un fond teinté */
  /* Tempo : toujours accompagné du mot */
  --tempo-bleu: oklch(0.48 0.17 262);
  --tempo-blanc: oklch(0.97 0.003 260);
  --tempo-rouge: var(--alerte);
  --ombre-carte: 0 0 0 .5px var(--filet), 0 1px 2px oklch(0.25 0.02 260 / .04), 0 10px 30px -18px oklch(0.25 0.03 260 / .25);
  --police: Geist, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --gx: 20px;
  --edge: 32px;
  --colw: 400px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fond: oklch(0.17 0.006 260);
    --surface: oklch(0.215 0.007 260);
    --surface-2: oklch(0.25 0.008 260);
    --encre: oklch(0.96 0.004 260);
    --encre-2: oklch(0.80 0.008 260);
    --encre-3: oklch(0.70 0.008 260);
    --filet: oklch(0.96 0.004 260 / .10);
    --piste: oklch(0.96 0.004 260 / .12);
    --soleil: oklch(0.86 0.15 85);
    --soleil-t: oklch(0.86 0.15 85);
    --maison: oklch(0.80 0.11 240);
    --maison-t: oklch(0.80 0.11 240);
    --batterie: oklch(0.74 0.15 152);
    --batterie-t: oklch(0.74 0.15 152);
    --reseau: oklch(0.62 0.17 295);
    --reseau-t: oklch(0.70 0.15 295);
    --alerte: oklch(0.72 0.17 27);
    --alerte-t: oklch(0.72 0.17 27);
    --ombre-carte: 0 0 0 .5px var(--filet), 0 18px 40px -26px oklch(0 0 0 / .7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fond: oklch(0.17 0.006 260);
  --surface: oklch(0.215 0.007 260);
  --surface-2: oklch(0.25 0.008 260);
  --encre: oklch(0.96 0.004 260);
  --encre-2: oklch(0.80 0.008 260);
  --encre-3: oklch(0.70 0.008 260);
  --filet: oklch(0.96 0.004 260 / .10);
  --piste: oklch(0.96 0.004 260 / .12);
  --soleil: oklch(0.86 0.15 85);
  --soleil-t: oklch(0.86 0.15 85);
  --maison: oklch(0.80 0.11 240);
  --maison-t: oklch(0.80 0.11 240);
  --batterie: oklch(0.74 0.15 152);
  --batterie-t: oklch(0.74 0.15 152);
  --reseau: oklch(0.62 0.17 295);
  --reseau-t: oklch(0.70 0.15 295);
  --alerte: oklch(0.72 0.17 27);
  --alerte-t: oklch(0.72 0.17 27);
  --ombre-carte: 0 0 0 .5px var(--filet), 0 18px 40px -26px oklch(0 0 0 / .7);
}
@media (max-width: 374px) { :root { --gx: 16px; } }
@media (min-width: 768px) { :root { --gx: 32px; } }

/* ================================================================ BASE === */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--fond); }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font: 400 15px/21px var(--police);
  font-feature-settings: "tnum" 1; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
p, h1, h2, h3, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { overflow: visible; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.nw { white-space: nowrap; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ================================================================ HÉROS === */
.hero {
  position: relative; display: block;
  width: 100%; height: 75vh; height: 75svh;
  margin: 0; padding: 0 0 0 0;
  overflow: hidden; isolation: isolate;
  border-radius: 0 0 28px 28px;
  background: var(--ciel-haut-actuel, oklch(.86 .055 240));
  color: var(--ciel-encre);
  /* encres et surface de la SCÈNE (indépendantes du thème de la page) */
  --surface-scene: #FFFFFF;
  --ciel-encre: oklch(0.22 0.012 260);
  --ciel-encre-2: oklch(0.38 0.012 260);
  --fil: oklch(0.42 0.01 260 / .5);
}
.hero[data-ciel="sombre"] {
  /* sur un ciel sombre, les énergies prennent leur clarté « sombre » (même teinte) : comètes, moyeu et pastilles restent lisibles */
  --soleil: oklch(0.86 0.15 85);
  --maison: oklch(0.80 0.11 240);
  --batterie: oklch(0.74 0.15 152);
  --reseau: oklch(0.62 0.17 295);
  --surface-scene: oklch(0.24 0.01 260);
  --ciel-encre: oklch(0.97 0.004 260);
  --ciel-encre-2: oklch(0.84 0.008 260);
  --fil: oklch(0.88 0.01 260 / .45);
}
.hero :focus-visible { outline-color: var(--ciel-encre); }
.saut {
  position: absolute; z-index: 20; left: var(--gx); top: -80px;
  padding: 10px 14px; border-radius: 12px;
  background: var(--encre); color: var(--fond); font-weight: 600; text-decoration: none;
}
.saut:focus { top: max(8px, env(safe-area-inset-top)); }
#annonce { top: 0; left: 0; }
.direct:focus { outline: none; }

/* --- Ciel (derrière la maison : il ne la couvre jamais) --- */
.ciel { position: absolute; inset: 0; z-index: 0; pointer-events: none; --yh: 60%; padding-right: env(safe-area-inset-right, 0px); }
.ciel-fond {
  position: absolute; inset: 0;
  /* voile de lecture (encrerCiel) : seulement autour du crépuscule et de l'aube, quand ni l'encre claire ni la sombre n'atteint 4,5:1 sur le ciel */
  background:
    linear-gradient(180deg, var(--voile-c, transparent) 0, var(--voile-c, transparent) var(--voile-y, 0px), transparent calc(var(--voile-y, 0px) + 80px)),
    linear-gradient(180deg, var(--c-haut) 0, var(--c-milieu) calc(var(--yh) * .45), var(--c-horizon) var(--yh), var(--c-sol0) calc(var(--yh) + 24px), var(--c-sol1) 100%);
}
.ciel-fond-b { opacity: 0; }
.astre { position: absolute; left: 0; top: 0; width: 0; height: 0; transition: opacity .6s ease; }
.astre .halo { position: absolute; left: calc(var(--r) * -3.5); top: calc(var(--r) * -3.5); width: calc(var(--r) * 7); height: calc(var(--r) * 7); border-radius: 50%; background: radial-gradient(closest-side, color-mix(in oklch, var(--astre) 42%, transparent), color-mix(in oklch, var(--astre) 14%, transparent) 55%, transparent); }
.astre .disque { position: absolute; left: calc(var(--r) * -1); top: calc(var(--r) * -1); width: calc(var(--r) * 2); height: calc(var(--r) * 2); border-radius: 50%; background: var(--astre); box-shadow: 0 0 0 .5px color-mix(in oklch, var(--astre) 60%, transparent); }
.astre.lune .disque { background: transparent; box-shadow: calc(var(--r) * .42) calc(var(--r) * -.18) 0 0 oklch(.95 .02 90); transform: rotate(-12deg); }
.astre.lune .halo { background: radial-gradient(closest-side, oklch(.95 .02 90 / .10), transparent); }
.etoiles { position: absolute; inset: 0; width: 100%; height: 100%; }
.etoiles circle { fill: oklch(.95 .01 260); }
.etoiles .tw { animation: scintille var(--d) ease-in-out var(--r) infinite; }
@keyframes scintille { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.nuages { position: absolute; inset: 0; }
.nuages i { position: absolute; display: block; border-radius: 999px; background: radial-gradient(closest-side, var(--nuage), transparent); }
.nuages.derive { animation: derive 40s ease-in-out infinite alternate; }
@keyframes derive { to { transform: translateX(24px); } }
.pluie { position: absolute; inset: 0; opacity: .18; background: repeating-linear-gradient(102deg, transparent 0 9px, oklch(1 0 0 / .9) 9px 10px, transparent 10px 23px); background-size: 100% 46px; }
.pluie.anim { animation: pluie 1.1s linear infinite; }
@keyframes pluie { to { background-position: -10px 46px; } }

/* --- Maison (SVG en ligne) et calque des filets --- */
.scene { position: absolute; inset: 0; z-index: 1; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: hidden; }
.fils { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fil { fill: none; stroke: var(--fil); stroke-width: 1; stroke-dasharray: 1.4 3; stroke-linecap: round; transition: opacity .3s ease; }
.ancre { fill: var(--c); stroke: var(--surface-scene); stroke-width: 1; transform-box: fill-box; transform-origin: center; }
.ancre.pouls { animation: ancre 600ms ease-in-out; }
@keyframes ancre { 50% { transform: scale(1.8); } }

/* --- Barre du haut --- */
.barre {
  position: absolute; z-index: 5; top: 8px; left: var(--gx); right: var(--gx); height: 44px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
  transition: top .2s;
}
.hero[data-niveau="2"] .barre, .hero[data-niveau="3"] .barre, .hero[data-niveau="4"] .barre { top: 4px; }
.barre-g { display: flex; align-items: center; gap: 28px; min-width: 0; justify-self: start; }
.marque { display: inline-flex; align-items: center; gap: 9px; height: 44px; min-width: 44px; padding-right: 4px; border-radius: 12px; color: var(--ciel-encre); text-decoration: none; }
.marque svg { width: 28px; height: 28px; flex: none; }
.marque-nom { font: 600 17px/1 var(--police); letter-spacing: -.02em; }
.nav-large { display: none; gap: 22px; }
.nav-large :is(a, button) { position: relative; padding: 0; border: 0; background: none; font: 500 15px/44px var(--police); color: var(--ciel-encre-2); text-decoration: none; border-radius: 6px; }
.nav-large a[aria-current="page"] { color: var(--ciel-encre); }
.hero.sans-nav .nav-large { display: none !important; }
.nav-large a[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 2px; border-radius: 2px; background: currentColor; }
.rond {
  position: relative; justify-self: end; display: grid; place-items: center; flex: none;
  width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; color: var(--ciel-encre); text-decoration: none;
}
.rond .ic { width: 21px; height: 21px; }
.pastille-n { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--alerte); box-shadow: 0 0 0 2px var(--surface-scene); }

/* surfaces givrées de la scène (pastilles, capsule « en direct », bouton rond) — S&A-HOME .hc-chip */
.givre, .pill, .rond {
  background: linear-gradient(180deg, color-mix(in oklch, var(--surface-scene) 64%, transparent), color-mix(in oklch, var(--surface-scene) 82%, transparent));
  -webkit-backdrop-filter: blur(16px) saturate(1.8); backdrop-filter: blur(16px) saturate(1.8);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .8), inset 0 0 0 .5px oklch(1 0 0 / .5), 0 0 0 .5px oklch(.35 .01 260 / .12), 0 6px 16px -10px oklch(.25 .03 260 / .45);
}
.hero[data-ciel="sombre"] :is(.givre, .pill, .rond) {
  background: oklch(.22 .01 260 / .72);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .10), 0 0 0 .5px oklch(1 0 0 / .08), 0 8px 18px -10px oklch(0 0 0 / .6);
}

/* --- Capsule d'état (centre de la barre) --- */
.capsule {
  position: relative; justify-self: center; min-width: 0; max-width: 100%;
  display: inline-flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 12px 0 10px; border: 0; border-radius: 999px;
  font: 500 13px/1 var(--police); color: var(--ciel-encre); white-space: nowrap;
}
.capsule::before { content: ""; position: absolute; inset: -7px -4px; }
.capsule .pt { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--batterie)); box-shadow: 0 0 0 2.5px color-mix(in oklch, var(--c, var(--batterie)) 24%, transparent); flex: none; }
.capsule.evenement {
  height: 44px; padding: 0 16px 0 12px; gap: 10px;
  background: oklch(.16 .01 260 / .82); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 0 0 .5px oklch(1 0 0 / .08), 0 10px 24px -12px oklch(0 0 0 / .6);
  color: #fff; text-align: left;
}
.capsule.evenement::before { inset: 0; }
.capsule .ev-ic { display: grid; place-items: center; width: 16px; height: 16px; color: var(--c, #fff); flex: none; }
.capsule .ev-ic .ic { width: 16px; height: 16px; }
.capsule .ev-t { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.capsule .ev-1 { font: 600 12.5px/1.15 var(--police); overflow: hidden; text-overflow: ellipsis; }
.capsule .ev-2 { font: 500 12px/1.15 var(--police); color: oklch(1 0 0 / .75); overflow: hidden; text-overflow: ellipsis; }
.capsule .ev-c { display: none; font: 600 12.5px/1 var(--police); }
.capsule.compacte .ev-t { display: none; }
.capsule.compacte .ev-c { display: inline; }
.hero.sans-nom .marque-nom { display: none; }
.hero.barre-serree .barre { grid-template-columns: auto minmax(0, 1fr) auto; }
@media (max-width: 359px) {
  .barre { gap: 6px; }
  .capsule.evenement { padding: 0 10px; gap: 8px; }
  .capsule .ev-1, .capsule .ev-2 { letter-spacing: -.01em; }
  .capsule.evenement .ev-ic { display: none; }
  .capsule .ev-2 { font-size: 11.5px; }
}

/* --- LE chiffre et sa phrase --- */
.une {
  position: absolute; z-index: 4; left: var(--gx); top: 66px;
  display: flex; flex-direction: column; align-items: flex-start;
  margin: 0; padding: 0; border: 0; background: none; border-radius: 12px;
  color: var(--ciel-encre); text-align: left;
}
.une-k { display: flex; align-items: center; gap: 8px; height: 20px; font: 500 14px/20px var(--police); color: var(--ciel-encre-2); white-space: nowrap; }
.une-k i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--soleil)); flex: none; }
.une-v { display: block; font-weight: 400; font-size: var(--une-t, 62px); line-height: 1; letter-spacing: -.045em; white-space: nowrap; font-variant-numeric: tabular-nums; transition: opacity .4s; }
.une-v .u { font-size: .34em; font-weight: 500; letter-spacing: 0; color: var(--ciel-encre-2); margin-left: .12em; }
.une-v .u.mid { margin: 0 .3em 0 .26em; }
.une.perime .une-v { color: color-mix(in oklch, var(--ciel-encre) 55%, transparent); }   /* chiffres à 55 % ; l'unité garde son encre pleine (≥ 4,5:1) */
.hero[data-niveau="2"] .une-k, .hero[data-niveau="3"] .une-k, .hero[data-niveau="4"] .une-k, .hero[data-mode="court"] .une-k { height: 18px; font-size: 13px; line-height: 18px; }
.une-phrase {
  position: absolute; z-index: 4; left: var(--gx); top: 160px;
  width: max-content; max-width: min(32ch, calc(100% - 2 * var(--gx)));
  font: 400 16px/22px var(--police); letter-spacing: -.005em; color: var(--ciel-encre);
  text-wrap: pretty;
}
.hero[data-niveau="1"] .une-phrase { font-size: 15px; line-height: 20px; }
.hero[data-mode="court"] .une-phrase { font-size: 15px; line-height: 20px; white-space: nowrap; max-width: none; }
.une-phrase[hidden] { display: none; }

/* --- Pastilles (S&A-HOME, devenues boutons) --- */
.pastilles { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.pill {
  position: absolute; left: 0; top: 0; pointer-events: auto;
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 6px;
  border: 0; border-radius: 999px; transform: translate(-50%, 0);
  font: 600 14px/20px var(--police); letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums;
  color: oklch(.22 .012 260);
  transition: opacity 300ms ease, visibility 0s linear 0s;
}
.pill::before { content: ""; position: absolute; inset: -7px -4px; }
.pill .g { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 999px; flex: none; background: color-mix(in oklch, var(--c) 22%, transparent); color: var(--ct); }
.pill .g .ic { width: 12px; height: 12px; stroke-width: 2; }
.pill .v { display: inline-flex; align-items: center; gap: 3px; }
.pill .v .ic, .pill .s .ic { width: 11px; height: 11px; stroke-width: 2; }
.pill .s { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; font-size: 12.5px; color: oklch(.41 .01 260); }
.hero[data-ciel="sombre"] .pill { color: oklch(.97 .004 260); }
.hero[data-ciel="sombre"] .pill .s { color: oklch(.80 .008 260); }
.hero[data-ciel="sombre"] .pill .g { color: var(--c); }
.pill.repos .g { background: oklch(.40 .01 260 / .12); color: oklch(.52 .01 260); }
.pill.repos .v, .pill.perime .v, .pill.perime .s { color: oklch(.46 .01 260); }
.hero[data-ciel="sombre"] .pill.repos .g { background: oklch(.96 .004 260 / .12); color: oklch(.72 .008 260); }
.hero[data-ciel="sombre"] :is(.pill.repos .v, .pill.perime .v, .pill.perime .s) { color: oklch(.72 .008 260); }
.pill.coupe .g { background: color-mix(in oklch, var(--alerte) 18%, transparent); color: var(--alerte-t); }
.pill.coupe .v { color: var(--alerte-t); }
.hero[data-ciel="sombre"] .pill.coupe :is(.g, .v) { color: oklch(.76 .15 27); }
.pill.cache { opacity: 0; visibility: hidden; transition: opacity 300ms ease, visibility 0s linear 300ms; }
.hero[data-mode="court"] .pill { transform: none; }
.pill:focus-visible { outline: 2px solid var(--ciel-encre); outline-offset: 2px; }

.envoi { margin-top: 8px; font: 500 13px/18px var(--police); color: var(--batterie-t); min-height: 18px; }
.fermer { width: 44px; height: 44px; }
.ligne-switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 10px; }
.ligne-switch .interrupteur { flex: none; }
.ligne-switch p { margin: 0; font: 400 14px/20px var(--police); color: var(--encre-2); }
.segments.theme { margin-top: 10px; }

@media (min-width: 640px) {
  .fiche { width: 520px; max-height: min(86svh, 760px); margin: auto; border-radius: 28px; box-shadow: 0 30px 80px -20px oklch(0 0 0 / .45); }
  .fiche-in { padding: 8px 24px 24px; }
  .fiche-tete { margin: 0 -24px; padding: 14px 10px 8px 24px; }
}

/* ================================================================ GRANDS ÉCRANS (contenu) === */
html[data-mode="large"] .bilan { width: var(--colw); margin: calc(var(--lift, 0px) * -1) 0 0 var(--edge); }
html[data-mode="court"] .bilan { margin: 12px var(--gx) 0; }
@media (min-width: 900px) {
  .page { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; align-items: start; padding-top: 32px; }
  .colonne-g { grid-column: 1 / span 7; display: flex; flex-direction: column; gap: 24px; }
  .colonne-d { grid-column: 8 / span 5; display: flex; flex-direction: column; gap: 24px; }
  .lignes { margin: 0; padding: 6px 0; border-radius: 24px; background: var(--surface); box-shadow: var(--ombre-carte); overflow: hidden; }
  .lignes button { padding: 12px 20px; }
  .lignes li + li button::before { left: 58px; }
  .pied { text-align: left; }
  .pied-actions { justify-content: flex-start; }
}
@media (max-width: 899px) { .colonne-g, .colonne-d { display: contents; } }

/* ================================================================ COMÈTES ET MOYEU (dans le SVG) === */
.fl-flux { transition: opacity 300ms ease; }
.fl-flux path, .fl-fixe path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fl-lueur { filter: url(#fl-flou); }
.fl-fixe .fl-fleche { stroke: var(--surface-scene); stroke-width: 1; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.hub-halo { fill: var(--maison); opacity: .55; }
.hub-disque { transform-box: fill-box; transform-origin: center; }
.hub-rond { fill: var(--surface-scene); stroke: var(--maison); stroke-width: 1.8; }
.hub-ic { fill: var(--maison); }
#fl-hub.eteint .hub-halo { display: none; }
#fl-hub.eteint .hub-rond { stroke: var(--encre-3); }
#fl-hub.eteint .hub-ic { fill: var(--encre-3); }
.pill .long, .pill .court { align-items: center; gap: 4px; }
.pill .long { display: inline-flex; }
.pill .court { display: none; }
.pill .sep { margin-right: 1px; }
@media (max-width: 359px) { .pill .long { display: none; } .pill .court { display: inline-flex; } .pill .court:empty { display: none; } }
.hero.pills-courtes .pill .long { display: none; }
.hero.pills-courtes .pill .court { display: inline-flex; }
.hero.pills-courtes .pill .court:empty { display: none; }

/* ================================================================ MOUVEMENT RÉDUIT === */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.calme .etoiles .tw, .calme .nuages, .calme .pluie, .calme .ancre.pouls { animation: none !important; }

/* ================================================================ COULEURS FORCÉES (Windows contraste élevé) === */
@media (forced-colors: active) {
  .interrupteur .tr { border: 1px solid CanvasText; background: Canvas; }
  .interrupteur .tr::after { background: CanvasText; forced-color-adjust: none; }
  .interrupteur[aria-checked="true"] .tr { background: Highlight; border-color: Highlight; forced-color-adjust: none; }
  .interrupteur[aria-checked="true"] .tr::after { background: HighlightText; }
  .segments button:is([aria-selected="true"], [aria-checked="true"]) { outline: 2px solid Highlight; outline-offset: -2px; }
  .une-k { position: relative; z-index: 1; }           /* le fond imposé de la ligne du chiffre ne masque plus son intitulé */
  .bm-p, .bm-p i { forced-color-adjust: none; }
  .capsule .pt, .une-k i, .pastel { forced-color-adjust: none; }
}

function puissance(kw) {

};

  const eps = (23.439 - 0.00000036 * d) * RAD;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(eps) * Math.sin(L));
  const gmst = ((18.697374558 + 24.06570982441908 * d) % 24 + 24) % 24;
  const H = (gmst * 15 + lon) * RAD - ra, phi = lat * RAD;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  return { elevation: alt / RAD };
}

/* ------------------------------------------------------- Dérivés de l'état -- */
let MEMO = { jour: null, flux: {}, annonce: null };
const SEUILS = { soleil: [0.030, 0.018], maison: [0.030, 0.018], batterie: [0.030, 0.018], reseau: [0.020, 0.010] };   // allumage / extinction (kW)

function tarifA(e, h) {
  const tf = e.tarif || {};
  const plages = (tf.hc || []).map(([a, b]) => [hDe(a, 22), hDe(b, 6)]);
  const dans = (x, [a, b]) => a < b ? x >= a && x < b : x >= a || x < b;
  const pl = plages.find(p => dans(h, p));
  const hc = !!pl;
  let fin = null;
  if (pl) fin = pl[1];
  else if (plages.length) fin = plages.map(p => p[0]).sort((x, y) => ((x - h + 24) % 24) - ((y - h + 24) % 24))[0];
  const couleur = tf.couleur || 'bleu';
  return { option: tf.option || 'tempo', couleur, periode: hc ? 'HC' : 'HP', hc, fin, prix: tf.prix?.[couleur]?.[hc ? 'hc' : 'hp'] ?? null };
}

/* Fin de charge de la batterie : suit la prévision solaire (l'excédent sur la consommation actuelle). */
function finDeCharge(e, h, soleil) {
  const i = e.instantane, inst = e.installation, b = i.batterie;
  const besoin = (100 - i.batterie_pct) / 100 * inst.batterie_kWh;
  const c = e.courbe || {}, pas_h = c.pas_h || 0.5;
  const prev = (c.prevision || []).map((v, k) => v == null ? null : [k * pas_h, v]).filter(x => x && x[0] > h);
  if (!soleil || !prev.length) return { pleine: h + besoin / b, socFin: null, finCharge: null };
  const pts = [[h, i.production], ...prev], appoint = Math.max(0, i.reseau), dt = 1 / 12;
  let kwh = 0, finCharge = h;
  for (let k = 0; k < pts.length - 1; k++) {
    const [t0, p0] = pts[k], [t1, p1] = pts[k + 1];
    for (let t = t0; t < t1 - 1e-9; t += dt) {
      const d = Math.min(dt, t1 - t), pr = p0 + (p1 - p0) * (t + d / 2 - t0) / (t1 - t0);
      const charge = Math.min(b, Math.max(0, pr - i.maison) + appoint);
      if (charge > 0 && kwh + charge * d >= besoin) return { pleine: t + (besoin - kwh) / charge, socFin: null, finCharge: null };
      kwh += charge * d;
      if (charge > 0) finCharge = t + d;
    }
  }
  return { pleine: null, socFin: Math.min(100, i.batterie_pct + 100 * kwh / inst.batterie_kWh), finCharge };
}
function texteCharge(d, soc) {
  if (d.pleine != null && d.pleine < 24) return `pleine vers ${heureTxt(arrondi5(d.pleine))}`;
  if (d.socFin != null && Math.round(d.socFin) > Math.round(soc)) return `≈${NBSP}${pct(d.socFin)}${NNBSP}% vers ${heureTxt(arrondi5(d.finCharge))}`;
  return '';
}

function calculerFlux(e, horsligne, coupure, aBatterie) {
  const i = e.instantane || {};
  const val = { soleil: Math.max(0, i.production ?? 0), maison: i.maison ?? 0, batterie: aBatterie ? (i.batterie ?? 0) : 0, reseau: coupure ? 0 : (i.reseau ?? 0) };
  const out = {};
  for (const [nom, v] of Object.entries(val)) {
    const a = Math.abs(v), [on, off] = SEUILS[nom];
    let actif = MEMO.flux[nom] ? a >= off : a > on - 1e-9;
    if (horsligne) actif = false;
    MEMO.flux[nom] = actif;
    const u = Math.sqrt(borne(a / 3, 0, 1));
    let phase;
    if (nom === 'soleil') phase = 'ent';
    else if (nom === 'maison') phase = 'sor';
    else if (nom === 'batterie') phase = v > 0 ? 'sor' : 'ent inv';
    else phase = v < 0 ? 'sor' : 'ent inv';
    out[nom] = { actif, phase, kW: a, u, signe: Math.sign(v) };
  }
  return out;
}

/* Fraîcheur des données (sans effet de bord : la minuterie de 15 s l'appelle seule) */
function fraicheur(e, h) {
  const fr = e.fraicheur || {};
  const age = fini(fr.age_s) ? fr.age_s : fr.derniere_maj ? Math.max(0, (Date.now() - Date.parse(fr.derniere_maj)) / 1000) : 0;
  return { age, horsligne: age >= 900 || fr.connecte === false, derniere: fr.derniere_maj ? heureLocale(fr.derniere_maj, e.fuseau).h : h };
}

function deriver(e) {
  const i = e.instantane || {}, j = e.jour || {}, inst = e.installation || {};
  const { date, h } = heureLocale(e.horodatage, e.fuseau);
  const lever = hDe(e.soleil?.lever, 7), coucher = hDe(e.soleil?.coucher, 19);
  const midiSol = (lever + coucher) / 2;
  const E = fini(e.soleil?.elevation) ? e.soleil.elevation : positionSoleil(date, e.lieu?.lat ?? 48.85, e.lieu?.lon ?? 2.35).elevation;
  const matin = h < midiSol;
  const cle = E >= 10 ? 'jour' : E >= -1 ? (matin ? 'aube' : 'doree') : E >= -8 ? 'crepuscule' : 'nuit';
  const progres = borne((h - lever) / (coucher - lever), 0, 1);
  const { age, horsligne, derniere } = fraicheur(e, h);
  const coupure = e.reseau_etat === 'coupure';
  const aBatterie = (inst.batterie_kWh ?? 0) > 0;
  const p = Math.max(0, i.production ?? 0), b = i.batterie ?? 0, soc = borne(i.batterie_pct ?? 0, 0, 100);
  // le chiffre : production le jour, maison le soir (hystérésis 80 W / 30 W)
  let jour = MEMO.jour;
  if (p >= 0.08) jour = true; else if (p < 0.03) jour = false; else if (jour == null) jour = E > 0;
  MEMO.jour = jour;
  const mode_une = horsligne ? 'horsligne' : coupure ? 'coupure' : jour ? 'soleil' : 'maison';
  const tarif = tarifA(e, h);
  // batterie
  let pleine = null, socFin = null, finCharge = null;
  if (aBatterie && b > 0.02 && soc < 100) ({ pleine, socFin, finCharge } = finDeCharge(e, h, p > 0.05));
  const P15 = fini(i.maison_15min) ? i.maison_15min : Math.abs(b);
  const utile = aBatterie ? Math.max(0, (soc - (inst.reserve_pct ?? 0)) / 100 * inst.batterie_kWh) : 0;
  const decharge = aBatterie && (b < -0.02 || coupure);
  const tenue_h = decharge && P15 > 0.01 ? tronque5(utile / P15) : null;     // affichée telle quelle (multiple de 5 min)
  const finTenue = tenue_h != null ? tronque5(h + utile / P15) : null;
  const tenue_reduite_h = tenue_h != null ? tronque5(2 * utile / P15) : null;
  // bilans du jour
  const autonomie = j.maison > 0 ? 100 * (1 - (j.import ?? 0) / j.maison) : null;
  const autoconso = j.production > 0 ? 100 * (1 - (j.export ?? 0) / j.production) : null;
  const evite = (j.autoconso_directe ?? 0) + (j.decharge_batterie ?? 0);
  const prixHP = e.tarif?.prix?.[tarif.couleur]?.hp ?? 0.1552;
  const economiesEstimees = !fini(j.economies_eur);
  const economies = economiesEstimees ? evite * prixHP : j.economies_eur;
  // reste de la prévision du jour (kWh) : les créneaux à venir, plus la fin du créneau en cours au rythme actuel
  const c = e.courbe || {}, pas = c.pas_h || 0.5;
  const kNow = Math.floor(h / pas + 1e-9), finCreneau = (kNow + 1) * pas - h;
  const enCours = c.prevision?.[kNow] ?? (c.production?.[kNow] != null || p > 0 ? p : 0);
  const reste = (c.prevision || []).reduce((a, v, k) => a + (v != null && k > kNow ? v * pas : 0), 0) + (h < coucher ? enCours * finCreneau : 0);
  const flux = calculerFlux(e, horsligne, coupure, aBatterie);
  return { date, h, lever, coucher, midiSol, E, matin, cle, progres, age, horsligne, derniere, coupure, aBatterie, mode_une, tarif,
    pleine, socFin, finCharge, P15, utile, tenue_h, finTenue, tenue_reduite_h, autonomie, autoconso, evite, economies, economiesEstimees, prixHP, reste, flux, soc,
    kWmax: Math.max(inst.puissanceCrete_kWc ?? 0, inst.batterie_kW_max ?? 0, 3) };
}

/* ================================================================ TEXTES === */
const plageHC = (e) => { const p = e.tarif?.hc?.[0]; return p ? [hDe(p[0], 22), hDe(p[1], 6)] : [22, 6]; };
const nomPeriode = hc => hc ? 'heures creuses' : 'heures pleines';
const nomCouleur = c => ({ bleu: 'Bleu', blanc: 'Blanc', rouge: 'Rouge' }[c] || '');
const SWATCH = { bleu: 'var(--tempo-bleu)', blanc: 'var(--tempo-blanc)', rouge: 'var(--tempo-rouge)' };

/* La phrase du héros : { longue, courte } (la courte perd la seconde proposition) */
function phrase(e, d) {
  const i = e.instantane || {}, inst = e.installation || {};
  const p = Math.max(0, i.production ?? 0), m = i.maison ?? 0, b = i.batterie ?? 0, r = i.reseau ?? 0, soc = d.soc;
  const F = d.flux, enCharge = F.batterie.actif && b > 0, enDecharge = F.batterie.actif && b < 0, achat = F.reseau.actif && r > 0, vente = F.reseau.actif && r < 0;
  const une = t => ({ longue: t, courte: t });
  if (d.mode_une === 'coupure') {
    const fin = d.finTenue != null ? heureTxt(d.finTenue) : '—';
    return {
      longue: `La batterie alimente la maison. À ce rythme (${pTxt(d.P15)}), jusqu’à ≈${NBSP}${fin}${NBSP}; ≈${NBSP}${duree(d.tenue_reduite_h)} en divisant la consommation par deux.`,
      courte: `La batterie alimente la maison. À ce rythme (${pTxt(d.P15)}), jusqu’à ≈${NBSP}${fin}.`
    };
  }
  if (d.mode_une === 'horsligne') {
    return { longue: `Plus de nouvelles de la passerelle depuis ${duree(d.age / 3600)}. Les valeurs affichées datent de ${heureTxt(d.derniere)}.`,
             courte: `Plus de nouvelles de la passerelle depuis ${duree(d.age / 3600)}.` };
  }
  const ciel = e.meteo?.maintenant?.ciel;
  if (d.mode_une === 'soleil') {
    const c = e.courbe || {}, k = Math.floor(d.h / (c.pas_h || .5));
    const prevu = c.prevision?.[k] ?? c.prevision?.[k + 1];
    if (['couvert', 'pluie', 'orage'].includes(ciel) && fini(prevu) && p < prevu * .5) return une(`Ciel couvert${NBSP}: le toit produit peu, ${enDecharge ? 'la batterie' : 'le réseau'} complète la maison.`);
    if (p >= m) {
      if (d.aBatterie && soc >= 99) return une(`Batterie pleine${NBSP}: le surplus du toit part au réseau.`);
      if (enCharge) {
        const tc = texteCharge(d, soc);
        return tc ? { longue: `Le soleil couvre la maison et charge la batterie (${tc}).`, courte: 'Le soleil couvre la maison et charge la batterie.' }
                  : une('Le soleil couvre la maison, charge la batterie et vend le surplus.');
      }
      return une(vente ? 'Le soleil couvre la maison et vend le surplus.' : 'Le soleil couvre toute la maison.');
    }
    const x = pct(100 * p / Math.max(m, 0.001));
    if (enDecharge && achat) return une(`Le soleil couvre ${x}${NNBSP}% de la maison${NBSP}; la batterie et le réseau complètent.`);
    if (enDecharge) return une(`Le soleil couvre ${x}${NNBSP}% de la maison, la batterie complète.`);
    if (achat) return une(`Le soleil couvre ${x}${NNBSP}% de la maison, le réseau complète en ${nomPeriode(d.tarif.hc)}.`);
    return une(`Le soleil couvre ${x}${NNBSP}% de la maison.`);
  }
  // soir et nuit
  if (e.mode === 'heures_creuses' && enCharge && achat) {
    const fin = d.pleine != null ? heureTxt(arrondi5(d.pleine)) : '—';
    return une(`La batterie se charge en heures creuses, pleine vers ${fin}.`);
  }
  if (enDecharge && achat) {
    const tete = `La batterie (${pTxt(b)}) et le réseau (${pTxt(r)}, ${nomPeriode(d.tarif.hc)}) alimentent la maison`;
    return { longue: `${tete}.`, courte: 'La batterie et le réseau alimentent la maison.' };
  }
  if (enDecharge && d.tenue_h != null) {
    if (d.tenue_h >= 24) return une('La batterie alimente la maison, plus de 24 h au rythme actuel.');
    return { longue: `La batterie alimente la maison, jusqu’à ≈${NBSP}${heureTxt(d.finTenue)} au rythme actuel.`, courte: 'La batterie alimente la maison.' };
  }
  if (achat) {
    const res = inst.reserve_pct ?? 0;
    const tete = d.aBatterie && soc <= res + 1 ? `Batterie à sa réserve (${res}${NNBSP}%)${NBSP}: le réseau prend le relais en ${nomPeriode(d.tarif.hc)}` : `Le réseau alimente la maison en ${nomPeriode(d.tarif.hc)}`;
    return { longue: `${tete}${d.tarif.fin != null ? `, jusqu’à ${heureTxt(d.tarif.fin)}` : ''}.`, courte: `${tete}.` };
  }
  return une('La maison consomme peu, tout est au calme.');
}

/* En ce moment : ce que fait le système, pourquoi, et la suite (≤ 3 lignes « Ensuite ») */
function enCeMoment(e, d) {
  const i = e.instantane || {}, inst = e.installation || {};
  const p = Math.max(0, i.production ?? 0), m = i.maison ?? 0, b = i.batterie ?? 0, r = i.reseau ?? 0, soc = d.soc;
  const F = d.flux, enCharge = F.batterie.actif && b > 0, enDecharge = F.batterie.actif && b < 0, achat = F.reseau.actif && r > 0, vente = F.reseau.actif && r < 0;
  const [debHC, finHC] = plageHC(e);
  const res = inst.reserve_pct ?? 0, cap = inst.batterie_kWh ?? 0;
  const leverSuivant = d.h > d.coucher ? hDe(e.soleil?.lever_demain, d.lever) + 24 : d.lever;
  const corps = [], ensuite = [];
  const tarifDe = hh => { const t = ((hh % 24) + 24) % 24; return (debHC > finHC ? (t >= debHC || t < finHC) : (t >= debHC && t < finHC)); };
  if (d.mode_une === 'coupure') {
    corps.push(`Votre maison est protégée${NBSP}: la batterie prend tout en charge. Elle délivre au plus ${nombre(inst.batterie_kW_max ?? 5, 0)}${NBSP}kW${NBSP}: évitez de lancer le four et les plaques en même temps.`);
    if (d.tenue_reduite_h != null) corps.push(`À ce rythme (${pTxt(d.P15)}, moyenne des 15 dernières minutes), elle tient ≈${NBSP}${duree(d.tenue_h)}${NBSP}; ≈${NBSP}${duree(d.tenue_reduite_h)} en divisant la consommation par deux.`);
    if (d.tenue_h != null) ensuite.push({ t: `≈${NBSP}${heureTxt(d.finTenue)}`, g: 'reseau', x: 'Réserve atteinte si la coupure dure' });
    ensuite.push({ t: 'Dès le retour du réseau', g: 'batterie', x: 'Recharge en heures creuses', long: true });
    return { corps, ensuite };
  }
  if (d.mode_une === 'horsligne') {
    corps.push(`Breezy ne reçoit plus de données depuis ${heureTxt(d.derniere)} (${duree(d.age / 3600)}).`);
    corps.push('Vérifiez que la box internet et Home Assistant sont allumés. Les chiffres ci-dessus sont les derniers connus.');
    return { corps, ensuite, lien: true };
  }
  const finHP = tarifDe(d.h) ? null : debHC;
  // énergie de la batterie au coucher du soleil, puis heure de la réserve (consommation moyenne des soirées)
  const conso = e.prevision?.conso_soiree_kW ?? (m || 0.6);
  const reserveDepuis = (t, socT) => t + Math.max(0, (socT - res) / 100 * cap) / Math.max(conso, 0.05);
  // réserve atteinte au rythme de décharge actuel de la batterie (le réseau peut fournir le reste de la maison)
  const reserveAuRythme = () => Math.abs(b) > 0.01 && d.utile > 0 ? tronque5(d.h + d.utile / Math.abs(b)) : null;
  if (d.mode_une === 'soleil') {
    if (p >= m) {
      if (enCharge) {
        corps.push('Le surplus du toit remplit la batterie.');
        let socCoucher = soc;
        if (d.pleine != null && d.pleine <= d.coucher) { ensuite.push({ t: `≈${NBSP}${heureTxt(arrondi5(d.pleine))}`, g: 'batterie', x: 'Batterie pleine' }); socCoucher = 100; }
        else if (d.socFin != null) { ensuite.push({ t: `≈${NBSP}${heureTxt(arrondi5(d.finCharge))}`, g: 'batterie', x: `Fin de charge, ≈${NBSP}${pct(d.socFin)}${NNBSP}%` }); socCoucher = d.socFin; }
        const tRes = reserveDepuis(d.coucher, socCoucher);
        const jusqua = finHP != null && tRes > finHP ? heureTxt(finHP) : `≈${NBSP}${heureTxt(finBatt(tRes))}`;
        corps[0] += ` Au coucher du soleil (${heureTxt(d.coucher)}), elle prendra le relais pour éviter d’acheter en heures pleines, jusqu’à ${jusqua}.`;
        ensuite.push({ t: heureTxt(d.coucher), g: 'coucher', x: 'La batterie alimente la maison' });
        if (tRes < leverSuivant + (d.h > d.coucher ? 0 : 24)) ensuite.push({ t: `≈${NBSP}${heureTxt(finBatt(tRes))}`, g: 'reseau', x: `Réserve atteinte${NBSP}: le réseau prend le relais en ${nomPeriode(tarifDe(tRes))}` });
        else ensuite.push({ t: heureTxt(hDe(e.soleil?.lever_demain, d.lever)), g: 'lever', x: 'La batterie tient jusqu’au lever du soleil' });
      } else if (d.aBatterie && soc >= 99) {
        corps.push(`La batterie est pleine${NBSP}: le surplus du toit part au réseau, payé ${nombre(inst.tarifRevente_eur_kWh ?? 0.04, 2)}${NBSP}€/kWh. Gardez les gros appareils pour maintenant${NBSP}: ils tournent au soleil.`);
        ensuite.push({ t: heureTxt(d.coucher), g: 'coucher', x: 'La batterie alimente la maison' });
      } else {
        corps.push('Le toit couvre toute la maison.' + (vente ? ' Le surplus part au réseau.' : ''));
        ensuite.push({ t: heureTxt(d.coucher), g: 'coucher', x: 'Coucher du soleil' });
      }
    } else {
      corps.push(enDecharge && achat ? `Le toit ne couvre pas toute la maison${NBSP}: la batterie (${pTxt(b)}) et le réseau (${pTxt(r)}, ${nomPeriode(d.tarif.hc)}, ${nombre(d.tarif.prix ?? 0, 4)}${NBSP}€/kWh) complètent.`
        : enDecharge ? `Le toit ne couvre pas toute la maison${NBSP}: la batterie complète pour éviter d’acheter au réseau.`
        : achat ? `Le toit ne couvre pas toute la maison${NBSP}: le réseau complète, en ${nomPeriode(d.tarif.hc)} (${nombre(d.tarif.prix ?? 0, 4)}${NBSP}€/kWh).` : 'Le toit couvre une partie de la maison.');
      ensuite.push({ t: heureTxt(d.coucher), g: 'coucher', x: 'Coucher du soleil' });
      const tB = enDecharge ? reserveAuRythme() : null;
      if (tB != null) ensuite.push({ t: `≈${NBSP}${heureTxt(tB)}`, g: 'reseau', x: 'Réserve atteinte au rythme actuel' });
    }
    return { corps, ensuite: ensuite.slice(0, 3) };
  }
  // soir et nuit
  if (e.mode === 'heures_creuses' && enCharge && achat) {
    const fin = d.pleine != null && d.pleine < 48 ? heureTxt(arrondi5(d.pleine)) : null;
    corps.push(`La batterie se charge sur le réseau en heures creuses (${nombre(d.tarif.prix ?? 0, 4)}${NBSP}€/kWh)${fin ? `, pleine vers ${fin}` : ''}.`);
    corps.push('Elle gardera cette énergie pour les heures pleines, quand le prix est le plus haut.');
    const ev = [];
    if (fin) ev.push({ at: d.pleine < d.h ? d.pleine + 24 : d.pleine, t: `≈${NBSP}${fin}`, g: 'batterie', x: 'Batterie pleine' });
    ev.push({ at: finHC + (finHC < d.h ? 24 : 0), t: heureTxt(finHC), g: 'horloge', x: 'Fin des heures creuses' });
    ev.push({ at: leverSuivant, t: heureTxt(leverSuivant), g: 'lever', x: `Lever du soleil${NBSP}: le toit reprend la main` });
    ev.sort((a, c) => a.at - c.at).slice(0, 3).forEach(x => ensuite.push(x));
    return { corps, ensuite };
  }
  if (enDecharge && achat) {
    corps.push(`La batterie (${pTxt(b)}) et le réseau (${pTxt(r)}) alimentent ensemble la maison, en ${nomPeriode(d.tarif.hc)} (${nombre(d.tarif.prix ?? 0, 4)}${NBSP}€/kWh).`);
    const tB = reserveAuRythme();
    const ev = [];
    if (tB != null) {
      corps.push(`Au rythme actuel de la batterie, sa réserve sera atteinte vers ${heureTxt(tB)}${NBSP}; ensuite, le réseau alimentera seul la maison.`);
      ev.push({ at: tB, t: `≈${NBSP}${heureTxt(tB)}`, g: 'reseau', x: `Réserve atteinte${NBSP}: le réseau prend le relais en ${nomPeriode(tarifDe(tB))}` });
    }
    if (!d.tarif.hc) ev.push({ at: debHC + (debHC < d.h ? 24 : 0), t: heureTxt(debHC), g: 'horloge', x: 'Début des heures creuses' });
    ev.push({ at: leverSuivant, t: heureTxt(leverSuivant), g: 'lever', x: `Lever du soleil${NBSP}: le toit reprend la main` });
    ev.sort((a, c) => a.at - c.at).slice(0, 3).forEach(x => ensuite.push(x));
    return { corps, ensuite };
  }
  if (enDecharge && d.tenue_h != null) {
    const tRes = d.finTenue;
    corps.push(d.tarif.hc ? 'La batterie alimente la maison avec l’énergie du soleil de la journée.' : `Le soleil est couché${NBSP}: la batterie alimente la maison pour éviter d’acheter en heures pleines.`);
    if (tRes < leverSuivant) corps.push(`Au rythme actuel (${pTxt(Math.abs(b))}), elle tiendra jusqu’à ≈${NBSP}${heureTxt(tRes)}${NBSP}; ensuite, le réseau prendra le relais en ${nomPeriode(tarifDe(tRes))}.`);
    else corps.push(`Au rythme actuel (${pTxt(Math.abs(b))}), elle tiendra jusqu’au lever du soleil (${heureTxt(leverSuivant)}).`);
    const ev = [];
    if (!d.tarif.hc) ev.push({ at: debHC + (debHC < d.h ? 24 : 0), t: heureTxt(debHC), g: 'horloge', x: 'Début des heures creuses' });
    if (tRes < leverSuivant) ev.push({ at: tRes, t: `≈${NBSP}${heureTxt(tRes)}`, g: 'reseau', x: `Réserve atteinte${NBSP}: le réseau prend le relais en ${nomPeriode(tarifDe(tRes))}` });
    ev.push({ at: finHC + (finHC < d.h ? 24 : 0), t: heureTxt(finHC), g: 'horloge', x: 'Fin des heures creuses' });
    ev.push({ at: leverSuivant, t: heureTxt(leverSuivant), g: 'lever', x: `Lever du soleil${NBSP}: le toit reprend la main` });
    ev.sort((a, c) => a.at - c.at).slice(0, 3).forEach(x => ensuite.push(x));
    return { corps, ensuite };
  }
  if (achat) {
    if (d.aBatterie && soc <= res + 1) corps.push(`La batterie a atteint sa réserve de ${res}${NNBSP}%${NBSP}: elle la garde pour une coupure.`);
    corps.push(`Le réseau alimente la maison en ${nomPeriode(d.tarif.hc)} (${nombre(d.tarif.prix ?? 0, 4)}${NBSP}€/kWh)${d.tarif.hc ? ', au tarif le plus bas' : ''}.`);
    const ev = [];
    if (d.tarif.hc) {
      const cd = e.tarif?.couleur_demain;
      const prixHP = cd ? e.tarif?.prix?.[cd]?.hp : null;
      ev.push({ at: finHC + (finHC < d.h ? 24 : 0), t: heureTxt(finHC), g: 'horloge', x: cd ? `Heures pleines, jour Tempo ${nomCouleur(cd)} (${nombre(prixHP ?? 0, 4)}${NBSP}€/kWh)` : 'Fin des heures creuses' });
    } else ev.push({ at: debHC + (debHC < d.h ? 24 : 0), t: heureTxt(debHC), g: 'horloge', x: 'Début des heures creuses' });
    ev.push({ at: leverSuivant, t: heureTxt(leverSuivant), g: 'lever', x: `Lever du soleil${NBSP}: le toit reprend la maison` });
    ev.push({ at: leverSuivant + 2.5, t: `≈${NBSP}${heureTxt(arrondi5(leverSuivant + 2.5))}`, g: 'batterie', x: 'La batterie se recharge au soleil' });
    ev.sort((a, c) => a.at - c.at).slice(0, 3).forEach(x => ensuite.push(x));
    return { corps, ensuite };
  }
  corps.push('Tout est au calme. La maison consomme peu et la batterie attend le soleil.');
  ensuite.push({ t: heureTxt(leverSuivant), g: 'lever', x: 'Lever du soleil' });
  return { corps, ensuite };
}

/* ================================================================ HÉROS === */
const A = { PANNEAUX: [470, 190], PANNEAUX_G: [330, 175], LUCARNE: [773, 285], BATTERIE: [508, 668], RESEAU: [900, 743], HUB: [759, 538] };
let PHRASE = { longue: '', courte: '' }, PASTILLES = [], UNE_VAL = null;

function rendreHero(e, d) {
  const i = e.instantane || {}, une = $('une');
  const modes = {
    soleil: { k: 'Production solaire', c: 'var(--soleil)', v: i.production, fiche: 'soleil', ancre: A.PANNEAUX, sr: 'Ouvrir le détail du soleil' },
    maison: { k: 'La maison consomme', c: 'var(--maison)', v: i.maison, fiche: 'maison', ancre: A.LUCARNE, sr: 'Ouvrir le détail de la maison' },
    coupure: { k: 'Coupure réseau', c: 'var(--alerte)', fiche: 'batterie', sr: 'Ouvrir le détail de la batterie' },

  };
  const M = modes[d.mode_une];
  une.dataset.fiche = M.fiche;
  une.style.setProperty('--c', M.c);
  une.classList.toggle('perime', d.mode_une === 'horsligne');
  $('une-k').querySelector('span').textContent = M.k;
  let html, srv, num = null;
  if (d.mode_une === 'coupure') {
    const t = d.tenue_h != null ? Math.round(d.tenue_h * 12) * 5 : null;
    html = t == null ? '—' : `${Math.floor(t / 60)}<span class="u mid">h</span>${String(t % 60).padStart(2, '0')}`;
    srv = t == null ? 'autonomie inconnue' : `${duree(d.tenue_h).replace(NBSP + 'h' + NBSP, ' heures ').replace(NBSP + 'h', ' heures')} d’autonomie sur batterie`;
  } else {
    const v = d.mode_une === 'horsligne' ? (MEMO.derniereUne ?? i.production) : M.v;
    const pw = puissance(v);
    html = pw.u ? unite(pw.n, pw.u) : pw.n;
    num = pw;
    srv = `${pLong(v)}`;
  }
  if (d.mode_une !== 'horsligne') MEMO.derniereUne = d.mode_une === 'soleil' ? i.production : d.mode_une === 'maison' ? i.maison : MEMO.derniereUne;
  // décompte : seulement si la valeur bouge d'au moins 2 %
  const el = $('une-v');
  if (num && UNE_VAL && UNE_VAL.u === num.u && fini(UNE_VAL.x) && !immobile() && Math.abs(num.w - UNE_VAL.w) / Math.max(UNE_VAL.w, 1) >= .02) {
    const de = UNE_VAL.w, a = num.w, unit = num.u, t0 = performance.now();
    cancelAnimationFrame(el._raf);
    const pas = t => {
      const k = Math.min(1, (t - t0) / 600), x = de + (a - de) * (1 - Math.pow(1 - k, 3));
      const n = unit === 'kW' ? nombre(x / 1000, 2) : nombre(Math.round(x / 10) * 10, 0);
      el.innerHTML = k < 1 ? unite(n, unit) : html;
      if (k < 1) el._raf = requestAnimationFrame(pas);
    };
    el._raf = requestAnimationFrame(pas);
  } else el.innerHTML = html;
  UNE_VAL = num ? { ...num, x: num.w } : null;
  une.setAttribute('aria-label', `${M.k}${NBSP}: ${srv}. ${M.sr}`);
  PHRASE = phrase(e, d);
  const ph = $('une-phrase');
  if (!ph.dataset.choix || ph.textContent !== PHRASE[ph.dataset.choix]) ph.textContent = PHRASE[ph.dataset.choix || 'longue'];
  MEMO.ancreUne = d.mode_une === 'soleil' || d.mode_une === 'maison' ? M.ancre : null;
  MEMO.couleurUne = M.c;
  rendrePastilles(e, d);
}

/* Pastilles : où elles vont (ciel ou sol), leur ancre, leur texte long et court */
function rendrePastilles(e, d) {
  const i = e.instantane || {}, F = d.flux;
  const perime = d.mode_une === 'horsligne', h0 = heureTxt(d.derniere);
  const b = i.batterie ?? 0, r = i.reseau ?? 0;
  const sep = '<span class="sep">·</span>';
  const L = [];
  const avecHeure = (v, s) => perime ? [v, `${sep}${h0}`] : [v, s];
  // Soleil (seulement quand le chiffre n'est pas la production)
  const pSol = { id: 'soleil', place: 'ciel', ancre: A.PANNEAUX_G, c: 'var(--soleil)', ct: 'var(--soleil-t)', g: icone('soleil') };
  if (perime) Object.assign(pSol, { long: avecHeure(pTxt(i.production), ''), court: [pTxt(i.production), ''], cls: 'perime', label: `Soleil${NBSP}: ${pLong(i.production)} à ${h0}, dernière valeur connue. Ouvrir le détail` });
  else if (!F.soleil.actif) Object.assign(pSol, { long: [pTxt(0), `${sep}au repos`], court: ['', 'au repos'], cls: 'repos', label: `Soleil${NBSP}: panneaux au repos. Ouvrir le détail` });
  else Object.assign(pSol, { long: [pTxt(i.production), ''], court: [pTxt(i.production), ''], cls: '', label: `Soleil${NBSP}: ${pLong(i.production)} produits. Ouvrir le détail` });
  // Maison
  const pMai = { id: 'maison', place: 'ciel', ancre: A.LUCARNE, c: 'var(--maison)', ct: 'var(--maison-t)', g: icone('maison') };
  const mNon = !fini(i.maison);
  Object.assign(pMai, {
    long: perime ? avecHeure(pTxt(i.maison), '') : [mNon ? 'non mesuré' : pTxt(i.maison), ''], court: [mNon ? 'non mesuré' : pTxt(i.maison), ''],
    cls: perime ? 'perime' : '', label: mNon ? 'Maison : consommation non mesurée. Ouvrir le détail' : `Maison${NBSP}: ${pLong(i.maison)} consommés${perime ? ` à ${h0}, dernière valeur connue` : ''}. Ouvrir le détail`
  });
  // Batterie
  const inst = e.installation || {}, stock = d.soc / 100 * (inst.batterie_kWh ?? 0);
  const pBat = { id: 'batterie', place: 'sol', ancre: A.BATTERIE, c: 'var(--batterie)', ct: 'var(--batterie-t)', g: icone('batterie') };
  const socTxt = `${pct(d.soc)}${NNBSP}%`;
  let bS, bC, bLab;
  if (perime) { bS = `${sep}${h0}`; bC = ''; bLab = `à ${h0}, dernière valeur connue`; }
  else if (F.batterie.actif && b > 0) { bS = `${sep}${fleche('haut')}${pTxt(b)}`; bC = `${fleche('haut')}${pTxt(b)}`; bLab = `en charge à ${pLong(b)}`; }
  else if (F.batterie.actif && b < 0) { bS = `${sep}${fleche('bas')}${pTxt(b)}`; bC = `${fleche('bas')}${pTxt(b)}`; bLab = `en décharge à ${pLong(b)}`; }
  else { bS = `${sep}au repos`; bC = ''; bLab = 'au repos'; }
  Object.assign(pBat, { long: [socTxt, bS], court: [socTxt, bC], cls: perime ? 'perime' : '', label: `Batterie${NBSP}: ${pct(d.soc)} %, ${bLab}, ${nombre(stock, 1)} kilowattheures stockés. Ouvrir le détail` });
  // Réseau
  const pRes = { id: 'reseau', place: 'sol', ancre: A.RESEAU, c: 'var(--reseau)', ct: 'var(--reseau-t)', g: icone('reseau') };
  if (d.coupure) Object.assign(pRes, { long: ['coupé', ''], court: ['coupé', ''], cls: 'coupe', g: icone('reseauCoupe'), label: `Réseau${NBSP}: coupé depuis ${e.coupure?.depuis ? heureTxt(heureLocale(e.coupure.depuis, e.fuseau).h) : '—'}. Ouvrir le détail` });
  else if (perime) Object.assign(pRes, { long: [`${r < 0 ? fleche('vente') : r > 0 ? fleche('achat') : ''}${pTxt(r)}`, `${sep}${h0}`], court: [pTxt(r), ''], cls: 'perime', label: `Réseau${NBSP}: ${r < 0 ? 'vente' : r > 0 ? 'achat' : 'au repos'} de ${pLong(r)} à ${h0}, dernière valeur connue. Ouvrir le détail` });
  else if (F.reseau.actif && r < 0) Object.assign(pRes, { long: [`${fleche('vente')}${pTxt(r)}`, `${sep}vente`], court: [`${fleche('vente')}${pTxt(r)}`, ''], cls: '', label: `Réseau${NBSP}: vente de ${pLong(r)}. Ouvrir le détail` });
  else if (F.reseau.actif && r > 0) Object.assign(pRes, { long: [`${fleche('achat')}${pTxt(r)}`, `${sep}achat`], court: [`${fleche('achat')}${pTxt(r)}`, ''], cls: '', label: `Réseau${NBSP}: achat de ${pLong(r)}. Ouvrir le détail` });
  else Object.assign(pRes, { long: [pTxt(0), `${sep}au repos`], court: ['', 'au repos'], cls: 'repos', label: `Réseau${NBSP}: au repos. Ouvrir le détail` });

  if (d.mode_une === 'soleil') L.push(pMai);
  else if (d.mode_une === 'maison') L.push(pSol);
  else L.push(pSol, pMai);
  if (d.aBatterie) L.push(pBat);
  L.push(pRes);
  PASTILLES = L;
  const ul = $('pastilles');
  for (const id of ['soleil', 'maison', 'batterie', 'reseau']) {
    let bt = ul.querySelector(`[data-noeud="${id}"]`);
    if (!bt) {
      const li = document.createElement('li');
      li.innerHTML = `<button class="pill cache" type="button" data-noeud="${id}" data-fiche="${id}"></button>`;
      ul.appendChild(li); bt = li.firstChild;
      bt.addEventListener('pointerenter', () => pulserAncre(id));
      bt.addEventListener('focus', () => pulserAncre(id));
    }
    const P = L.find(x => x.id === id);
    // pastille absente : tout son <li> sort de la liste (lecteur d'écran), le bouton s'efface en fondu
    if (!P) { bt.classList.add('cache'); bt.setAttribute('tabindex', '-1'); bt.parentElement.setAttribute('aria-hidden', 'true'); continue; }
    bt.removeAttribute('tabindex'); bt.parentElement.removeAttribute('aria-hidden');
    bt.className = `pill ${P.cls || ''}`.trim();
    bt.style.setProperty('--c', P.c); bt.style.setProperty('--ct', P.ct);
    const seg = ([v, s]) => `${v ? `<span class="v">${v}</span>` : ''}${s ? `<span class="s">${s}</span>` : ''}`;
    const html = `<span class="g" aria-hidden="true">${P.g}</span><span class="long" aria-hidden="true">${seg(P.long)}</span><span class="court" aria-hidden="true">${seg(P.court)}</span>`;
    if (bt.innerHTML !== html) bt.innerHTML = html;
    bt.setAttribute('aria-label', P.label);
  }
}
function pulserAncre(id) {
  if (immobile()) return;
  const a = $('fils').querySelector(`.ancre[data-noeud="${id}"]`);
  if (!a) return;
  a.classList.remove('pouls'); void a.getBoundingClientRect(); a.classList.add('pouls');
}

/* --- Capsule d'état : en direct, en retard, ou événement (coupure, hors ligne, Tempo rouge demain, veille orage) --- */
function rendreCapsule(e, d) {
  const cap = $('capsule');
  let ev = null;
  // c2 : forme courte (une ligne) quand la barre manque de place ; le chiffre du héros donne déjà le détail en coupure et hors ligne
  if (d.horsligne) ev = { ic: 'horsligne', c: 'oklch(.80 .008 260)', l1: `Hors ligne depuis ${heureTxt(d.derniere)}`, l2: `${e.fraicheur?.source || 'Home Assistant'} ne répond plus`, c2: 'Hors ligne' };
  else if (d.coupure) ev = { ic: 'reseauCoupe', c: 'oklch(.76 .15 27)', l1: 'Coupure réseau', l2: `depuis ${e.coupure?.depuis ? heureTxt(heureLocale(e.coupure.depuis, e.fuseau).h) : '—'} · batterie active`, c2: 'Coupure' };
  else if (e.tarif?.couleur_demain === 'rouge') ev = { ic: 'alerte', c: 'oklch(.76 .15 27)', l1: 'Tempo rouge demain', l2: `6 h – 22 h${NBSP}: ${nombre(e.tarif?.prix?.rouge?.hp ?? 0, 4)}${NBSP}€/kWh`, c2: 'Rouge demain' };
  else if (e.veille_orage?.active) ev = { ic: 'eclair', c: 'oklch(.86 .15 85)', l1: 'Veille orage active', l2: 'charge à 100 % avant 18 h', c2: 'Veille orage' };
  if (ev) {
    cap.className = `capsule evenement${MEMO.capCompacte ? ' compacte' : ''}`;
    cap.dataset.fiche = d.horsligne ? 'statut' : 'alertes';
    cap.style.setProperty('--c', ev.c);
    const html = `<span class="ev-ic">${icone(ev.ic)}</span><span class="ev-t"><span class="ev-1">${ev.l1}</span><span class="ev-2">${ev.l2}</span></span><span class="ev-c" aria-hidden="true">${ev.c2}</span>`;
    if (cap.innerHTML !== html) cap.innerHTML = html;
    cap.setAttribute('aria-label', `${ev.l1}, ${ev.l2}. Ouvrir le détail`);
    return;
  }
  const age = d.age;
  cap.className = 'capsule givre';
  cap.dataset.fiche = 'statut';
  const direct = age < 60;
  cap.style.setProperty('--c', direct ? 'var(--batterie)' : 'var(--soleil)');
  const txt = direct ? 'En direct' : `Il y a ${Math.max(1, Math.round(age / 60))}${NBSP}min`;
  const ageTxt = age < 60 ? `${Math.max(1, Math.round(age))} seconde${Math.round(age) > 1 ? 's' : ''}` : `${Math.round(age / 60)} minute${Math.round(age / 60) > 1 ? 's' : ''}`;
  const html = `<span class="pt" aria-hidden="true"></span><span>${txt}</span>`;
  if (cap.innerHTML !== html) cap.innerHTML = html;
  cap.setAttribute('aria-label', `${direct ? 'Données en direct' : 'Données en retard'}, mises à jour il y a ${ageTxt}. Ouvrir l’état des capteurs`);
}

/* ================================================================ SCÈNE === */
const svg = document.querySelector('#scene svg');
let CADRE = null, SCENE = null;

function rendreScene(e, d) {
  SCENE = d;
  const sombre = themeSombre();
  const hero = $('hero');
  // --- ciel : interpolation OKLab par élévation, puis météo, puis données périmées
  const cles = clesCiel(sombre, d.matin);
  let teintes = [1, 2, 3, 4].map(n => interCles(cles, d.E, n));
  const meteo = e.meteo?.maintenant?.ciel || 'clair';
  const mod = { clair: [1, 0], voile: [.8, 0], nuageux: [.75, 0], couvert: [.35, sombre ? -.02 : -.04], pluie: [.35, sombre ? -.04 : -.06], orage: [.35, sombre ? -.08 : -.10] }[meteo] || [1, 0];
  teintes = teintes.map(t => chroma(t, mod[0], mod[1]));
  if (d.horsligne) teintes = teintes.map(t => chroma(t, .5));
  const [haut, milieu] = teintes;
  // ciel sombre ou clair (ombres du dessin) ; l'encre du texte, elle, est choisie par encrerCiel() sur le ciel réellement derrière le texte
  const yH = luminanceLab(haut), yM = luminanceLab(milieu), yN = luminanceLab(ENCRE.sombre), yB = luminanceLab(ENCRE.claire);
  const ciel = Math.min(contraste(yN, yH), contraste(yN, yM)) >= Math.min(contraste(yB, yH), contraste(yB, yM)) ? 'clair' : 'sombre';
  if (!CADRE) hero.dataset.ciel = ciel;
  MEMO.teintes = teintes; MEMO.fonduCiel = true;
  encrerCiel();
  // --- astre : soleil (E ≥ −1), lune (E < −4)
  const astre = $('astre');
  const soleilVu = d.E >= -1, luneVue = d.E < -4;
  const voile = { voile: .75, couvert: .3 }[meteo] ?? 1;
  const cache = meteo === 'pluie' || meteo === 'orage';
  astre.classList.toggle('lune', !soleilVu && luneVue);
  astre.style.opacity = (soleilVu || luneVue) && !cache ? String(soleilVu ? voile : 1) : '0';
  const cA = melangeLab(lireOklch('.80 .14 60'), lireOklch('.86 .15 85'), lisser(3, 18, d.E));
  astre.style.setProperty('--astre', cssLab(d.horsligne ? chroma(cA, .5) : cA));
  // --- nuages et pluie
  const nb = { voile: 2, nuageux: 3, couvert: 5, pluie: 5, orage: 5 }[meteo] || 0;
  const nuages = $('nuages');
  nuages.dataset.n = nb; nuages.dataset.meteo = meteo;
  nuages.classList.toggle('derive', nb > 0 && !immobile());
  const nuit = d.E < -4;
  nuages.style.setProperty('--nuage', meteo === 'voile' ? 'oklch(1 0 0 / .35)' : meteo === 'orage' ? 'oklch(.36 .012 260 / .8)' : nuit ? 'oklch(.3 .01 260 / .6)' : meteo === 'nuageux' ? 'oklch(1 0 0 / .7)' : 'oklch(.93 .005 260 / .8)');
  $('pluie').hidden = !(meteo === 'pluie' || meteo === 'orage');
  $('pluie').classList.toggle('anim', !immobile());

  // --- la maison : voile (multiplication), teinte, halo, lumières, ombres au sol
  const i = e.instantane || {};
  const vo = interCles(VOILE[sombre ? 'sombre' : 'clair'], d.E, 1);
  const voileEl = svg.querySelector('#voile'), blanc = luminanceLab(vo) > .985;
  voileEl.setAttribute('display', blanc ? 'none' : 'inline');
  voileEl.setAttribute('fill', cssLab(vo));
  const teinte = svg.querySelector('#teinte');
  if (d.cle === 'jour') { teinte.setAttribute('display', 'inline'); teinte.setAttribute('fill', 'url(#gTeinteJour)'); teinte.setAttribute('opacity', sombre ? '.25' : '.35'); }
  else if (d.cle === 'doree' || d.cle === 'aube') { teinte.setAttribute('display', 'inline'); teinte.setAttribute('fill', 'url(#gTeinteDoree)'); teinte.setAttribute('opacity', '.55'); }
  else teinte.setAttribute('display', 'none');
  const HALO = { doree: ['#ffaa60', .35], aube: ['#ffaa60', .35], crepuscule: ['#8a8fff', .34], nuit: ['#7d93ff', .36] }[d.cle];
  const halo = svg.querySelector('#halo');
  halo.setAttribute('display', HALO ? 'inline' : 'none');
  if (HALO) { svg.querySelector('#halo-couleur').setAttribute('flood-color', HALO[0]); halo.setAttribute('opacity', HALO[1]); }
  const soirOuNuit = d.cle === 'crepuscule' || d.cle === 'nuit';
  const auto = {
    pignon: d.cle !== 'jour',
    baies: soirOuNuit,
    lucarne: d.cle !== 'jour',
    applique: soirOuNuit,
    tranchee: !d.horsligne && !d.coupure && d.flux.reseau.actif
  };
  const Lum = e.lumieres && typeof e.lumieres === 'object' ? { ...auto, ...e.lumieres } : auto;
  const allumees = [];
  for (const [k, on] of Object.entries(Lum)) {
    const g = svg.querySelector('#lueur-' + k);
    if (!g) continue;
    g.style.transition = immobile() ? 'none' : 'opacity 1.2s ease';
    g.style.opacity = on ? '1' : '0';
    const fen = svg.querySelector('#fen-' + k);
    if (fen) fen.setAttribute('fill-opacity', on ? '1' : '0');
    if (on && k !== 'tranchee') allumees.push({ pignon: 'le séjour', baies: 'la terrasse', lucarne: 'la chambre sous la lucarne', applique: 'le garage' }[k]);
  }
  svg.querySelector('#flaques').setAttribute('opacity', soirOuNuit && (Lum.baies || Lum.applique) ? '1' : '0');
  // ombres du dessin : grises de jour sur ciel clair, noires sur ciel sombre
  const sombreCiel = ciel === 'sombre';
  svg.querySelectorAll('#sol > g').forEach(g => {
    g.setAttribute('opacity', sombreCiel ? '.6' : g.dataset.o);
    g.querySelectorAll('polygon').forEach(pg => pg.setAttribute('fill', sombreCiel ? '#000' : pg.dataset.f));
  });
  // reflet fixe sur les panneaux, le jour
  const uSol = d.flux.soleil.u;
  svg.querySelector('#reflet-pv').setAttribute('opacity', d.flux.soleil.actif ? (.2 + .1 * uSol).toFixed(2) : '0');
  // LED de la batterie : niveau (bas 718 → haut 617)
  const soc = d.soc / 100;
  const r = $('soc-rect'), yHaut = 718 - 101 * soc;
  r.style.transition = immobile() ? 'none' : 'y .6s ease, height .6s ease';
  r.setAttribute('y', yHaut.toFixed(1)); r.setAttribute('height', (732 - yHaut).toFixed(1));
  const ledHalo = svg.querySelector('#lueur-led');
  if (ledHalo) ledHalo.style.opacity = d.aBatterie ? (0.3 + .7 * soc).toFixed(2) : '0';
  // sans batterie : on retire batterie, gaines et LED
  for (const id of ['led-batterie', 'gaine-coffrets', 'gaine-batterie', 'calque-led']) { const el = svg.querySelector('#' + id); if (el) el.style.display = d.aBatterie ? '' : 'none'; }

  // hors ligne : le signe des dernières valeurs connues ; sinon, l'état des flux (mêmes seuils que les pastilles et les comètes)
  const rs = i.reseau ?? 0, bt = i.batterie ?? 0, F = d.flux;
  const actif = (nom, v, seuil) => d.horsligne ? Math.abs(v) > seuil : F[nom].actif;
  const etatBatt = !d.aBatterie ? 'absente' : actif('batterie', bt, .02) ? (bt > 0 ? `en charge à ${pLong(bt)}` : `en décharge à ${pLong(bt)}`) : 'au repos';
  svg.setAttribute('aria-label',
    `La maison entière${d.horsligne ? `, valeurs de ${heureTxt(d.derniere)}` : ''}. Panneaux solaires ${actif('soleil', i.production ?? 0, .03) ? `produisant ${pLong(i.production)}` : 'au repos'}, ` +
    `maison consommant ${pLong(i.maison)}, batterie à ${pct(d.soc)} % ${etatBatt}, ` +
    `réseau ${d.coupure ? 'coupé' : actif('reseau', rs, .01) ? (rs > 0 ? `en achat, ${pLong(rs)}` : `en vente, ${pLong(rs)}`) : 'au repos'}` +
    (allumees.length ? `. Lumière allumée dans ${allumees.join(', ')}.` : '.'));
}

/* ------------------------------------------------ Encre du héros et voile de lecture ---
   Le texte du héros (marque, menu, chiffre, phrase) est posé sur le ciel. On échantillonne le dégradé réellement
   derrière lui (de la barre au bas de la phrase), on choisit l'encre, sombre ou claire, qui demande le moins d'aide,
   puis, si elle reste sous 4,5:1 (autour de l'aube et du crépuscule, ciel mauve), on pose en haut du ciel un voile
   de sa propre teinte, plus clair ou plus sombre, juste assez opaque pour l'atteindre. L'encre secondaire
   (intitulé, unité, menu) se rapproche de l'encre principale tant qu'elle n'atteint pas 4,5:1.
   Le bilan, quand il chevauche une scène sombre ou intermédiaire en thème clair, passe en surface pleine ou en verre sombre. */
const ENCRE = { sombre: lireOklch('.22 .012 260'), claire: lireOklch('.97 .004 260') };
const CIBLE = 4.6;
const versSrgb = lab => versRgbLin(lab).map(v => { v = borne(v, 0, 1); return v <= .0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - .055; });
const lumSrgb = c => .2126 * lin(c[0]) + .7152 * lin(c[1]) + .0722 * lin(c[2]);
function encrerCiel() {
  const T = MEMO.teintes;
  if (!T) return;
  const hero = $('hero'), C = CADRE, sombreTheme = themeSombre();
  const [haut, milieu, horizon, sol] = T;
  const H = C?.H || hero.clientHeight || 600, yh = C ? C.hy + 535 * C.s : H * .6;
  const [y0, y1] = C?.texte || [0, yh * .45];
  // le dégradé CSS du ciel (interpolé en sRGB, comme le navigateur)
  const arrets = [[0, haut], [yh * .45, milieu], [yh, horizon], [yh + 24, sol], [H, chroma(sol, 1, -.015)]].map(([y, c]) => [y, versSrgb(c)]);
  const ciel = y => {
    if (y <= arrets[0][0]) return arrets[0][1];
    for (let k = 1; k < arrets.length; k++) if (y <= arrets[k][0]) { const [ya, a] = arrets[k - 1], [yb, b] = arrets[k], t = yb > ya ? (y - ya) / (yb - ya) : 1; return a.map((x, n) => x + (b[n] - x) * t); }
    return arrets[arrets.length - 1][1];
  };
  const ech = Array.from({ length: 13 }, (_, k) => ciel(y0 + (y1 - y0) * k / 12));
  const voiles = { clair: versSrgb([.97, haut[1] * .3, haut[2] * .3]), sombre: versSrgb([.24, haut[1] * .7, haut[2] * .7]) };
  const pire = (yEncre, voile, a) => Math.min(...ech.map(c => contraste(yEncre, lumSrgb(a ? c.map((x, n) => x + (voile[n] - x) * a) : c))));
  const alpha = (yEncre, voile) => {
    if (pire(yEncre, voile, 0) >= CIBLE) return 0;
    let lo = 0, hi = .8;
    if (pire(yEncre, voile, hi) < CIBLE) return hi;
    for (let k = 0; k < 14; k++) { const m = (lo + hi) / 2; if (pire(yEncre, voile, m) >= CIBLE) hi = m; else lo = m; }
    return hi;
  };
  const yS = luminanceLab(ENCRE.sombre), yC = luminanceLab(ENCRE.claire);
  const aS = alpha(yS, voiles.clair), aC = alpha(yC, voiles.sombre);
  const encre = aS <= aC ? 'clair' : 'sombre';                       // data-ciel : « clair » = ciel clair, encre sombre
  const a = Math.min(aS, aC), voile = encre === 'clair' ? voiles.clair : voiles.sombre;
  // encre secondaire : la plus discrète qui garde 4,5:1 sur le ciel voilé
  let L2 = encre === 'clair' ? .38 : .84;
  const L1 = encre === 'clair' ? .22 : .97, y2 = L => luminanceLab(lireOklch(`${L} .01 260`));
  if (pire(y2(L2), voile, a) < CIBLE) {
    let lo = L1, hi = L2;                                             // lo : passe toujours ; hi : trop discret
    for (let k = 0; k < 12; k++) { const m = (lo + hi) / 2; if (pire(y2(m), voile, a) >= CIBLE) lo = m; else hi = m; }
    L2 = lo;
  }
  hero.dataset.ciel = encre;
  if (L2 !== (encre === 'clair' ? .38 : .84)) hero.style.setProperty('--ciel-encre-2', `oklch(${L2.toFixed(3)} .01 260)`); else hero.style.removeProperty('--ciel-encre-2');
  // le ciel (fondu de 1,2 s quand il change avec les données)
  const rgb = c => `rgb(${c.map(x => Math.round(borne(x, 0, 1) * 255)).join(' ')}`;
  const vars = { '--c-haut': cssLab(haut), '--c-milieu': cssLab(milieu), '--c-horizon': cssLab(horizon), '--c-sol0': cssLab(sol), '--c-sol1': cssLab(chroma(sol, 1, -.015)),
    '--voile-c': a > 0 ? `${rgb(voile)} / ${a.toFixed(3)})` : 'transparent', '--voile-y': `${Math.round(y1)}px` };
  const cle = Object.values(vars).join('|');
  const ca = $('ciel-a'), cb = $('ciel-b');
  if (cle !== MEMO.cleCiel) {
    if (MEMO.cleCiel && MEMO.fonduCiel && !immobile()) {
      for (const k of Object.keys(vars)) cb.style.setProperty(k, ca.style.getPropertyValue(k));
      cb.style.transition = 'none'; cb.style.opacity = '1'; void cb.offsetWidth;
      cb.style.transition = 'opacity 1.2s ease'; cb.style.opacity = '0';
    }
    for (const [k, v] of Object.entries(vars)) ca.style.setProperty(k, v);
    MEMO.cleCiel = cle;
  }
  MEMO.fonduCiel = false;
  hero.style.setProperty('--ciel-haut-actuel', vars['--c-haut']);
  // le bilan sur la scène (thème clair seulement : en thème sombre, son verre sombre suffit partout)
  let fond = '';
  if (!sombreTheme && C?.bilanZone) {
    const [b0, b1] = C.bilanZone;
    const yMin = Math.min(...Array.from({ length: 7 }, (_, k) => lumSrgb(ciel(b0 + (b1 - b0) * k / 6))));
    if (C.mode === 'large' && encre === 'sombre') fond = 'sombre';
    else if (yMin < .52) fond = 'plein';
  }
  const bilan = $('bilan');
  if ((bilan.dataset.fond || '') !== fond) { if (fond) bilan.dataset.fond = fond; else delete bilan.dataset.fond; }
}
