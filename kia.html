<!doctype html>
<!--
  Breezy · Kia — le garage de la voiture, comme l'accueil de l'app Kia Connect
  ---------------------------------------------------------------------------
  GABARIT : tools/build.js produit kia.html (une page autonome) depuis ce fichier :
   - les marqueurs INCLURE insèrent le code commun à toutes les pages (src/partage/ : jetons, composants, pont vers
     Home Assistant, formats, icônes, interrupteur des animations), le même que l'Accueil ;
   - le rendu de la voiture (assets/roadster.webp) est embarqué tel quel en data URI, une seule fois (marqueur DATA).
      node tools/build.js                                (toutes les pages)
      node tools/build.js src/kia.template.html kia.html (cette page)
  Déployer kia.html à côté d'index.html : les liens entre les pages sont relatifs.

  DONNÉES : les entités de Home Assistant (bloc CONFIG.entites du script, « ← AJUSTE ICI »), reçues de la coque de
  S&A-HOME par postMessage (request_states → states). Les commandes partent exactement comme celles de S&A-HOME
  (PONT_NIRO.ecrire) : service_call → service_result.
  Hors de Home Assistant (page ouverte seule) : des valeurs d'exemple, au même format que les états de Home Assistant,
  lues par le même code ; les commandes y changent l'exemple après 1,2 s. Aperçus : kia.html?apercu=debranchee |
  branchee | charge (par défaut) | limite | perime (ou Breezy.apercu('limite') dans la console).

  LE HÉROS est un studio sombre (le « garage » de la voiture), le même dans les deux thèmes, comme l'app Kia : le nom de
  la voiture, la batterie en grand, une barre fine (niveau, repère de la limite, éclair allumé pendant la charge), une
  ligne (autonomie ; pendant la charge, la puissance et l'heure de fin), la voiture posée sur son ombre, une prise qui
  s'allume quand elle est branchée, et quatre commandes (Clim, Verrou, Début, Fin). Le contenu dessous suit le thème.
-->

/* Breezy · jetons et base, communs à toutes les pages (inclus par tools/build.js) */
/* ================================================================ JETONS === */
:root {
  color-scheme: light;
  --fond: oklch(0.972 0.004 260);
  --surface: #FFFFFF;
  --surface-2: oklch(0.95 0.005 260);
  --encre: oklch(0.22 0.012 260);
  --encre-2: oklch(0.44 0.01 260);
  --encre-3: oklch(0.52 0.01 260);
  --filet: oklch(0.22 0.012 260 / .10);
  --piste: oklch(0.40 0.01 260 / .10);
  /* énergie : même teinte pour comète, pastille, graphique, icône */
  --soleil: oklch(0.82 0.16 82);
  --soleil-t: oklch(0.52 0.12 70);
  --soleil-graphe: oklch(0.665 0.15 70);       /* barres du graphique : ≥ 3:1 sur la carte blanche (le héros garde --soleil) */
  --maison: oklch(0.66 0.14 250);
  --maison-t: oklch(0.48 0.15 256);
  --batterie: oklch(0.64 0.15 152);
  --batterie-t: oklch(0.48 0.12 152);
  --reseau: oklch(0.50 0.19 295);
  --reseau-t: oklch(0.46 0.19 295);
  --borne: oklch(0.58 0.19 332);                  /* la recharge de la voiture : un violet rosé, distinct du réseau */
  --borne-t: oklch(0.50 0.18 332);
  --alerte: oklch(0.58 0.20 27);
  --ombre-carte: 0 0 0 .5px var(--filet), 0 1px 2px oklch(0.25 0.02 260 / .04), 0 10px 30px -18px oklch(0.25 0.03 260 / .25);
  --police: Geist, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --gx: 20px;
  --edge: 32px;
  --colw: 400px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fond: oklch(0.17 0.006 260);
    --surface: oklch(0.215 0.007 260);
    --surface-2: oklch(0.25 0.008 260);
    --encre: oklch(0.96 0.004 260);
    --encre-2: oklch(0.80 0.008 260);
    --encre-3: oklch(0.70 0.008 260);
    --filet: oklch(0.96 0.004 260 / .10);
    --piste: oklch(0.96 0.004 260 / .12);
    --soleil: oklch(0.86 0.15 85);
    --soleil-t: oklch(0.86 0.15 85); --soleil-graphe: oklch(0.86 0.15 85);
    --maison: oklch(0.80 0.11 240);
    --maison-t: oklch(0.80 0.11 240);
    --batterie: oklch(0.74 0.15 152);
    --batterie-t: oklch(0.74 0.15 152);
    --reseau: oklch(0.62 0.17 295);
    --reseau-t: oklch(0.70 0.15 295);
    --borne: oklch(0.72 0.15 332);
    --borne-t: oklch(0.76 0.13 332);
    --alerte: oklch(0.72 0.17 27);
    --ombre-carte: 0 0 0 .5px var(--filet), 0 18px 40px -26px oklch(0 0 0 / .7);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fond: oklch(0.17 0.006 260);
  --surface: oklch(0.215 0.007 260);
  --surface-2: oklch(0.25 0.008 260);
  --encre: oklch(0.96 0.004 260);
  --encre-2: oklch(0.80 0.008 260);
  --encre-3: oklch(0.70 0.008 260);
  --filet: oklch(0.96 0.004 260 / .10);
  --piste: oklch(0.96 0.004 260 / .12);
  --soleil: oklch(0.86 0.15 85);
  --soleil-t: oklch(0.86 0.15 85); --soleil-graphe: oklch(0.86 0.15 85);
  --maison: oklch(0.80 0.11 240);
  --maison-t: oklch(0.80 0.11 240);
  --batterie: oklch(0.74 0.15 152);
  --batterie-t: oklch(0.74 0.15 152);
  --reseau: oklch(0.62 0.17 295);
  --reseau-t: oklch(0.70 0.15 295);
  --borne: oklch(0.72 0.15 332);
  --borne-t: oklch(0.76 0.13 332);
  --alerte: oklch(0.72 0.17 27);
  --ombre-carte: 0 0 0 .5px var(--filet), 0 18px 40px -26px oklch(0 0 0 / .7);

@media (max-width: 374px) { :root { --gx: 16px; } }

/* ================================================================ BASE === */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--fond); }
body {
  margin: 0; background: var(--fond); color: var(--encre);
  font: 400 15px/21px var(--police);
  font-feature-settings: "tnum" 1; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
p, h1, h2, h3, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
svg { overflow: visible; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.saut {
  position: absolute; z-index: 20; left: var(--gx); top: -80px;
  padding: 10px 14px; border-radius: 12px;
  background: var(--encre); color: var(--fond); font-weight: 600; text-decoration: none;
}
.saut:focus { top: max(8px, env(safe-area-inset-top)); }

/* Breezy · la scène et les composants communs (héros, ciel, barre, pastilles, chiffre, verre dépoli, cartes, lignes, pied)
   — inclus par tools/build.js ; les règles propres à une page restent dans son gabarit, APRÈS ce fichier. */
/* ================================================================ HÉROS === */
.hero {
  position: relative; display: block;
  width: 100%; height: 75vh; height: 75svh;
  margin: 0; padding: 0 0 0 0;
  overflow: hidden; isolation: isolate;
  border-radius: 0 0 28px 28px;
  background: var(--ciel-haut-actuel, oklch(.86 .055 240));
  color: var(--ciel-encre);
  /* encres et surface de la SCÈNE (indépendantes du thème de la page) */
  --surface-scene: #FFFFFF;
  --ciel-encre: oklch(0.22 0.012 260);
  --ciel-encre-2: oklch(0.38 0.012 260);
  --fil: oklch(0.42 0.01 260 / .5);
}
.hero[data-ciel="sombre"] {
  /* sur un ciel sombre, les énergies prennent leur clarté « sombre » (même teinte) : comètes, moyeu et pastilles restent lisibles */
  --soleil: oklch(0.86 0.15 85);
  --maison: oklch(0.80 0.11 240);
  --batterie: oklch(0.74 0.15 152);
  --reseau: oklch(0.62 0.17 295);
  --borne: oklch(0.72 0.15 332);
  --surface-scene: oklch(0.24 0.01 260);
  --ciel-encre: oklch(0.97 0.004 260);
  --ciel-encre-2: oklch(0.84 0.008 260);
  --fil: oklch(0.88 0.01 260 / .45);
}
.hero :focus-visible { outline-color: var(--ciel-encre); }
#annonce { top: 0; left: 0; }
.direct:focus { outline: none; }

/* --- Ciel (derrière la maison : il ne la couvre jamais) --- */
.ciel { position: absolute; inset: 0; z-index: 0; pointer-events: none; --yh: 60%; padding-right: env(safe-area-inset-right, 0px); }
.ciel-fond {
  position: absolute; inset: 0;
  /* voile de lecture (encrerCiel) : seulement autour du crépuscule et de l'aube, quand ni l'encre claire ni la sombre n'atteint 4,5:1 sur le ciel */
  background:
    linear-gradient(180deg, var(--voile-c, transparent) 0, var(--voile-c, transparent) var(--voile-y, 0px), transparent calc(var(--voile-y, 0px) + 80px)),
    linear-gradient(180deg, var(--c-haut) 0, var(--c-milieu) calc(var(--yh) * .45), var(--c-horizon) var(--yh), var(--c-sol0) calc(var(--yh) + 24px), var(--c-sol1) 100%);
}
.ciel-fond-b { opacity: 0; }
.astre { position: absolute; left: 0; top: 0; width: 0; height: 0; transition: opacity .6s ease; }
.astre .halo { position: absolute; left: calc(var(--r) * -3.5); top: calc(var(--r) * -3.5); width: calc(var(--r) * 7); height: calc(var(--r) * 7); border-radius: 50%; background: radial-gradient(closest-side, color-mix(in oklch, var(--astre) 42%, transparent), color-mix(in oklch, var(--astre) 14%, transparent) 55%, transparent); }
.astre .disque { position: absolute; left: calc(var(--r) * -1); top: calc(var(--r) * -1); width: calc(var(--r) * 2); height: calc(var(--r) * 2); border-radius: 50%; background: var(--astre); box-shadow: 0 0 0 .5px color-mix(in oklch, var(--astre) 60%, transparent); }
.astre.lune .disque { background: transparent; box-shadow: calc(var(--r) * .42) calc(var(--r) * -.18) 0 0 oklch(.95 .02 90); transform: rotate(-12deg); }
.astre.lune .halo { background: radial-gradient(closest-side, oklch(.95 .02 90 / .10), transparent); }
.etoiles { position: absolute; inset: 0; width: 100%; height: 100%; }
.etoiles circle { fill: oklch(.95 .01 260); }
.etoiles .tw { animation: scintille var(--d) ease-in-out var(--r) infinite; }
@keyframes scintille { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
.nuages { position: absolute; inset: 0; }
.nuages i { position: absolute; display: block; border-radius: 999px; background: radial-gradient(closest-side, var(--nuage), transparent); }
.nuages.derive { animation: derive 40s ease-in-out infinite alternate; }
@keyframes derive { to { transform: translateX(24px); } }
.pluie { position: absolute; inset: 0; opacity: .18; background: repeating-linear-gradient(102deg, transparent 0 9px, oklch(1 0 0 / .9) 9px 10px, transparent 10px 23px); background-size: 100% 46px; }
.pluie.anim { animation: pluie 1.1s linear infinite; }
@keyframes pluie { to { background-position: -10px 46px; } }

/* --- Maison (SVG en ligne) et calque des filets --- */
.scene { position: absolute; inset: 0; z-index: 1; }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: hidden; }
.fils { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.fil { fill: none; stroke: var(--fil); stroke-width: 1; stroke-dasharray: 1.4 3; stroke-linecap: round; transition: opacity .3s ease; }
.ancre { fill: var(--c); stroke: var(--surface-scene); stroke-width: 1; transform-box: fill-box; transform-origin: center; }
.ancre.pouls { animation: ancre 600ms ease-in-out; }
@keyframes ancre { 50% { transform: scale(1.8); } }

/* --- Barre du haut --- */
.barre {
  position: absolute; z-index: 5; top: 8px; left: var(--gx); right: var(--gx); height: 44px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
  transition: top .2s;
}
.hero[data-niveau="2"] .barre, .hero[data-niveau="3"] .barre, .hero[data-niveau="4"] .barre { top: 4px; }
.barre-g { display: flex; align-items: center; gap: 28px; min-width: 0; justify-self: start; }
.marque { display: inline-flex; align-items: center; gap: 9px; height: 44px; min-width: 44px; padding-right: 4px; border-radius: 12px; color: var(--ciel-encre); text-decoration: none; }
.marque svg { width: 28px; height: 28px; flex: none; }
.marque-nom { font: 600 17px/1 var(--police); letter-spacing: -.02em; }
.nav-large { display: none; gap: 22px; }
.nav-large a { position: relative; padding: 0; border: 0; background: none; font: 500 15px/44px var(--police); color: var(--ciel-encre-2); text-decoration: none; border-radius: 6px; }
.nav-large a[aria-current="page"] { color: var(--ciel-encre); }
.hero.sans-nav .nav-large { display: none !important; }
.nav-large a[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 2px; border-radius: 2px; background: currentColor; }

/* surfaces givrées de la scène (pastilles, capsule « en direct ») — S&A-HOME .hc-chip */
.givre, .pill {
  background: linear-gradient(180deg, color-mix(in oklch, var(--surface-scene) 64%, transparent), color-mix(in oklch, var(--surface-scene) 82%, transparent));
  -webkit-backdrop-filter: blur(16px) saturate(1.8); backdrop-filter: blur(16px) saturate(1.8);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .8), inset 0 0 0 .5px oklch(1 0 0 / .5), 0 0 0 .5px oklch(.35 .01 260 / .12), 0 6px 16px -10px oklch(.25 .03 260 / .45);
}
.hero[data-ciel="sombre"] :is(.givre, .pill) {
  background: oklch(.22 .01 260 / .72);
  box-shadow: inset 0 1px 0 oklch(1 0 0 / .10), 0 0 0 .5px oklch(1 0 0 / .08), 0 8px 18px -10px oklch(0 0 0 / .6);
}

/* --- Capsule d'état (centre de la barre) : « En direct », ou « Hors de Home Assistant : valeurs d’exemple » (S&A-HOME) --- */
.capsule {
  position: relative; justify-self: center; min-width: 0; max-width: 100%;
  display: inline-flex; align-items: center; gap: 8px;
  height: 30px; padding: 0 12px 0 10px; border: 0; border-radius: 999px;
  font: 500 13px/1 var(--police); color: var(--ciel-encre); white-space: nowrap;
}
.capsule .pt { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--batterie)); box-shadow: 0 0 0 2.5px color-mix(in oklch, var(--c, var(--batterie)) 24%, transparent); flex: none; }
.capsule .cc, .capsule.court .cl { display: none; }
.capsule.court .cc { display: inline; }
.hero.sans-nom .marque-nom { display: none; }
@media (max-width: 359px) { .barre { gap: 6px; } }

/* --- LE chiffre et sa phrase --- */
.une {
  position: absolute; z-index: 4; left: var(--gx); top: 66px;
  display: flex; flex-direction: column; align-items: flex-start;
  margin: 0; padding: 0; border: 0; background: none; border-radius: 12px;
  color: var(--ciel-encre); text-align: left;
}
.une-k { display: flex; align-items: center; gap: 8px; height: 20px; font: 500 14px/20px var(--police); color: var(--ciel-encre-2); white-space: nowrap; }
.une-k i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--soleil)); flex: none; }
.une-v { display: block; font-weight: 400; font-size: var(--une-t, 62px); line-height: 1; letter-spacing: -.045em; white-space: nowrap; font-variant-numeric: tabular-nums; transition: opacity .4s; }
.une-v .u { font-size: .34em; font-weight: 500; letter-spacing: 0; color: var(--ciel-encre-2); margin-left: .12em; }
.hero[data-niveau="2"] .une-k, .hero[data-niveau="3"] .une-k, .hero[data-niveau="4"] .une-k, .hero[data-mode="court"] .une-k { height: 18px; font-size: 13px; line-height: 18px; }
.une-phrase {
  position: absolute; z-index: 4; left: var(--gx); top: 160px;
  width: max-content; max-width: min(32ch, calc(100% - 2 * var(--gx)));
  font: 400 16px/22px var(--police); letter-spacing: -.005em; color: var(--ciel-encre);
  text-wrap: pretty;
}
.hero[data-niveau="1"] .une-phrase { font-size: 15px; line-height: 20px; }
.hero[data-mode="court"] .une-phrase { font-size: 15px; line-height: 20px; white-space: nowrap; max-width: none; }
.une-phrase[hidden] { display: none; }

/* --- Pastilles (S&A-HOME) : une valeur par flux allumé --- */
.pastilles { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.pill {
  position: absolute; left: 0; top: 0; pointer-events: auto;
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px 0 6px;
  border: 0; border-radius: 999px; transform: translate(-50%, 0);
  font: 600 14px/20px var(--police); letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums;
  color: oklch(.22 .012 260);
  transition: opacity 300ms ease, visibility 0s linear 0s;
}
.pill .g { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 999px; flex: none; background: color-mix(in oklch, var(--c) 22%, transparent); color: var(--ct); }
.pill .g .ic { width: 12px; height: 12px; stroke-width: 2; }
.pill .v { display: inline-flex; align-items: center; gap: 3px; }
.pill .v .ic, .pill .s .ic { width: 11px; height: 11px; stroke-width: 2; }
.pill .s { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; font-size: 12.5px; color: oklch(.41 .01 260); }
.pill .n { margin-right: 4px; font-weight: 500; font-size: 13px; color: oklch(.41 .01 260); }
.hero[data-ciel="sombre"] .pill { color: oklch(.97 .004 260); }
.hero[data-ciel="sombre"] .pill :is(.s, .n) { color: oklch(.80 .008 260); }
.hero[data-ciel="sombre"] .pill .g { color: var(--c); }
.pill.cache { opacity: 0; visibility: hidden; transition: opacity 300ms ease, visibility 0s linear 300ms; }
a.pill { text-decoration: none; cursor: pointer; }                   /* une pastille qui ouvre une page (la borne → Kia) */
.hero[data-mode="court"] .pill { transform: none; }

/* pastilles sorties du héros (héros minuscule : zoom 400 %) : une rangée qui se replie, sur la page */
.pastilles.dehors { position: static; display: flex; flex-wrap: wrap; gap: 14px 8px; padding: 14px var(--gx) 2px; pointer-events: auto; }
.pastilles.dehors .pill { position: relative; transform: none; color: var(--encre); background: var(--surface-2); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.pastilles.dehors .pill :is(.s, .n) { color: var(--encre-2); }

/* ================================================================ GRANDS ÉCRANS (héros) === */
.hero[data-mode="large"] .barre { top: 16px; height: 48px; left: var(--edge); right: var(--edge); }
.hero[data-mode="large"] .une, .hero[data-mode="large"] .une-phrase { left: var(--edge); }
.hero[data-mode="large"] .une-phrase { max-width: var(--colw); font-size: 18px; line-height: 26px; }
.hero[data-mode="large"] .une-v { letter-spacing: -.05em; }
@media (min-width: 1100px) { .hero[data-mode="large"] .nav-large { display: flex; } }
.hero[data-mode="court"] .barre { top: 6px; right: auto; width: calc(var(--colw) - var(--gx)); }
.hero[data-mode="court"] .une-v { letter-spacing: -.05em; }
/* ================================================================ CONTENU === */
main { display: block; padding: 0 0 8px; }
@media (prefers-reduced-motion: reduce) { main { padding-bottom: 32px; } }   /* le pied (interrupteur) est masqué : la page garde sa marge basse */
.page { display: flex; flex-direction: column; gap: 16px; padding: 16px var(--gx) 0; max-width: 1320px; margin: 0 auto; }
.carte {
  position: relative; border-radius: 24px; padding: 18px 20px;
  background: var(--surface); box-shadow: var(--ombre-carte);
}
@media (max-width: 359px) { .carte { padding: 16px; } }
.carte-tete { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.carte h2, .bilan h2 { font: 600 17px/22px var(--police); letter-spacing: -.01em; }
.u { font-weight: 500; }

/* --- Bilan du jour (verre dépoli, S&A-HOME .hb-bilan.hb-p) --- */
.bilan {
  position: relative; z-index: 6;
  margin: calc(var(--ov, 0px) * -1) 14px 0;

.jauge .seg { position: absolute; top: 0; bottom: 0; left: calc(var(--a, 0) * 1%); width: calc((var(--b, 0) - var(--a, 0)) * 1%); transition: left .6s cubic-bezier(.2, .7, .2, 1), width .6s cubic-bezier(.2, .7, .2, 1); }
.j-base { background: linear-gradient(90deg, color-mix(in oklch, var(--vert) 55%, transparent), var(--vert)); }
.j-sol { background: var(--soleil); }
.jauge .j-res { left: calc(var(--a, 0) * 1% + 1px); width: max(0px, calc((var(--b, 0) - var(--a, 0)) * 1% - 1px)); background: var(--reseau); }
.j-reste { background: repeating-linear-gradient(-45deg, color-mix(in oklch, var(--vert) 34%, transparent) 0 2px, transparent 2px 5px); }
.j-lim { position: absolute; top: 0; left: calc(var(--lim, 0) * 1%); width: 2px; height: 16px; margin-left: -1px; border-radius: 1px; background: var(--encre); transition: left .3s ease; }
.j-pt { position: absolute; top: 1px; left: calc(var(--soc, 0) * 1%); width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2.5px var(--vert), 0 1px 3px oklch(.25 .02 260 / .3); transition: left .6s cubic-bezier(.2, .7, .2, 1); }
.jauge [hidden] { display: none; }
.limite { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; margin-top: 10px; }
.limite[hidden] { display: none; }
.limite-l { font: 500 15px/20px var(--police); color: var(--encre); }
/* le pas : des disques de 40 px dans des cibles de 44 px ; le disque « + » s'aligne sur le bord du corps, dans la carte */
.pas { display: flex; align-items: center; margin-right: -2px; }
.pas button { position: relative; display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--encre); }
.pas button::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--surface-2); }
.pas button .ic { position: relative; width: 18px; height: 18px; stroke-width: 2; }
.pas button[aria-disabled="true"] { opacity: .35; cursor: default; }
.pas output { min-width: 68px; text-align: center; font: 400 22px/28px var(--police); letter-spacing: -.02em; white-space: nowrap; transition: opacity .2s ease; }
.pas output .u { font-size: 15px; color: var(--encre-2); }
.pas output.attente { opacity: .6; }
@media (max-width: 374px) { .pas output { min-width: 60px; } }

/* --- Mode de recharge --- */
.mode .carte-tete { flex-wrap: wrap; row-gap: 0; }
.mode-v { font: 500 15px/20px var(--police); color: var(--encre-2); }
.segments { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); height: 52px; margin-top: 10px; padding: 4px; border-radius: 999px; background: var(--surface-2); }
.segments[hidden] { display: none; }
.segments button { display: grid; place-items: center; height: 44px; padding: 0; border: 0; border-radius: 999px; background: none; color: var(--encre-3); transition: background-color .25s ease, color .25s ease, box-shadow .25s ease; }
.segments button .ic { width: 22px; height: 22px; transition: opacity .2s ease; }
.segments button[aria-checked="true"] { background: var(--surface); box-shadow: var(--ombre-carte); color: var(--mc, var(--encre)); }
.segments button.attente .ic { opacity: .6; }
/* entité absente ou indisponible : le choix est grisé et ne réagit plus */
.segments[aria-disabled="true"] { opacity: .45; }
.segments[aria-disabled="true"] button { cursor: default; }
.ligne-hc { display: flex; justify-content: space-between; width: 100%; min-height: 52px; margin-top: 14px; padding: 4px 0 0; border-top: 1px solid var(--filet); border-radius: 0; font: 500 15px/20px var(--police); color: var(--encre); text-align: left; }
.ligne-hc[hidden] { display: none; }
.ligne-hc.attente .tr { opacity: .6; }
.ligne-hc[aria-disabled="true"] { cursor: default; }
.ligne-hc[aria-disabled="true"] .tr { opacity: .4; }

/* --- Recharges : les trois dernières, une barre chacune (soleil, réseau) --- */
.journal { display: flex; flex-direction: column; margin-top: 6px; }
.journal li { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 40px; }
.journal .jd { font: 500 14px/20px var(--police); color: var(--encre-2); white-space: nowrap; }
.journal .jb { position: relative; height: 6px; border-radius: 999px; background: var(--piste); }
.journal .jf { position: absolute; left: 0; top: 0; bottom: 0; display: flex; gap: 1px; width: calc(var(--w, 0) * 1%); border-radius: 999px; overflow: hidden; }
.journal .jf i { display: block; height: 100%; }
.journal .jf .js { width: calc(var(--ps, 0) * 1%); background: var(--soleil); flex: none; }
.journal .jf .jr { flex: 1; background: var(--reseau); }
.journal .jv { font: 500 15px/20px var(--police); color: var(--encre); white-space: nowrap; text-align: right; }

/* --- Suivi --- */
.suivi .lv.chaud { color: var(--soleil-t); }
.suivi .lv.alerte { color: var(--alerte); }
.lignes[hidden], .carte[hidden] { display: none; }

/* --- Déverrouiller : une confirmation --- */
.dialogue { width: min(340px, calc(100vw - 32px)); padding: 22px 20px 18px; border: 0; color: var(--encre); }
.dialogue::backdrop { background: oklch(.15 .01 260 / .45); }
.dialogue h2 { margin: 0 0 18px; }
.dlg-actions { display: flex; gap: 10px; }
.dlg-actions button { flex: 1; height: 48px; border: 0; border-radius: 999px; font: 600 15px/1 var(--police); background: var(--surface-2); color: var(--encre); }
.dlg-actions .alerte { background: var(--alerte-forte); color: #fff; }
:root[data-theme="dark"] .dlg-actions .alerte { background: var(--alerte); color: oklch(.17 .006 260); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dlg-actions .alerte { background: var(--alerte); color: oklch(.17 .006 260); } }

/* ================================================================ KIA : MOUVEMENT ET COULEURS FORCÉES === */
.calme .niveau.charge .niv-rempli::after { animation: none !important; opacity: 0; }
.calme #port.charge .port-halo, .calme .cmd .ic-k, .calme .cmd .ic-k rect, .calme .maj .ic { animation: none !important; }
@media (prefers-reduced-motion: reduce) { .niveau.charge .niv-rempli::after { opacity: 0; } .toast { transition: none; } }
@media (forced-colors: active) {
  .cmd, .maj, .retour, .segments, .dlg-actions button { border: 1px solid CanvasText; }
  .cmd[aria-busy="true"] { border-style: dashed; }
  .niv-piste, .jauge .piste, .journal .jb { outline: 1px solid CanvasText; }
  .niv-rempli, .niv-lim, .niv-eclair, .port-halo, .port-coeur, .jauge .seg, .journal .jf i { forced-color-adjust: none; }
  .maj .age { forced-color-adjust: none; background: CanvasText; }
  .j-lim { forced-color-adjust: none; background: CanvasText; }
  .j-pt { forced-color-adjust: none; background: Canvas; box-shadow: 0 0 0 2.5px CanvasText; }
  .pas button::before { border: 1px solid CanvasText; }
  .segments button[aria-checked="true"] { outline: 2px solid CanvasText; outline-offset: -2px; }
  .toast { border: 2px solid CanvasText; }
}
</style>
</head>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   Breezy · Kia — réglages et pont vers Home Assistant (comme S&A-HOME)
   ← AJUSTE ICI : toutes les entités sont regroupées dans CONFIG.entites (les mêmes que S&A-HOME, Voltia et le journal
   des recharges). Une entité vide ('') = l'élément n'est pas relié : il est masqué. Une entité absente, « unavailable »
   ou « unknown » dans Home Assistant : sa valeur s'affiche « — », sa commande est grisée (rien n'est jamais inventé).
   ═══════════════════════════════════════════════════════════════════════ */
const CONFIG = {
  fuseau: 'Europe/Paris',                                                 // ← l'heure de la maison
  nom: 'E-NIRO',                                                          // ← le nom de la voiture, en haut à gauche (comme l'app Kia)
  batterieKWh: 64,                                                        // batterie utile du e-Niro (kia_trajets.yaml)
  entites: {
    // la voiture (S&A-HOME : E.niro)
    soc: 'sensor.e_niro_e_niro_e_niro_ev_battery_level',                  // %
    autonomie: 'sensor.e_niro_e_niro_e_niro_ev_range',                    // km
    branchee: 'binary_sensor.e_niro_e_niro_e_niro_ev_battery_plug',
    charge: 'switch.e_niro_e_niro_ev_charging',
    limite: 'number.e_niro_e_niro_e_niro_ac_charging_limit',              // % (attributs min, max, step)
    duree: 'sensor.e_niro_e_niro_e_niro_estimated_charge_duration',       // minutes restantes
    verrou: 'lock.e_niro_e_niro_e_niro_door_lock',
    clim: 'switch.e_niro_e_niro_climate',
    actualiser: 'button.e_niro_e_niro_force_refresh',
    maj: 'sensor.e_niro_e_niro_e_niro_last_updated_at',                   // horodatage des données de la voiture
    hc: 'switch.e_niro_off_peak_charge_only',
    b12v: 'sensor.e_niro_e_niro_e_niro_car_battery_level',                // % de la batterie 12 V

    dernierEntretien: 'input_number.eniro_dernier_entretien_km',          // km au compteur à la dernière révision

/* ---------- Home Assistant, par la coque de S&A-HOME (postMessage) — partagé par toutes les pages ----------
   page → coque : { type: 'request_states' } · { type: 'history_request', id, start, end, entities, period, types }
                  · { type: 'service_call', id, domain, service, entity_id, data }                  (S&A-HOME : ha.appel)
   coque → page : { type: 'states', states, user, dark } · { type: 'history_result', id, success, data }
                  · { type: 'service_result', id, success, error }
   Une entité absente, « unavailable » ou « unknown » vaut null : rien n'est jamais inventé. */
const HA = {
  enCoque: window.parent !== window,
  connecte: false,
  sombre: null,
  etats: {},
  t: null,                                                    // valeurs d'exemple : l'heure figée de l'aperçu
  id: 1, attentes: {},
  e(id) { return id ? this.etats[id] || null : null; },
  etat(id) { const s = this.e(id); return s && s.state !== 'unavailable' && s.state !== 'unknown' ? s.state : null; },
  nb(id) { const v = parseFloat(this.etat(id)); return Number.isFinite(v) ? v : null; },
  attr(id, a) { const s = this.e(id); return s && s.attributes && s.attributes[a] != null ? s.attributes[a] : null; },
  premiere(liste) { return [].concat(liste).find(id => id && this.etats[id]) || null; },
  maintenant() { return this.t ?? Date.now(); },
  /* âge d'une donnée, en minutes (S&A-HOME : ha.age) : l'horodatage de l'état (capteur timestamp), à défaut son last_changed ;
     null si l'entité est absente ou indisponible */
  age(id) {
    const s = this.e(id);
    if (!s || this.etat(id) == null) return null;
    const t = Date.parse(s.state), t2 = Number.isFinite(t) ? t : Date.parse(s.last_changed);
    return Number.isFinite(t2) ? Math.max(0, (this.maintenant() - t2) / 60000) : null;
  },
  ecouter(recu) {
    window.addEventListener('message', ev => {
      const m = ev.data;
      if (!m || !m.type || ev.source !== window.parent) return;
      if (m.type === 'states') {
        this.etats = m.states || {};
        this.sombre = typeof m.dark === 'boolean' ? m.dark : null;
        const premier = !this.connecte;
        this.connecte = true;
        recu(premier);
      } else if ((m.type === 'history_result' || m.type === 'service_result') && this.attentes[m.id]) {
        const r = this.attentes[m.id]; delete this.attentes[m.id];
        if (m.success) r.ok(m.data); else r.ko(m.error);
      }
    });
    window.parent.postMessage({ type: 'request_states' }, '*');
  },
  historique(q) {
    if (!this.enCoque) return Promise.reject(new Error('hors de Home Assistant'));
    const id = this.id++;
    return new Promise((ok, ko) => {
      this.attentes[id] = { ok, ko };
      window.parent.postMessage({ type: 'history_request', id, ...q }, '*');
      setTimeout(() => { if (this.attentes[id]) { delete this.attentes[id]; ko(new Error('sans réponse')); } }, 20000);
    });
  },
  /* une commande, exactement comme S&A-HOME (ha.appel) : service_call, puis service_result ; sans réponse après 15 s, elle est
     tenue pour faite. Résout { ok: true } ou { ok: false, erreur } (jamais rejetée). Hors de Home Assistant : rien n'est envoyé. */
  appel(domaine, service, entite, donnees) {
    if (!this.enCoque) return Promise.resolve({ ok: true, envoye: false });
    const id = this.id++;
    return new Promise(fin => {
      this.attentes[id] = { ok: () => fin({ ok: true, envoye: true }), ko: erreur => fin({ ok: false, envoye: true, erreur }) };
      window.parent.postMessage({ type: 'service_call', id, domain: domaine, service, entity_id: entite, data: donnees || {} }, '*');
      setTimeout(() => { if (this.attentes[id]) { delete this.attentes[id]; fin({ ok: true, envoye: true }); } }, 15000);
    });
  }
};

  if (!fini(w)) return { n: '—', u: '', w: null };
  const a = Math.abs(w), r = Math.round(a / 10) * 10;
  if (a === 0) return { n: '0', u: 'W', w: 0 };
  if (r < 1000) return { n: r === 0 ? `<${NNBSP}10` : nombre(r, 0), u: 'W', w: r };

  return `${p.n.replace(NNBSP, ' ')} ${accord(n, p.u === 'W' ? 'watt' : 'kilowatt')}`;

};

function heureLocale(date) {

function etatsExemple(nom) {
  const A = EXEMPLE.apercus[nom] || EXEMPLE.apercus.charge;
  const t = Date.parse(A.t), quand = new Date(t).toISOString();
  const etats = {};
  const pose = (id, state, attributes = {}) => { if (id) etats[id] = { entity_id: id, state: String(state), attributes, last_changed: quand }; };
  // la voiture
  pose(ENT.soc, A.soc, { unit_of_measurement: '%' });
  pose(ENT.autonomie, A.km, { unit_of_measurement: 'km' });
  pose(ENT.branchee, A.prise, { device_class: 'plug' });
  pose(ENT.charge, A.charge);
  pose(ENT.limite, EXEMPLE.limite, { min: 50, max: 100, step: 10, unit_of_measurement: '%' });
  pose(ENT.duree, A.duree, { unit_of_measurement: 'min' });
  pose(ENT.verrou, A.verrou || 'locked');
  pose(ENT.clim, 'off');
  pose(ENT.actualiser, new Date(t - 2 * 86400000).toISOString());
  pose(ENT.maj, new Date(t - A.age * 60000).toISOString(), { device_class: 'timestamp' });
  pose(ENT.hc, 'off');
  pose(ENT.b12v, EXEMPLE.b12, { unit_of_measurement: '%' });
  pose(ENT.odometre, EXEMPLE.odo, { unit_of_measurement: 'km' });
  pose(ENT.dernierEntretien, EXEMPLE.entretien, { min: 0, max: 500000, step: 1, unit_of_measurement: 'km' });
  // la recharge
  pose(ENT.borne, A.borne, { unit_of_measurement: 'W' });
  pose(ENT.veSolaire, A.sol, { unit_of_measurement: 'W' });
  pose(ENT.veReseau, A.res, { unit_of_measurement: 'W' });
  pose(ENT.mode, A.mode || 'Soleil', { options: EXEMPLE.options });
  const S = A.session || EXEMPLE.dernier, C0 = EXEMPLE.compteurs;
  pose(ENT.sessionSoc, S.soc, { unit_of_measurement: '%' });
  pose(ENT.sessionSol, C0.sol.toFixed(3), { unit_of_measurement: 'kWh' });
  pose(ENT.sessionRes, C0.res.toFixed(3), { unit_of_measurement: 'kWh' });
  pose(ENT.sessionDebut, S.debut, { has_date: true, has_time: true });
  pose(ENT.energieSolaire, (C0.sol + S.sol).toFixed(3), { unit_of_measurement: 'kWh' });
  pose(ENT.energieReseau, (C0.res + S.res).toFixed(3), { unit_of_measurement: 'kWh' });

  pose(ENT.journal, sessions[0].fin, { sessions });

/* ================================================================ LECTURE === */
/* Commandes en attente de Home Assistant : la commande affiche son état visé (cible) tant que Home Assistant rapporte autre
   chose et que le délai court ; dès qu'il rapporte la cible, l'attente s'efface ; au bout du délai, l'état réel de Home
   Assistant reprend la main, sans message. */
const ATTENTE = {};
function attente(cle, reel) {
  const a = ATTENTE[cle];
  if (!a) return { val: reel, attente: false };
  if (a.confirme ? a.confirme() : reel === a.cible) { delete ATTENTE[cle]; a.apres?.(); return { val: reel, attente: false }; }
  if (Date.now() - a.depuis > a.delai) { delete ATTENTE[cle]; return { val: reel, attente: false }; }
  return { val: a.cible, attente: true };
}
/* La limite de charge : la DERNIÈRE valeur demandée (voulue) est tenue à part de la valeur que Home Assistant confirme.
   La dernière demande part toujours, 800 ms après le dernier geste — même quand elle revient à la valeur que HA affiche
   encore pendant qu'une autre demande est en route. L'attente ne s'efface que lorsque HA rapporte la valeur voulue, sans
   envoi en cours ; et si l'on est revenu à la valeur de départ (celle de HA au premier geste) après avoir envoyé autre
   chose, seulement une fois que HA a quitté cette valeur de départ : sinon l'ancienne valeur passerait pour la nouvelle.
   Rien n'est envoyé si l'on revient à la valeur de HA avant le premier envoi. */
const LIM = { voulue: null, envoyee: null, enVol: 0, depuis: 0, minut: 0, depart: null, bouge: false };
function oublierLimite() { clearTimeout(LIM.minut); Object.assign(LIM, { voulue: null, envoyee: null, minut: 0, depuis: 0, depart: null, bouge: false }); }
function lireLimite(reel) {
  if (LIM.voulue == null) return { val: reel, attente: false };
  if (LIM.envoyee != null && reel != null && reel !== LIM.depart) LIM.bouge = true;
  const confirme = !LIM.minut && !LIM.enVol && reel === LIM.voulue && (LIM.envoyee == null || LIM.voulue !== LIM.depart || LIM.bouge);
  if (confirme) { oublierLimite(); return { val: reel, attente: false }; }
  if (Date.now() - LIM.depuis > DELAI.voiture + 800) { oublierLimite(); return { val: reel, attente: false }; }
  return { val: LIM.voulue, attente: true };
}
const nombreOu = (v, defaut) => { const n = Number(v); return v != null && Number.isFinite(n) ? n : defaut; };
const relie = id => !!id;                                                     // '' dans CONFIG : non relié, masqué

let MEMO = { annonce: null };
let SCENE = null;

function deriver() {
  const t = HA.maintenant(), { h } = heureLocale(new Date(t));
  const v = {};
  v.soc = HA.nb(ENT.soc);
  v.km = HA.nb(ENT.autonomie);
  // la limite de charge (S&A-HOME : bornée à 50–100, par pas de 10 si l'entité ne dit rien)
  v.lim = { min: nombreOu(HA.attr(ENT.limite, 'min'), 50), max: nombreOu(HA.attr(ENT.limite, 'max'), 100), pas: nombreOu(HA.attr(ENT.limite, 'step'), 10) || 10 };
  const lim = lireLimite(HA.nb(ENT.limite));
  v.limite = lim.val; v.limiteAttente = lim.attente;
  const pr = HA.etat(ENT.branchee);
  v.branchee = pr === 'on' ? true : pr === 'off' ? false : null;
  const sw = HA.etat(ENT.charge);
  v.interrupteur = sw == null ? null : sw === 'on';                           // l'interrupteur de charge de la voiture
  // la borne, en direct (Smart3CT) ; ses sources (Voltia)
  v.borneW = HA.nb(ENT.borne); v.solW = HA.nb(ENT.veSolaire); v.resW = HA.nb(ENT.veReseau);
  v.mesure = v.borneW != null && v.borneW > 50;
  const sol = v.solW != null ? Math.max(0, v.solW) : null, res = v.resW != null ? Math.max(0, v.resW) : null;
  v.part = sol != null && res != null && sol + res > 50 ? Math.round(sol / (sol + res) * 100) : null;
  /* LA charge : un seul état, partout (éclair, lueur, ligne, prise, Début et Fin) — l'interrupteur de la voiture OU la
     puissance de la borne (> 50 W). La borne mesure en direct : elle l'emporte quand la voiture tarde à se mettre à jour. */
  v.enCharge = v.mesure ? true : v.interrupteur != null ? v.interrupteur && v.branchee !== false : v.borneW != null ? false : null;
  const ch = attente('charge', v.enCharge);
  v.chargeCible = ch.val; v.chargeAttente = ch.attente;
  v.branche = v.branchee === true || v.enCharge === true;
  v.atteinte = v.soc != null && v.limite != null && v.soc >= v.limite;
  v.etat = v.enCharge ? 'charge' : v.branchee === false ? 'debranchee' : v.branchee === true ? (v.atteinte ? 'limite' : 'branchee') : null;
  // depuis le branchement (Voltia) : points gagnés, kWh du soleil et du réseau
  v.session = null;
  const s0 = HA.nb(ENT.sessionSoc);
  if (v.branche && s0 != null && v.soc != null) {
    const dif = (a, b) => (a != null && b != null ? Math.max(0, a - b) : null);
    const kSol = dif(HA.nb(ENT.energieSolaire), HA.nb(ENT.sessionSol)), kRes = dif(HA.nb(ENT.energieReseau), HA.nb(ENT.sessionRes));
    const gain = v.soc - s0;
    v.session = { soc0: borne(s0, 0, 100), gain, sol: kSol, res: kRes, partage: gain > 0 && kSol != null && kRes != null && kSol + kRes >= 0.1 };
  }
  // fin de charge (S&A-HOME finTxt) : maintenant + durée restante, à 5 min près ; à défaut (durée inconnue, ou encore à 0
  // pendant que la borne débite), au rythme de la borne jusqu'à la limite
  v.fin = null;
  if (v.enCharge) {
    const duree = HA.nb(ENT.duree);
    let heures = null;
    if (duree != null && duree > 0) heures = duree / 60;
    else if (v.borneW != null && v.borneW > 100 && v.soc != null && v.limite != null && v.limite > v.soc) heures = (v.limite - v.soc) / 100 * CONFIG.batterieKWh / (v.borneW / 1000);
    if (heures != null && heures < 36) {

    }

  const vr = attente('verrou', HA.etat(ENT.verrou)); v.verrou = vr.val; v.verrouAttente = vr.attente;
  const clReel = HA.etat(ENT.clim), cl = attente('clim', clReel == null ? null : clReel === 'on'); v.clim = cl.val; v.climAttente = cl.attente;
  const hcReel = HA.etat(ENT.hc), hc = attente('hc', hcReel == null ? null : hcReel === 'on'); v.hc = hc.val; v.hcAttente = hc.attente;
  v.modeDispo = HA.etat(ENT.mode) != null;                                      // absente ou indisponible : le choix est grisé
  const md = attente('mode', HA.etat(ENT.mode)); v.mode = md.val; v.modeAttente = md.attente;
  const opts = HA.attr(ENT.mode, 'options');
  v.options = Array.isArray(opts) && opts.length ? opts.map(String) : ['Normal', 'Soleil', 'Soleil + super creuses'];
  // âge des données de la voiture (minutes) ; actualisation en attente jusqu'au prochain horodatage
  v.age = HA.age(ENT.maj);
  v.majAttente = attente('actualiser', null).attente;
  // suivi
  const suivi = { b12: HA.nb(ENT.b12v), odo: HA.nb(ENT.odometre), dernier: HA.nb(ENT.dernierEntretien) };
  suivi.reste = suivi.odo != null && suivi.dernier != null && ENT.intervalleEntretienKm ? suivi.dernier + ENT.intervalleEntretienKm - suivi.odo : null;
  return { t, h, v, suivi };
}

/* ================================================================ HÉROS === */
const ETATS_SR = { debranchee: 'Débranchée', branchee: 'Branchée', charge: 'En charge', limite: 'Limite de charge atteinte' };
let UNE_VAL = null, FLASH_MAJ = 0;
const kmTxt = km => `${nombre(Math.round(km), 0)}${NBSP}km`;

function rendreHero(d) {
  const v = d.v, hero = $('hero');
  $('nom-v').textContent = CONFIG.nom;
  // le chiffre : décompte (comme l'Accueil) s'il bouge d'au moins 2 points
  const el = $('une-v'), gab = n => `${pct(n)}<span class="u">${NNBSP}%</span>`;
  cancelAnimationFrame(el._raf);
  const soc = v.soc != null ? Math.round(borne(v.soc, 0, 100)) : null;
  if (soc == null) el.textContent = '—';
  else if (UNE_VAL != null && !immobile() && Math.abs(soc - UNE_VAL) >= 2) {
    const de = UNE_VAL, t0 = performance.now();
    const pas = t => { const q = Math.min(1, (t - t0) / 600), x = de + (soc - de) * (1 - Math.pow(1 - q, 3)); el.innerHTML = gab(q < 1 ? Math.round(x) : soc); if (q < 1) el._raf = requestAnimationFrame(pas); };
    el._raf = requestAnimationFrame(pas);
  } else el.innerHTML = gab(soc);
  UNE_VAL = soc;
  hero.classList.toggle('perime', v.age != null && v.age >= 1440);
  // la barre : le niveau à l'échelle, le repère de la limite, l'éclair (et la lueur) pendant la charge
  const niv = $('niveau');
  niv.style.setProperty('--soc', soc != null ? soc : 0);
  const lim = v.limite != null ? borne(v.limite, 0, 100) : null;
  $('niv-lim').hidden = lim == null;
  if (lim != null) $('niv-lim').style.setProperty('--lim', lim);
  niv.classList.toggle('charge', v.enCharge === true);
  // la ligne : l'autonomie ; pendant la charge seulement, « / 7,2 kW · vers 14 h 50 »
  const charge = v.enCharge ? [v.mesure ? pTxt(v.borneW) : null, v.fin].filter(Boolean).join(' · ') : '';
  const ligne = [v.km != null ? kmTxt(v.km) : '', charge].filter(Boolean).join(' <span class="sep">/</span> ');
  if ($('une-ligne').innerHTML !== ligne) $('une-ligne').innerHTML = ligne;
  // ce que le lecteur d'écran entend
  const etat = v.etat === 'charge'
    ? `En charge${v.mesure ? ` à ${pLong(v.borneW)}${v.part != null ? (v.part < 5 ? ', venus du réseau' : `, dont ${pct(v.part)} % de soleil`) : ''}` : ''}${v.fin ? `, fin ${v.fin}` : ''}`
    : ETATS_SR[v.etat] || 'État de la prise inconnu';
  $('une-sr').textContent = `Batterie de la Kia${NBSP}: ${soc != null ? `${soc} %` : 'non mesurée'}${v.km != null ? `, ${nombre(Math.round(v.km), 0)} km d’autonomie` : ''}. ${etat}.`;
  // la prise : allumée quand la voiture est branchée ; couleur de la borne pendant la charge
  const port = $('port');
  port.setAttribute('display', v.branche ? 'inline' : 'none');
  port.classList.toggle('charge', v.enCharge === true);
  const portes = v.verrou === 'locked' ? ', portes verrouillées' : v.verrou != null ? ', portes déverrouillées' : '';
  const prise = v.etat === 'charge' ? 'branchée, en charge' : v.etat === 'branchee' ? 'branchée' : v.etat === 'limite' ? 'branchée, limite de charge atteinte' : v.etat === 'debranchee' ? 'débranchée' : 'prise non mesurée';
  $('voiture').setAttribute('aria-label', `La Kia e-Niro, ${prise}${portes}${v.clim === true && !v.climAttente ? ', climatisation en marche' : ''}.`);
  rendreCommandes(d);

}

/* Les quatre commandes : Clim (allumée : bleu glacier, le ventilateur tourne), Verrou (ouverte : alerte), Début, Fin.
   En attente : les barres d'envoi à la place de l'icône, le mot grisé, jusqu'à la confirmation de HA (ou 15 s). */
function rendreCommandes(d) {
  const v = d.v;
  const cmd = (id, relieOk, ic, mot, o) => {
    const b = $(id);
    b.hidden = !relieOk;
    if (!relieOk) return;
    const html = `${iconeK(o.occupe ? 'signal' : ic)}<span class="cmd-l">${mot}</span>`;
    if (b.innerHTML !== html) b.innerHTML = html;
    b.classList.toggle('allume', !!o.allume && !o.occupe);
    b.classList.toggle('alerte', !!o.alerte && !o.occupe);
    if (o.nom) b.setAttribute('aria-label', o.nom);
    if (o.presse !== undefined) { if (o.presse == null) b.removeAttribute('aria-pressed'); else b.setAttribute('aria-pressed', String(o.presse)); }
    if (o.occupe) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy');
    if (o.inactif && !o.occupe) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
    if (SURVOL.matches) b.title = b.getAttribute('aria-label') || mot; else b.removeAttribute('title');
  };
  cmd('d-clim', relie(ENT.clim), 'ventilateur', 'Clim', { allume: v.clim === true, presse: v.clim, occupe: v.climAttente, inactif: v.clim == null });
  const verrouille = v.verrou === 'locked', ouverte = v.verrou != null && !verrouille;
  cmd('d-verrou', relie(ENT.verrou), ouverte ? 'verrouOuvert' : 'verrou', verrouille ? 'Verrouillée' : ouverte ? 'Ouverte' : 'Verrou', {
    alerte: ouverte, occupe: v.verrouAttente, inactif: v.verrou == null,
    nom: verrouille ? 'Verrouillée, déverrouiller' : ouverte ? 'Ouverte, verrouiller' : 'Verrou, indisponible'
  });
  // Début : branchée, pas en charge, sous la limite ; Fin : en charge. L'interrupteur doit être joignable.
  const qui = v.chargeAttente ? ATTENTE.charge?.bouton : null;
  const possible = relie(ENT.charge) && v.interrupteur != null;
  cmd('d-debut', relie(ENT.charge), 'eclair', 'Début', { occupe: qui === 'debut', inactif: !!qui || !possible || v.enCharge !== false || v.branchee !== true || v.atteinte });
  cmd('d-fin', relie(ENT.charge), 'eclairBarre', 'Fin', { occupe: qui === 'fin', inactif: !!qui || !possible || v.enCharge !== true });
  $('commandes').hidden = !relie(ENT.clim) && !relie(ENT.verrou) && !relie(ENT.charge);
}
const SURVOL = window.matchMedia('(hover: hover) and (pointer: fine)');

/* Actualiser (en haut à droite) : en attente jusqu'au prochain horodatage des données ; une pastille ambre si elles ont 30 min ou plus */
function rendreMaj(d) {
  const v = d.v, b = $('d-maj');
  b.hidden = !relie(ENT.actualiser);
  const vieux = v.age != null && v.age >= 30 && !v.majAttente;
  const html = icone(FLASH_MAJ > Date.now() ? 'coche' : 'actualiser') + (vieux ? '<i class="age" aria-hidden="true"></i>' : '');
  if (b.innerHTML !== html) b.innerHTML = html;
  if (v.majAttente) b.setAttribute('aria-busy', 'true'); else b.removeAttribute('aria-busy');
  if (SURVOL.matches) b.title = 'Actualiser'; else b.removeAttribute('title');
}

/* --- L'état des données (en haut à droite), seulement s'il y a lieu : hors de Home Assistant, connexion, sans réponse,
   ou données de la voiture de 30 min et plus (S&A-HOME : ha.age). Données fraîches : rien. --- */
let SANS_REPONSE = false;
const ageUnite = a => { const m = Math.round(a); return m < 1 ? null : m < 60 ? [m, 'min', 'minute'] : m < 2880 ? [Math.floor(m / 60), 'h', 'heure'] : [Math.floor(m / 1440), 'j', 'jour']; };
const ageCourt = a => { const u = ageUnite(a); return u ? `Il y a ${u[0]}${NBSP}${u[1]}` : 'À l’instant'; };
const ageLong = a => { const u = ageUnite(a); return u ? `il y a ${u[0]} ${accord(u[0], u[2])}` : 'à l’instant'; };
function rendreCapsule() {
  const age = SCENE?.v.age ?? null;
  let c = null, txt = '', sr = '';
  if (!HA.enCoque) [c, txt, sr] = ['var(--soleil)', 'Valeurs d’exemple', `Hors de Home Assistant${NBSP}: valeurs d’exemple`];
  else if (!HA.connecte) [c, txt, sr] = SANS_REPONSE ? ['var(--alerte-s)', 'Sans réponse', 'Home Assistant ne répond pas'] : ['var(--encre-s2)', 'Connexion…', 'Connexion à Home Assistant…'];
  else if (age != null && age >= 30) [c, txt, sr] = ['var(--soleil)', ageCourt(age), `Données de la Kia${NBSP}: ${ageLong(age)}`];
  const cap = $('capsule');
  cap.hidden = !txt;
  if (!txt) { if (cap.innerHTML) cap.innerHTML = ''; return; }
  cap.style.setProperty('--c', c);
  const html = `<span class="pt" aria-hidden="true"></span><span aria-hidden="true">${txt}</span><span class="sr-only">${sr}</span>`;
  if (cap.innerHTML !== html) cap.innerHTML = html;

/* ================================================================ CADRAGE ===
   La voiture entière — toute l'image (x 0 → 1640, y 11 → 941, ses bords presque transparents compris) — tient dans le
   héros et rien d'opaque ne la couvre ; elle ne bouge pas quand la charge commence ou s'arrête.
   - portrait (téléphone) et large (ordinateur) : tout est centré, comme l'app Kia — le chiffre, la barre, la ligne, la
     voiture au milieu de la place qui reste, puis les commandes ; le contenu chevauche le bas du studio ;
   - court (téléphone à l'horizontale) : le chiffre et les commandes à gauche, la voiture à droite. */
const AUTO = { cx: 847, cy: 490 };                                          // centre de la carrosserie (pixels de l'image)
const IMG = { x1: 1640, y0: 11, y1: 941 };                                  // la boîte de l'image (alpha ≥ 1)
function cadrer() {
  const hero = $('hero');
  const W = hero.clientWidth, H = hero.clientHeight;
  if (!W || !H || !SCENE) return;
  const html = document.documentElement;
  const mode = W / H < 1.15 ? 'portrait' : H < 430 ? 'court' : 'large';
  hero.dataset.mode = mode;
  const gx = parseFloat(getComputedStyle(html).getPropertyValue('--gx')) || 20;
  const edge = Math.max(32, (W - 1320) / 2 + 32);
  hero.style.setProperty('--edge', edge + 'px');
  const barre = $('barre'), tete = $('tete'), cmd = $('commandes');
  // le menu (grand écran) s'efface s'il touche le nom ou l'état des données
  hero.classList.remove('sans-nav');
  const nav = barre.querySelector('.nav-large');
  if (nav.offsetWidth) {
    const n = nav.getBoundingClientRect(), g = barre.querySelector('.barre-g').getBoundingClientRect(), dr = barre.querySelector('.barre-d').getBoundingClientRect();
    if (n.left < g.right + 24 || n.right > dr.left - 24) hero.classList.add('sans-nav');
  }
  // écran étroit : le nom et l'état des données se serrent, puis la capsule perd son point, plutôt que de se toucher
  hero.classList.remove('serre', 'tres-serre');
  const serre = () => barre.querySelector('.barre-g').getBoundingClientRect().right + 14 > barre.querySelector('.barre-d').getBoundingClientRect().left;
  if (serre()) hero.classList.add('serre');
  if (serre()) hero.classList.add('tres-serre');
  const bB = barre.offsetTop + barre.offsetHeight;
  let s, ix, iy, ov = 0, colW = W;
  const hc = cmd.hidden ? 0 : cmd.offsetHeight;
  if (mode === 'court') {
    tete.style.setProperty('--n', (H < 260 ? 36 : 44) + 'px');
    tete.style.top = (bB + 2) + 'px';
    const cTop = H - 6 - hc;
    cmd.style.top = cTop + 'px';
    colW = gx + Math.max(tete.offsetWidth, cmd.hidden ? 0 : cmd.offsetWidth);
    hero.style.setProperty('--colw', colW + 'px');
    const safeR = parseFloat(getComputedStyle(hero).paddingRight) || 0;
    const x0 = colW + 20, x1 = W - 12 - safeR, y0 = bB + 2, y1 = H - 4;
    s = Math.max(.04, Math.min((x1 - x0) / IMG.x1, (y1 - y0) / (IMG.y1 - IMG.y0)));
    ix = (x0 + x1) / 2 - IMG.x1 / 2 * s;
    iy = (y0 + y1) / 2 - (IMG.y0 + IMG.y1) / 2 * s;
  } else {
    const large = mode === 'large', bas = H < 480;
    tete.style.setProperty('--n', (large ? borne(.1 * H, 56, 76) : borne(.14 * W, 46, 60)) + 'px');
    const tTop = bB + (large ? 14 : W < 375 || bas ? 2 : 8);
    tete.style.top = tTop + 'px';
    const tB = tTop + tete.offsetHeight;
    ov = W >= 900 ? 32 : bas ? 20 : 28;
    const cTop = H - ov - (large ? 22 : bas ? 10 : 16) - hc;
    cmd.style.top = cTop + 'px';
    const y0 = tB + (bas ? 4 : 12), y1 = (cmd.hidden ? H - ov - 8 : cTop) - (bas ? 2 : 6);
    const sW = Math.min(large ? .5 * W : .88 * W, 640) / 1572;
    s = Math.max(.04, Math.min(sW, (W / 2 - 2) / AUTO.cx, (y1 - y0) / (IMG.y1 - IMG.y0)));
    ix = W / 2 - AUTO.cx * s;
    // la carrosserie au milieu de la place, sans que l'image n'en sorte
    iy = Math.min(Math.max((y0 + y1) / 2 - AUTO.cy * s, y0 - IMG.y0 * s), y1 - IMG.y1 * s);
  }
  html.style.setProperty('--ov', ov + 'px');
  html.style.setProperty('--pt', ov > 0 ? '0px' : (W >= 900 ? '32px' : '16px'));
  html.style.setProperty('--toast-y', (bB + 8) + 'px');
  // la voiture : viewBox à partir du cadrage (unités : pixels de l'image)
  $('voiture').setAttribute('viewBox', `${(-ix / s).toFixed(2)} ${(-iy / s).toFixed(2)} ${(W / s).toFixed(2)} ${(H / s).toFixed(2)}`);
  // la prise : un point de 2,6 px et un halo de 9 px, quelle que soit l'échelle
  const k = 1 / s;
  $('port-coeur').setAttribute('r', (2.6 * k).toFixed(2));
  $('port-halo').setAttribute('r', (8 * k).toFixed(2));
  $('f-port-dev').setAttribute('stdDeviation', (2.6 * k).toFixed(2));
  // la lumière du studio, derrière la voiture
  const fond = $('studio-fond');
  fond.style.setProperty('--lx', (ix + AUTO.cx * s).toFixed(1) + 'px');
  fond.style.setProperty('--ly', (iy + 560 * s).toFixed(1) + 'px');
  fond.style.setProperty('--lw', Math.max(1572 * s * .78, Math.min(W * .62, 520)).toFixed(1) + 'px');
  fond.style.setProperty('--lh', (640 * s * 1.25).toFixed(1) + 'px');
  // la barre fine : à l'échelle de l'écran (celle de l'app Kia fait le tiers de la largeur)
  $('niveau').style.setProperty('--nw', borne(.34 * Math.min(W, 640), 112, 200).toFixed(0) + 'px');
  // la carte Charge : pleine (sans verre) sur une page claire — le verre dépoli sur le studio sombre deviendrait gris
  const ch = $('charge');
  if (themeSombre()) delete ch.dataset.fond; else ch.dataset.fond = 'plein';
}

/* ================================================================ SOUS LE HÉROS === */
/* --- Charge : la batterie, la recharge depuis le branchement (soleil, réseau), la limite --- */
function rendreCharge(d) {
  const v = d.v;
  const soc = v.soc != null ? borne(v.soc, 0, 100) : null, lim = v.limite != null ? borne(v.limite, 0, 100) : null;
  const seg = (id, a, b) => { const el = $(id); const vu = a != null && b != null && b > a; el.hidden = !vu; if (vu) { el.style.setProperty('--a', a.toFixed(2)); el.style.setProperty('--b', b.toFixed(2)); } };
  const S = v.session;
  let srSession = '';
  if (soc != null && S && S.partage) {
    const s0 = Math.min(S.soc0, soc), m = s0 + (soc - s0) * S.sol / (S.sol + S.res);
    seg('j-base', 0, s0); seg('j-sol', s0, m); seg('j-res', m, soc);
    srSession = ` Depuis le branchement${NBSP}: +${pct(S.gain)} ${accord(S.gain, 'point')}, ${pct(S.sol / (S.sol + S.res) * 100)} % de soleil.`;
  } else { seg('j-base', 0, soc); seg('j-sol', null, null); seg('j-res', null, null); }
  seg('j-reste', v.branche ? soc : null, v.branche ? lim : null);
  $('j-lim').hidden = lim == null; if (lim != null) $('j-lim').style.setProperty('--lim', lim.toFixed(2));
  $('j-pt').hidden = soc == null; if (soc != null) $('j-pt').style.setProperty('--soc', soc.toFixed(2));
  $('jauge').setAttribute('aria-label', `Batterie ${soc != null ? `${pct(soc)} %` : 'non mesurée'}${lim != null ? `, limite ${pct(lim)} %` : ''}.${srSession}`);
  // la limite : − 80 % +
  $('limite').hidden = !relie(ENT.limite);
  const out = $('lim-v');
  const txt = v.limite != null ? `${pct(v.limite)}<span class="u">${NNBSP}%</span>` : '—';
  if (out.innerHTML !== txt) out.innerHTML = txt;
  out.classList.toggle('attente', v.limiteAttente);
  const bas = v.limite == null || v.limite <= v.lim.min, haut = v.limite == null || v.limite >= v.lim.max;
  const bm = $('lim-moins'), bp = $('lim-plus');
  if (!bm.firstChild) { bm.innerHTML = icone('moins'); bp.innerHTML = icone('plus'); }
  bas ? bm.setAttribute('aria-disabled', 'true') : bm.removeAttribute('aria-disabled');
  haut ? bp.setAttribute('aria-disabled', 'true') : bp.removeAttribute('aria-disabled');
}

/* --- Mode de recharge (Voltia) : trois segments à icônes ; « Réseau en heures creuses » --- */
const ICONE_MODE = o => (/super|creuse/i.test(o) ? 'soleilLune' : /soleil/i.test(o) ? 'soleil' : 'borne');
function rendreMode(d) {
  const v = d.v, carte = $('mode');
  carte.hidden = !relie(ENT.mode) && !relie(ENT.hc);
  const seg = $('segments');
  seg.hidden = !relie(ENT.mode);
  $('mode-v').textContent = relie(ENT.mode) ? (v.modeDispo ? v.mode ?? '—' : '—') : '';
  if (relie(ENT.mode)) {
    seg.style.setProperty('--n', v.options.length);
    const actif = v.modeDispo && v.options.includes(v.mode) ? v.mode : null;
    const html = v.options.map((o, k) => {
      const choisi = o === actif, focus = choisi || (!actif && k === 0);
      const mc = ICONE_MODE(o) === 'borne' ? 'var(--borne-t)' : 'var(--soleil-t)';
      return `<button type="button" role="radio" aria-checked="${choisi}" aria-label="${o.replace(/"/g, '&quot;')}" tabindex="${focus ? 0 : -1}" data-option="${o.replace(/"/g, '&quot;')}"${v.modeDispo ? '' : ' aria-disabled="true"'}${choisi && v.modeAttente ? ' class="attente"' : ''} style="--mc:${mc}">${icone(ICONE_MODE(o))}</button>`;
    }).join('');
    majHTML(seg, html);
    v.modeDispo ? seg.removeAttribute('aria-disabled') : seg.setAttribute('aria-disabled', 'true');
    v.modeAttente ? seg.setAttribute('aria-busy', 'true') : seg.removeAttribute('aria-busy');
  }
  const hc = $('btn-hc');
  hc.hidden = !relie(ENT.hc);
  hc.setAttribute('aria-checked', String(v.hc === true));
  hc.classList.toggle('attente', v.hcAttente);
  v.hc == null ? hc.setAttribute('aria-disabled', 'true') : hc.removeAttribute('aria-disabled');
  v.hcAttente ? hc.setAttribute('aria-busy', 'true') : hc.removeAttribute('aria-busy');
}
/* remplace un contenu seulement s'il change, et rend le focus clavier à l'élément de même rang (comme l'Accueil) */
const MODELE = document.createElement('template');
function majHTML(el, html) {
  MODELE.innerHTML = html;
  if (el.innerHTML === MODELE.innerHTML) return;
  const act = document.activeElement, rang = act && el.contains(act) ? [...el.querySelectorAll('a, button')].indexOf(act) : -1;
  el.innerHTML = html;
  if (rang >= 0) el.querySelectorAll('a, button')[rang]?.focus({ preventScroll: true });
}

/* --- Recharges : les 3 dernières du journal (sensor.sa_niro_recharges, attribut sessions) --- */
const MOIS = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' });
function jourTxt(debut, d) {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(String(debut || ''));
  if (!m) return null;
  const [ty, tm, td] = heureLocale(new Date(d.t)).jour.split('-').map(Number);
  const j = Date.UTC(+m[1], +m[2] - 1, +m[3]), ecart = Math.round((Date.UTC(ty, tm - 1, td) - j) / 86400000);
  return ecart === 0 ? 'Aujourd’hui' : ecart === 1 ? 'Hier' : MOIS.format(new Date(j + 12 * 3600000));
}
function rendreRecharges(d) {
  const brut = HA.attr(ENT.journal, 'sessions');
  const n = x => Math.max(0, Number(x) || 0);
  const L = (Array.isArray(brut) ? brut : []).slice(0, 3).map(s => {
    const sol = n(s.sol), res = n(s.hsc) + n(s.hc) + n(s.hp), total = Number.isFinite(Number(s.total)) && Number(s.total) > 0 ? Number(s.total) : sol + res;
    return { jour: jourTxt(s.debut, d), sol, res, total };
  }).filter(s => s.jour && s.total > 0);
  $('recharges').hidden = !relie(ENT.journal) || !L.length;
  if (!L.length) return;
  const max = Math.max(...L.map(s => s.total));
  majHTML($('journal'), L.map(s => {
    const ps = s.sol + s.res > 0 ? s.sol / (s.sol + s.res) * 100 : 0;
    const v = `${nombre(s.total, 1)}${NBSP}kWh`;
    const sr = `${s.jour}${NBSP}: ${nombre(s.total, 1)} kWh${s.sol > 0 ? `, dont ${nombre(s.sol, 1)} kWh de soleil` : ''}`;
    return `<li><span class="jd" aria-hidden="true">${s.jour}</span><span class="jb" aria-hidden="true"><span class="jf" style="--w:${(s.total / max * 100).toFixed(1)}">` +
      `${s.sol > 0 ? `<i class="js" style="--ps:${ps.toFixed(1)}"></i>` : ''}${s.res > 0 ? '<i class="jr"></i>' : ''}</span></span>` +
      `<span class="jv" aria-hidden="true">${v}</span><span class="sr-only">${sr}</span></li>`;
  }).join(''));
}

/* --- Suivi : batterie 12 V, kilométrage, révision (dernière + 15 000 km − compteur) --- */
function rendreSuivi(d) {
  const S = d.suivi, L = [];
  const val = (id, x, txt) => (HA.etat(id) == null || x == null ? '—' : txt);
  if (relie(ENT.b12v)) L.push(['b12v', 'Batterie 12 V', val(ENT.b12v, S.b12, `${pct(S.b12)}${NNBSP}%`), '']);
  if (relie(ENT.odometre)) L.push(['compteur', 'Kilométrage', val(ENT.odometre, S.odo, `${nombre(Math.round(S.odo ?? 0), 0)}${NBSP}km`), '']);
  if (relie(ENT.odometre) && relie(ENT.dernierEntretien)) {
    const r = S.reste;
    if (r != null && r < 0) L.push(['cle', 'Révision dépassée de', `${nombre(Math.round(-r), 0)}${NBSP}km`, 'alerte']);
    else L.push(['cle', 'Révision dans', r == null ? '—' : `${nombre(Math.round(r), 0)}${NBSP}km`, r != null && r < 1000 ? 'chaud' : '']);
  }
  $('suivi').hidden = !L.length;
  majHTML($('lignes'), L.map(([ic, t, v, c]) => `<li><div class="ligne">${icone(ic)}<span class="l1">${t}</span><span class="lv${c ? ' ' + c : ''}">${v}</span></div></li>`).join(''));
}

/* ================================================================ COMMANDES ===
   Exactement comme S&A-HOME (PONT_NIRO.ecrire) : { type: 'service_call', id, domain, service, entity_id, data }.
   Un bandeau « Commande envoyée » en haut (comme l'app Kia) ; refusée : « Commande refusée par Home Assistant », entier. */
const DELAI = { commande: 15000, voiture: 90000, actualiser: 150000, local: 10000 };
const MINUT_ATT = {};
function attendre(cle, cible, delai, opts = {}) {
  ATTENTE[cle] = { cible, depuis: Date.now(), delai, ...opts };
  clearTimeout(MINUT_ATT[cle]);
  MINUT_ATT[cle] = setTimeout(planifierRendu, delai + 60);         // délai écoulé : l'état réel reprend la main
}
/* le lecteur d'écran entend le bandeau et les changements d'état */
function dire(texte) { const a = $('annonce'); a.textContent = ''; requestAnimationFrame(() => { a.textContent = texte; }); }
let BANDEAU = 0;
function bandeau(texte, refus = false) {
  const t = $('toast');
  t.textContent = texte;
  t.classList.toggle('refus', refus);
  t.classList.add('vu');
  clearTimeout(BANDEAU);
  BANDEAU = setTimeout(() => t.classList.remove('vu'), refus ? 4500 : 2400);
  dire(texte);
}
function envoyer(cle, domaine, service, entite, data) {
  const marque = ATTENTE[cle];
  bandeau('Commande envoyée');
  if (!HA.enCoque) {
    // valeurs d'exemple : rien n'est envoyé ; l'exemple change après 1,2 s (une latence simulée)
    setTimeout(() => { exempleApplique(domaine, service, entite, data); rendre(); }, 1200);
    return;
  }
  HA.appel(domaine, service, entite, data).then(r => {
    if (r.ok) return;
    if (ATTENTE[cle] === marque) delete ATTENTE[cle];
    refuser(cle === 'charge' ? marque?.bouton : cle);
    rendre();
  });
}
function commander(cle, domaine, service, entite, data, cible, delai, opts) {
  attendre(cle, cible, delai, opts);
  rendre();
  envoyer(cle, domaine, service, entite, data);
}
const enAttente = cle => !!ATTENTE[cle];
/* refusée par Home Assistant : retour à l'état réel, la commande tremble, le message de S&A-HOME en entier */
function refuser(cle) {
  const el = { limite: $('pas'), debut: $('d-debut'), fin: $('d-fin'), verrou: $('d-verrou'), clim: $('d-clim'), actualiser: $('d-maj'), mode: $('segments'), hc: $('btn-hc') }[cle];
  if (el && !immobile()) { el.classList.remove('secoue'); void el.offsetWidth; el.classList.add('secoue'); setTimeout(() => el.classList.remove('secoue'), 320); }
  bandeau('Commande refusée par Home Assistant', true);
}
/* valeurs d'exemple : la commande change l'état d'exemple (comme Home Assistant le ferait) */
function exempleApplique(domaine, service, entite, data) {
  const quand = new Date(HA.maintenant()).toISOString();
  const pose = (id, state) => { const e = HA.etats[id]; if (e) HA.etats[id] = { ...e, state: String(state), last_changed: quand }; };
  if (domaine === 'switch') {
    pose(entite, service === 'turn_on' ? 'on' : 'off');
    if (entite === ENT.charge && service === 'turn_off') [ENT.borne, ENT.veSolaire, ENT.veReseau, ENT.duree].forEach(id => pose(id, 0));
    if (entite === ENT.charge && service === 'turn_on') pose(ENT.borne, 7200);
  } else if (domaine === 'lock') pose(entite, service === 'lock' ? 'locked' : 'unlocked');
  else if (domaine === 'number') pose(entite, data.value);
  else if (domaine === 'input_select') pose(entite, data.option);
  else if (domaine === 'button') { pose(entite, quand); pose(ENT.maj, quand); }
}

/* la limite : la valeur et les repères bougent tout de suite ; la dernière valeur voulue part 800 ms après le dernier geste */
function pasLimite(sens) {
  const v = SCENE?.v;
  if (!v || v.limite == null) return;
  const cible = borne(Math.round((v.limite + sens * v.lim.pas) / v.lim.pas) * v.lim.pas, v.lim.min, v.lim.max);
  if (cible === v.limite) return;
  if (LIM.voulue == null) LIM.depart = HA.nb(ENT.limite);                   // la valeur de HA au premier geste
  LIM.voulue = cible; LIM.depuis = Date.now();
  clearTimeout(LIM.minut);
  LIM.minut = setTimeout(envoyerLimite, 800);
  rendre();
}
function envoyerLimite() {
  LIM.minut = 0;
  const voulue = LIM.voulue;
  if (voulue == null) return;
  // rien n'est encore parti et l'on est revenu à la valeur de Home Assistant : rien à envoyer
  if (LIM.envoyee == null && !LIM.enVol && voulue === HA.nb(ENT.limite)) { oublierLimite(); rendre(); return; }
  LIM.envoyee = voulue; LIM.enVol++; LIM.depuis = Date.now();
  setTimeout(planifierRendu, DELAI.voiture + 900);                 // délai écoulé : la valeur de HA reprend la main
  const fin = r => {
    LIM.enVol = Math.max(0, LIM.enVol - 1);
    if (!r.ok && LIM.voulue === voulue) { oublierLimite(); refuser('limite'); }
    planifierRendu();
  };
  bandeau('Commande envoyée');
  if (!HA.enCoque) { setTimeout(() => { exempleApplique('number', 'set_value', ENT.limite, { value: voulue }); fin({ ok: true }); }, 1200); return; }
  HA.appel('number', 'set_value', ENT.limite, { value: voulue }).then(fin);
}

function brancherCommandes() {
  $('lim-moins').addEventListener('click', () => pasLimite(-1));
  $('lim-plus').addEventListener('click', () => pasLimite(1));
  // début, fin de la charge
  const charger = (on, bouton) => {
    const b = $(bouton === 'debut' ? 'd-debut' : 'd-fin');
    if (!SCENE || enAttente('charge') || b.getAttribute('aria-disabled') === 'true') return;
    commander('charge', 'switch', on ? 'turn_on' : 'turn_off', ENT.charge, {}, on, DELAI.commande, { bouton });
  };
  $('d-debut').addEventListener('click', () => charger(true, 'debut'));
  $('d-fin').addEventListener('click', () => charger(false, 'fin'));
  // verrou : déverrouiller après confirmation ; verrouiller tout de suite
  const dlg = $('dlg-verrou');
  $('d-verrou').addEventListener('click', () => {
    const v = SCENE?.v;
    if (!v || enAttente('verrou') || v.verrou == null) return;
    if (v.verrou === 'locked') { dlg.returnValue = ''; dlg.showModal(); $('dlg-annuler').focus(); }       // le focus commence sur Annuler
    else commander('verrou', 'lock', 'lock', ENT.verrou, {}, 'locked', DELAI.commande);
  });
  dlg.addEventListener('close', () => {
    if (dlg.returnValue === 'ok' && !enAttente('verrou')) commander('verrou', 'lock', 'unlock', ENT.verrou, {}, 'unlocked', DELAI.commande);
    $('d-verrou').focus({ preventScroll: true });
  });
  // climatisation
  $('d-clim').addEventListener('click', () => {
    const v = SCENE?.v;
    if (!v || enAttente('clim') || v.clim == null) return;
    commander('clim', 'switch', v.clim ? 'turn_off' : 'turn_on', ENT.clim, {}, !v.clim, DELAI.commande);
  });
  // actualiser : en attente jusqu'au prochain horodatage des données (150 s, comme kia_trajets.yaml) ; une coche 600 ms
  $('d-maj').addEventListener('click', () => {
    if (enAttente('actualiser')) return;
    const avant = HA.e(ENT.maj)?.state ?? null;
    commander('actualiser', 'button', 'press', ENT.actualiser, {}, null, DELAI.actualiser, {
      confirme: () => (HA.e(ENT.maj)?.state ?? null) !== avant,
      apres: () => { FLASH_MAJ = Date.now() + 600; setTimeout(planifierRendu, 620); }
    });
  });
  // heures creuses
  $('btn-hc').addEventListener('click', () => {
    const v = SCENE?.v;
    if (!v || enAttente('hc') || v.hc == null) return;
    commander('hc', 'switch', v.hc ? 'turn_off' : 'turn_on', ENT.hc, {}, !v.hc, DELAI.voiture);
  });
  // mode de Voltia : un clic, ou les flèches (groupe de boutons radio) ; rien si l'entité est absente ou indisponible
  const seg = $('segments');
  const choisir = o => {
    const v = SCENE?.v;
    if (!v || !v.modeDispo || enAttente('mode') || o == null || o === v.mode) return;
    commander('mode', 'input_select', 'select_option', ENT.mode, { option: o }, o, DELAI.local);
  };
  seg.addEventListener('click', ev => { const b = ev.target.closest('button[data-option]'); if (b) choisir(b.dataset.option); });
  seg.addEventListener('keydown', ev => {
    const dir = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[ev.key];
    if (!dir) return;
    ev.preventDefault();
    if (!SCENE?.v.modeDispo) return;
    const bs = [...seg.querySelectorAll('button[data-option]')], k = bs.indexOf(document.activeElement);
    const n = bs[((k < 0 ? 0 : k) + dir + bs.length) % bs.length];
    if (!n) return;
    choisir(n.dataset.option);
    seg.querySelector(`button[data-option="${CSS.escape(n.dataset.option)}"]`)?.focus();
  });
}

/* ================================================================ RENDU === */
function annoncer(d) {
  const e = d.v.etat;
  if (!e) return;                                                     // état inconnu : rien n'est annoncé, le dernier connu est gardé
  const avant = MEMO.annonce;
  MEMO.annonce = e;
  if (avant == null || avant === e) return;
  dire(e === 'debranchee' ? 'La Kia est débranchée.' : e === 'charge' ? 'La charge commence.' : e === 'limite' ? 'Limite de charge atteinte.'
    : avant === 'charge' ? 'La charge s’arrête.' : 'La Kia est branchée.');
}
function rendre() {
  const d = deriver();
  SCENE = d;
  rendreHero(d);
  rendreCapsule();
  rendreCharge(d);
  rendreMode(d);
  rendreRecharges(d);
  rendreSuivi(d);
  annoncer(d);
  cadrer();
}
let RENDU = 0;
function planifierRendu() { cancelAnimationFrame(RENDU); RENDU = requestAnimationFrame(() => rendre()); }

function appliquerTheme() {
  const r = document.documentElement;
  if (HA.sombre == null) delete r.dataset.theme; else r.dataset.theme = HA.sombre ? 'dark' : 'light';
}
function chargerExemple(nom) {
  const x = etatsExemple(nom);
  HA.etats = x.etats; HA.t = x.t;
}

/* ================================================================ DÉMARRAGE === */
function demarrer() {
  lireAnimations();
  majInterrupteur();
  brancherCommandes();
  $('btn-anim').addEventListener('click', () => basculerAnimations(() => rendre()));
  if (HA.enCoque) {
    HA.ecouter(() => { appliquerTheme(); planifierRendu(); });
    setTimeout(() => { if (!HA.connecte) { SANS_REPONSE = true; rendreCapsule(); cadrer(); } }, 6000);
    setInterval(() => { if (HA.connecte) planifierRendu(); }, 60000);     // l'âge des données avance même sans nouvel état
  } else chargerExemple(new URLSearchParams(location.search).get('apercu') || 'charge');
  rendre();
  requestAnimationFrame(() => cadrer());
  document.fonts?.ready?.then(() => cadrer());
  let rz = 0;
  const obs = new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(cadrer); });
  [$('hero'), $('barre'), $('tete'), $('commandes')].forEach(el => obs.observe(el));
  // hors écran, ou onglet caché : les animations du studio se mettent en pause
  let ecran = true;
  const pause = () => $('hero').classList.toggle('fige', !ecran || document.hidden);
  new IntersectionObserver(es => { ecran = es[0].isIntersecting; pause(); }, { threshold: 0 }).observe($('hero'));
  document.addEventListener('visibilitychange', pause);
  reduitMQ.addEventListener?.('change', () => { majInterrupteur(); rendre(); });
  sombreMQ.addEventListener?.('change', () => rendre());
}

/* Outil de développement, hors de Home Assistant : Breezy.apercu('limite') */
